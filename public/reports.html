<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Báo cáo — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=20260824k">
<script src="/js/theme.js?v=20260824a"></script>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Thống kê tỷ lệ lỗi sản xuất</h2>
  <p>Đếm số lần đơn hàng bị chuyển sang <strong>B4.3_ĐƠN LỖI CẦN LÀM LẠI</strong>, theo loại sản phẩm / team sản xuất / tuần — dựa trên lịch sử thao tác, không phải trạng thái hiện tại của đơn (vì đơn lỗi sau khi làm lại sẽ không còn ở trạng thái này nữa).</p>

  <form id="form-thong-ke-loi" class="bao-cao-form">
    <div class="truong">
      <label for="loi-tu-ngay">Từ ngày</label>
      <input type="date" id="loi-tu-ngay">
    </div>
    <div class="truong">
      <label for="loi-den-ngay">Đến ngày</label>
      <input type="date" id="loi-den-ngay">
    </div>
    <div class="nut-xuat">
      <button type="button" class="btn-hanh-dong phu" id="btn-xem-thong-ke-loi"></button>
    </div>
  </form>

  <div id="khu-thong-ke-loi" style="margin-top:20px"></div>
</div>

<script src="/js/icons.js?v=20260823c"></script>
<script src="/js/api.js?v=20260824b"></script>
<script>
(async () => {
  const user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'reports');

  document.getElementById('btn-xem-thong-ke-loi').innerHTML = icon('chart') + ' Xem thống kê';
  // Mặc định 30 ngày gần nhất — đủ để thấy xu hướng theo tuần mà không phải tải toàn bộ lịch sử
  const homNay30 = new Date(); homNay30.setDate(homNay30.getDate() - 30);
  document.getElementById('loi-tu-ngay').value = homNay30.toISOString().slice(0, 10);
  document.getElementById('loi-den-ngay').value = ngayHomNayYYYYMMDD();
  document.getElementById('btn-xem-thong-ke-loi').onclick = xemThongKeLoi;
  document.getElementById('loi-tu-ngay').addEventListener('change', xemThongKeLoi);
  document.getElementById('loi-den-ngay').addEventListener('change', xemThongKeLoi);
  await xemThongKeLoi();
})();

function ngayHomNayYYYYMMDD() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}

// Vẽ 1 nhóm thống kê dạng thanh ngang (không cần thư viện chart) — width% theo tỷ lệ so với giá trị lớn nhất
function veNhomThongKe(tieuDe, doiTuongDem) {
  const muc = Object.entries(doiTuongDem).sort((a, b) => b[1] - a[1]);
  if (muc.length === 0) return `<div class="xem-truoc-bang"><h3>${escapeHtml(tieuDe)}</h3><p>Không có dữ liệu.</p></div>`;
  const max = muc[0][1];
  return `
    <div class="xem-truoc-bang">
      <h3>${escapeHtml(tieuDe)}</h3>
      <div class="thanh-thong-ke">
        ${muc.map(([nhan, soLuong]) => `
          <div class="thanh-thong-ke-dong">
            <span class="thanh-thong-ke-nhan">${escapeHtml(nhan)}</span>
            <span class="thanh-thong-ke-bar"><span style="width:${Math.max(4, Math.round(soLuong / max * 100))}%"></span></span>
            <span class="thanh-thong-ke-so">${soLuong}</span>
          </div>
        `).join('')}
      </div>
    </div>`;
}

async function xemThongKeLoi() {
  const khu = document.getElementById('khu-thong-ke-loi');
  khu.innerHTML = spinnerInline('Đang tải thống kê...');

  const qs = new URLSearchParams();
  const tuNgay = document.getElementById('loi-tu-ngay').value;
  const denNgay = document.getElementById('loi-den-ngay').value;
  if (tuNgay) qs.set('tuNgay', tuNgay);
  if (denNgay) qs.set('denNgay', denNgay);

  let ketQua;
  try {
    ketQua = await apiFetch('/reports/thong-ke-loi?' + qs.toString());
  } catch (e) {
    khu.innerHTML = `<p>${icon('alert')} ${escapeHtml(e.message)}</p>`;
    return;
  }

  if (ketQua.tongSoLoi === 0) {
    khu.innerHTML = `<div class="trang-thai-rong">${icon('check')}<p>Không có đơn nào bị lỗi trong khoảng thời gian đã chọn.</p></div>`;
    return;
  }

  khu.innerHTML = `
    <p><strong>${ketQua.tongSoLoi}</strong> lần đơn bị chuyển sang lỗi cần làm lại, trong khoảng thời gian đã chọn.</p>
    <div class="luoi-thong-ke-loi">
      ${veNhomThongKe('Theo loại sản phẩm', ketQua.theoLoai)}
      ${veNhomThongKe('Theo team sản xuất', ketQua.theoTeam)}
      ${veNhomThongKe('Theo tuần', ketQua.theoTuan)}
    </div>
    <div class="xem-truoc-bang" style="margin-top:16px">
      <h3>Chi tiết ${ketQua.chiTiet.length < ketQua.tongSoLoi ? `(mới nhất ${ketQua.chiTiet.length}/${ketQua.tongSoLoi})` : ''}</h3>
      <div class="bang-cuon-ngang">
        <table class="bang-xem-truoc">
          <thead><tr><th>Mã đơn</th><th>Khách hàng</th><th>Loại</th><th>Team</th><th>Người chuyển</th><th>Thời gian</th></tr></thead>
          <tbody>${ketQua.chiTiet.map(c => `<tr>
            <td>${escapeHtml(c.sttKey)}</td><td>${escapeHtml(c.khachHang)}</td><td>${escapeHtml(c.loai)}</td>
            <td>${escapeHtml(c.team)}</td><td>${escapeHtml(c.nguoiDung)}</td><td>${escapeHtml(c.thoiGian)}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>`;
}
</script>
</body>
</html>
