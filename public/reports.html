<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Báo cáo — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=20260823d">
<script src="/js/theme.js?v=20260823b"></script>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Xuất báo cáo</h2>
  <p>Mặc định là đơn hàng lên đơn <strong>hôm nay</strong>, tất cả khách hàng. Đổi ngày/khách hàng để mở rộng, hoặc chọn thêm 1 trạng thái để in nhanh đúng nhóm đơn cần thiết.</p>

  <form id="form-bao-cao" class="bao-cao-form">
    <div class="truong">
      <label for="tu-ngay">Từ ngày</label>
      <input type="date" id="tu-ngay">
    </div>
    <div class="truong">
      <label for="den-ngay">Đến ngày</label>
      <input type="date" id="den-ngay">
    </div>
    <div class="truong">
      <label for="khach-hang">Khách hàng</label>
      <select id="khach-hang"><option value="">Tất cả khách hàng</option></select>
    </div>
    <div class="truong">
      <label for="trang-thai">Trạng thái (tuỳ chọn)</label>
      <select id="trang-thai"><option value="">Tất cả trạng thái</option></select>
    </div>
    <div id="thong-tin-loc" class="thong-tin-loc"></div>
    <div class="nut-xuat">
      <button type="button" class="btn-hanh-dong" id="btn-excel"></button>
      <button type="button" class="btn-hanh-dong phu" id="btn-pdf"></button>
    </div>
  </form>

  <div id="thong-bao" style="margin-top:12px"></div>
</div>

<script src="/js/icons.js?v=20260823b"></script>
<script src="/js/api.js?v=20260823d"></script>
<script>
(async () => {
  const user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'reports');

  document.getElementById('btn-excel').innerHTML = icon('file') + ' Xuất Excel';
  document.getElementById('btn-pdf').innerHTML = icon('file') + ' Xuất PDF';

  // Mặc định "hôm nay" cho cả 2 ô ngày — đúng yêu cầu "không chọn thì mặc định hôm nay".
  // Người dùng vẫn có thể đổi thành khoảng ngày rộng hơn nếu cần báo cáo tổng hợp.
  const homNay = ngayHomNayYYYYMMDD();
  document.getElementById('tu-ngay').value = homNay;
  document.getElementById('den-ngay').value = homNay;

  try {
    const list = await apiFetch('/reports/khach-hang');
    const sel = document.getElementById('khach-hang');
    list.forEach(kh => sel.innerHTML += `<option value="${escapeHtml(kh.ma)}">${escapeHtml(kh.ten)} (${escapeHtml(kh.ma)})</option>`);
  } catch (e) {
    document.getElementById('thong-bao').textContent = 'Không tải được danh sách khách hàng: ' + e.message;
  }

  ['tu-ngay', 'den-ngay', 'khach-hang'].forEach(id => {
    document.getElementById(id).addEventListener('change', taiDanhSachTrangThai);
  });
  await taiDanhSachTrangThai();

  document.getElementById('btn-excel').onclick = () => xuatBaoCao('excel');
  document.getElementById('btn-pdf').onclick = () => xuatBaoCao('pdf');
})();

function ngayHomNayYYYYMMDD() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}

function layThamSoLoc() {
  const qs = new URLSearchParams();
  const tuNgay = document.getElementById('tu-ngay').value;
  const denNgay = document.getElementById('den-ngay').value;
  const khachHang = document.getElementById('khach-hang').value;
  if (tuNgay) qs.set('tuNgay', tuNgay);
  if (denNgay) qs.set('denNgay', denNgay);
  if (khachHang) qs.set('khachHang', khachHang);
  return qs;
}

// Dropdown Trạng thái tự cập nhật theo ngày + khách hàng đang chọn — chỉ hiện trạng thái THẬT SỰ
// đang có trong phạm vi lọc đó, kèm số lượng đơn, để in nhanh đúng nhóm cần thiết.
async function taiDanhSachTrangThai() {
  const selTrangThai = document.getElementById('trang-thai');
  const dangChonTruoc = selTrangThai.value;
  const thongTin = document.getElementById('thong-tin-loc');

  let ketQua;
  try {
    ketQua = await apiFetch('/reports/trang-thai-theo-loc?' + layThamSoLoc().toString());
  } catch (e) {
    thongTin.textContent = 'Không tải được danh sách trạng thái: ' + e.message;
    return;
  }

  selTrangThai.innerHTML = '<option value="">Tất cả trạng thái</option>' +
    ketQua.trangThai.map(t => `<option value="${escapeHtml(t.trangThai)}">${escapeHtml(t.trangThai)} (${t.soDon} đơn)</option>`).join('');

  // Giữ lại lựa chọn cũ nếu trạng thái đó vẫn còn trong danh sách mới; không thì reset về "Tất cả"
  if (ketQua.trangThai.some(t => t.trangThai === dangChonTruoc)) {
    selTrangThai.value = dangChonTruoc;
  }

  thongTin.textContent = ketQua.tongSoDon === 0
    ? 'Không có đơn nào khớp ngày/khách hàng đã chọn.'
    : `Có ${ketQua.tongSoDon} đơn khớp bộ lọc hiện tại.`;
}

// Tải file nhị phân (Excel/PDF) qua fetch thay vì mở link trực tiếp — để dùng chung cookie session
// và bắt được lỗi (vd hết quyền) thay vì trình duyệt hiện trang lỗi JSON thô
async function xuatBaoCao(loai) {
  const thongBao = document.getElementById('thong-bao');
  thongBao.innerHTML = spinnerInline('Đang tạo file...');

  const qs = layThamSoLoc();
  const trangThai = document.getElementById('trang-thai').value;
  if (trangThai) qs.set('trangThai', trangThai);

  try {
    const res = await fetch(`/api/reports/${loai}?` + qs.toString(), { credentials: 'include' });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Không xuất được báo cáo');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = loai === 'excel' ? 'bao-cao-don-hang.xlsx' : 'bao-cao-don-hang.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    thongBao.innerHTML = `${icon('check')} Đã tải file báo cáo.`;
  } catch (e) {
    thongBao.innerHTML = `${icon('alert')} ${escapeHtml(e.message)}`;
  }
}
</script>
</body>
</html>
