<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=20260831i">
<script src="/js/theme.js?v=20260831i"></script>
</head>
<body class="trang-dang-nhap">
<div class="login-wrap">
  <img class="welcome-banner" src="/images/Welcome.jpg" alt="" aria-hidden="true">
  <div class="logo-mark" aria-hidden="true" id="logo-mark"></div>
  <h1>Xưởng Thêu <span style="font-size:0.4em;font-weight:400;color:var(--color-text-muted);vertical-align:middle">Phiên bản 67</span></h1>
  <p>Chào mừng đến với Giao diện quản lý xưởng thêu</p>
  <div id="danh-sach-ten" class="ten-list">Đang tải danh sách nhân viên...</div>
</div>
<script src="/js/icons.js?v=20260831i"></script>
<script src="/js/api.js?v=20260831i"></script>
<script>
document.getElementById('logo-mark').innerHTML = icon('logo', { size: 56 });

async function taiDanhSach() {
  const el = document.getElementById('danh-sach-ten');
  let list;
  try {
    list = await apiFetch('/auth/danh-sach');
  } catch (e) {
    el.textContent = 'Không tải được danh sách: ' + e.message;
    return;
  }
  el.innerHTML = '';
  if (list.length === 0) { el.textContent = 'Chưa có nhân viên nào. Liên hệ Admin để thêm.'; return; }
  list.forEach(u => {
    const btn = document.createElement('button');
    btn.className = 'btn-ten';
    btn.textContent = u.ten;
    btn.setAttribute('aria-label', 'Đăng nhập với tên ' + u.ten);
    btn.onclick = () => dangNhap(u.ten);
    el.appendChild(btn);
  });
}

async function dangNhap(ten) {
  try {
    await apiFetch('/auth/dang-nhap', { method: 'POST', body: JSON.stringify({ ten }) });
    window.location.href = '/orders.html';
  } catch (e) { alert(e.message); }
}

taiDanhSach();
</script>
</body>
</html>
