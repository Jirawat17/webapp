<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes â€” XÆ°á»Ÿng ThÃªu</title>
<link rel="stylesheet" href="/css/style.css?v=112">
<script src="/js/theme.js?v=104"></script>
<style>
/* Notes (02/10/2026) â€” style riÃªng trang nÃ y. */
.nt-khoi { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-4); }
.nt-cong-cu { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: flex-end; }
.nt-cong-cu .truong { flex: 1 1 200px; min-width: 0; }
.nt-cong-cu .truong label, .nt-form .truong > label { display: block; margin-bottom: 4px; }
.nt-cong-cu .truong input, .nt-cong-cu .truong select { width: 100%; box-sizing: border-box; }
.nt-form .truong { margin-bottom: var(--space-3); }
.nt-form input[type=text], .nt-form textarea { width: 100%; box-sizing: border-box; }
.nt-form textarea { min-height: 180px; font-family: inherit; }
.nt-the { display: inline-block; font-size: 0.78rem; padding: 2px 8px; border-radius: 999px; background: var(--color-bg); border: 1px solid var(--color-border); margin: 2px 4px 2px 0; cursor: pointer; }
.nt-noi-dung { white-space: pre-wrap; word-break: break-word; margin: var(--space-2) 0; }
.nt-noi-dung.thu-gon { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.nt-anh { display: flex; gap: 8px; flex-wrap: wrap; margin-top: var(--space-2); }
.nt-anh .o-anh { position: relative; }
.nt-anh img { width: 110px; height: 110px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--color-border); display: block; }
.nt-anh .xoa-anh { position: absolute; top: 2px; right: 2px; background: var(--color-danger-text); color: #fff; border: 0; border-radius: 999px; width: 22px; height: 22px; cursor: pointer; line-height: 22px; padding: 0; }
.nt-meta { font-size: 0.8rem; color: var(--color-text-muted); }
.nt-dong-dau { display: flex; gap: var(--space-2); align-items: flex-start; flex-wrap: wrap; }
.nt-dong-dau h3 { margin: 0; flex: 1 1 240px; min-width: 0; word-break: break-word; }
</style>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Notes</h2>
  <p style="color:var(--color-text-muted);margin-top:0">Ghi chÃ©p kinh nghiá»‡m xá»­ lÃ½ váº¥n Ä‘á» (chá»‰ superadmin). Ná»™i dung lÃ  vÄƒn báº£n thÆ°á»ng â€” giá»¯ xuá»‘ng dÃ²ng, link tá»± báº¥m Ä‘Æ°á»£c. áº¢nh: chá»n file hoáº·c dÃ¡n (Ctrl+V) vÃ o Ã´ ná»™i dung.</p>

  <div class="nt-khoi">
    <div class="nt-cong-cu">
      <div class="truong"><label for="nt-tim">TÃ¬m</label><input type="search" id="nt-tim" placeholder="Tá»« khoÃ¡ trong tiÃªu Ä‘á», ná»™i dung, tháº»..." autocomplete="off"></div>
      <div class="truong" style="flex:0 1 200px"><label for="nt-loc-the">Tháº»</label><select id="nt-loc-the"><option value="">Táº¥t cáº£ tháº»</option></select></div>
      <button type="button" class="btn-hanh-dong" onclick="moForm()">+ ThÃªm note</button>
      <button type="button" class="btn-hanh-dong phu" onclick="document.getElementById('nt-file-import').click()">Import .txt / .md</button>
      <input type="file" id="nt-file-import" accept=".txt,.md,text/plain,text/markdown" multiple hidden onchange="importFile(this)">
    </div>
    <p id="nt-thong-bao" style="display:none;margin:var(--space-2) 0 0"></p>
  </div>

  <div id="nt-form" class="nt-khoi nt-form" style="display:none">
    <h3 id="nt-form-tieu-de" style="margin-top:0">ThÃªm note</h3>
    <div class="truong"><label for="nt-tieu-de">TiÃªu Ä‘á» *</label><input type="text" id="nt-tieu-de" maxlength="200"></div>
    <div class="truong"><label for="nt-noi-dung">Ná»™i dung</label><textarea id="nt-noi-dung" maxlength="50000" placeholder="Váº¥n Ä‘á» gáº·p pháº£i, nguyÃªn nhÃ¢n, cÃ¡ch xá»­ lÃ½... (dÃ¡n áº£nh báº±ng Ctrl+V)"></textarea></div>
    <div class="truong"><label for="nt-the">Tháº» (cÃ¡ch nhau dáº¥u pháº©y, tá»‘i Ä‘a 10)</label><input type="text" id="nt-the" list="nt-goi-y-the" placeholder="vd GKE, ZIP, QC3"><datalist id="nt-goi-y-the"></datalist></div>
    <div class="truong"><label for="nt-chon-anh">áº¢nh Ä‘Ã­nh kÃ¨m</label>
      <input type="file" id="nt-chon-anh" accept="image/jpeg,image/png,image/webp,image/gif" multiple onchange="themAnhCho([...this.files]); this.value = ''">
      <div id="nt-anh-form" class="nt-anh"></div></div>
    <p style="margin-bottom:0"><button type="button" class="btn-hanh-dong" id="nt-nut-luu" onclick="luuNote(this)">LÆ°u</button>
      <button type="button" class="btn-hanh-dong phu" onclick="dongForm()">Huá»·</button> <span id="nt-loi-form" style="color:var(--color-danger-text)"></span></p>
  </div>

  <div id="nt-danh-sach">Äang táº£i...</div>
</div>

<script src="/js/icons.js?v=106"></script>
<script src="/js/api.js?v=141"></script>
<script>
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
let dsNote = [];
let dangSua = null;     // note Ä‘ang sá»­a (null = thÃªm má»›i)
let anhCho = [];        // [{ file, url }] áº£nh má»›i chá»n/dÃ¡n, táº£i lÃªn khi báº¥m LÆ°u
let anhBo = [];         // key áº£nh cÅ© báº¥m xoÃ¡ trong form, xoÃ¡ khi báº¥m LÆ°u
const urlAnh = key => '/api/notes/anh/' + key.split('/').map(encodeURIComponent).join('/');
// VÄƒn báº£n thÆ°á»ng -> HTML: escape trÆ°á»›c, rá»“i biáº¿n http(s)://... thÃ nh link.
const vanBanCoLink = s => escapeHtml(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const gio = t => { const d = new Date(t); return isNaN(d) ? '' : d.toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };

(async () => {
  const user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'notes');
  if (user.vaiTro !== 'superadmin') {
    document.querySelector('.page').innerHTML = '<p>Báº¡n khÃ´ng cÃ³ quyá»n truy cáº­p trang nÃ y.</p>';
    return;
  }
  document.getElementById('nt-tim').oninput = debounce(taiNotes, 300);
  document.getElementById('nt-loc-the').onchange = taiNotes;
  document.getElementById('nt-noi-dung').addEventListener('paste', e => {
    const anh = [...(e.clipboardData && e.clipboardData.files || [])].filter(f => f.type.startsWith('image/'));
    if (anh.length) { e.preventDefault(); themAnhCho(anh); }
  });
  await Promise.all([taiNotes(), taiThe()]);
})();

function thongBao(chu, loi) {
  const el = document.getElementById('nt-thong-bao');
  el.style.display = 'block';
  el.style.color = loi ? 'var(--color-danger-text)' : 'var(--color-success-text)';
  el.textContent = chu;
}

async function taiThe() {
  let ds = [];
  try { ds = await apiFetch('/notes/the'); } catch (e) { return; }
  const sel = document.getElementById('nt-loc-the');
  const dangChon = sel.value;
  sel.innerHTML = '<option value="">Táº¥t cáº£ tháº»</option>' + ds.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  sel.value = ds.includes(dangChon) ? dangChon : '';
  document.getElementById('nt-goi-y-the').innerHTML = ds.map(t => `<option value="${escapeHtml(t)}">`).join('');
}

async function taiNotes() {
  const el = document.getElementById('nt-danh-sach');
  const qs = new URLSearchParams();
  const tuKhoa = document.getElementById('nt-tim').value.trim();
  const the = document.getElementById('nt-loc-the').value;
  if (tuKhoa) qs.set('tuKhoa', tuKhoa);
  if (the) qs.set('the', the);
  try { dsNote = await apiFetch('/notes?' + qs); } catch (e) { el.textContent = 'Lá»—i: ' + e.message; return; }
  if (!dsNote.length) { el.innerHTML = `<p style="color:var(--color-text-muted)">${tuKhoa || the ? 'KhÃ´ng cÃ³ note nÃ o khá»›p.' : 'ChÆ°a cÃ³ note nÃ o â€” báº¥m "+ ThÃªm note".'}</p>`; return; }
  el.innerHTML = dsNote.map(n => `<div class="nt-khoi">
    <div class="nt-dong-dau"><h3>${escapeHtml(n.TieuDe)}</h3>
      <button type="button" class="btn-hanh-dong phu" style="padding:4px 10px;font-size:0.8rem" onclick="moForm(${n.id})">Sá»­a</button>
      <button type="button" class="btn-hanh-dong phu nguy-hiem" style="padding:4px 10px;font-size:0.8rem" onclick="xoaNote(${n.id})">XoÃ¡</button></div>
    <div>${n.The.map(t => `<span class="nt-the" onclick="locThe(this.dataset.the)" data-the="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join('')}</div>
    ${n.NoiDung ? `<div class="nt-noi-dung${n.NoiDung.split('\n').length > 6 || n.NoiDung.length > 600 ? ' thu-gon' : ''}" id="nt-nd-${n.id}">${vanBanCoLink(n.NoiDung)}</div>
      ${n.NoiDung.split('\n').length > 6 || n.NoiDung.length > 600 ? `<button type="button" class="btn-hanh-dong phu" style="padding:2px 8px;font-size:0.78rem" onclick="moRong(this, ${n.id})">Xem thÃªm â–¾</button>` : ''}` : ''}
    ${n.Anh.length ? `<div class="nt-anh">${n.Anh.map(k => `<a href="${urlAnh(k)}" target="_blank" rel="noopener"><img src="${urlAnh(k)}" alt="áº¢nh Ä‘Ã­nh kÃ¨m" loading="lazy"></a>`).join('')}</div>` : ''}
    <div class="nt-meta" style="margin-top:var(--space-2)">Táº¡o: ${escapeHtml(n.NguoiTao)} Â· ${gio(n.ThoiGianTao)}${n.ThoiGianSua ? ` â€” Sá»­a: ${escapeHtml(n.NguoiSua)} Â· ${gio(n.ThoiGianSua)}` : ''}</div>
  </div>`).join('');
}
function moRong(nut, id) {
  const el = document.getElementById('nt-nd-' + id);
  const thuGon = el.classList.toggle('thu-gon');
  nut.textContent = thuGon ? 'Xem thÃªm â–¾' : 'Thu gá»n â–´';
}
function locThe(the) {
  document.getElementById('nt-loc-the').value = the;
  taiNotes();
}

function moForm(id) {
  dangSua = id ? dsNote.find(n => n.id === id) : null;
  anhCho.forEach(a => URL.revokeObjectURL(a.url));
  anhCho = []; anhBo = [];
  document.getElementById('nt-form-tieu-de').textContent = dangSua ? 'Sá»­a note' : 'ThÃªm note';
  document.getElementById('nt-tieu-de').value = dangSua ? dangSua.TieuDe : '';
  document.getElementById('nt-noi-dung').value = dangSua ? dangSua.NoiDung : '';
  document.getElementById('nt-the').value = dangSua ? dangSua.The.join(', ') : '';
  document.getElementById('nt-loi-form').textContent = '';
  veAnhForm();
  const f = document.getElementById('nt-form');
  f.style.display = '';
  f.scrollIntoView({ behavior: 'smooth', block: 'start' });
  document.getElementById('nt-tieu-de').focus();
}
function dongForm() {
  anhCho.forEach(a => URL.revokeObjectURL(a.url));
  anhCho = []; anhBo = []; dangSua = null;
  document.getElementById('nt-form').style.display = 'none';
}
function themAnhCho(files) {
  for (const file of files) {
    if (!['image/jpeg', 'image/png', 'image/webp', 'image/gif'].includes(file.type)) { document.getElementById('nt-loi-form').textContent = `Bá» qua "${file.name}": chá»‰ nháº­n áº£nh JPEG/PNG/WEBP/GIF.`; continue; }
    anhCho.push({ file, url: URL.createObjectURL(file) });
  }
  veAnhForm();
}
function veAnhForm() {
  const cu = dangSua ? dangSua.Anh.filter(k => !anhBo.includes(k)) : [];
  document.getElementById('nt-anh-form').innerHTML =
    cu.map(k => `<div class="o-anh"><img src="${urlAnh(k)}" alt="áº¢nh Ä‘Ã­nh kÃ¨m"><button type="button" class="xoa-anh" title="Bá» áº£nh nÃ y" onclick="boAnhCu(${escapeHtml(JSON.stringify(k))})">Ã—</button></div>`).join('') +
    anhCho.map((a, i) => `<div class="o-anh"><img src="${a.url}" alt="áº¢nh má»›i (chÆ°a lÆ°u)" style="outline:2px dashed var(--color-primary)"><button type="button" class="xoa-anh" title="Bá» áº£nh nÃ y" onclick="boAnhCho(${i})">Ã—</button></div>`).join('');
}
function boAnhCu(key) { anhBo.push(key); veAnhForm(); }
function boAnhCho(i) { URL.revokeObjectURL(anhCho[i].url); anhCho.splice(i, 1); veAnhForm(); }

// LÆ°u: táº¡o/sá»­a note -> xoÃ¡ áº£nh Ä‘Ã£ bá» -> nÃ©n + táº£i tá»«ng áº£nh má»›i. áº¢nh lá»—i khÃ´ng lÃ m máº¥t note Ä‘Ã£ lÆ°u (bÃ¡o láº¡i Ä‘á»ƒ thá»­ láº§n sau).
async function luuNote(nut) {
  const loiEl = document.getElementById('nt-loi-form');
  loiEl.textContent = '';
  const body = { tieuDe: document.getElementById('nt-tieu-de').value, noiDung: document.getElementById('nt-noi-dung').value, the: document.getElementById('nt-the').value };
  if (!body.tieuDe.trim()) { loiEl.textContent = 'ChÆ°a nháº­p tiÃªu Ä‘á».'; return; }
  nut.disabled = true;
  const loiAnh = [];
  try {
    let id = dangSua && dangSua.id;
    if (id) await apiFetch('/notes/' + id, { method: 'PUT', body: JSON.stringify(body) });
    else id = (await apiFetch('/notes', { method: 'POST', body: JSON.stringify(body) })).id;
    for (const key of anhBo) {
      try { await apiFetch(`/notes/${id}/anh`, { method: 'DELETE', body: JSON.stringify({ key }) }); } catch (e) { loiAnh.push('xoÃ¡ áº£nh: ' + e.message); }
    }
    for (let i = 0; i < anhCho.length; i++) {
      nut.textContent = `Äang táº£i áº£nh ${i + 1}/${anhCho.length}...`;
      const fd = new FormData();
      const file = anhCho[i].file.type === 'image/gif' ? anhCho[i].file : await nenAnhTruocKhiTaiLen(anhCho[i].file);
      fd.append('anh', file, file.name || 'anh.jpg');
      try { await apiFetch(`/notes/${id}/anh`, { method: 'POST', body: fd, headers: {} }); } catch (e) { loiAnh.push(`áº£nh ${i + 1}: ${e.message}`); }
    }
  } catch (e) {
    loiEl.textContent = 'ChÆ°a lÆ°u: ' + e.message;
    nut.disabled = false; nut.textContent = 'LÆ°u';
    return;
  }
  nut.disabled = false; nut.textContent = 'LÆ°u';
  dongForm();
  await Promise.all([taiNotes(), taiThe()]);
  thongBao(loiAnh.length ? `ÄÃ£ lÆ°u note, nhÆ°ng cÃ³ áº£nh lá»—i (${loiAnh.join('; ')}) â€” má»Ÿ Sá»­a Ä‘á»ƒ thÃªm láº¡i.` : 'ÄÃ£ lÆ°u note.', !!loiAnh.length);
}

async function xoaNote(id) {
  const n = dsNote.find(x => x.id === id);
  if (!n || !confirm(`XoÃ¡ note "${n.TieuDe}"${n.Anh.length ? ` vÃ  ${n.Anh.length} áº£nh Ä‘Ã­nh kÃ¨m` : ''}? KhÃ´ng khÃ´i phá»¥c Ä‘Æ°á»£c.`)) return;
  try { await apiFetch('/notes/' + id, { method: 'DELETE' }); } catch (e) { thongBao('ChÆ°a xoÃ¡: ' + e.message, true); return; }
  if (dangSua && dangSua.id === id) dongForm();
  await Promise.all([taiNotes(), taiThe()]);
  thongBao('ÄÃ£ xoÃ¡ note.');
}

async function importFile(input) {
  const files = [...input.files];
  input.value = '';
  if (!files.length) return;
  const the = prompt(`Import ${files.length} file â€” má»—i file thÃ nh 1 note (tiÃªu Ä‘á» = tÃªn file).\nTháº» gáº¯n cho cÃ¡c note nÃ y (cÃ¡ch nhau dáº¥u pháº©y, cÃ³ thá»ƒ Ä‘á»ƒ trá»‘ng):`, '');
  if (the === null) return;
  const fd = new FormData();
  files.forEach(f => fd.append('files', f, f.name));
  fd.append('the', the);
  let kq;
  try { kq = await apiFetch('/notes/import', { method: 'POST', body: fd, headers: {} }); } catch (e) { thongBao('Import lá»—i: ' + e.message, true); return; }
  await Promise.all([taiNotes(), taiThe()]);
  thongBao(`ÄÃ£ nháº­p ${kq.daNhap.length} note.${kq.boQua.length ? ` Bá» qua ${kq.boQua.length} file: ${kq.boQua.map(b => `${b.ten} (${b.lyDo})`).join('; ')}.` : ''}`, !kq.daNhap.length);
}
</script>
</body>
