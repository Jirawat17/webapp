<body>
<div id="nav"></div>
<div class="page">
  <h2>Đơn của tôi</h2>

  <!-- Thứ tự 2 mục ĐÃ ĐẢO (08/09/2026, theo yêu cầu người dùng) — "Đang chạy máy của tôi" lên trước

  <!-- Tiêu đề gộp CHUNG 1 hàng với Lọc/Sắp xếp (bổ sung 09/09/2026, theo yêu cầu người dùng — tăng

  <div id="panel-loc-dc" class="panel-dieu-khien" style="display:none">
    <div class="inline-form">
      <div class="truong">
        <label for="loc-trang-thai">Trạng thái</label>
        <select id="loc-trang-thai"><option value="Đang chạy máy" selected>Đang chạy máy</option></select>

      <div class="truong truong-rong">

      <div class="truong">
        <label for="loc-canh-bao">Mức cảnh báo</label>

          <option value="">Tất cả mức cảnh báo</option>

          <option value="CAM">Cam</option>
          <option value="DO">Đỏ</option>

      <label class="chon-tat-ca-hang truong-hang-loat" for="loc-hang-loat">
        <input type="checkbox" id="loc-hang-loat">
        Chỉ đơn hàng loạt
      </label>
      <div class="truong">
        <label for="loc-loai">Loại</label>
        <select id="loc-loai"><option value="">Tất cả loại</option></select>
      </div>
      <div class="truong">
        <label for="loc-kich-thuoc">Kích thước</label>
        <select id="loc-kich-thuoc"><option value="">Tất cả kích thước</option></select>
      </div>
      <div class="truong">
        <label for="loc-mau-sac">Màu sắc</label>
        <select id="loc-mau-sac"><option value="">Tất cả màu sắc</option></select>
      </div>
      <div class="truong">
        <label for="loc-hang-van-chuyen">Hãng vận chuyển</label>
        <select id="loc-hang-van-chuyen"><option value="">Tất cả hãng vận chuyển</option></select>
      </div>
      <div id="loc-nguoi-van-hanh-wrap" class="truong" style="display:none">
        <label for="loc-nguoi-van-hanh">Người sản xuất</label>
        <select id="loc-nguoi-van-hanh"><option value="">Tất cả người sản xuất</option></select>
      </div>
      <button type="button" class="btn-hanh-dong phu" onclick="xoaTatCaLoc()">Xoá bộ lọc</button>
    </div>

  <div id="panel-sap-xep-dc" class="panel-dieu-khien" style="display:none">
    <div class="inline-form">
      <div class="truong">
        <label for="sap-xep">Sắp xếp theo</label>
        <select id="sap-xep">
          <option value="ngay_cu_nhat">Ngày lên đơn — cũ nhất trước (mặc định)</option>
          <option value="">Ngày lên đơn — mới nhất trước</option>
          <option value="ma_don">Mã đơn (STT_Key) — A đến Z</option>
          <option value="ma_don_desc">Mã đơn (STT_Key) — Z đến A</option>
          <option value="canh_bao">Mức cảnh báo — khẩn cấp nhất trước</option>
          <option value="so_luong">Số lượng — nhiều nhất trước</option>
          <option value="khach_hang">Tên khách hàng — A đến Z</option>

  <div id="danh-sach-don" class="order-list"></div>

  <div class="tieu-de-cong-cu" style="margin-top:32px">
    <h3>DANH MỤC CÁC ĐƠN CHƯA AI CHẠY MÁY</h3>
    <div class="thanh-cong-cu-danh-sach">
      <button type="button" class="btn-hanh-dong phu" id="btn-mo-loc-ss" onclick="batTatPanel('ss','loc')"></button>
      <button type="button" class="btn-hanh-dong phu" id="btn-mo-sap-xep-ss" onclick="batTatPanel('ss','sap-xep')"></button>
    </div>
  </div>

  <div id="panel-loc-ss" class="panel-dieu-khien" style="display:none">
    <div class="inline-form">
      <div class="truong">
        <label for="loc-trang-thai-ss">Trạng thái</label>
        <select id="loc-trang-thai-ss"><option value="ĐÃ SẴN SÀNG CHẠY MÁY" selected>ĐÃ SẴN SÀNG CHẠY MÁY</option></select>
      </div>
      <div class="truong truong-rong">
        <label for="loc-kh-ss">Tìm theo tên đơn / mã KH</label>
        <input id="loc-kh-ss" placeholder="STT_Key hoặc mã khách hàng">
      </div>
      <div class="truong truong-ngay">
        <label for="loc-tu-ngay-ss">Từ ngày</label>
        <input type="date" id="loc-tu-ngay-ss">
      </div>
      <div class="truong truong-ngay">
        <label for="loc-den-ngay-ss">Đến ngày</label>
        <input type="date" id="loc-den-ngay-ss">
      </div>
      <div class="truong">
        <label for="loc-canh-bao-ss">Mức cảnh báo</label>
        <select id="loc-canh-bao-ss">
          <option value="">Tất cả mức cảnh báo</option>
          <option value="VANG">Vàng</option>
          <option value="CAM">Cam</option>
          <option value="DO">Đỏ</option>
        </select>
      </div>
      <label class="chon-tat-ca-hang truong-hang-loat" for="loc-hang-loat-ss">
        <input type="checkbox" id="loc-hang-loat-ss">
        Chỉ đơn hàng loạt
      </label>
      <div class="truong">
        <label for="loc-loai-ss">Loại</label>
        <select id="loc-loai-ss"><option value="">Tất cả loại</option></select>
      </div>
      <div class="truong">
        <label for="loc-kich-thuoc-ss">Kích thước</label>
        <select id="loc-kich-thuoc-ss"><option value="">Tất cả kích thước</option></select>
      </div>
      <div class="truong">
        <label for="loc-mau-sac-ss">Màu sắc</label>
        <select id="loc-mau-sac-ss"><option value="">Tất cả màu sắc</option></select>
      </div>
      <div class="truong">
        <label for="loc-hang-van-chuyen-ss">Hãng vận chuyển</label>
        <select id="loc-hang-van-chuyen-ss"><option value="">Tất cả hãng vận chuyển</option></select>
      </div>
      <button type="button" class="btn-hanh-dong phu" onclick="xoaTatCaLocSs()">Xoá bộ lọc</button>
    </div>
  </div>

  <div id="panel-sap-xep-ss" class="panel-dieu-khien" style="display:none">
    <div class="inline-form">
      <div class="truong">
        <label for="sap-xep-ss">Sắp xếp theo</label>
        <select id="sap-xep-ss">
          <option value="ngay_cu_nhat">Ngày lên đơn — cũ nhất trước (mặc định)</option>
          <option value="">Ngày lên đơn — mới nhất trước</option>
          <option value="ma_don">Mã đơn (STT_Key) — A đến Z</option>
          <option value="ma_don_desc">Mã đơn (STT_Key) — Z đến A</option>
          <option value="canh_bao">Mức cảnh báo — khẩn cấp nhất trước</option>
          <option value="so_luong">Số lượng — nhiều nhất trước</option>
          <option value="khach_hang">Tên khách hàng — A đến Z</option>
        </select>
      </div>
    </div>
  </div>

  <div id="thanh-hanh-dong-san-sang" class="thanh-hanh-dong-hang-loat" style="display:none">
    <span class="nhan-so-luong-da-chon">Đã chọn <strong id="so-luong-da-chon-san-sang">0</strong> đơn</span>
    <button id="nut-nhan-chay-may" class="btn-hanh-dong" onclick="apDungNhanChayMay()">Chuyển các đơn đã chọn từ ĐÃ SẴN SÀNG CHẠY MÁY sang Đang chạy máy</button>
    <span id="khoi-chi-dinh-nguoi-chay-may-san-sang" style="display:none">
      <span class="thanh-hanh-dong-cach"></span>
      <select id="nguoi-chay-may-dich-san-sang">
        <option value="">Chỉ định người chạy máy...</option>
      </select>
      <button id="nut-ap-dung-chi-dinh-san-sang" class="btn-hanh-dong" onclick="apDungChiDinhNguoiChayMaySanSang()">Áp dụng</button>
    </span>
    <button type="button" class="btn-hanh-dong phu" onclick="boChonTatCaDonSanSang()">Bỏ chọn</button>
  </div>
  <label class="chon-tat-ca-hang">
    <input type="checkbox" id="chon-tat-ca-san-sang" onchange="chonTatCaSanSang(this.checked)">
    Chọn tất cả đơn sẵn sàng đang hiển thị

<script src="/js/icons.js?v=104"></script>
<script src="/js/api.js?v=104"></script>
<script>
// Số ngày bỏ khỏi nhãn (bổ sung 23/09/2026, theo yêu cầu người dùng) — ngưỡng giờ chỉnh được ở
// settings.html (superadmin), 3/5/7 không còn luôn đúng nên không hard-code vào nhãn hiển thị nữa.
const NHAN_CANH_BAO = { VANG: 'Vàng', CAM: 'Cam', DO: 'Đỏ' };
const NHAN_NGUOI_VAN_HANH_KHONG_RO = 'ĐƠN SỬA TRONG GGSHEET, KHÔNG RÕ TÀI KHOẢN SẢN XUẤT NÀO ĐANG CHẠY';

let user; // dùng lại ở taiDon() (biết vaiTro để quyết định hiện bộ lọc/badge người vận hành cho admin)
let danhSachSanSang = [];
let donSanSangChonSet = new Set();
let coLocNaoDangChonSanSang = false; // ghi lại ở taiDonSanSang(), renderDanhSachSanSang() đọc lại để chọn đúng thông báo khi danh sách rỗng
// Giới hạn số THẺ render/tải ảnh cùng lúc (bổ sung 22/09/2026, theo yêu cầu người dùng cải thiện hiệu
// năng — cùng cơ chế đã áp dụng ở orders.html) — CHỈ ảnh hưởng hiển thị, danhSachSanSang/donSanSangChonSet
// vẫn giữ đầy đủ nên "Chọn tất cả" không đổi.
const SO_DON_MOI_LUOT = 60;
let soDangHienThiSanSang = SO_DON_MOI_LUOT;
let soDangHienThiDangChay = SO_DON_MOI_LUOT;
let danhSachDangChay = [];
// Màu nền thẻ theo Xưởng (bổ sung 23/09/2026, theo yêu cầu người dùng) — tải 1 lần lúc vào trang, xem
// public/js/api.js#taiMauTheoXuong/lopVaStyleXuong.
let mauTheoXuong = {};

// Các ô lọc (không tính Trạng thái — cố định, và Chỉ đơn hàng loạt — checkbox riêng) của mỗi mục —
// dùng chung cho cả việc đếm số lọc đang áp dụng (capNhatNhanNutLoc) lẫn xoá trắng (xoaCacOLoc).
const CAC_O_LOC_SS = ['loc-kh-ss', 'loc-tu-ngay-ss', 'loc-den-ngay-ss', 'loc-canh-bao-ss', 'loc-loai-ss', 'loc-kich-thuoc-ss', 'loc-mau-sac-ss', 'loc-hang-van-chuyen-ss'];
const CAC_O_LOC_DC = ['loc-kh', 'loc-tu-ngay', 'loc-den-ngay', 'loc-canh-bao', 'loc-loai', 'loc-kich-thuoc', 'loc-mau-sac', 'loc-hang-van-chuyen'];

(async () => {
  user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'my-orders');
  mauTheoXuong = await taiMauTheoXuong();

  // Bộ lọc "Người sản xuất" — bổ sung 07/09/2026, CHỈ dành cho admin (xem
  // docs/superpowers/specs/2026-09-07-loc-nguoi-san-xuat-don-cua-toi-design.md). san_xuat vốn đã chỉ
  // thấy đơn của chính mình (lọc ở server, routes/orders.js locDonDangChayMayTheoNguoiVanHanh) nên
  // không cần bộ lọc này.
  if (laAdmin(user.vaiTro)) {
    document.getElementById('loc-nguoi-van-hanh-wrap').style.display = '';
    document.getElementById('loc-nguoi-van-hanh').onchange = () => taiDon();
  }

  // "Chỉ định người chạy máy" ở mục "Đơn sẵn sàng chạy máy" — CHỈ admin (xem
  // docs/superpowers/specs/2026-09-08-admin-chi-dinh-tai-san-sang-design.md). display:contents (không
  // phải '') vì khối này nằm trong .thanh-hanh-dong-hang-loat (flex container) — dùng '' sẽ làm mất
  // flex:1/align-self:stretch của các phần tử con (lỗi đã gặp ở orders.html trước đây).
  // Tải danh sách nhân viên (admin) SONG SONG với 2 danh sách đơn bên dưới thay vì đợi xong mới bắt đầu
  // (bổ sung 22/09/2026, theo yêu cầu người dùng cải thiện tốc độ tải trang) — độc lập hoàn toàn.
  let taiDsNhanVienSanSang = Promise.resolve();
  if (laAdmin(user.vaiTro)) {
    document.getElementById('khoi-chi-dinh-nguoi-chay-may-san-sang').style.display = 'contents';
    taiDsNhanVienSanSang = (async () => {
      try {
        const dsNhanVien = await apiFetch('/users/tom-tat');
        const dsSanXuat = dsNhanVien.filter(u => u.VaiTro === 'san_xuat' && String(u.KichHoat).toUpperCase() === 'TRUE');
        document.getElementById('nguoi-chay-may-dich-san-sang').innerHTML = '<option value="">Chỉ định người chạy máy...</option>' +
          dsSanXuat.map(u => `<option value="${escapeHtml(u.Ten)}">${escapeHtml(u.Ten)}</option>`).join('');
      } catch (e) { /* không tải được danh sách nhân viên — ô chọn giữ nguyên rỗng, không chặn tải trang */ }
    })();
  }

  document.getElementById('btn-mo-loc-ss').innerHTML = icon('filter', { size: 16 }) + ' Lọc';
  document.getElementById('btn-mo-sap-xep-ss').innerHTML = icon('sort', { size: 16 }) + ' Sắp xếp';
  document.getElementById('btn-mo-loc-dc').innerHTML = icon('filter', { size: 16 }) + ' Lọc';
  document.getElementById('btn-mo-sap-xep-dc').innerHTML = icon('sort', { size: 16 }) + ' Sắp xếp';

  ganSuKienLocSapXep('-ss', taiDonSanSang, boChonTatCaDonSanSang);
  ganSuKienLocSapXep('', taiDon, null);

  await Promise.all([taiDonSanSang(), taiDon(), taiDsNhanVienSanSang]);
})();

// Gắn onchange/oninput cho đúng bộ 8 ô lọc + Chỉ đơn hàng loạt + Sắp xếp của 1 mục — dùng chung cho
// cả 2 mục (hauTo='-ss' hoặc ''), tránh chép 2 lần cùng 1 khối wiring gần như giống hệt nhau.
// boChonFn (tuỳ chọn) bỏ chọn các đơn đang chọn trước khi tải lại — lọc có thể làm đơn đang chọn biến
// mất khỏi danh sách hiển thị (mục "Đang chạy máy của tôi" không có cơ chế chọn nhiều nên truyền null).
function ganSuKienLocSapXep(hauTo, taiLaiFn, boChonFn) {
  const chay = () => { if (boChonFn) boChonFn(); taiLaiFn(); };
  document.getElementById('loc-kh' + hauTo).oninput = debounce(chay, 400);
  document.getElementById('loc-tu-ngay' + hauTo).onchange = () => {
    const denNgay = document.getElementById('loc-den-ngay' + hauTo);
    if (document.getElementById('loc-tu-ngay' + hauTo).value && !denNgay.value) denNgay.value = ngayHomNayYYYYMMDD();
    chay();
  };
  ['loc-den-ngay', 'loc-canh-bao', 'loc-hang-loat', 'loc-loai', 'loc-kich-thuoc', 'loc-mau-sac', 'loc-hang-van-chuyen'].forEach(id => {
    document.getElementById(id + hauTo).onchange = chay;
  });
  document.getElementById('sap-xep' + hauTo).onchange = taiLaiFn;
}

// Đóng/mở 1 trong 2 panel "Lọc"/"Sắp xếp" của 1 mục — luôn đóng panel còn lại CỦA CHÍNH MỤC ĐÓ (mục
// kia không bị đụng tới, độc lập hoàn toàn), bấm lại đúng nút đang mở thì đóng luôn (toggle). tienTo
// là 'ss' (Đơn sẵn sàng chạy máy) hoặc 'dc' (Đang chạy máy của tôi), ten là 'loc' hoặc 'sap-xep'.
function batTatPanel(tienTo, ten) {
  const tenKia = ten === 'loc' ? 'sap-xep' : 'loc';
  const idPanel = `panel-${ten}-${tienTo}`;
  const idPanelKia = `panel-${tenKia}-${tienTo}`;
  const idBtn = `btn-mo-${ten}-${tienTo}`;
  const idBtnKia = `btn-mo-${tenKia}-${tienTo}`;
  const dangMo = document.getElementById(idPanel).style.display !== 'none';
  document.getElementById(idPanel).style.display = 'none';
  document.getElementById(idPanelKia).style.display = 'none';
  document.getElementById(idBtn).classList.remove('dang-mo');
  document.getElementById(idBtnKia).classList.remove('dang-mo');
  if (!dangMo) {
    document.getElementById(idPanel).style.display = 'block';
    document.getElementById(idBtn).classList.add('dang-mo');
  }
}

// Đổ danh sách lựa chọn cho 1 ô <select> theo đúng GIÁ TRỊ THẬT đang có trong dữ liệu (không hardcode)
// — giữ lại lựa chọn đang chọn (nếu còn hợp lệ) khi đổ lại danh sách. Sao chép từ orders.html.
function domLaiOChon(id, nhanTatCa, giaTriList) {
  const sel = document.getElementById(id);
  const dangChon = sel.value;
  const cacGiaTri = [...new Set(giaTriList.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'vi'));
  sel.innerHTML = `<option value="">${nhanTatCa}</option>` +
    cacGiaTri.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
  sel.value = dangChon;
}

// CHỈ đổ lại các ô lọc động (Loại/Kích thước/Màu sắc/Hãng vận chuyển) khi KHÔNG có bộ lọc nào đang áp
// dụng — nếu đã lọc rồi mà vẫn đổ lại theo đúng danh sách đã bị thu hẹp thì các lựa chọn khác sẽ biến
// mất khỏi ô, không bấm lại được nữa (giống hệt quy ước capNhatCacBoLocDong() ở orders.html).
function capNhatCacBoLocDong(list, hauTo) {
  domLaiOChon('loc-loai' + hauTo, 'Tất cả loại', list.map(o => o.LOAI));
  domLaiOChon('loc-kich-thuoc' + hauTo, 'Tất cả kích thước', list.map(o => o.KICH_THUOC));
  domLaiOChon('loc-mau-sac' + hauTo, 'Tất cả màu sắc', list.map(o => o.MAU_SAC));
  domLaiOChon('loc-hang-van-chuyen' + hauTo, 'Tất cả hãng vận chuyển', list.map(o => o.HANG_VAN_CHUYEN));
}

// Số lọc đang thực sự áp dụng (không tính Trạng thái — luôn cố định 1 giá trị ở cả 2 mục) hiện thành
// số trong nhãn nút "Lọc", giống orders.html.
function capNhatNhanNutLoc(idBtn, cacOLoc, idHangLoat) {
  const soLuong = cacOLoc.filter(id => document.getElementById(id).value).length + (document.getElementById(idHangLoat).checked ? 1 : 0);
  document.getElementById(idBtn).innerHTML = icon('filter', { size: 16 }) + ' Lọc' + (soLuong ? ` (${soLuong})` : '');
}

// Xoá trắng đúng bộ ô lọc (không đụng ô Sắp xếp — theo đúng quy ước orders.html: Lọc và Sắp xếp là 2
// mối quan tâm tách biệt, ô Sắp xếp có mặc định riêng ghi rõ trên option, không cần nút xoá).
function xoaCacOLoc(cacOLoc, hauTo) {
  cacOLoc.forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('loc-hang-loat' + hauTo).checked = false;
}

function xoaTatCaLocSs() {
  xoaCacOLoc(CAC_O_LOC_SS, '-ss');
  boChonTatCaDonSanSang();
  taiDonSanSang();
}

async function taiDonSanSang() {
  const el = document.getElementById('danh-sach-san-sang');
  el.innerHTML = skeletonList(2);

  const kh = document.getElementById('loc-kh-ss').value;
  const tuNgay = document.getElementById('loc-tu-ngay-ss').value;
  const denNgay = document.getElementById('loc-den-ngay-ss').value;
  const canhBao = document.getElementById('loc-canh-bao-ss').value;
  const hangLoat = document.getElementById('loc-hang-loat-ss').checked;
  const loai = document.getElementById('loc-loai-ss').value;
  const kichThuoc = document.getElementById('loc-kich-thuoc-ss').value;
  const mauSac = document.getElementById('loc-mau-sac-ss').value;
  const hangVanChuyen = document.getElementById('loc-hang-van-chuyen-ss').value;
  const sapXep = document.getElementById('sap-xep-ss').value;

  const qs = new URLSearchParams({ trangThai: 'ĐÃ SẴN SÀNG CHẠY MÁY' });
  if (kh) qs.set('kh', kh);
  if (tuNgay) qs.set('tuNgay', tuNgay);
  if (denNgay) qs.set('denNgay', denNgay);
  if (canhBao) qs.set('canhBao', canhBao);
  if (hangLoat) qs.set('hangLoat', '1');
  if (loai) qs.set('loai', loai);
  if (kichThuoc) qs.set('kichThuoc', kichThuoc);
  if (mauSac) qs.set('mauSac', mauSac);
  if (hangVanChuyen) qs.set('hangVanChuyen', hangVanChuyen);
  if (sapXep) qs.set('sapXep', sapXep);

  try {
    danhSachSanSang = await apiFetch('/orders?' + qs.toString());
  } catch (e) {
    el.innerHTML = `<p>Không tải được danh sách: ${escapeHtml(e.message)}</p>`;
    return;
  }
  soDangHienThiSanSang = SO_DON_MOI_LUOT; // lọc/tải lại -> luôn bắt đầu lại từ lượt đầu

  // Bỏ khỏi tập đang chọn những đơn không còn trong danh sách (đã bị người khác nhận/xử lý ở nơi
  // khác giữa 2 lần tải, hoặc vừa bị lọc bớt) — tránh giữ trạng thái "đã chọn" cho 1 đơn không còn
  // hiển thị.
  const cacSttHienTai = new Set(danhSachSanSang.map(o => o.STT_Key));
  [...donSanSangChonSet].forEach(k => { if (!cacSttHienTai.has(k)) donSanSangChonSet.delete(k); });

  coLocNaoDangChonSanSang = !!(kh || tuNgay || denNgay || canhBao || hangLoat || loai || kichThuoc || mauSac || hangVanChuyen);
  if (!coLocNaoDangChonSanSang) capNhatCacBoLocDong(danhSachSanSang, '-ss');
  capNhatNhanNutLoc('btn-mo-loc-ss', CAC_O_LOC_SS, 'loc-hang-loat-ss');

  renderDanhSachSanSang();
}

function renderDanhSachSanSang() {
  const el = document.getElementById('danh-sach-san-sang');

  if (danhSachSanSang.length === 0) {
    el.innerHTML = `<div class="trang-thai-rong">${icon('package')}<p>${coLocNaoDangChonSanSang ? 'Không có đơn nào khớp bộ lọc.' : 'Hiện không có đơn nào đang sẵn sàng chạy máy.'}</p></div>`;
    capNhatThanhHanhDongSanSang();
    return;
  }

  const dsDeRender = danhSachSanSang.slice(0, soDangHienThiSanSang);
  const conLai = danhSachSanSang.length - dsDeRender.length;

  el.innerHTML = dsDeRender.map(o => {
    const daChon = donSanSangChonSet.has(o.STT_Key);
    // Tô màu nền thẻ theo Xưởng (bổ sung 23/09/2026, theo yêu cầu người dùng — mở rộng từ orders.html
    // sang đây, xem style.css .order-card.co-mau-xuong + public/js/api.js#lopVaStyleXuong).
    const xuongCard = lopVaStyleXuong(o.XUONG, mauTheoXuong);
    return `
    <div class="order-card ${daChon ? 'da-chon' : ''} ${xuongCard.lop}" style="${xuongCard.style}" data-stt-san-sang="${escapeHtml(o.STT_Key)}"
         onclick="toggleChonDonSanSang('${escapeHtml(o.STT_Key)}', !donSanSangChonSet.has('${escapeHtml(o.STT_Key)}'))">
      <button type="button" class="btn-xem-the" title="Xem chi tiết đơn"
              aria-label="Xem chi tiết đơn ${escapeHtml(o.STT_Key)}"
              onclick="event.stopPropagation(); location.href='/order.html?stt=${encodeURIComponent(o.STT_Key)}'">
        ${icon('arrowRight', { size: 16 })}
      </button>
      ${o.DUONG_DAN_URL || o.MOCKUP
        ? `<div class="nhom-anh-dai-dien">${urlAnhHienThiList(o.DUONG_DAN_URL || o.MOCKUP).map(src => `<img src="${escapeHtml(src)}" alt="" loading="lazy" onerror="this.remove()">`).join('')}</div>`
        : ''}
      <div class="thong-tin">
        <strong class="tieu-de-the ${o.DonUuTien ? 'uu-tien' : ''}">${escapeHtml(o.TieuDeSanPham || o.STT_Key)}</strong>
        <div class="meta">${escapeHtml(o.TenKhachHang || '')} · Lên đơn: ${escapeHtml(o.NGAY_LEN_DON ? dinhDangNgayNgan(o.NGAY_LEN_DON) : '—')} · SL: <strong>${escapeHtml(o.SO_LUONG || '')}</strong></div>
        <div class="badge-row">
          ${o.DonUuTien ? `<span class="badge trang-thai-danger">${icon('star', {size:14})} Ưu tiên</span>` : ''}
          <span class="badge ${lopTrangThai(o.TRANG_THAI_XUONG)}">${escapeHtml(o.TRANG_THAI_XUONG || '')}</span>
          ${o.CanhBao ? `
            <span class="badge badge-canh-bao ${o.CanhBao.toLowerCase()}">
              ${icon('alert')} ${escapeHtml(NHAN_CANH_BAO[o.CanhBao] || o.CanhBao)}
            </span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('') + (conLai > 0
    ? `<button type="button" class="btn-hanh-dong phu" style="grid-column:1/-1" onclick="soDangHienThiSanSang+=SO_DON_MOI_LUOT;renderDanhSachSanSang()">Xem thêm (còn ${conLai} đơn)</button>`
    : '');

  capNhatCheckboxChonTatCaSanSang();
  capNhatThanhHanhDongSanSang();
}

function toggleChonDonSanSang(sttKey, daChon) {
  if (daChon) donSanSangChonSet.add(sttKey); else donSanSangChonSet.delete(sttKey);
  const the = document.querySelector(`[data-stt-san-sang="${CSS.escape(sttKey)}"]`);
  if (the) the.classList.toggle('da-chon', daChon);
  capNhatCheckboxChonTatCaSanSang();
  capNhatThanhHanhDongSanSang();
}

// Toggle TRỰC TIẾP trên DOM đã render thay vì gọi lại renderDanhSachSanSang() (dựng lại TOÀN BỘ danh
// sách qua innerHTML) — bổ sung 22/09/2026, theo yêu cầu người dùng cải thiện hiệu năng. Chỉ cần cập
// nhật đúng các thẻ ĐANG hiển thị; thẻ chưa hiển thị (còn ẩn sau "Xem thêm") sẽ tự đọc đúng
// donSanSangChonSet khi tới lượt render qua renderDanhSachSanSang().
function chonTatCaSanSang(daChonHet) {
  danhSachSanSang.forEach(o => {
    if (daChonHet) donSanSangChonSet.add(o.STT_Key); else donSanSangChonSet.delete(o.STT_Key);
  });
  document.querySelectorAll('#danh-sach-san-sang [data-stt-san-sang]').forEach(the => {
    the.classList.toggle('da-chon', daChonHet);
  });
  capNhatThanhHanhDongSanSang();
}

function boChonTatCaDonSanSang() {
  donSanSangChonSet.clear();
  document.querySelectorAll('#danh-sach-san-sang [data-stt-san-sang]').forEach(the => {
    the.classList.remove('da-chon');
  });
  document.getElementById('chon-tat-ca-san-sang').checked = false;
  capNhatThanhHanhDongSanSang();
}

function capNhatCheckboxChonTatCaSanSang() {
  const cb = document.getElementById('chon-tat-ca-san-sang');
  cb.checked = danhSachSanSang.length > 0 && danhSachSanSang.every(o => donSanSangChonSet.has(o.STT_Key));
}

function capNhatThanhHanhDongSanSang() {
  const thanh = document.getElementById('thanh-hanh-dong-san-sang');
  if (donSanSangChonSet.size === 0) { thanh.style.display = 'none'; return; }
  thanh.style.display = 'flex';
  document.getElementById('so-luong-da-chon-san-sang').textContent = donSanSangChonSet.size;
}

async function apDungNhanChayMay() {
  const soLuong = donSanSangChonSet.size;
  if (!confirm(`Chuyển ${soLuong} đơn đã chọn sang "Đang chạy máy"?`)) return;

  const nut = document.getElementById('nut-nhan-chay-may');
  const nhanGoc = nut.innerHTML;
  document.querySelectorAll('#thanh-hanh-dong-san-sang button, #thanh-hanh-dong-san-sang select').forEach(el => el.disabled = true);
  nut.innerHTML = icon('spinner', { className: 'icon-spin', size: 16 }) + ' Đang xử lý...';

  let daHuy = false;
  const danhSach = Array.from(donSanSangChonSet);
  const thanhTienDo = taoThanhTienDo(nut, { onHuy: () => { daHuy = true; } });
  thanhTienDo.capNhat(0, danhSach.length);

  const ketQua = await chayHangLoatCoTienDo(
    danhSach,
    sttKey => apiFetch('/orders/chuyen-trang-thai-hang-loat', {
      method: 'POST', body: JSON.stringify({ sttKeys: [sttKey], trangThaiMoi: 'Đang chạy máy' }),
    }),
    { onTienDo: (hienTai, tong) => thanhTienDo.capNhat(hienTai, tong), kiemTraHuy: () => daHuy }
  );
  thanhTienDo.xoa();

  let thongBao = `Đã chuyển ${ketQua.thanhCong.length}/${soLuong} đơn sang "Đang chạy máy".`;
  if (ketQua.daHuy) thongBao += `\n\nĐã HỦY giữa chừng — các đơn còn lại vẫn đang được chọn, bấm lại nếu muốn tiếp tục.`;
  if (ketQua.loi.length > 0) {
    thongBao += `\n\nKhông chuyển được ${ketQua.loi.length} đơn:\n` +
      ketQua.loi.map(l => `- ${l.sttKey}: ${l.lyDo}`).join('\n');
  }
  alert(thongBao);

  document.querySelectorAll('#thanh-hanh-dong-san-sang button, #thanh-hanh-dong-san-sang select').forEach(el => el.disabled = false);
  nut.innerHTML = nhanGoc;
  if (ketQua.daHuy) ketQua.thanhCong.forEach(sttKey => donSanSangChonSet.delete(sttKey));
  else donSanSangChonSet.clear();

  await taiDonSanSang();
  await taiDon(); // đơn vừa chuyển có thể giờ xuất hiện ở "Đang chạy máy của tôi" bên dưới
}

// Admin CHỈ ĐỊNH 1 người sản xuất chạy máy cho các đơn "sẵn sàng" đã chọn — cùng route/hành vi với
// khối chỉ định ở orders.html (xem docs/superpowers/specs/2026-09-08-admin-chi-dinh-tai-san-sang-design.md).
async function apDungChiDinhNguoiChayMaySanSang() {
  const nguoiSanXuat = document.getElementById('nguoi-chay-may-dich-san-sang').value;
  if (!nguoiSanXuat) { alert('Hãy chọn người sản xuất muốn chỉ định'); return; }

  const soLuong = donSanSangChonSet.size;
  if (!confirm(`Chỉ định "${nguoiSanXuat}" chạy máy cho ${soLuong} đơn đã chọn (chuyển sang "Đang chạy máy")?`)) return;

  document.querySelectorAll('#thanh-hanh-dong-san-sang button, #thanh-hanh-dong-san-sang select').forEach(el => el.disabled = true);
  const nutApDung = document.getElementById('nut-ap-dung-chi-dinh-san-sang');
  nutApDung.textContent = 'Đang xử lý...';

  let daHuy = false;
  const danhSach = Array.from(donSanSangChonSet);
  const thanhTienDo = taoThanhTienDo(nutApDung, { onHuy: () => { daHuy = true; } });
  thanhTienDo.capNhat(0, danhSach.length);

  const ketQua = await chayHangLoatCoTienDo(
    danhSach,
    sttKey => apiFetch('/orders/chi-dinh-nguoi-chay-may', {
      method: 'POST', body: JSON.stringify({ sttKeys: [sttKey], nguoiSanXuat }),
    }),
    { onTienDo: (hienTai, tong) => thanhTienDo.capNhat(hienTai, tong), kiemTraHuy: () => daHuy }
  );
  thanhTienDo.xoa();

  let thongBao = `Đã chỉ định "${nguoiSanXuat}" chạy máy cho ${ketQua.thanhCong.length}/${soLuong} đơn.`;
  if (ketQua.daHuy) thongBao += `\n\nĐã HỦY giữa chừng — các đơn còn lại vẫn đang được chọn, bấm lại nếu muốn tiếp tục.`;
  if (ketQua.loi.length > 0) {
    thongBao += `\n\nKhông chỉ định được ${ketQua.loi.length} đơn:\n` +
      ketQua.loi.map(l => `- ${l.sttKey}: ${l.lyDo}`).join('\n');
  }
  alert(thongBao);

  document.querySelectorAll('#thanh-hanh-dong-san-sang button, #thanh-hanh-dong-san-sang select').forEach(el => el.disabled = false);
  nutApDung.textContent = 'Áp dụng';
  if (ketQua.daHuy) ketQua.thanhCong.forEach(sttKey => donSanSangChonSet.delete(sttKey));
  else donSanSangChonSet.clear();

  await taiDonSanSang();
  await taiDon();
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function ngayHomNayYYYYMMDD() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}

function xoaTatCaLoc() {
  xoaCacOLoc(CAC_O_LOC_DC, '');
  if (laAdmin(user.vaiTro)) document.getElementById('loc-nguoi-van-hanh').value = '';
  taiDon();
}

// Ngày rút gọn D/M (không năm) — khớp cách hiển thị đang dùng ở trang Danh sách đơn hàng
function dinhDangNgayNgan(giaTri) {
  const d = parseNgay(giaTri);
  return d ? `${d.getDate()}/${d.getMonth() + 1}` : '';
}

async function taiDon() {
  const el = document.getElementById('danh-sach-don');
  el.innerHTML = skeletonList(4);

  const dangLaAdmin = laAdmin(user.vaiTro);
  const nguoiVanHanhDangLoc = dangLaAdmin ? document.getElementById('loc-nguoi-van-hanh').value : '';
  const kh = document.getElementById('loc-kh').value;
  const tuNgay = document.getElementById('loc-tu-ngay').value;
  const denNgay = document.getElementById('loc-den-ngay').value;
  const canhBao = document.getElementById('loc-canh-bao').value;
  const hangLoat = document.getElementById('loc-hang-loat').checked;
  const loai = document.getElementById('loc-loai').value;
  const kichThuoc = document.getElementById('loc-kich-thuoc').value;
  const mauSac = document.getElementById('loc-mau-sac').value;
  const hangVanChuyen = document.getElementById('loc-hang-van-chuyen').value;
  const sapXep = document.getElementById('sap-xep').value;

  const qs = new URLSearchParams({ trangThai: 'Đang chạy máy' });
  if (nguoiVanHanhDangLoc) qs.set('nguoiVanHanh', nguoiVanHanhDangLoc);
  if (kh) qs.set('kh', kh);
  if (tuNgay) qs.set('tuNgay', tuNgay);
  if (denNgay) qs.set('denNgay', denNgay);
  if (canhBao) qs.set('canhBao', canhBao);
  if (hangLoat) qs.set('hangLoat', '1');
  if (loai) qs.set('loai', loai);
  if (kichThuoc) qs.set('kichThuoc', kichThuoc);
  if (mauSac) qs.set('mauSac', mauSac);
  if (hangVanChuyen) qs.set('hangVanChuyen', hangVanChuyen);
  if (sapXep) qs.set('sapXep', sapXep);

  let list;
  try {
    list = await apiFetch('/orders?' + qs.toString());
  } catch (e) {
    el.innerHTML = `<p>Không tải được danh sách: ${escapeHtml(e.message)}</p>`;
    return;
  }

  // Chỉ đổ lại danh sách người sản xuất trong ô lọc khi CHƯA lọc theo người nào — nếu đã lọc rồi mà
  // vẫn đổ lại theo đúng danh sách đã bị thu hẹp (chỉ còn 1 người) thì các tên khác sẽ biến mất khỏi
  // ô, không bấm lại được nữa (giống hệt quy ước capNhatCacBoLocDong() ở orders.html).
  if (laAdmin && !nguoiVanHanhDangLoc) {
    const sel = document.getElementById('loc-nguoi-van-hanh');
    const dangChon = sel.value;
    const cacTen = [...new Set(list.map(o => o.NguoiVanHanh).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'vi'));
    sel.innerHTML = '<option value="">Tất cả người sản xuất</option>' + cacTen.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
    sel.value = dangChon;
  }

  const coLocNaoDangChon = nguoiVanHanhDangLoc || kh || tuNgay || denNgay || canhBao || hangLoat || loai || kichThuoc || mauSac || hangVanChuyen;
  if (!coLocNaoDangChon) capNhatCacBoLocDong(list, '');
  capNhatNhanNutLoc('btn-mo-loc-dc', CAC_O_LOC_DC, 'loc-hang-loat');

  // Server (routes/orders.js, locDonDangChayMayTheoNguoiVanHanh) đã tự lọc: san_xuat chỉ nhận về
  // đúng đơn mình đang vận hành, hoặc đơn không xác định được ai đang chạy (an toàn, tránh thất lạc)
  // — không cần lọc lại lần nữa ở đây.
  danhSachDangChay = list;
  soDangHienThiDangChay = SO_DON_MOI_LUOT; // lọc/tải lại -> luôn bắt đầu lại từ lượt đầu
  renderDanhSachDangChay(coLocNaoDangChon);
}

  const el = document.getElementById('danh-sach-don');
  if (danhSachDangChay.length === 0) {
    el.innerHTML = `<div class="trang-thai-rong">${icon('package')}<p>${coLocNaoDangChon ? 'Không có đơn nào khớp bộ lọc.' : 'Bạn chưa chạy máy đơn nào — mọi việc đã xong hoặc chưa bắt đầu.'}</p></div>`;

  const dsDeRender = danhSachDangChay.slice(0, soDangHienThiDangChay);
  const conLai = danhSachDangChay.length - dsDeRender.length;

  el.innerHTML = dsDeRender.map(o => {
    // Tô màu nền thẻ theo Xưởng (bổ sung 23/09/2026, theo yêu cầu người dùng — xem
    // style.css .order-card.co-mau-xuong + public/js/api.js#lopVaStyleXuong).
    const xuongCard = lopVaStyleXuong(o.XUONG, mauTheoXuong);
    return `
    <div class="order-card ${xuongCard.lop}" style="${xuongCard.style}" onclick="location.href='/order.html?stt=${encodeURIComponent(o.STT_Key)}'">
      ${o.DUONG_DAN_URL || o.MOCKUP
        ? `<div class="nhom-anh-dai-dien">${urlAnhHienThiList(o.DUONG_DAN_URL || o.MOCKUP).map(src => `<img src="${escapeHtml(src)}" alt="" loading="lazy" onerror="this.remove()">`).join('')}</div>`
        : ''}
      <div class="thong-tin">
        <strong class="tieu-de-the ${o.DonUuTien ? 'uu-tien' : ''}">${escapeHtml(o.TieuDeSanPham || o.STT_Key)}</strong>
        <div class="meta">${escapeHtml(o.TenKhachHang || '')} · Lên đơn: ${escapeHtml(o.NGAY_LEN_DON ? dinhDangNgayNgan(o.NGAY_LEN_DON) : '—')} · SL: <strong>${escapeHtml(o.SO_LUONG || '')}</strong></div>
        <div class="badge-row">
          ${o.DonUuTien ? `<span class="badge trang-thai-danger">${icon('star', {size:14})} Ưu tiên</span>` : ''}
          <span class="badge ${lopTrangThai(o.TRANG_THAI_XUONG)}">${escapeHtml(o.TRANG_THAI_XUONG || '')}</span>
          ${!o.NguoiVanHanh ? `
            <span class="badge trang-thai-danger" style="white-space:normal;max-width:100%">${icon('alert', {size:14})} ${escapeHtml(NHAN_NGUOI_VAN_HANH_KHONG_RO)}</span>` : ''}
          ${laAdmin && o.NguoiVanHanh ? `
            <span class="badge trang-thai-info">${icon('users', {size:14})} Đang vận hành: <strong>${escapeHtml(o.NguoiVanHanh)}</strong></span>` : ''}
          ${o.CanhBao ? `
            <span class="badge badge-canh-bao ${o.CanhBao.toLowerCase()}">
              ${icon('alert')} ${escapeHtml(NHAN_CANH_BAO[o.CanhBao] || o.CanhBao)}
            </span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('') + (conLai > 0
    ? `<button type="button" class="btn-hanh-dong phu" style="grid-column:1/-1" onclick="soDangHienThiDangChay+=SO_DON_MOI_LUOT;renderDanhSachDangChay(${JSON.stringify(!!coLocNaoDangChon)})">Xem thêm (còn ${conLai} đơn)</button>`
    : '');
}
</script>
</body>
</html>
