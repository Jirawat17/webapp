<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=112">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script src="/js/theme.js?v=104"></script>
</head>
<body class="trang-dang-nhap">
<div class="login-wrap">
  <div class="logo-mark" aria-hidden="true" id="logo-mark"></div>
  <h1>Xưởng Thêu</h1>
  <form id="form-dang-nhap" style="margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:12px">
    <div style="width:100%;max-width:260px;text-align:left">
      <label for="o-ten" style="display:block;font-size:0.8rem;color:var(--color-text-muted);font-weight:700;margin-bottom:4px">Tên đăng nhập</label>
      <input id="o-ten" required autocomplete="off" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--color-border);font-family:inherit;font-size:1rem">
    </div>
    <div style="width:100%;max-width:260px;text-align:left">
      <label for="o-mat-khau" style="display:block;font-size:0.8rem;color:var(--color-text-muted);font-weight:700;margin-bottom:4px">PIN (6 chữ số)</label>
      <input type="password" id="o-mat-khau" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" style="font-size:1.4rem;text-align:center;letter-spacing:0.3em;width:100%;padding:12px;border-radius:8px;border:1px solid var(--color-border)">
    </div>
    <button type="submit" class="btn-ten">Đăng nhập</button>
  </form>
  <div id="khu-doi-pin" style="display:none;width:100%;max-width:260px;text-align:left">
    <p style="font-size:0.9rem;color:var(--color-text-muted);margin:0 0 12px">Bạn đang dùng PIN mặc định — cần đặt PIN mới trước khi vào ứng dụng.</p>
    <form id="form-doi-pin" style="display:flex;flex-direction:column;gap:12px">
      <div>
        <label for="o-pin-moi" style="display:block;font-size:0.8rem;color:var(--color-text-muted);font-weight:700;margin-bottom:4px">PIN mới (6 chữ số, không phải 000000)</label>
        <input type="password" id="o-pin-moi" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="new-password" style="font-size:1.4rem;text-align:center;letter-spacing:0.3em;width:100%;padding:12px;border-radius:8px;border:1px solid var(--color-border)">
      </div>
      <div>
        <label for="o-pin-xac-nhan" style="display:block;font-size:0.8rem;color:var(--color-text-muted);font-weight:700;margin-bottom:4px">Xác nhận PIN mới</label>
        <input type="password" id="o-pin-xac-nhan" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="new-password" style="font-size:1.4rem;text-align:center;letter-spacing:0.3em;width:100%;padding:12px;border-radius:8px;border:1px solid var(--color-border)">
      </div>
      <button type="submit" class="btn-ten">Đặt PIN mới</button>
    </form>
  </div>
</div>
<script src="/js/icons.js?v=106"></script>
<script src="/js/api.js?v=141"></script>
<script>
document.getElementById('logo-mark').innerHTML = '<img src="/images/logo.png" alt="" width="88" height="88" style="display:block;margin:0 auto;border-radius:22%;box-shadow:0 8px 24px rgba(200,24,24,.28)">';

document.getElementById('form-dang-nhap').onsubmit = async (e) => {
  e.preventDefault();
  const ten = document.getElementById('o-ten').value.trim();
  const matKhau = document.getElementById('o-mat-khau').value;
  try {
    const user = await apiFetch('/auth/dang-nhap', { method: 'POST', body: JSON.stringify({ ten, matKhau }) });
    if (user.doiPin) {
      document.getElementById('form-dang-nhap').style.display = 'none';
      document.getElementById('khu-doi-pin').style.display = 'block';
      document.getElementById('o-pin-moi').focus();
      return;
    }
    window.location.href = trangChuTheoVaiTro(user.vaiTro);
  } catch (err) { await hopThongBao(err.message); }
};

document.getElementById('form-doi-pin').onsubmit = async (e) => {
  e.preventDefault();
  const pinMoi = document.getElementById('o-pin-moi').value;
  const xacNhan = document.getElementById('o-pin-xac-nhan').value;
  if (pinMoi !== xacNhan) { await hopThongBao('Hai PIN không khớp.'); return; }
  try {
    await apiFetch('/auth/doi-pin-hn', { method: 'POST', body: JSON.stringify({ pinMoi }) });
    const user = await apiFetch('/auth/hien-tai');
    window.location.href = trangChuTheoVaiTro(user.vaiTro);
  } catch (err) { await hopThongBao(err.message); }
};
</script>
</body>
</html>
