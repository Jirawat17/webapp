async function dungCamera() {

    // stop() trong khoáº£ng Ä‘Ã³ gá»i removeChild(canvas null) -> lá»—i, mÃ¡y quÃ©t káº¹t. NÃªn chá» "playing" (tá»‘i Ä‘a 2 giÃ¢y) rá»“i má»›i stop(). Bá»™ nghe
