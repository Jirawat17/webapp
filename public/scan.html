<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quét QR — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Quét mã QR</h2>
  <div class="scan-mode">
    <button id="mode-lookup" class="active">🔍 Tra cứu</button>
    <button id="mode-batch">⚡ Quét kịch bản</button>
  </div>
  <div id="chon-kich-ban" style="display:none; margin-bottom:12px;">
    <select id="kich-ban-select" style="width:100%; padding:10px; border-radius:8px;"></select>
  </div>
  <div id="qr-reader" style="width:100%"></div>
  <div id="ket-qua"></div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/js/api.js"></script>
<script>
let user, mode = 'lookup', scanner, dangXuLy = false;

(async () => {
  user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'scan');
  await taiKichBan();
  startScanner();
})();

document.getElementById('mode-lookup').onclick = () => chuyenMode('lookup');
document.getElementById('mode-batch').onclick = () => chuyenMode('batch');

function chuyenMode(m) {
  mode = m;
  document.getElementById('mode-lookup').classList.toggle('active', m === 'lookup');
  document.getElementById('mode-batch').classList.toggle('active', m === 'batch');
  document.getElementById('chon-kich-ban').style.display = m === 'batch' ? 'block' : 'none';
}

async function taiKichBan() {
  const list = await apiFetch('/qr/kich-ban');
  const sel = document.getElementById('kich-ban-select');
  sel.innerHTML = list.map(k => `<option value="${k.id}">${k.label}</option>`).join('');
  if (list.length === 0) {
    document.getElementById('mode-batch').disabled = true;
    document.getElementById('mode-batch').title = 'Vai trò của bạn chưa có kịch bản nào';
  }
}

function startScanner() {
  scanner = new Html5Qrcode('qr-reader');
  scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, onScanSuccess)
    .catch(err => {
      document.getElementById('ket-qua').innerHTML =
        `<div class="ket-qua-box loi">Không mở được camera: ${err}. Hãy cho phép quyền camera.</div>`;
    });
}

async function onScanSuccess(sttKey) {
  if (dangXuLy) return;
  dangXuLy = true;
  const el = document.getElementById('ket-qua');

  try {
    if (mode === 'lookup') {
      const don = await apiFetch('/qr/tra-cuu/' + encodeURIComponent(sttKey));
      el.innerHTML = `<div class="ket-qua-box">
        <strong>${don.Ten_San_Pham || ''}</strong> — ${don.Ten_KH || ''}<br>
        Trạng thái: <span class="badge badge-${don.Trang_Thai}">${don.Trang_Thai || ''}</span><br>
        <a href="/order.html?stt=${encodeURIComponent(sttKey)}">Xem chi tiết →</a>
      </div>`;
    } else {
      const scenarioId = document.getElementById('kich-ban-select').value;
      const res = await apiFetch(`/qr/kich-ban/${scenarioId}/quet`, { method: 'POST', body: JSON.stringify({ sttKey }) });
      el.innerHTML = `<div class="ket-qua-box ok">✅ ${res.don.STT_Key}: chuyển sang ${res.don.Trang_Thai}</div>`;
    }
  } catch (e) {
    el.innerHTML = `<div class="ket-qua-box loi">❌ ${e.message}</div>`;
  }

  setTimeout(() => { dangXuLy = false; }, 1500); // chống quét trùng liên tiếp cùng 1 mã
}
</script>
</body>
</html>
