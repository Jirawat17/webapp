<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quét QR — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=112">
<script src="/js/theme.js?v=104"></script>
<style>
/* Tự ẩn header khi cuộn xuống, hiện lại khi cuộn lên — chỉ áp dụng riêng cho trang Quét QR
   (chỉ định nghĩa trong <style> của trang này, không đụng style.css dùng chung) để tăng vùng
   thao tác trên điện thoại khi đang quét/chụp liên tục. */
.app-header { transition: transform 0.25s ease; }
.app-header.an-khi-cuon { transform: translateY(-100%); }
/* Ô nhập mã của kịch bản "Cho nhập mã tay" (05/10/2026, theo yêu cầu người dùng) — cùng cỡ/kiểu ô "Nhập mã đơn" ở
   public/order.html: gấp 3 cỡ ô mặc định, chữ xanh dương đậm cố định, chữ gợi ý xám thường, nút cao bằng ô. */
#o-nhap-ma-kich-ban { width: 480px; max-width: calc(100vw - 2 * var(--space-4)); height: 63px; font-size: 40px; font-weight: 700; color: #1d4ed8; }
#o-nhap-ma-kich-ban::placeholder { color: #757575; font-weight: 400; opacity: 1; }
#o-nhap-ma-kich-ban + button { height: 63px; }
</style>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Quét mã QR</h2>
  <div class="scan-mode">
    <button id="mode-batch" class="active"></button>
    <button id="mode-photo-san-xuat"></button>
    <button id="mode-photo-da-dan-tem"></button>
    <button id="mode-lookup"></button>
  </div>

  <div id="chon-kich-ban-wrap" style="display:none"></div>

  <div id="camera-wrap" style="display:none">
    <form id="form-nhap-ma-kich-ban" onsubmit="nhapMaKichBan(event)" style="display:none;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
      <input type="search" id="o-nhap-ma-kich-ban" placeholder="Nhập mã đơn..." aria-label="Nhập mã đơn để quét" autocomplete="off" enterkeyhint="go">
      <button type="submit" class="btn-hanh-dong phu">Quét</button>
    </form>
    <div class="khu-vuc-camera">
      <div class="camera-vien">
        <div id="qr-reader" style="border-radius:12px;overflow:hidden;"></div>
        <button id="btn-flash" class="btn-flash-overlay" hidden></button>
      </div>
      <div id="toast-vua-quet" class="toast-vua-quet"></div>
    </div>

    <div id="ket-qua-vua-quet-kich-ban" class="khoi-ket-qua-vua-quet chi-che-do-kich-ban" style="display:none"></div>

    <p id="mo-ta-quet-chup-anh" style="display:none;text-align:center;font-weight:600"></p>

    <!-- Đơn đã chụp ảnh đã sản xuất 1 nhưng CHƯA xong lượt (14/10/2026) — chụp ảnh 2 / Xong; quét đơn tiếp theo cũng tự Xong. -->
    <div id="don-cho-xong" class="khoi-ket-qua-vua-quet ok" style="display:none"></div>
    <input type="file" accept="image/*" capture="environment" id="input-chup-anh-2" style="display:none">

    <div id="ket-qua-tra-cuu"></div>

    <button id="btn-dung-quet" class="btn-dung-quet chi-che-do-kich-ban" style="display:none"></button>

    <!-- Chuyển "dem-nhom" (3 ô đếm Sẵn sàng/Sai trạng thái/Không tìm thấy) xuống SAU nút "Dừng quét"
         (bổ sung 09/09/2026, theo yêu cầu người dùng) — trước đó nằm NGAY ĐẦU trang, đẩy vùng camera/
         kết quả vừa quét (thông tin đơn đang cần xem NHẤT lúc đang quét) xuống thấp hơn. Chỉ đổi VỊ
         TRÍ trong HTML, KHÔNG đổi id/class — renderDemNhom() vẫn document.getElementById('dem-nhom')
         như cũ, không cần sửa JS. -->
    <div id="dem-nhom" class="dem-nhom chi-che-do-kich-ban" style="display:none"></div>

    <div class="chi-che-do-kich-ban" style="display:none">
      <h3 style="margin-top:20px">Danh sách đang quét</h3>
      <div id="ds-dang-quet" class="ds-dang-quet"></div>
    </div>
  </div>

  <div id="photo-wrap" style="display:none">
    <p id="photo-mo-ta"></p>
    <div id="thong-tin-don-cho-chup" class="khoi-ket-qua-vua-quet ok"></div>
    <input type="file" accept="image/*" capture="environment" id="input-chup-anh" style="display:none">
    <button id="btn-chup-anh" class="btn-dung-quet san-sang"></button>
    <button type="button" id="btn-quet-lai-chup-anh" class="btn-hanh-dong phu">Quét lại</button>
    <div id="toast-chup-anh" class="toast-vua-quet"></div>
    <div id="dem-nhom-anh" class="dem-nhom"></div>
    <div id="toc-do-anh-gan-nhat" style="display:none;margin-top:10px;font-size:13px;color:var(--color-text-muted)"></div>
    <h3 style="margin-top:20px">Danh sách đã chụp</h3>
    <div id="ds-da-chup" class="ds-dang-quet"></div>
  </div>

  <div id="khu-xem-lai" class="man-xem-lai" style="display:none"></div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/js/icons.js?v=106"></script>
<script src="/js/api.js?v=130"></script>
<script>
let user;
// Mặc định mở vào "Quét kịch bản" (batch) khi vào trang — theo yêu cầu người dùng 05/09/2026, vì đây
// là chế độ dùng thường xuyên nhất, "Tra cứu" (lookup) ít dùng hơn hẳn (đã đẩy xuống nút cuối cùng
// trong thanh chọn chế độ — xem .scan-mode trong HTML phía trên).
let mode = 'batch';
let scanner = null;
let cameraDangChayCho = null;
let dangXuLyQuet = false;
let denFlashBat = false;
let toastTimer = null;

let kichBanDaTai = [];
let kichBanDangChon = null;
let dsQuet = [];
let dangQuetKichBan = true;
let audioCtx = null;

let toastAnhTimer = null;
// Đơn ĐÃ XÁC ĐỊNH (qua quét QR sống) cho tab "Chụp ảnh đã sản xuất" — null =
// đang ở trạng thái "Đang quét" (hiện camera sống), có giá trị = đang ở trạng thái "Sẵn sàng chụp"
// (xem docs/superpowers/specs/2026-09-07-tach-quet-chup-anh-design.md). Trước đây đọc QR TỪ ẢNH VỪA
// CHỤP bằng html5-qrcode.scanFile() — tỉ lệ đọc thất bại cao (giải mã ảnh tĩnh 1 lần thử, khác hẳn
// quét sống nhiều khung hình/giây) — giờ quét sống TRƯỚC để xác định đơn, ảnh chụp sau không cần đọc
// được mã QR trong đó nữa.
let donDaXacDinhChoAnh = null;

// Mốc "chụp ảnh kèm chuyển giai đoạn" — xem CAU_HINH_ANH bên dưới. Giữ DANH SÁCH ĐÃ CHỤP riêng
// (dsDaChupTheoMoc) để không mất lịch sử phiên làm việc khi đổi qua lại các mode khác rồi quay lại.
// (Mốc "photo_dong_goi"/"Chụp ảnh đóng gói" ĐÃ XOÁ 09/09/2026 lần 3 cùng lúc xoá trạng thái "Đã đóng
// gói" khỏi hệ thống, theo yêu cầu người dùng — xem data/pipelineTinhTrang.js.)
// "photo_da_dan_tem"/"Chụp ảnh ĐÃ DÁN TEM" (bổ sung 09/09/2026 lần 4, theo yêu cầu người dùng) — THAY
// THẾ hẳn chế độ "Quét mã QR Tracking" cũ (gọi GKE thật tạo vận đơn — đã xoá) bằng xác nhận thuần ảnh,
// CÙNG khuôn "Chụp ảnh đã sản xuất": quét QR xác định đơn đang "Đã sản xuất" → chụp ảnh → tự chuyển
// TRANG_THAI_XUONG sang "ĐÃ DÁN TEM". KHÔNG gọi GKE, KHÔNG tạo mã tracking thật — cơ chế GKE (Mua
// Tracking, IN LABEL, trang Tracking) vẫn giữ nguyên, tách biệt hoàn toàn khỏi việc đổi trạng thái này
// (đã xác nhận rõ với người dùng, chấp nhận đơn "ĐÃ DÁN TEM" qua đường này sẽ không có mã tracking
// thật trừ khi dùng thêm 1 trong các cơ chế GKE kể trên).
const CAU_HINH_ANH = {
  photo_san_xuat: {
    moc: 'da_san_xuat',
    nhanTab: 'Chụp ảnh đã sản xuất',
    moTa: 'Đơn phải đang ở "Đang chạy máy". Tối đa 2 ảnh mỗi đơn — đơn chuyển "Đã sản xuất" khi chụp xong ảnh 2, bấm Xong, hoặc quét sang đơn tiếp theo.',
    yeuCau: 'Đang chạy máy', chuyenSang: 'Đã sản xuất',
    // Tối đa 2 ảnh/đơn, chuyển trạng thái khi XONG CẢ LƯỢT (14/10/2026, theo yêu cầu người dùng) — xem donChoXong bên dưới.
    haiAnh: true,
  },
  photo_da_dan_tem: {
    moc: 'da_dan_tem',
    nhanTab: 'Chụp ảnh ĐÃ DÁN TEM',
    // Bổ sung 09/09/2026 lần 5: nhắc thêm điều kiện tracking ngay trong mô tả (routes/photos.js đã
    // chặn thật ở /kiem-tra và /upload — đây chỉ là chữ hiển thị giúp người quét hiểu lý do sớm hơn).
    moTa: 'Đơn phải đang ở "Đã sản xuất" và đã có thông tin Tracking (mua tracking trước ở menu Đơn hàng/Tracking).',
    yeuCau: 'Đã sản xuất', chuyenSang: 'ĐÃ DÁN TEM',
  },
};
let dsDaChupTheoMoc = { photo_san_xuat: [], photo_da_dan_tem: [] };
// STT_Key đang có 1 lượt upload ngầm CHƯA XONG (bổ sung 22/09/2026, theo yêu cầu người dùng — chụp
// liên tục nhiều đơn, ảnh tải ngầm phía sau, không chặn nhịp quét→chụp) — chỉ để chặn chụp TRÙNG cho
// ĐÚNG 1 đơn đang chờ ảnh trước tải xong, không khoá gì giữa các đơn khác nhau.
const dsUploadDangCho = new Set(); // khoá: sttKey (ảnh 1 / ảnh duy nhất), sttKey+'#2' (ảnh 2), sttKey+'#xong' (đang gửi "Xong")
// Đơn "Chụp ảnh đã sản xuất" đã chụp ảnh 1 nhưng CHƯA xong lượt (14/10/2026, theo yêu cầu người dùng): { sttKey, tieuDe, tenKhachHang,
// soAnh, huaAnh1: Promise<bool> ảnh 1 đã lưu, dong: dòng "Danh sách đã chụp" }. Xong lượt khi: chụp xong ảnh 2 / bấm "Xong đơn này" /
// quét được đơn KHÁC (kiểm tra OK). Thoát trang thì đơn vẫn "Đang chạy máy"; quét lại đơn đó -> máy chủ báo đã có ảnh -> chụp tiếp.
let donChoXong = null;
// LƯU donChoXong trên máy (15/10/2026, Logs 14/10: Tu tra cứu -> mở Chi tiết đơn -> quay lại, trang Quét QR tải lại, "đơn chờ Xong" chỉ
// nằm trong bộ nhớ trang nên MẤT, quét đơn kế không còn gì để tự Xong -> 7 đơn kẹt "Đang chạy máy" 2–3 giờ). Mọi lần đổi donChoXong đi qua
// datDonChoXong(); mở lại trang thì khoiPhucDonChoXong() hỏi lại máy chủ rồi dựng lại khung chờ. Chỉ lưu dữ liệu thuần (không lưu Promise).
// Khoá RIÊNG từng tài khoản (máy dùng chung — vd 1 iPhone cho Nhân và Phượng): người sau mở trang không đụng tới đơn chờ của người trước.
const khoaDonChoXong = () => 'scan-don-cho-xong:' + user.ten;
const GIU_DON_CHO_XONG_MS = 24 * 3600 * 1000; // quá 1 ngày thì bỏ (đơn đó quét lại vẫn thấy "đã có ảnh" từ máy chủ)
function datDonChoXong(d) {
  donChoXong = d;
  try {
    if (d) localStorage.setItem(khoaDonChoXong(), JSON.stringify({ sttKey: d.sttKey, tieuDe: d.tieuDe || '', tenKhachHang: d.tenKhachHang || '', luc: Date.now() }));
    else localStorage.removeItem(khoaDonChoXong());
  } catch (e) { /* trình duyệt chặn lưu — vẫn chạy như cũ, chỉ không khôi phục được */ }
}
// -> true nếu đã khôi phục (trang chuyển thẳng sang "Chụp ảnh đã sản xuất"). Máy chủ là nguồn đúng: chỉ khôi phục khi đơn VẪN "Đang chạy
// máy" và có ảnh của lượt này (ảnh 1 có thể chưa tải xong lúc trang bị đóng). Lỗi mạng: giữ nguyên bản lưu, lần mở trang sau thử lại.
async function khoiPhucDonChoXong() {
  let luu = null;
  try { luu = JSON.parse(localStorage.getItem(khoaDonChoXong()) || 'null'); } catch (e) { return false; }
  if (!luu || !luu.sttKey) return false;
  if (!(Date.now() - luu.luc < GIU_DON_CHO_XONG_MS)) { datDonChoXong(null); return false; }
  const boQua = lyDo => {
    datDonChoXong(null);
    ghiLogQuet({ suKien: 'XONG_DON', cheDo: 'photo_san_xuat', sttKey: luu.sttKey, ketQua: 'BO_NGANG', loi: lyDo, chiTiet: { cach: 'khoi-phuc' } });
    return false;
  };
  let kq;
  try {
    kq = await apiFetch('/photos/kiem-tra', { method: 'POST', body: JSON.stringify({ sttKey: luu.sttKey, moc: CAU_HINH_ANH.photo_san_xuat.moc }) });
  } catch (err) {
    if (!err.status || err.status >= 500) return false; // mạng / máy chủ lỗi — để lần sau
    return boQua(err.message); // đơn đã sang trạng thái khác (vd người khác đã Xong) / không còn — không còn gì để Xong
  }
  if (!(kq.soAnhLuotNay >= 1)) return boQua('Ảnh 1 chưa lưu được (trang bị đóng khi đang tải) — quét lại mã đơn để chụp lại');
  const dong = { trangThai: 'cho-xong', sttKey: luu.sttKey, ghiChu: `Đã có ${kq.soAnhLuotNay} ảnh — chưa Xong (khôi phục sau khi trang tải lại)` };
  dsDaChupTheoMoc.photo_san_xuat.unshift(dong);
  datDonChoXong({ sttKey: luu.sttKey, tieuDe: kq.tieuDe || luu.tieuDe, tenKhachHang: kq.tenKhachHang || luu.tenKhachHang, soAnh: kq.soAnhLuotNay,
    huaAnh1: Promise.resolve(true), dong, khoiPhuc: true });
  hienThiToast('OK', `${luu.sttKey}: đơn đang chờ — chụp ảnh 2, bấm Xong hoặc quét đơn tiếp theo`);
  return true;
}

// ============================================================
// Logs_UploadAnh (12/10/2026, theo yêu cầu người dùng): ghi MỌI thao tác ở trang này (mở camera, quét QR, chụp + tải ảnh, xác nhận
// hàng loạt, quét lại, thoát khi ảnh chưa tải xong) kèm thiết bị + phiên bản app -> routes/nhatKyQuet.js, xem ở Logs > Logs_UploadAnh.
// Gom lô 3 giây rồi gửi 1 lần; lỗi gửi log thì bỏ qua im lặng (log KHÔNG được làm phiền/chậm người dùng). Không gửi nội dung ảnh.
// ============================================================
const PHIEN_BAN_APP = ((document.querySelector('script[src*="/js/api.js"]') || {}).src || '').match(/[?&]v=(\d+)/)?.[1] || '';
let thietBiLog = null; // gán khi layThietBiLog() xong (Promise thietBiLogSan bên dưới)
const hangDoiLog = [];
let henGuiLog = null;
let tSanSangQuet = performance.now(); // mốc camera sẵn sàng / vừa nhả khoá quét — đo "thời gian tìm mã" (gồm cả lúc người dùng đưa máy vào mã)
let cameraDaMo = false; // camera đang chạy thật (mở thành công) — không thì "thời gian tìm mã" vô nghĩa, ghi trống
const msTimMaHienTai = () => (cameraDaMo ? Math.round(performance.now() - tSanSangQuet) : null);
const luotDangTai = new Map(); // sttKey -> bản ghi CHUP_ANH đang tải — đóng trang giữa chừng thì ghi THOAT_GIUA_CHUNG

// layThietBiLog() (hệ điều hành / trình duyệt / đời máy) nằm ở /js/api.js từ 16/10/2026 — dùng chung với log đo mạng mọi trang.
// Lấy thông tin thiết bị NGAY khi tải trang; mọi lô log CHỜ promise này (tối đa 2 giây) — máy cũ trả Client Hints chậm, không chờ
// thì vài sự kiện đầu (mở camera, mã đầu tiên) rơi vào nhóm "? · ?" đúng lúc cần đo máy chậm.
const thietBiLogSan = layThietBiLog().then(tb => (thietBiLog = tb)).catch(() => (thietBiLog = {}));
// Lỗi do máy chủ đánh dấu nghiepVu (đơn không hợp lệ: sai trạng thái, không tìm thấy, chưa có tracking...) -> nhóm "Sai đơn".
// Mọi lỗi khác (mất mạng, hết phiên 401, file không phải ảnh, máy chủ 5xx...) -> lỗi kỹ thuật ('LOI').
const ketQuaLoi = (err, nhanNghiepVu) => (err && err.nghiepVu ? nhanNghiepVu : 'LOI');
// Dùng chung api.js#thongTinMangTrinhDuyet (loai / mbps / rtt / kieu) — trình duyệt không báo gì thì null như trước.
const mangHienTai = () => (navigator.connection ? thongTinMangTrinhDuyet() : null);
function ghiLogQuet(suKien) {
  hangDoiLog.push({ ...suKien, cheDo: suKien.cheDo || mode, _t: Date.now() });
  clearTimeout(henGuiLog);
  henGuiLog = setTimeout(guiLogQuet, 3000);
}
async function guiLogQuet(beacon = false, hoiPhienBan = false) {
  if (!beacon && !thietBiLog) await Promise.race([thietBiLogSan, new Promise(r => setTimeout(r, 2000))]);
  if (!hangDoiLog.length && !hoiPhienBan) return; // vd pagehide đã gửi hết bằng sendBeacon trong lúc chờ thông tin thiết bị
  const goi = hangDoiLog.splice(0, 30);
  const body = JSON.stringify({ phienBanApp: PHIEN_BAN_APP, thietBi: thietBiLog || {}, suKien: goi.map(({ _t, ...s }) => ({ ...s, cachMs: Date.now() - _t })) });
  if (beacon) { try { navigator.sendBeacon('/api/nhat-ky-quet', new Blob([body], { type: 'application/json' })); } catch (e) { /* bỏ */ } return; }
  try {
    const r = await fetch('/api/nhat-ky-quet', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body, credentials: 'include', keepalive: true });
    if (r.ok) nhacBanMoi((await r.json()).phienBanMoiNhat);
  } catch (e) { /* mất mạng: bỏ lô này */ }
  if (hangDoiLog.length) setTimeout(guiLogQuet, 500);
}
// Tab Quét QR mở suốt ca nhiều ngày không tải lại -> chạy bản cũ. Máy chủ báo số mới nhất mỗi lần gửi log -> hiện thanh nhắc.
function nhacBanMoi(moiNhat) {
  if (!moiNhat || !PHIEN_BAN_APP || moiNhat === PHIEN_BAN_APP || document.getElementById('thanh-ban-moi')) return;
  const el = document.createElement('button');
  el.id = 'thanh-ban-moi';
  el.type = 'button';
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2000;padding:10px;border:0;background:#f59e0b;color:#111;font-weight:700;font-size:15px;cursor:pointer';
  el.textContent = '⟳ Có bản mới của app — bấm để tải lại trang';
  el.onclick = async () => {
    if (dsUploadDangCho.size && !await hopXacNhan(`Còn ${dsUploadDangCho.size} ảnh đang tải lên — tải lại trang bây giờ sẽ làm hỏng các ảnh đó. Vẫn tải lại?`)) return;
    daDongYRoiTrang = true; // đã hỏi ở trên — không hỏi lần 2 ở beforeunload

  // chặn phát âm thanh tự động nếu chưa có tương tác, nên "mồi" trước để tiếng bíp sau này phát được ngay.
  try { layAudioCtx().resume(); } catch (e) {}
  capNhatManHinh();

// ============================================================
// ÂM THANH — 3 tiếng bíp khác nhau rõ rệt cho 3 kết quả quét, tự tạo bằng Web Audio API (không cần file âm thanh)
// ============================================================
function layAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function phatBeep(tanSo, thoiLuongMs, doTreMs, loaiSong) {
  try {
    const ctx = layAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = loaiSong || 'sine';
    osc.frequency.value = tanSo;
    gain.gain.value = 0.18;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const batDau = ctx.currentTime + (doTreMs || 0) / 1000;
    osc.start(batDau);
    osc.stop(batDau + thoiLuongMs / 1000);
  } catch (e) { /* trình duyệt chặn âm thanh — bỏ qua lặng lẽ, không ảnh hưởng luồng quét */ }
}

// 3 kết quả phải nghe RÕ RÀNG KHÁC NHAU, đặc biệt "Sẵn sàng" phải khác hẳn 2 trường hợp lỗi để
// không nhầm khi quét nhanh liên tục: OK dùng sóng sine êm (như chuông); 2 trường hợp lỗi dùng
// sóng square (âm sắc "còi báo động", khác hẳn về chất âm chứ không chỉ khác cao độ) + có rung.
function phatAmThanhKetQua(nhom) {
  if (nhom === 'DA_NHAN') {
    // Tab Tracking (bổ sung 02/09/2026): quét xong 1 mã phải chờ GKE tới ~1 phút mới có kết quả
    // cuối — nếu chỉ phát âm OK/lỗi ở cuối thì người quét không biết máy đã "nhận" được mã ngay lúc
    // quét hay chưa, dễ tưởng máy treo mà quét lại. 2 tiếng "tít tít" NGẮN, CÙNG 1 cao độ, sát nhau
    // (mô phỏng tiếng bíp máy quét mã vạch quen thuộc, dễ nhận ra ngay) — cao độ cao hơn hẳn và
    // không tăng dần như OK (OK: 2 nốt tăng dần 880→1175, dài hơn, cách xa hơn) nên không lẫn dù
    // cùng là 2 tiếng; không mang nghĩa thành công/thất bại nên không rung.
    phatBeep(1500, 50, 0, 'sine');
    phatBeep(1500, 50, 70, 'sine');
  } else if (nhom === 'OK') {
    // 2 nốt sine tăng dần, êm nhẹ — không rung, để phân biệt tuyệt đối với 2 trường hợp lỗi bên dưới
    phatBeep(880, 120, 0, 'sine');
    phatBeep(1175, 150, 100, 'sine');
  } else if (nhom === 'SAI_TRANG_THAI') {
    // Sóng vuông (âm sắc "còi"), 2 tiếng đều nhau mức trung — khác hẳn chất âm của OK
    phatBeep(520, 130, 0, 'square');
    phatBeep(520, 130, 190, 'square');
    if (navigator.vibrate) navigator.vibrate([120, 90, 120]); // rung 2 nhịp ngắn
  } else if (nhom === 'CANH_BAO_NHOM') {
    // F1 (11/10/2026): đơn nhiều áo chưa đủ — 3 tiếng sine 660Hz ngắn đều nhau (khác hẳn 4 âm trên), phát SAU tiếng OK.
    phatBeep(660, 90, 0, 'sine');
    phatBeep(660, 90, 150, 'sine');
    phatBeep(660, 90, 300, 'sine');
    if (navigator.vibrate) navigator.vibrate([80, 60, 80, 60, 80]);
  } else if (nhom === 'KHONG_TIM_THAY') {
    // Sóng vuông, trầm hơn, dài hơn, 3 tiếng dồn dập — nặng nhất trong 3 kết quả, không thể nhầm với OK
    phatBeep(220, 160, 0, 'square');
    phatBeep(220, 160, 220, 'square');
    phatBeep(180, 260, 440, 'square');
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]); // rung 3 nhịp dài hơn, khác kiểu với Sai trạng thái
  }
}

// Bật/tắt camera XẾP HÀNG (14/10/2026, theo Logs_UploadAnh 13/10: bấm đổi chế độ khi camera đang mở dở -> html5-qrcode báo "Cannot
// transition to a new state, already under transition" / "Cannot clear while scan is ongoing", camera CŨ không tắt được và vẫn gọi hàm
// quét của chế độ chụp ảnh khi đã sang "Tra cứu" -> lỗi "cauHinh.moc" liên tục). Chỉ 1 lượt bật/tắt chạy tại 1 thời điểm; bấm dồn dập
// trong lúc đang chạy thì chỉ nhớ chế độ MUỐN cuối cùng, xong lượt hiện tại mới chuyển thẳng tới đó (bỏ qua các chế độ trung gian).
// Giới hạn: lượt đang chờ hộp xin quyền camera (getUserMedia) không huỷ được — đổi chế độ sẽ có hiệu lực ngay khi người dùng trả lời.
let cameraMuonChay = null, luotDieuChinhCamera = null;
// Lỗi khi tắt camera cũ (dungCamera) — gắn vào log MO_CAMERA ngay sau (chiTiet.loiDung) để biết vì sao mở camera mới báo "Cannot clear
// while scan is ongoing" (Logs_UploadAnh 14/10: đổi chế độ ngay khi camera vừa mở xong).
let loiDungCamera = null;
const trangThaiScanner = () => { try { return scanner.getState(); } catch (e) { return null; } }; // html5-qrcode: 1 chưa chạy, 2 đang quét, 3 tạm dừng
const moTaLoi = e => `${(e && e.name) || ''} ${String((e && e.message) || e)}`.trim(); // html5-qrcode hay throw CHUỖI (không có name)
function dieuChinhCamera(muonChay) {
  cameraMuonChay = muonChay;
  if (!luotDieuChinhCamera) {
    luotDieuChinhCamera = (async () => {
      try {
        let muon;
        do {
          muon = cameraMuonChay;
          // Lỗi 1 lượt không được làm mất chế độ người dùng bấm TRONG LÚC lượt đó chạy — bắt lỗi từng lượt, vòng vẫn chạy tiếp tới chế độ cuối.
          try { await dieuChinhCameraThat(muon); } catch (err) { console.error('[Camera] Lỗi đổi camera:', err); }
        } while (muon !== cameraMuonChay);
      } finally {
        luotDieuChinhCamera = null;
      }
    })();
  }
  return luotDieuChinhCamera;
}
async function dieuChinhCameraThat(muonChay) {
  if (muonChay === cameraDangChayCho) return;
  loiDungCamera = null; // chỉ gắn lỗi tắt camera của ĐÚNG lượt này vào log MO_CAMERA ngay sau
  if (cameraDangChayCho !== null) await dungCamera();
  cameraDangChayCho = muonChay;
  if (muonChay === 'lookup') await batDauCamera(xuLyQuetTraCuu);
  // "Quét kịch bản" TỪNG truyền aspectRatio 16/9 riêng (khung camera rộng-thấp) — ĐÃ BỎ 09/09/2026,
  // dùng chung đúng 1 cỡ khung mặc định (qrbox 260 + khung ngoài ~286px) như mọi chế độ khác.
  else if (muonChay === 'batch') await batDauCamera(ma => xuLyQuetKichBan(ma)); // html5-qrcode gọi (mã, kếtQuả) — chỉ chuyển mã, tham số 2 dành cho ô nhập
  // "Chụp ảnh đã sản xuất" — bước quét QR SỐNG để xác định đơn, trước khi cho chụp ảnh
  // thật (xem docs/superpowers/specs/2026-09-07-tach-quet-chup-anh-design.md).
  else if (muonChay === 'photo_scan') await batDauCamera(ma => xuLyQuetDeXacDinhDon(ma)); // html5-qrcode truyền thêm decodedResult — không để rơi vào `nguon`
}

// "NotReadableError: Could not start video source" KHÔNG PHẢI lỗi quyền — trình duyệt/OS chưa kịp
// nhả hẳn camera từ lượt dừng ngay trước đó (hay gặp khi dừng rồi mở lại camera liên tiếp) HOẶC 1
// app/tab khác đang giữ camera. Tự thử lại vài lần có chờ trước khi báo lỗi thật — phần lớn trường
// hợp tự hết sau 1-2 lần thử vì camera vừa được nhả ra.
function laLoiCameraDangBanRoi(err) {
  return /NotReadableError/i.test(String(err));
}

async function batDauCamera(onScan, qrboxSize, tuyChon = {}) {
  const { soLanThuLai = 2, facingMode = 'environment', aspectRatio } = tuyChon;
  if (!scanner) scanner = new Html5Qrcode('qr-reader');

  // Ghi ra Console (F12) trạng thái quyền camera THẬT SỰ theo trình duyệt (nếu hỗ trợ Permissions
  // API) — để phân biệt rõ "chưa cấp quyền/đã bị chặn" (permission) với "có quyền nhưng phần cứng
  // không mở được" (NotReadableError, xem hàm trên) thay vì đoán mò qua thông báo lỗi chung chung.
  try {
    const trangThai = await navigator.permissions.query({ name: 'camera' });
    console.log('[Camera] Trạng thái quyền camera (Permissions API):', trangThai.state);
  } catch (e) {
    console.log('[Camera] Trình duyệt không hỗ trợ Permissions API cho camera — bỏ qua bước kiểm tra này (không phải lỗi).');
  }

  const tMoCamera = performance.now();
  for (let lan = 0; lan <= soLanThuLai; lan++) {
    const gioBatDau = Date.now();
    try {
      // Mã đọc được lúc đang có hộp thoại mở (api.js#dangMoHopThoai) -> bỏ qua: hộp của app không dừng camera như alert() của
      // trình duyệt trước đây, không để đơn bị xử lý phía sau hộp người dùng đang đọc. Đóng hộp xong camera đọc lại bình thường.
      await scanner.start({ facingMode }, { fps: 10, qrbox: qrboxSize || 260, ...(aspectRatio ? { aspectRatio } : {}) },
        (...thamSo) => { if (!dangMoHopThoai()) onScan(...thamSo); });
      capNhatHoTroFlash();
      console.log(`[Camera] Mở camera thành công sau ${Date.now() - gioBatDau}ms (facingMode=${facingMode})`);
      tSanSangQuet = performance.now();
      cameraDaMo = true;
      ghiLogQuet({ suKien: 'MO_CAMERA', ketQua: 'OK', tongMs: Math.round(tSanSangQuet - tMoCamera), chiTiet: { soLanThu: lan + 1, ...(loiDungCamera ? { loiDung: loiDungCamera } : {}) } });
      return;
    } catch (err) {
      console.error(`[Camera] Lỗi mở camera (lần ${lan + 1}/${soLanThuLai + 1}, sau ${Date.now() - gioBatDau}ms) — tên lỗi: "${err && err.name}":`, err);
      if (laLoiCameraDangBanRoi(err) && lan < soLanThuLai) {
        console.warn(`[Camera] Camera đang bận, đợi rồi thử lại...`);
        await new Promise(r => setTimeout(r, 700));
        continue;
      }
      ghiLogQuet({ suKien: 'MO_CAMERA', ketQua: 'LOI', loi: moTaLoi(err),
        tongMs: Math.round(performance.now() - tMoCamera),
        chiTiet: { soLanThu: lan + 1, trangThaiMayQuet: trangThaiScanner(), ...(loiDungCamera ? { loiDung: loiDungCamera } : {}) } });
      const goiY = laLoiCameraDangBanRoi(err)
        ? 'Camera đang được app/tab khác dùng — đóng hết ứng dụng/tab khác đang mở camera (Zoom, Teams, Windows Camera, tab trình duyệt khác...) rồi thử lại.'
        : 'Hãy cho phép quyền camera cho trang web này trong trình duyệt.';
      document.getElementById('ket-qua-tra-cuu').innerHTML =
        `<div class="ket-qua-box loi">${icon('alert')} Không mở được camera: ${escapeHtml(String(err))}. ${goiY}</div>`;
      cameraDangChayCho = null; // không mở được -> bấm lại đúng chế độ đó sẽ thử mở lại (trước đây coi như đang chạy, bấm không có tác dụng)
      return;
    }
  }
}

// html5-qrcode 2.3.8: stop() lỗi giữa chừng (vd camera.close() ném lỗi) thì máy quét KẸT ở "đang quét" -> mọi start() sau đều báo "Cannot
// clear while scan is ongoing"; stop() còn có thể TREO mãi (close() không bao giờ xong khi luồng video không còn track nào) làm kẹt cả
// hàng đợi bật/tắt camera. Nên: chờ stop() tối đa 2 giây; sau đó máy quét chưa về "chưa chạy" (1) thì BỎ hẳn bản đó — tự tắt luồng video,
// dừng vòng quét của nó (shouldScan — thuộc tính nội bộ 2.3.8, để bản cũ không gọi hàm quét của chế độ cũ nữa) — lần mở sau tạo bản mới.
async function dungCamera() {
  if (scanner) {
    const cu = scanner;
    let hen;
    // GỐC lỗi Logs 14/10 (thử với thư viện thật): start() xong TRƯỚC khi video phát ("playing") — canvas quét chỉ được tạo lúc "playing";
    // stop() trong khoảng đó gọi removeChild(canvas null) -> lỗi, máy quét kẹt. Nên chờ "playing" (tối đa 2 giây) rồi mới stop(). Bộ nghe
    // của html5-qrcode gắn trước nên chạy trước bộ nghe này -> canvas đã có khi stop().
    const video = document.querySelector('#qr-reader video');
    if (video && !document.querySelector('#qr-reader canvas')) {
      await new Promise(xong => { video.addEventListener('playing', xong, { once: true }); hen = setTimeout(xong, 2000); });
      clearTimeout(hen);
    }
    try {
      await Promise.race([cu.stop(), new Promise((_, loi) => { hen = setTimeout(() => loi(new Error('stop() quá 2 giây')), 2000); })]);
    } catch (e) {
      loiDungCamera = `${moTaLoi(e).slice(0, 150)} (trạng thái ${trangThaiScanner()})`;
    } finally {
      clearTimeout(hen);
    }
    if (trangThaiScanner() !== 1) {
      // Nâng html5-qrcode mà thuộc tính nội bộ này đổi tên -> ghi rõ vào log thay vì âm thầm không có tác dụng.
      const conShouldScan = 'shouldScan' in cu;
      cu.shouldScan = false;
      document.querySelectorAll('#qr-reader video').forEach(v => { try { v.srcObject && v.srcObject.getTracks().forEach(t => t.stop()); } catch (e) {} });
      document.getElementById('qr-reader').innerHTML = ''; // bỏ khung video chết của bản cũ ngay (chế độ sau có thể không mở camera)
      scanner = null;
      loiDungCamera = `${loiDungCamera || 'stop() xong nhưng máy quét chưa về "chưa chạy"'} — đã bỏ máy quét cũ, tạo bản mới`
        + (conShouldScan ? '' : ' [html5-qrcode không còn shouldScan — xem lại dungCamera]');
    }
  }
  cameraDaMo = false;
  cameraDangChayCho = null;
  denFlashBat = false;
  document.getElementById('btn-flash').hidden = true;
  capNhatNutFlash();
}

// Đèn flash chỉ hoạt động qua web trên số ít thiết bị/trình duyệt hỗ trợ "torch" — kiểm tra ngay
// sau khi mở camera, ẩn hẳn icon nếu không hỗ trợ (thay vì hiện ra rồi báo lỗi khi bấm như trước).
function capNhatHoTroFlash() {
  let hoTro = false;
  try {
    const kn = scanner.getRunningTrackCapabilities();
    hoTro = !!(kn && kn.torch);
  } catch (e) {}
  document.getElementById('btn-flash').hidden = !hoTro;
}

document.getElementById('btn-flash').onclick = async () => {
  if (!scanner || !cameraDangChayCho) return;
  try {
    denFlashBat = !denFlashBat;
    await scanner.applyVideoConstraints({ advanced: [{ torch: denFlashBat }] });
  } catch (e) {
    denFlashBat = false;
    await hopThongBao('Thiết bị hoặc trình duyệt này không hỗ trợ bật đèn flash qua web (thường gặp trên iPhone/Safari).');
  }
  capNhatNutFlash();
};

function capNhatNutFlash() {
  const btn = document.getElementById('btn-flash');
  btn.classList.toggle('dang-bat', denFlashBat);
  btn.innerHTML = '🔦';
  btn.setAttribute('aria-label', denFlashBat ? 'Tắt đèn flash' : 'Bật đèn flash');
  btn.title = btn.getAttribute('aria-label');
}

async function xuLyQuetTraCuu(sttKey) {
  if (dangXuLyQuet) return;
  dangXuLyQuet = true;
  const el = document.getElementById('ket-qua-tra-cuu');
  const msTimMa = msTimMaHienTai(), tKiemTra = performance.now();

  try {
    const don = await apiFetch('/qr/tra-cuu/' + encodeURIComponent(sttKey));
    ghiLogQuet({ suKien: 'QUET_QR', sttKey, ketQua: 'OK', chiTiet: { nguon: 'CAMERA', msTimMa, msKiemTra: Math.round(performance.now() - tKiemTra) } });
    el.innerHTML = `<div class="ket-qua-box">
      ${icon('package')}
      <div>
        <strong>${escapeHtml(don.TieuDeSanPham || don.STT_Key)}</strong> — ${escapeHtml(don.TenKhachHang || '')}<br>
        Trạng thái: <span class="badge ${lopTrangThai(don.TRANG_THAI_XUONG)}">${escapeHtml(don.TRANG_THAI_XUONG || '')}</span><br>
        <a href="/order.html?stt=${encodeURIComponent(sttKey)}">Xem chi tiết ${icon('arrowRight', {size:14})}</a>
      </div>
    </div>`;
  } catch (e) {
    el.innerHTML = `<div class="ket-qua-box loi">${icon('alert')} ${escapeHtml(e.message)}</div>`;
    ghiLogQuet({ suKien: 'QUET_QR', sttKey, ketQua: ketQuaLoi(e, 'KHONG_TIM_THAY'), loi: e.message,
      chiTiet: { nguon: 'CAMERA', msTimMa, msKiemTra: Math.round(performance.now() - tKiemTra) } });
  }

  setTimeout(() => { dangXuLyQuet = false; tSanSangQuet = performance.now(); }, 1500);
}

// Ô nhập mã (kịch bản "Cho nhập mã tay", 05/10/2026): Enter = đúng như vừa quét 1 mã bằng camera. Máy quét mã vạch cầm tay
// gõ rất nhanh — mã nào tới khi mã trước chưa xử lý xong thì XẾP HÀNG chờ (camera thì bỏ qua lượt quét trùng, ô nhập thì
// không được bỏ mã nào). Xử lý xong con trỏ quay lại ô (alert lỗi mạng cũng làm mất con trỏ).
let hangDoiNhapMa = Promise.resolve();
function oNhapMaKichBanSanSang() {
  const o = document.getElementById('o-nhap-ma-kich-ban');
  o.value = '';
  o.focus();
}
function nhapMaKichBan(e) {
  e.preventDefault();
  const o = document.getElementById('o-nhap-ma-kich-ban');
  const ma = o.value.trim();
  o.value = '';
  o.focus();
  if (!ma) return;
  const kichBanLucGo = kichBanDangChon; // ghi nhận NGAY lúc Enter — mã còn chờ trong hàng đợi mà đã đổi kịch bản thì bỏ
  // .catch: 1 mã lỗi bất ngờ không được làm hỏng cả hàng đợi (promise bị reject -> mọi mã sau bị bỏ im lặng).
  hangDoiNhapMa = hangDoiNhapMa
    .then(() => xuLyQuetKichBan(ma, kichBanLucGo))
    .catch(err => {
      dangXuLyQuet = false;
      hienThiToast('KHONG_TIM_THAY', `Lỗi khi xử lý mã ${ma}: ${err.message}`);
      phatAmThanhKetQua('KHONG_TIM_THAY');
    })
    .then(() => o.focus());
}

// kichBanCuaMa: chỉ ô nhập truyền vào (kịch bản lúc gõ mã) — camera để null.
async function xuLyQuetKichBan(sttKey, kichBanCuaMa = null) {
  const tuONhap = !!kichBanCuaMa;
  // Ô nhập: mã đã bị xoá khỏi ô nên KHÔNG được bỏ qua — khoá đang bị chỗ khác giữ (vd thao tác ở màn Xem lại, nhả sau
  // 700ms) thì chờ nhả rồi xử lý. Camera vẫn bỏ qua như cũ (khung hình sau sẽ đọc lại mã).
  if (tuONhap) while (dangXuLyQuet) await new Promise(r => setTimeout(r, 50));
  if (dangXuLyQuet) return;
  if (tuONhap && kichBanCuaMa !== kichBanDangChon) return; // đã đổi sang kịch bản khác trong lúc mã chờ

  const daCo = dsQuet.find(x => x.sttKey === sttKey);
  if (daCo) {
    hienThiToast('trung', `Mã ${sttKey} đã có trong danh sách`);
    nhayDong(daCo.key);
    return;
  }

  dangXuLyQuet = true;
  const msTimMa = tuONhap ? null : msTimMaHienTai(), tKiemTra = performance.now();
  const logQuet = (ketQuaLog, them = {}) => ghiLogQuet({ suKien: 'QUET_QR', sttKey: them.sttKey || sttKey, ketQua: ketQuaLog, loi: them.loi || '',
    chiTiet: { nguon: tuONhap ? 'NHAP_TAY' : 'CAMERA', msTimMa, msKiemTra: Math.round(performance.now() - tKiemTra), kichBan: kichBanDangChon && kichBanDangChon.id } });
  let ketQua;
  try {
    ketQua = await apiFetch(`/qr/kich-ban/${kichBanDangChon.id}/kiem-tra`, {
      method: 'POST', body: JSON.stringify(tuONhap ? { sttKey, goTay: true, daCoTrongDs: dsQuet.map(x => x.sttKey) } : { sttKey }),
    });
  } catch (e) {
    logQuet('LOI', { loi: e.message });
    await hopThongBao('Lỗi khi kiểm tra mã: ' + e.message);
    dangXuLyQuet = false;
    tSanSangQuet = performance.now();
    return;
  }
  logQuet(ketQua.nhom || 'OK', { sttKey: ketQua.sttKey, loi: ketQua.nhom !== 'OK' ? ketQua.lyDo || '' : '' });
  // Ô nhập: server trả MÃ GỐC (gõ "10son10,1" -> "10SON10.1") — báo trùng theo mã gốc như khi quét camera.
  // (server trả nhom TRUNG và không ghi nhật ký; vẫn so lại phía này phòng danh sách đổi trong lúc chờ)
  const trungMaGoc = tuONhap && ketQua.sttKey && dsQuet.find(x => x.sttKey === ketQua.sttKey);
  if (trungMaGoc || ketQua.nhom === 'TRUNG') {
    hienThiToast('trung', `Mã ${ketQua.sttKey} đã có trong danh sách`);
    if (trungMaGoc) nhayDong(trungMaGoc.key);
    dangXuLyQuet = false;
    tSanSangQuet = performance.now();
    return;
  }
  // Mã từ ô nhập còn trong hàng đợi lúc người dùng đã đổi sang kịch bản khác -> kết quả không thuộc danh sách hiện tại, bỏ.
  if (tuONhap && kichBanDangChon !== kichBanCuaMa) { dangXuLyQuet = false; return; }

  const item = {
    key: sttKey + '_' + Date.now(),
    sttKey: ketQua.sttKey || sttKey,
    tieuDe: ketQua.tieuDe || '',
    tenKhachHang: ketQua.tenKhachHang || '',
    nhom: ketQua.nhom,
    lyDo: ketQua.lyDo || '',
    trangThaiHienTai: ketQua.trangThaiHienTai || '',
    trangThaiYeuCau: ketQua.trangThaiYeuCau || '',
    trangThaiSau: ketQua.trangThaiSau || '',
    nhomNhieuAo: ketQua.nhomNhieuAo || null,
    daXuLy: false,
  };
  dsQuet.unshift(item);

  hienThiToast(item.nhom, item.tieuDe || item.sttKey);
  phatAmThanhKetQua(item.nhom);
  if (item.nhomNhieuAo) setTimeout(() => phatAmThanhKetQua('CANH_BAO_NHOM'), 350);

  renderDemNhom();
  renderDsDangQuet();
  renderKetQuaVuaQuet();

  // Camera: khoá 700ms chống 1 mã bị đọc nhiều lần liên tiếp. Ô nhập: mở khoá ngay cho mã kế tiếp trong hàng đợi.
  if (tuONhap) dangXuLyQuet = false;
  else setTimeout(() => { dangXuLyQuet = false; tSanSangQuet = performance.now(); }, 700);
}

// nut (tuỳ chọn, 16/10/2026): { nhan, bam } — nút bấm ngay trong toast; toast có nút hiện lâu hơn (10 giây) và bấm được.
function hienThiToast(loai, noiDung, nut) {
  clearTimeout(toastTimer);
  const el = document.getElementById('toast-vua-quet');
  const MAP = {
    OK: { cls: 'ok', icon: '✅' },
    SAI_TRANG_THAI: { cls: 'canh-bao', icon: '⚠️' },
    KHONG_TIM_THAY: { cls: 'loi', icon: '❌' },
    trung: { cls: 'canh-bao', icon: '🔁' },
  };
  const m = MAP[loai] || MAP.trung;
  // Camera vẫn đọc lại đúng mã lỗi ~0,7 giây/lần: toast có nút đang hiện CÙNG nội dung -> chỉ gia hạn, KHÔNG vẽ lại (vẽ lại thay nút giữa
  // lúc đang chạm -> lần bấm bị mất).
  if (nut && el.classList.contains('co-nut') && el.dataset.noiDung === noiDung) {
    toastTimer = setTimeout(() => { el.classList.remove('hien', 'co-nut'); }, 10000);
    return;
  }
  el.dataset.noiDung = noiDung;
  el.className = 'toast-vua-quet hien ' + m.cls + (nut ? ' co-nut' : '');
  el.innerHTML = `<span style="font-size:1.4rem">${m.icon}</span> <span>${escapeHtml(noiDung)}${nut ? '<br><button type="button" class="btn-hanh-dong nut-trong-toast"></button>' : ''}</span>`;
  if (nut) {
    const b = el.querySelector('.nut-trong-toast');
    b.textContent = nut.nhan;
    b.onclick = () => { clearTimeout(toastTimer); el.classList.remove('hien', 'co-nut'); nut.bam(); };
  }
  toastTimer = setTimeout(() => { el.classList.remove('hien', 'co-nut'); }, nut ? 10000 : 3500);
}

// Quét đơn "Đã sản xuất" khi đang ở chế độ chụp ảnh SẢN XUẤT (16/10/2026, theo yêu cầu người dùng — log 15/10: cùng đơn bị quét lại
// 6–9 lần vì đang nhầm chế độ): thông báo lỗi kèm nút chuyển sang chế độ Đã dán tem + tự kiểm tra lại đúng đơn vừa quét (vào thẳng
// màn chụp). Chỉ khi đơn đang ĐÚNG trạng thái chế độ Đã dán tem yêu cầu.
function nutChuyenSangDanTem(ma, trangThaiHienTai) {
  if (mode !== 'photo_san_xuat' || trangThaiHienTai !== 'Đã sản xuất') return undefined;
  return {
    nhan: 'Chuyển sang chế độ Đã dán tem',
    bam: async () => {
      while (dangXuLyQuet) await new Promise(r => setTimeout(r, 200)); // lượt quét trước còn khoá 0,7 giây
      // Giữ khoá TỪ TRƯỚC khi đổi chế độ: camera vẫn chạy, không để 1 mã khác đọc được giữa chừng chen vào rồi bị lượt của nút ghi đè
      // (ảnh chụp sau đó gắn nhầm đơn). xuLyQuetDeXacDinhDon tự nhả khoá khi xong.
      dangXuLyQuet = true;
      // Đơn ở chế độ chụp sản xuất đang chờ "Xong" (đã có ảnh 1) -> coi như xong lượt, giống "quét sang đơn tiếp theo" (chạy ngầm).
      if (donChoXong) hoanTatDonChoXong('doi-che-do');
      doiMode('photo_da_dan_tem');
      xuLyQuetDeXacDinhDon(ma, 'NUT_DOI_CHE_DO');
    },
  };
}

function lopNhom(nhom) { return nhom === 'OK' ? 'ok' : nhom === 'SAI_TRANG_THAI' ? 'canh-bao' : 'loi'; }
function nhanIconNhom(nhom) { return nhom === 'OK' ? '✅' : nhom === 'SAI_TRANG_THAI' ? '⚠️' : '❌'; }

function renderDemNhom() {
  const el = document.getElementById('dem-nhom');
  const soOK = dsQuet.filter(x => x.nhom === 'OK' && !x.daXuLy).length;
  const soCanhBao = dsQuet.filter(x => x.nhom === 'SAI_TRANG_THAI' && !x.daXuLy).length;
  const soLoi = dsQuet.filter(x => x.nhom === 'KHONG_TIM_THAY' && !x.daXuLy).length;
  el.innerHTML = `
    <div class="dem-o ok"><div class="hang-tren"><span class="dem-icon">✅</span><span class="dem-so">${soOK}</span></div><div class="dem-nhan">Sẵn sàng</div></div>
    <div class="dem-o canh-bao"><div class="hang-tren"><span class="dem-icon">⚠️</span><span class="dem-so">${soCanhBao}</span></div><div class="dem-nhan">Sai trạng thái</div></div>
    <div class="dem-o loi"><div class="hang-tren"><span class="dem-icon">❌</span><span class="dem-so">${soLoi}</span></div><div class="dem-nhan">Không tìm thấy</div></div>`;
}

// Nội dung 1 dòng kết quả quét (dùng chung cho "Danh sách đang quét" và "Xem lại", nhóm cảnh báo/
// lỗi ở dongXemLaiCanBaoLoi bên dưới) — LUÔN hiện dòng tiêu đề `item.tieuDe` (services/orderService.js,
// tieuDeSanPham, đã tự chứa STT_Key ở đầu) cho MỌI nhóm, kể cả SAI_TRANG_THAI (sửa 12/09/2026, theo
// yêu cầu người dùng — trước đây nhóm SAI_TRANG_THAI CHỈ hiện `lyDo` (server dựng sẵn, có nhắc mã đơn
// trong câu) để tránh lặp mã đơn 2 lần trên cùng 1 thẻ, nhưng như vậy lại ẩn mất tên/loại/size/màu thật
// của đơn — người dùng xác nhận cần thấy rõ tên đơn hơn là tránh lặp đúng mã đơn 1 lần).
function noiDungDongQuet(item) {
  return `
        <strong>${escapeHtml(item.tieuDe || item.sttKey)}</strong>
        <div class="ly-do">${escapeHtml(item.lyDo || (item.nhom === 'OK' ? `Sẽ chuyển: ${item.trangThaiHienTai} → ${item.trangThaiSau}` : ''))}</div>
        ${htmlCanhBaoNhom(item.nhomNhieuAo)}`;
}

// F1 (11/10/2026): khung vàng "Nhóm 9F13 (3 áo): 9F13.1 ✓ Đã sản xuất · 9F13,2 ✗ Đang chạy máy" — chỉ cảnh báo, không chặn.
// Màu cố định (vàng đậm/chữ nâu) đọc được cả nền sáng lẫn tối.
function htmlCanhBaoNhom(n) {
  if (!n) return '';
  return `<div style="margin-top:6px;padding:8px 10px;border:3px solid #eab308;background:#fef9c3;color:#713f12;border-radius:8px;font-weight:600;line-height:1.5">
    ⚠️ Nhóm ${escapeHtml(n.goc)} (${n.tong} áo) chưa đủ: ${n.thanhVien.map(t => `${escapeHtml(t.sttKey)} ${t.du ? '✓' : '✗'} ${escapeHtml(t.trangThai || '(trống)')}`).join(' · ')}
  </div>`;
}

function renderDsDangQuet() {
  const el = document.getElementById('ds-dang-quet');
  if (dsQuet.length === 0) { el.innerHTML = '<p style="color:var(--color-text-faint)">Chưa quét mã nào.</p>'; return; }

  el.innerHTML = dsQuet.map(item => `
    <div class="dong-quet ${lopNhom(item.nhom)}" id="dong-${item.key}">
      <span style="font-size:1.3rem">${nhanIconNhom(item.nhom)}</span>
      <div class="noi-dung">${noiDungDongQuet(item)}</div>
      <button class="btn-xoa-dong" onclick="xoaKhoiDsQuet('${item.key}', false)">XÓA</button>
    </div>`).join('');
}

function nhanTenNhom(nhom) { return nhom === 'OK' ? 'Sẵn sàng' : nhom === 'SAI_TRANG_THAI' ? 'Sai trạng thái' : 'Không tìm thấy'; }

// Khối "Kết quả vừa quét" — luôn hiện ĐÚNG 1 đơn vừa quét gần nhất (dsQuet[0]), KHÔNG tự ẩn như
// toast-vua-quet (biến mất sau 3.5s) — người quét thường đang thao tác tay ngoài kho, cần đủ thời
// gian đọc kỹ tình trạng đơn vừa quét thay vì phải nhìn đúng lúc toast còn hiện. Chỉ bị ghi đè khi
// có lượt quét MỚI (gọi lại hàm này), không tự đổi theo thời gian.
function renderKetQuaVuaQuet() {
  const el = document.getElementById('ket-qua-vua-quet-kich-ban');
  // LUÔN giữ "chi-che-do-kich-ban" trong className (không ghi đè mất) — setBatchOnlyVisible() dựa
  // vào đúng class này để ẩn khối này khi chuyển sang chế độ khác (Tra cứu/Tracking/Chụp ảnh); nếu
  // mất class này ở đây, khối sẽ bị kẹt hiện luôn kể cả sau khi rời khỏi "Quét kịch bản".
  if (dsQuet.length === 0) {
    el.className = 'khoi-ket-qua-vua-quet chi-che-do-kich-ban';
    el.innerHTML = '<p style="color:var(--color-text-faint);margin:0">Chưa quét mã nào.</p>';
    return;
  }
  const item = dsQuet[0];
  el.className = 'khoi-ket-qua-vua-quet chi-che-do-kich-ban ' + lopNhom(item.nhom);
  const dongTrangThai = item.nhom === 'OK'
    ? `Trạng thái: ${escapeHtml(item.trangThaiHienTai)} → ${escapeHtml(item.trangThaiSau)}`
    : escapeHtml(item.lyDo);
  el.innerHTML = `
    <div class="hang-tren"><span class="icon-lon">${nhanIconNhom(item.nhom)}</span><strong>${escapeHtml(nhanTenNhom(item.nhom))}</strong></div>
    <div class="tieu-de-lon">${escapeHtml(item.tieuDe || item.sttKey)}</div>
    ${item.tenKhachHang ? `<div class="dong-khach-hang">Khách hàng: ${escapeHtml(item.tenKhachHang)}</div>` : ''}
    <div class="dong-trang-thai">${dongTrangThai}</div>
    ${htmlCanhBaoNhom(item.nhomNhieuAo)}`;
}

function nhayDong(key) {
  const el = document.getElementById('dong-' + key);
  if (!el) return;
  el.style.outline = '3px solid var(--color-primary)';
  setTimeout(() => { if (el) el.style.outline = 'none'; }, 700);
}

function xoaKhoiDsQuet(key, tuManXemLai) {
  dsQuet = dsQuet.filter(x => x.key !== key);
  renderDemNhom();
  if (tuManXemLai) renderXemLai(); else { renderDsDangQuet(); renderKetQuaVuaQuet(); }
}

document.getElementById('btn-dung-quet').onclick = async () => {
  // Chờ các mã còn trong hàng đợi của ô nhập xử lý xong rồi mới sang Xem lại — nếu không, mã về muộn sẽ lọt vào bước
  // "Xác nhận cập nhật" (tính lại từ dsQuet lúc bấm) mà người dùng chưa hề thấy trên màn Xem lại.
  await hangDoiNhapMa;
  dangQuetKichBan = false;
  await capNhatManHinh();
};

function renderXemLai() {
  const el = document.getElementById('khu-xem-lai');
  const nhomOK = dsQuet.filter(x => x.nhom === 'OK' && !x.daXuLy);

  const nhomLoi = dsQuet.filter(x => x.nhom === 'KHONG_TIM_THAY' && !x.daXuLy);

        <div class="tieu-de-nhom">✅ Sẵn sàng (${nhomOK.length})</div>
        <div class="danh-sach-nhom">${nhomOK.length ? nhomOK.map(dongXemLaiOK).join('') : dongTrong()}</div>
      </div>
      <div class="nhom-xem-lai canh-bao">
        <div class="tieu-de-nhom">⚠️ Sai trạng thái (${nhomCanhBao.length})</div>
        <div class="danh-sach-nhom">${nhomCanhBao.length ? nhomCanhBao.map(dongXemLaiCanBaoLoi).join('') : dongTrong()}</div>
      </div>
      <div class="nhom-xem-lai loi">
        <div class="tieu-de-nhom">❌ Không tìm thấy (${nhomLoi.length})</div>
        <div class="danh-sach-nhom">${nhomLoi.length ? nhomLoi.map(dongXemLaiCanBaoLoi).join('') : dongTrong()}</div>

    </button>

    <button class="btn-tiep-tuc-quet ${coTheThoat ? 'san-sang' : ''}" id="btn-tiep-tuc" ${coTheThoat ? '' : 'disabled'}>
      ${coTheThoat ? 'Tiếp tục quét' : 'Cần xử lý hết nhóm Cảnh báo & Lỗi trước khi tiếp tục'}

  document.getElementById('btn-xac-nhan').onclick = xacNhanCapNhatHangLoat;
  document.getElementById('btn-tiep-tuc').onclick = tiepTucQuet;
  el.querySelectorAll('[data-danxem]').forEach(btn => { btn.onclick = () => danhDauDaXuLy(btn.dataset.danxem); });
  el.querySelectorAll('[data-xoa]').forEach(btn => { btn.onclick = () => xoaKhoiDsQuet(btn.dataset.xoa, true); });
}

function dongTrong() {
  return '<div class="dong-xem-lai"><span style="color:var(--color-text-faint)">Không có mục nào.</span></div>';
}

function dongXemLaiOK(item) {
  return `<div class="dong-xem-lai">
    <div class="noi-dung">
      <strong>${escapeHtml(item.tieuDe || item.sttKey)}</strong>
      <div class="ly-do">${escapeHtml(item.tenKhachHang || '')} · Sẽ chuyển: ${escapeHtml(item.trangThaiHienTai)} → ${escapeHtml(item.trangThaiSau)}</div>
    </div>
  </div>`;
}

function dongXemLaiCanBaoLoi(item) {
  return `<div class="dong-xem-lai">
    <div class="noi-dung">${noiDungDongQuet(item)}</div>
    <div class="nhom-nut">
      <button class="btn-daxem-xemlai" data-danxem="${item.key}">Đã xem</button>
      <button class="btn-xoa-xemlai" data-xoa="${item.key}">XÓA</button>
    </div>

}

function danhDauDaXuLy(key) {
  const item = dsQuet.find(x => x.key === key);
  if (item) item.daXuLy = true;
  renderDemNhom();
  renderXemLai();
}

async function xacNhanCapNhatHangLoat() {
  const nhomOK = dsQuet.filter(x => x.nhom === 'OK' && !x.daXuLy);
  if (nhomOK.length === 0) return;

  const btn = document.getElementById('btn-xac-nhan');
  btn.disabled = true;
  btn.textContent = 'Đang cập nhật...';

  // Gọi tuần tự từng mã 1 (thay vì gửi cả danh sách trong 1 request) để hiện được tiến độ thật —
  // xem chayHangLoatCoTienDo()/taoThanhTienDo() trong api.js. API vẫn y hệt, chỉ đổi cách gọi.
  let daHuy = false;
  const tXacNhan = performance.now();
  const thanhTienDo = taoThanhTienDo(btn, { onHuy: () => { daHuy = true; } });
  thanhTienDo.capNhat(0, nhomOK.length);

  const res = await chayHangLoatCoTienDo(
    nhomOK.map(x => x.sttKey),
    sttKey => apiFetch(`/qr/kich-ban/${kichBanDangChon.id}/xac-nhan-hang-loat`, {
      method: 'POST', body: JSON.stringify({ sttKeys: [sttKey] }),
    }),
    { onTienDo: (hienTai, tong) => thanhTienDo.capNhat(hienTai, tong), kiemTraHuy: () => daHuy }
  );
  thanhTienDo.xoa();
  ghiLogQuet({ suKien: 'XAC_NHAN_HANG_LOAT', ketQua: res.daHuy ? 'HUY' : res.loi.length ? 'CO_DON_LOI' : 'OK', // đơn bị máy chủ từ chối = nghiệp vụ tongMs: Math.round(performance.now() - tXacNhan),
    loi: res.loi.slice(0, 3).map(l => `${l.sttKey}: ${l.lyDo}`).join(' | '),
    chiTiet: { kichBan: kichBanDangChon && kichBanDangChon.id, soDon: nhomOK.length, thanhCong: res.thanhCong.length, soLoi: res.loi.length } });

  dsQuet = dsQuet.filter(x => !res.thanhCong.includes(x.sttKey));

  res.loi.forEach(l => {
    const item = dsQuet.find(x => x.sttKey === l.sttKey);
    if (item) { item.nhom = 'SAI_TRANG_THAI'; item.lyDo = l.lyDo; item.daXuLy = false; }
  });

  if (res.daHuy) {
    await hopThongBao(`Đã HỦY giữa chừng — đã cập nhật ${res.thanhCong.length}/${nhomOK.length} đơn. Các đơn còn lại vẫn ở nhóm "OK", bấm "Xác nhận cập nhật" lại để tiếp tục.`);
  } else if (res.loi.length > 0) {
    await hopThongBao(`Đã cập nhật ${res.thanhCong.length} đơn. Có ${res.loi.length} đơn KHÔNG cập nhật được — xem lại nhóm "Sai trạng thái" bên dưới.`);
  }

  renderDemNhom();
  renderXemLai();
}

async function tiepTucQuet() {
  dangQuetKichBan = true;
  await capNhatManHinh();
}

// ============================================================
// CHỤP ẢNH HÀNG LOẠT KÈM CHUYỂN GIAI ĐOẠN (bổ sung 26/08/2026, tách 2 mốc riêng 31/08/2026,
// TÁCH QUÉT/CHỤP THÀNH 2 BƯỚC 07/09/2026)
// Dùng UI/logic này cho tab "Chụp ảnh đã sản xuất" — lấy cấu hình (mốc ảnh + trạng thái yêu cầu/đích)
// từ CAU_HINH_ANH[mode] theo biến `mode` đang chọn (trước đây dùng chung với "Chụp ảnh đóng gói", đã
// xoá 09/09/2026 lần 3 — xem data/pipelineTinhTrang.js).
//
// Luồng (xem docs/superpowers/specs/2026-09-07-tach-quet-chup-anh-design.md):
//   [Đang quét] --quét QR sống OK + đơn đủ điều kiện (POST /photos/kiem-tra)--> [Sẵn sàng chụp]
//   [Đang quét] --quét QR nhưng đơn không đủ điều kiện/không tìm thấy--> báo lỗi, VẪN Ở [Đang quét]
//   [Sẵn sàng chụp] --bấm "Quét lại"--> [Đang quét] (không upload gì)
//   [Sẵn sàng chụp] --chụp ảnh, upload OK--> ghi log, TỰ QUAY LẠI [Đang quét] cho đơn tiếp theo
//   [Sẵn sàng chụp] --chụp ảnh, upload lỗi--> báo lỗi, VẪN Ở [Sẵn sàng chụp] (đơn đã biết, chụp lại
//                                              ngay không cần quét lại)
//
// TRƯỚC ĐÂY (đến 07/09/2026): đọc mã QR NGAY TỪ ẢNH VỪA CHỤP bằng html5-qrcode.scanFile() — giải mã
// ẢNH TĨNH, đúng 1 lần thử, không có "khung hình kế tiếp" để cứu như quét sống — tỉ lệ thất bại cao
// trên thực tế (mờ/loá sáng/góc chụp xấu tại đúng khoảnh khắc bấm chụp, mã QR chỉ chiếm 1 góc nhỏ
// trong ảnh vì ảnh còn phải chụp cả sản phẩm). Quét QR SỐNG (nhiều khung hình/giây, tự lấy nét) đáng
// tin cậy hơn hẳn — giờ quét sống TRƯỚC để xác định đơn, ảnh chụp sau không cần đọc được mã QR nữa.
// ============================================================

// Cùng mã + cùng chế độ vừa bị máy chủ từ chối (4xx) trong 6 giây -> KHÔNG gọi lại máy chủ, chỉ báo lại lỗi cũ (15/10/2026, người dùng
// chốt). Camera đọc lại mã lỗi liên tục: log 15/10 có 10LH253 9 lần/32 giây, mã vạch USPS 15 lần. 6 giây tính từ lần hỏi máy chủ gần nhất
// (lần bị chặn không gia hạn) — quá 6 giây hỏi lại thật, phòng đơn vừa đổi trạng thái. Lỗi mạng/5xx không nhớ: thử lại có ích.
const CHAN_LOI_LAP_MS = 6000;
let loiQuetGanNhat = null; // { ma, cheDo, loi, ketQuaLog, luc, soLanLap, lapTu, lapDen, trangThaiHienTai }
// Lần bị chặn vẫn ĐẾM — ghi 1 dòng tổng vào Logs_UploadAnh (chiTiet.soLanLapBiChan) khi lượt chặn kết thúc (lần hỏi máy chủ kế tiếp /
// rời trang / ẩn trang), để vẫn thấy người quét lặp mã lỗi bao lâu mà không thêm 1 dòng cho mỗi khung hình camera. Dòng tổng được ghi
// MUỘN hơn lúc quét -> kèm lapTu/lapDen (giờ thật lần chặn đầu/cuối, ms) để Logs_UploadAnh đặt đúng chỗ trên dòng thời gian. -> true nếu có ghi.
function ghiLogLapBiChan() {
  const l = loiQuetGanNhat;
  if (!l || !l.soLanLap) return false;
  ghiLogQuet({ suKien: 'QUET_QR', cheDo: l.cheDo, sttKey: l.ma, ketQua: l.ketQuaLog, loi: l.loi,
    chiTiet: { nguon: 'CAMERA', soLanLapBiChan: l.soLanLap, lapTu: l.lapTu, lapDen: l.lapDen } });
  l.soLanLap = 0;
  return true;
}
// Ẩn trang (khoá máy, chuyển app) — trình duyệt di động có thể tắt hẳn trang mà KHÔNG phát pagehide: gửi luôn dòng tổng (nếu có) bằng sendBeacon.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'hidden' || !ghiLogLapBiChan()) return;
  clearTimeout(henGuiLog);
  while (hangDoiLog.length) guiLogQuet(true);
});

// Quét được mã trong trạng thái [Đang quét] — kiểm tra đơn đủ điều kiện chụp TRƯỚC khi cho chụp ảnh
// thật (tránh lãng phí 1 lần chụp cho đơn sai trạng thái/không tồn tại).
// Quét sai trạng thái lặp lại (22/10/2026, theo yêu cầu người dùng — Logs_UploadAnh 16–22/10: 10LT16 bị máy chủ từ chối 21 lần trong
// 1,5 phút vì camera cứ để trên mã, người quét không đọc toast). Cùng mã + cùng chế độ bị máy chủ từ chối vì sai trạng thái lần thứ 4 trở
// đi (lần bị chặn 6 giây không tính) -> màn đỏ che camera, dừng quét tới khi bấm "Đã hiểu". Chỉ đếm các lần cách lần trước không quá 10
// phút — trang mở cả ngày: sai 3 lần buổi sáng rồi chiều quét nhầm 1 lần không bật màn đỏ.
const SO_LAN_SAI_HIEN_MAN_DO = 4; // 22/10/2026: người dùng đổi 3 -> 4
const KHOANG_DEM_SAI_MS = 10 * 60 * 1000;
const demSaiTrangThai = new Map(); // `${cheDo}|${ma}` -> { so, luc } — số lần máy chủ từ chối vì sai trạng thái, lần gần nhất
let manDoDangHien = false;
function hienManDoSaiTrangThai(ma, loi, soLan, nut) {
  manDoDangHien = true;
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(185,28,28,.96);color:#fff;display:flex;flex-direction:column;'
    + 'align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center';
  el.innerHTML = `<div style="font-size:3.5rem;line-height:1">⛔</div>
    <div style="font-size:1.5rem;font-weight:800">${escapeHtml(ma)} — QUÉT SAI ${soLan} LẦN</div>
    <div style="font-size:1.1rem;max-width:520px">${escapeHtml(loi)}</div>
    <div style="font-size:1rem;opacity:.9">Đừng quét lại đơn này — kiểm tra chế độ chụp đang chọn và trạng thái của đơn.</div>`;
  const dong = () => {
    el.remove();
    manDoDangHien = false;
    // 6 giây để đưa camera ra khỏi mã — camera đọc lại đúng mã đó trong lúc này chỉ hiện toast, không hỏi máy chủ / không bật lại màn đỏ ngay.
    if (loiQuetGanNhat && loiQuetGanNhat.ma === ma) { loiQuetGanNhat.luc = performance.now(); loiQuetGanNhat.soLanLap = 0; }
  };
  const taoNut = (nhan, nen, mau, bam) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = nhan;
    b.style.cssText = `padding:12px 28px;border:0;border-radius:8px;background:${nen};color:${mau};font-size:1.1rem;font-weight:700`;
    b.onclick = bam;
    el.appendChild(b);
  };
  if (nut) taoNut(nut.nhan, '#fde68a', '#7f1d1d', () => { dong(); nut.bam(); });
  taoNut('Đã hiểu', '#fff', '#b91c1c', dong);
  document.body.appendChild(el);
  phatAmThanhKetQua('SAI_TRANG_THAI');
  if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 400]);
}

async function xuLyQuetDeXacDinhDon(sttKeyThoDoc, nguon = 'CAMERA') {
  const cauHinh = CAU_HINH_ANH[mode];
  if (!cauHinh) { if (nguon !== 'CAMERA') dangXuLyQuet = false; return; } // phòng thêm: mã đọc từ camera tới muộn khi đã đổi chế độ — bỏ qua
  if (manDoDangHien && nguon === 'CAMERA') return; // màn đỏ "quét sai nhiều lần" đang hiện — chờ bấm "Đã hiểu"
  if (dangXuLyQuet && nguon === 'CAMERA') return; // nút đổi chế độ tự giữ khoá trước khi gọi (nutChuyenSangDanTem)
  dangXuLyQuet = true;
  const loiCu = loiQuetGanNhat;
  if (loiCu && loiCu.ma === sttKeyThoDoc && loiCu.cheDo === mode && performance.now() - loiCu.luc < CHAN_LOI_LAP_MS) {
    if (!loiCu.soLanLap) loiCu.lapTu = Date.now();
    loiCu.soLanLap++;
    loiCu.lapDen = Date.now();
    hienThiToast('SAI_TRANG_THAI', loiCu.loi, nutChuyenSangDanTem(loiCu.ma, loiCu.trangThaiHienTai));
    phatAmThanhKetQua('SAI_TRANG_THAI');
    setTimeout(() => { dangXuLyQuet = false; tSanSangQuet = performance.now(); }, 700);
    return;
  }
  ghiLogLapBiChan();
  const msTimMa = nguon === 'CAMERA' ? msTimMaHienTai() : null, tKiemTra = performance.now(); // bấm nút: không có "thời gian tìm mã"

  try {
    const ketQua = await apiFetch('/photos/kiem-tra', {
      method: 'POST', body: JSON.stringify({ sttKey: sttKeyThoDoc, moc: cauHinh.moc }),
    });
    const msKiemTra = Math.round(performance.now() - tKiemTra);
    demSaiTrangThai.delete(`${mode}|${sttKeyThoDoc}`);
    ghiLogQuet({ suKien: 'QUET_QR', sttKey: ketQua.sttKey || sttKeyThoDoc, ketQua: 'OK', chiTiet: { nguon, msTimMa, msKiemTra } });
    const sttKeyMoi = ketQua.sttKey || sttKeyThoDoc;
    if (cauHinh.haiAnh && donChoXong && donChoXong.sttKey === sttKeyMoi) {
      // Quét lại đúng đơn đang chờ Xong — giữ nguyên khung chờ, không mở lượt chụp mới (ảnh 1 có thể còn đang tải lên).
      hienThiToast('OK', `${sttKeyMoi}: đơn này đang chờ — chụp ảnh 2 hoặc bấm Xong`);
      phatAmThanhKetQua('OK');
    } else {
      if (cauHinh.haiAnh && donChoXong) hoanTatDonChoXong('quet-don-sau'); // quét được đơn KHÁC = đơn trước xong lượt (chạy ngầm, không chờ)
      if (cauHinh.haiAnh && ketQua.soAnhLuotNay >= 1) {
        // Đơn đã có ảnh của lượt này từ trước (thoát trang / quên bấm Xong) — người dùng chốt: GIỮ ảnh đã có, chụp tiếp hoặc Xong.
        const dong = { trangThai: 'cho-xong', sttKey: sttKeyMoi, ghiChu: `Đã có ${ketQua.soAnhLuotNay} ảnh từ lần chụp trước — chưa Xong` };
        themDongDaChup(dong);
        datDonChoXong({ sttKey: sttKeyMoi, tieuDe: ketQua.tieuDe, tenKhachHang: ketQua.tenKhachHang, soAnh: ketQua.soAnhLuotNay, huaAnh1: Promise.resolve(true), dong });
        hienThiToast('OK', `${ketQua.tieuDe || sttKeyMoi}: đã có ${ketQua.soAnhLuotNay} ảnh — ${ketQua.soAnhLuotNay < 2 ? 'chụp ảnh 2 hoặc ' : ''}bấm Xong`);
      } else {
        // log: bản ghi CHUP_ANH của lượt này — đi tiếp qua bấm chụp -> có ảnh -> nén -> gửi (taiAnhLenNgam).
        donDaXacDinhChoAnh = { sttKey: sttKeyMoi, tieuDe: ketQua.tieuDe, tenKhachHang: ketQua.tenKhachHang, nhomNhieuAo: ketQua.nhomNhieuAo || null,
          log: { cheDo: mode, msTimMa, msKiemTra, tXacDinh: performance.now() } };
        hienThiToast('OK', ketQua.tieuDe || sttKeyThoDoc);
      }
      phatAmThanhKetQua('OK');
      if (ketQua.nhomNhieuAo) setTimeout(() => phatAmThanhKetQua('CANH_BAO_NHOM'), 350);
      await capNhatManHinh();
    }
  } catch (err) {
    const ketQuaLog = ketQuaLoi(err, 'SAI_TRANG_THAI');
    const khoaSai = `${mode}|${sttKeyThoDoc}`;
    const truocSai = demSaiTrangThai.get(khoaSai);
    const soLanSai = ketQuaLog !== 'SAI_TRANG_THAI' ? 0
      : (truocSai && performance.now() - truocSai.luc <= KHOANG_DEM_SAI_MS ? truocSai.so : 0) + 1;
    if (soLanSai) demSaiTrangThai.set(khoaSai, { so: soLanSai, luc: performance.now() });
    const manDo = soLanSai >= SO_LAN_SAI_HIEN_MAN_DO;
    ghiLogQuet({ suKien: 'QUET_QR', sttKey: sttKeyThoDoc, ketQua: ketQuaLog, loi: err.message,
      chiTiet: { nguon, msTimMa, msKiemTra: Math.round(performance.now() - tKiemTra), ...(manDo ? { manDo: soLanSai } : {}) } });
    const trangThaiHienTai = err.duLieu && err.duLieu.trangThaiHienTai;
    if (err.status >= 400 && err.status < 500) loiQuetGanNhat = { ma: sttKeyThoDoc, cheDo: mode, loi: err.message, ketQuaLog, luc: performance.now(), soLanLap: 0, trangThaiHienTai };
    if (manDo) hienManDoSaiTrangThai(sttKeyThoDoc, err.message, soLanSai, nutChuyenSangDanTem(sttKeyThoDoc, trangThaiHienTai));
    else {
      hienThiToast('SAI_TRANG_THAI', err.message, nutChuyenSangDanTem(sttKeyThoDoc, trangThaiHienTai));
      phatAmThanhKetQua('SAI_TRANG_THAI');
    }
  }

  setTimeout(() => { dangXuLyQuet = false; tSanSangQuet = performance.now(); }, 700);
}

// Bấm "Quét lại" ở trạng thái [Sẵn sàng chụp] — quay về [Đang quét], KHÔNG upload gì.

// Tải ảnh lên NGẦM (bổ sung 22/09/2026, theo yêu cầu người dùng — quét mã QR + chụp ảnh xong là cho
// quét đơn TIẾP THEO ngay, không đợi ảnh trước tải xong; server mỗi lượt tải mất thật vài giây do phải
// đọc dữ liệu đơn trước khi ghi) — hàm này CHẠY NỀN, KHÔNG được await bởi nơi gọi (xuLyChupAnh bên
// dưới). `dong` là đúng object đã unshift vào dsDaChupTheoMoc[mode] — sửa TRỰC TIẾP field của nó rồi
// render lại để khối "Danh sách đã chụp" tự cập nhật, dù người dùng có thể đã quét sang đơn khác hoặc
// đổi mode trong lúc chờ (renderDsDaChup()/renderDemNhomAnh() luôn đọc đúng dsDaChupTheoMoc[mode] hiện
// tại — vô hại nếu mode đã đổi, chỉ là redraw lại đúng màn hình đang hiện, lịch sử vẫn đúng khi quay lại).
// Chờ trước mỗi lần tự gửi lại ảnh lỗi mạng (3 lần gửi lại, tổng ~26 giây chờ) — xem vòng gửi trong taiAnhLenNgam.
const CHO_GUI_LAI_ANH_MS = [3000, 8000, 15000];
// Hạn mỗi lần gửi (kết nối di động treo không báo lỗi thì không bao giờ tới lượt gửi lại) = 60 giây + thời gian đẩy file ở 10KB/s —
// TÍNH THEO DUNG LƯỢNG vì hạn tính cả lúc đang đẩy dữ liệu lên: ảnh đã nén ~250KB -> ~85s; ảnh GỐC 3MB (máy không nén được) -> ~6 phút,
// vẫn hơn hẳn lượt chậm nhất đã thấy thành công trong Logs 13/10 (3MB mất ~128s, mạng ~25KB/s) — không cắt ngang lượt chậm mà vẫn chạy.
const hanGuiAnhMs = soByte => 60000 + Math.round(soByte / 10240 * 1000);
// Qua apiFetch (cùng xử lý lỗi + ghi lỗi API gần nhất cho "Báo lỗi app"); headers rỗng để trình duyệt tự đặt multipart cho FormData.
async function guiAnhMotLan(form, soByte) {
  const han = hanGuiAnhMs(soByte);
  const huy = new AbortController();
  const hen = setTimeout(() => huy.abort(), han);
  try {
    return await apiFetch('/photos/upload', { method: 'POST', body: form, headers: {}, signal: huy.signal });
  } catch (err) {
    if (huy.signal.aborted) throw new Error(`quá ${Math.round(han / 1000)} giây không phản hồi`); // không có status -> được gửi lại
    throw err;
  } finally {
    clearTimeout(hen);
  }
}

// tuyChon (14/10/2026, ảnh đã sản xuất 2 ảnh): viTri 1|2, xong (false = lưu ảnh nhưng CHƯA chuyển trạng thái), truocKhiGui (Promise<bool>
// ảnh 1 đã lưu — ảnh 2 phải chờ). -> Promise<bool> đã lưu.
async function taiAnhLenNgam(sttKey, cauHinh, file, dong, log, tuyChon = {}) {
  const { viTri = 1, xong = true, truocKhiGui = null } = tuyChon;
  const khoa = viTri === 2 ? sttKey + '#2' : sttKey; // ảnh 1 và ảnh 2 cùng đơn có thể tải chồng nhau
  log.sttKey = sttKey;
  // Nén ảnh (bổ sung 21/09/2026) — DỜI VÀO ĐÂY, chạy ngầm cùng upload (bổ sung 23/09/2026, theo yêu
  // cầu người dùng: quay lại [Đang quét] vẫn còn chậm dù upload đã chạy ngầm). Ảnh gốc từ điện thoại/
  // iPad đời mới có thể tới 12-48MP — createImageBitmap() phải giải mã NGUYÊN độ phân giải gốc trước
  // khi canvas mới vẽ xuống kích thước nhỏ hơn, tốn tới vài giây trên máy yếu/đang tải nặng (vừa đóng
  // camera). Trước đây bước này vẫn await() trong xuLyChupAnh() TRƯỚC KHI cho quét đơn tiếp theo — dời
  // vào đây để KHÔNG còn bước nào (nén lẫn upload) chặn quay lại màn hình quét sau khi bấm chụp.
  luotDangTai.set(khoa, log);
  const tNen0 = performance.now();
  const thongSoNen = {}; // object RIÊNG của lượt này (ảnh nén ngầm chồng nhau — không đọc biến toàn cục của api.js)
  const fileDaNen = await nenAnhTruocKhiTaiLen(file, { ...cauHinhNenAnh, thongSo: thongSoNen });
  const tNen1 = performance.now();
  if (laAnhHeif(thongSoNen.dauFile)) baoAnhHeif(); // máy đang chụp HEIC — nhắc tắt cài đặt (1 lần mỗi lần mở trang)
  log.giaiDoan = 'gui';
  // Dòng "[đo: nén ..., gửi+chờ ...]" tạm hiện trên màn hình (23/09/2026) ĐÃ BỎ 12/10/2026 — số đo giờ ghi vào Logs_UploadAnh.
  const ghiLogChup = (ketQua, them) => {
    luotDangTai.delete(khoa);
    const msTongGui = Math.round(performance.now() - tGuiDi0); // gồm cả các lần gửi lỗi + thời gian chờ gửi lại
    const msGuiVaCho = Math.round(performance.now() - tLanGuiCuoi0); // riêng lần gửi cuối
    const msMayChu = them.thoiGian ? them.thoiGian.tong : null;
    ghiLogQuet({ suKien: 'CHUP_ANH', cheDo: log.cheDo, sttKey, ketQua, loi: them.loi || '', tongMs: Math.round(performance.now() - log.tCoAnh),
      chiTiet: {
        msTimMa: log.msTimMa, msKiemTra: log.msKiemTra,
        msXacDinhDenBamChup: log.tBamChup ? Math.round(log.tBamChup - log.tXacDinh) : null,
        msCamera: log.tBamChup ? Math.round(log.tCoAnh - log.tBamChup) : null, // mở camera máy + chụp + bấm "Dùng ảnh"
        loaiFile: file.type || '', kbGoc: Math.round(file.size / 1024), kbSauNen: Math.round(fileDaNen.size / 1024),
        msNen: Math.round(tNen1 - tNen0), ...thongSoNen,
        // Có mốc máy chủ (lượt thành công): tách gửi qua mạng; không có (lượt lỗi) thì chỉ biết tổng gửi + máy chủ xử lý.
        msGui: msMayChu != null ? Math.max(0, msGuiVaCho - msMayChu) : null, msGuiVaCho: msMayChu != null ? null : msTongGui,
        msMayChu, mayChu: them.thoiGian || null,
        kbMoiGiay: msMayChu != null && msGuiVaCho - msMayChu > 0 ? Math.round(fileDaNen.size / 1024 / ((msGuiVaCho - msMayChu) / 1000)) : null,
        mang: mangHienTai(),
        sauThoat: !!log.daBaoThoat, // đã ghi THOAT lúc trang bị cất rồi quay lại — máy chủ xoá dòng THOAT đó
        soLanGui, // > 1 = đã tự gửi lại vì lỗi mạng / máy chủ; msGui / kbMoiGiay chỉ tính lần gửi cuối
        msTongGui: soLanGui > 1 ? msTongGui : null, // từ lần gửi đầu tới khi xong, gồm cả lần lỗi + chờ
        ...(cauHinh.haiAnh ? { viTri, xong } : {}),
      } });
  };
  const form = new FormData();
  form.append('photo', fileDaNen);
  form.append('sttKey', sttKey);
  form.append('moc', cauHinh.moc);
  if (cauHinh.haiAnh) { form.append('viTri', String(viTri)); form.append('xong', xong ? '1' : '0'); }

  const tGuiDi0 = performance.now();
  let soLanGui = 0;
  let tLanGuiCuoi0 = tGuiDi0; // mốc bắt đầu lần gửi CUỐI — số đo tốc độ mạng chỉ tính lần đó, không tính lần lỗi + thời gian chờ
  try {
    // Tự gửi lại (14/10/2026, theo Logs_UploadAnh 13/10: ảnh 10U88.1 lỗi "Failed to fetch" trên mạng yếu, ảnh tải ngầm nên người dùng
    // đã sang đơn khác, không chụp lại -> đơn thiếu ảnh). CHỈ lỗi mạng (không có mã HTTP) / máy chủ 5xx (Cloudflare 502/524...);
    // lỗi nghiệp vụ 4xx (sai trạng thái, hết phiên...) báo ngay như cũ. Gửi lại đúng file đã nén, không nén lại.
    if (truocKhiGui && !(await truocKhiGui)) {
      throw Object.assign(new Error('Ảnh 1 chưa lưu được nên ảnh 2 chưa gửi — quét lại mã đơn để chụp lại.'), { nghiepVu: true });
    }
    let data;
    for (;;) {
      soLanGui++;
      tLanGuiCuoi0 = performance.now();
      try {
        data = await guiAnhMotLan(form, fileDaNen.size);
        break;
      } catch (err) {
        // Lần trước thực ra ĐÃ lưu (mất phản hồi giữa đường) -> lần gửi lại bị từ chối vì đơn đã sang đúng trạng thái đích
        // (routes/photos.js trả trangThaiHienTai — không dò chữ trong câu báo lỗi).
        // CHỈ khi lần gửi này có chuyển trạng thái (xong): ảnh 1 của "đã sản xuất" (xong=false) không đổi trạng thái nên đơn đã sang đích
        // KHÔNG chứng minh ảnh này đã lưu (có thể máy khác vừa chụp xong) -> báo lỗi như thường.
        if (xong && soLanGui > 1 && err.nghiepVu && err.duLieu && err.duLieu.trangThaiHienTai === cauHinh.chuyenSang) { data = { daLuuLanTruoc: true }; break; }
        if ((err.status && err.status < 500) || soLanGui > CHO_GUI_LAI_ANH_MS.length) throw err;
        dong.ghiChu = `Mạng chập chờn — tự gửi lại lần ${soLanGui + 1}/${CHO_GUI_LAI_ANH_MS.length + 1}... (đừng đóng trang)`;
        renderDsDaChup();
        await new Promise(r => setTimeout(r, CHO_GUI_LAI_ANH_MS[soLanGui - 1]));
      }
    }

    const don = data.don || {};
    ghiLogChup('OK', { thoiGian: data.thoiGian });
    if (data.thoiGian) { // tốc độ tải ảnh thật lên chấm báo mạng + dòng "Ảnh vừa tải" (16/10/2026)
      const msGuiMang = Math.max(0, Math.round(performance.now() - tLanGuiCuoi0) - data.thoiGian.tong), kb = Math.round(fileDaNen.size / 1024);
      baoTocDoTaiAnh({ msGui: msGuiMang, kb, kbps: msGuiMang > 0 ? Math.round(kb / (msGuiMang / 1000)) : null });
    }
    if (!xong) {
      // Ảnh 1 đã lưu, đơn vẫn "Đang chạy máy" — người dùng đã bấm ảnh 2 / Xong trong lúc ảnh 1 đang tải thì để bước đó tự ghi dòng.
      if (!dong.sauAnh1) { dong.trangThai = 'cho-xong'; dong.ghiChu = 'Đã lưu ảnh 1 — chụp ảnh 2, bấm Xong hoặc quét đơn tiếp theo'; }
      return true;
    }
    dong.trangThai = 'ok';
    dong.ghiChu = `${don.TenKhachHang || ''} — ${cauHinh.yeuCau} → ${cauHinh.chuyenSang}${viTri === 2 ? ' (2 ảnh)' : ''}${data.daLuuLanTruoc ? ' (đã lưu từ lần gửi trước)' : ''}`;
    hienThiToastAnh('ok', `${don.STT_Key || sttKey}${don.TenKhachHang ? ' · ' + don.TenKhachHang : ''} — đã chuyển sang "${cauHinh.chuyenSang}"`);
    phatAmThanhKetQua('OK');
    return true;
  } catch (err) {
    // Lỗi upload thật (mất mạng, server từ chối vì đơn vừa đổi trạng thái...) — đơn đã quay lại [Đang
    // quét] từ lúc bấm chụp, người dùng cần quét lại QR đơn này để thử chụp lại (khác hành vi cũ — cũ
    // giữ nguyên màn hình [Sẵn sàng chụp] để bấm lại ngay, không còn hợp lý khi ảnh đã tải ngầm).
    ghiLogChup(ketQuaLoi(err, 'SAI_TRANG_THAI'), { loi: err.message });
    dong.trangThai = 'canh-bao';
    // Lỗi kỹ thuật sau khi đã tự gửi lại hết lượt: nói rõ ảnh CHƯA lưu (dòng đỏ ở lại trong "Danh sách đã chụp").
    dong.ghiChu = err.nghiepVu ? err.message : `CHƯA LƯU ẢNH (đã thử ${soLanGui} lần: ${err.message}) — quét lại mã đơn để chụp lại.`;
    hienThiToastAnh('canh-bao', `${sttKey}: ${dong.ghiChu}`);
    phatAmThanhKetQua('SAI_TRANG_THAI');
    // Ảnh 1 không lưu được -> đơn không còn "chờ Xong" (không có ảnh nào để Xong); quét lại mã đơn để chụp lại từ đầu.
    if (donChoXong && donChoXong.dong === dong) { datDonChoXong(null); renderDonChoXong(); }
    return false;
  } finally {
    dsUploadDangCho.delete(khoa);
    renderDemNhomAnh();
    renderDsDaChup();
  }
}

async function xuLyChupAnh(file) {
  if (!donDaXacDinhChoAnh) { await hopThongBao('Chưa xác định được đơn — quét lại mã QR trước khi chụp.'); return; }
  const cauHinh = CAU_HINH_ANH[mode];
  const sttKey = donDaXacDinhChoAnh.sttKey;
  const log = { ...(donDaXacDinhChoAnh.log || { cheDo: mode, tXacDinh: performance.now() }), tCoAnh: performance.now(), giaiDoan: 'nen' };

  if (dsUploadDangCho.has(sttKey)) {
    await hopThongBao(`Đơn ${sttKey} vừa chụp xong, ảnh trước đang tải lên — đợi 1 chút rồi quét lại nếu cần chụp thêm.`);
    return;
  }

  // Thêm dòng "đang tải lên" ngay, rồi QUAY LẠI [Đang quét] cho đơn tiếp theo NGAY — không đợi nén
  // ảnh lẫn upload xong. Cả 2 việc đó chạy ở taiAnhLenNgam() phía trên, KHÔNG await ở đây (cố ý) —
  // xuLyChupAnh() giờ không còn bước nào tốn thời gian đáng kể, quay lại quét gần như tức thì.
  const dong = { trangThai: 'dang-tai', sttKey, ghiChu: 'Đang tải ảnh lên...' };
  themDongDaChup(dong);
  dsUploadDangCho.add(sttKey);

  // Ảnh đã sản xuất: ảnh 1 lưu nhưng CHƯA chuyển trạng thái — đơn vào khung "chờ Xong" (chụp ảnh 2 / Xong / quét đơn tiếp theo).
  const hua = taiAnhLenNgam(sttKey, cauHinh, file, dong, log, cauHinh.haiAnh ? { xong: false } : {});
  if (cauHinh.haiAnh) {
    datDonChoXong({ sttKey, tieuDe: donDaXacDinhChoAnh.tieuDe, tenKhachHang: donDaXacDinhChoAnh.tenKhachHang, soAnh: 1, huaAnh1: hua, dong });
  }
  donDaXacDinhChoAnh = null;
  await capNhatManHinh();
}

// Khung "đơn chờ Xong" ở màn hình quét (chỉ chế độ Chụp ảnh đã sản xuất, khi chưa xác định đơn mới).
function renderDonChoXong() {
  const el = document.getElementById('don-cho-xong');
  const hien = !!(donChoXong && CAU_HINH_ANH[mode] && CAU_HINH_ANH[mode].haiAnh && !donDaXacDinhChoAnh);
  el.style.display = hien ? 'block' : 'none';
  if (!hien) { el.innerHTML = ''; return; }
  const d = donChoXong;
  el.innerHTML = `
    <div class="tieu-de-lon">${escapeHtml(d.tieuDe || d.sttKey)}</div>
    ${d.tenKhachHang ? `<div class="dong-khach-hang">Khách hàng: ${escapeHtml(d.tenKhachHang)}</div>` : ''}
    <div style="margin:6px 0">Đã chụp ${d.soAnh} ảnh — chưa chuyển "Đã sản xuất".</div>
    <div class="hang-nut" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      ${d.soAnh < 2 ? `<button type="button" class="btn-hanh-dong" onclick="bamChupAnh2()">${icon('camera', { size: 18 })} Chụp ảnh 2</button>` : ''}
      <button type="button" class="btn-hanh-dong phu" onclick="hoanTatDonChoXong('nut')">${icon('check', { size: 18 })} Xong đơn này</button>
    </div>
    <div style="margin-top:6px;font-size:.9em;opacity:.8">Quét mã đơn tiếp theo cũng tự Xong đơn này.</div>`;
}

function bamChupAnh2() {
  const input = document.getElementById('input-chup-anh-2');
  input.value = ''; // chọn lại đúng ảnh mới chụp, kể cả trùng tên file với lần trước
  if (donChoXong) donChoXong.tBamChup2 = performance.now();
  input.click();
}
document.getElementById('input-chup-anh-2').addEventListener('change', e => {
  const file = e.target.files[0];
  const d = donChoXong;
  if (!file || !d) return;
  datDonChoXong(null);
  renderDonChoXong();
  d.dong.sauAnh1 = true;
  d.dong.trangThai = 'dang-tai';
  d.dong.ghiChu = 'Đang tải ảnh 2...';
  dsUploadDangCho.add(d.sttKey + '#2');
  renderDemNhomAnh(); renderDsDaChup();
  const bay = performance.now();
  // Ảnh 2 + chuyển "Đã sản xuất" trong cùng 1 lần gửi; chờ ảnh 1 lưu xong trước (máy chủ cần ảnh 1 của lượt này).
  taiAnhLenNgam(d.sttKey, CAU_HINH_ANH.photo_san_xuat, file, d.dong,
    { cheDo: 'photo_san_xuat', tXacDinh: d.tBamChup2 || bay, tBamChup: d.tBamChup2 || bay, tCoAnh: bay, giaiDoan: 'nen' },
    { viTri: 2, xong: true, truocKhiGui: d.huaAnh1 });
});

// "Xong đơn này" / quét sang đơn khác — chuyển "Đã sản xuất" với số ảnh đang có. Chạy ngầm; tự gửi lại khi lỗi mạng như ảnh.
// cach: 'nut' (bấm Xong) | 'quet-don-sau' (tự Xong khi quét đơn khác). MỖI lần đều ghi Logs_UploadAnh (XONG_DON, 15/10/2026) — trước đây
// không ghi nên không biết đơn kẹt "Đang chạy máy" là do Xong lỗi hay do không hề gửi.
async function hoanTatDonChoXong(cach = 'nut') {
  const d = donChoXong;
  if (!d) return;
  datDonChoXong(null);
  renderDonChoXong();
  d.dong.sauAnh1 = true;
  const khoa = d.sttKey + '#xong';
  dsUploadDangCho.add(khoa);
  const t0 = performance.now();
  let lan = 0;
  const ghiLogXong = (ketQua, them = {}) => ghiLogQuet({ suKien: 'XONG_DON', cheDo: 'photo_san_xuat', sttKey: d.sttKey, ketQua, loi: them.loi || '',
    tongMs: Math.round(performance.now() - t0), chiTiet: { cach, soAnh: d.soAnh, soLanGui: lan, ...(d.khoiPhuc ? { khoiPhuc: true } : {}), ...(them.chiTiet || {}) } });
  try {
    if (!(await d.huaAnh1)) { ghiLogXong('BO_NGANG', { loi: 'Ảnh 1 không lưu được — không Xong' }); return; } // dòng đã báo lỗi ảnh 1
    d.dong.trangThai = 'dang-tai';
    d.dong.ghiChu = 'Đang chuyển sang "Đã sản xuất"...';
    renderDemNhomAnh(); renderDsDaChup();
    for (lan = 1; ; lan++) {
      try {
        await apiFetch('/photos/hoan-tat-san-xuat', { method: 'POST', body: JSON.stringify({ sttKey: d.sttKey }) });
        break;
      } catch (err) {
        // Lần trước thực ra đã chuyển (mất phản hồi) -> lần gửi lại bị từ chối vì đơn đã "Đã sản xuất".
        if (lan > 1 && err.duLieu && err.duLieu.trangThaiHienTai === CAU_HINH_ANH.photo_san_xuat.chuyenSang) { d.daXongLanTruoc = true; break; }
        if ((err.status && err.status < 500) || lan > CHO_GUI_LAI_ANH_MS.length) throw err;
        d.dong.ghiChu = `Mạng chập chờn — tự gửi lại lần ${lan + 1}/${CHO_GUI_LAI_ANH_MS.length + 1}... (đừng đóng trang)`;
        renderDsDaChup();
        await new Promise(r => setTimeout(r, CHO_GUI_LAI_ANH_MS[lan - 1]));
      }
    }
    d.dong.trangThai = 'ok';
    d.dong.ghiChu = `${d.tenKhachHang || ''} — Đang chạy máy → Đã sản xuất (${d.soAnh} ảnh)`;
    hienThiToastAnh('ok', `${d.sttKey} — đã chuyển sang "Đã sản xuất" (${d.soAnh} ảnh)`);
    phatAmThanhKetQua('OK');
    ghiLogXong('OK', d.daXongLanTruoc ? { chiTiet: { daXongLanTruoc: true } } : {});
  } catch (err) {
    if (err.duLieu && err.duLieu.trangThaiHienTai === CAU_HINH_ANH.photo_san_xuat.chuyenSang) {
      ghiLogXong('OK', { chiTiet: { nguoiKhacDaXong: true } });
      // Đơn ĐÃ ở "Đã sản xuất" — người khác vừa bấm Xong / chụp xong đơn này trước: không phải lỗi, không kêu báo lỗi (14/10/2026).
      d.dong.trangThai = 'ok';
      d.dong.ghiChu = `${d.tenKhachHang || ''} — đơn đã ở "Đã sản xuất" (người khác vừa bấm Xong / chụp xong đơn này)`;
      hienThiToastAnh('ok', `${d.sttKey} — đơn đã ở "Đã sản xuất" (người khác vừa xong)`);
      return;
    }
    ghiLogXong(ketQuaLoi(err, 'SAI_TRANG_THAI'), { loi: err.message });
    d.dong.trangThai = 'canh-bao';
    d.dong.ghiChu = err.nghiepVu ? err.message : `CHƯA chuyển "Đã sản xuất" (${err.message}) — quét lại mã đơn rồi bấm Xong.`;
    hienThiToastAnh('canh-bao', `${d.sttKey}: ${d.dong.ghiChu}`);
    phatAmThanhKetQua('SAI_TRANG_THAI');
  } finally {
    dsUploadDangCho.delete(khoa);
    renderDemNhomAnh(); renderDsDaChup();
  }
}

// Hiện thông tin đơn đã xác định ở trạng thái [Sẵn sàng chụp] — dùng lại đúng class
// .khoi-ket-qua-vua-quet đã có cho khối "Kết quả vừa quét" ở Quét kịch bản, nhất quán hình ảnh.
function renderThongTinDonChoAnh() {
  const el = document.getElementById('thong-tin-don-cho-chup');
  if (!donDaXacDinhChoAnh) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="tieu-de-lon">${escapeHtml(donDaXacDinhChoAnh.tieuDe || donDaXacDinhChoAnh.sttKey)}</div>
    ${donDaXacDinhChoAnh.tenKhachHang ? `<div class="dong-khach-hang">Khách hàng: ${escapeHtml(donDaXacDinhChoAnh.tenKhachHang)}</div>` : ''}
    ${htmlCanhBaoNhom(donDaXacDinhChoAnh.nhomNhieuAo)}`;
}

function hienThiToastAnh(loai, noiDung) {
  clearTimeout(toastAnhTimer);
  const el = document.getElementById('toast-chup-anh');
  const MAP = { ok: '✅', 'canh-bao': '⚠️', loi: '❌' };
  el.className = 'toast-vua-quet hien ' + loai;
  el.innerHTML = `<span style="font-size:1.4rem">${MAP[loai] || ''}</span> ${escapeHtml(noiDung)}`;
  toastAnhTimer = setTimeout(() => { el.classList.remove('hien'); }, 4500);
}

function themDongDaChup(item) {
  dsDaChupTheoMoc[mode].unshift(item);
  renderDemNhomAnh();
  renderDsDaChup();
}

function renderDemNhomAnh() {
  const el = document.getElementById('dem-nhom-anh');
  const ds = dsDaChupTheoMoc[mode];
  // Ảnh tải ngầm xong / gửi lại khi người dùng đã sang chế độ không chụp ảnh (Tra cứu, Kịch bản) — không có khối này để vẽ (14/10/2026:
  // trước đây lỗi "reading 'filter'" ở đây, và trong vòng tự gửi lại sẽ làm dừng gửi lại giữa chừng).
  if (!ds) return;
  const soDangTai = ds.filter(x => x.trangThai === 'dang-tai').length;
  const soOK = ds.filter(x => x.trangThai === 'ok').length;
  const soCanhBao = ds.filter(x => x.trangThai === 'canh-bao').length;
  const soChoXong = ds.filter(x => x.trangThai === 'cho-xong').length; // ảnh đã sản xuất: đã lưu ảnh nhưng chưa Xong (14/10/2026)
  // Bỏ ô đếm "Không đọc được mã" (07/09/2026) — từ khi tách quét/chụp thành 2 bước, ảnh chụp không
  // còn cần tự đọc mã QR nữa nên themDongDaChup() không bao giờ còn gọi với trangThai:'loi' (xem
  // docs/superpowers/specs/2026-09-07-tach-quet-chup-anh-design.md) — ô đếm này sẽ luôn là 0.
  // Ô "Đang tải" (bổ sung 22/09/2026) — chỉ hiện khi có ít nhất 1 ảnh đang tải ngầm, cho người dùng
  // biết còn ảnh chưa tải xong, đừng thoát/đóng trang vội.
  el.innerHTML = `
    ${soDangTai > 0 ? `<div class="dem-o dang-tai"><div class="hang-tren"><span class="dem-icon">${icon('spinner', { className: 'icon-spin', size: 20 })}</span><span class="dem-so">${soDangTai}</span></div><div class="dem-nhan">Đang tải</div></div>` : ''}
    ${soChoXong > 0 ? `<div class="dem-o dang-tai"><div class="hang-tren"><span class="dem-icon">⏳</span><span class="dem-so">${soChoXong}</span></div><div class="dem-nhan">Chờ Xong</div></div>` : ''}
    <div class="dem-o ok"><div class="hang-tren"><span class="dem-icon">✅</span><span class="dem-so">${soOK}</span></div><div class="dem-nhan">Thành công</div></div>
    <div class="dem-o canh-bao"><div class="hang-tren"><span class="dem-icon">⚠️</span><span class="dem-so">${soCanhBao}</span></div><div class="dem-nhan">Lỗi nghiệp vụ</div></div>`;
}

function renderDsDaChup() {
  const el = document.getElementById('ds-da-chup');
  const ds = dsDaChupTheoMoc[mode];
  if (!ds) return; // chế độ không chụp ảnh — xem renderDemNhomAnh
  if (ds.length === 0) { el.innerHTML = '<p style="color:var(--color-text-faint)">Chưa chụp ảnh nào.</p>'; return; }
  const ICON_THEO_TRANG_THAI = {
    ok: '✅', 'canh-bao': '⚠️', 'cho-xong': '⏳',
    'dang-tai': icon('spinner', { className: 'icon-spin', size: 18 }),
  };
  el.innerHTML = ds.map(item => `
    <div class="dong-quet ${item.trangThai}">
      <span style="font-size:1.3rem">${ICON_THEO_TRANG_THAI[item.trangThai] || '❌'}</span>
      <div class="noi-dung">
        <strong>${escapeHtml(item.sttKey)}</strong>
        <div class="ly-do">${escapeHtml(item.ghiChu || '')}</div>
      </div>
    </div>`).join('');
}
</script>
</body>
</html>
