<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quét QR — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=79">
<script src="/js/theme.js?v=79"></script>
<style>
/* Tự ẩn header khi cuộn xuống, hiện lại khi cuộn lên — chỉ áp dụng riêng cho trang Quét QR
   (chỉ định nghĩa trong <style> của trang này, không đụng style.css dùng chung) để tăng vùng
   thao tác trên điện thoại khi đang quét/chụp liên tục. */
.app-header { transition: transform 0.25s ease; }
.app-header.an-khi-cuon { transform: translateY(-100%); }
</style>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Quét mã QR</h2>
  <div class="scan-mode">
    <button id="mode-lookup"></button>
    <button id="mode-batch" class="active"></button>
    <button id="mode-photo-san-xuat"></button>
  </div>
  <select id="mode-select" class="mode-select"></select>

  <div id="chon-kich-ban-wrap" style="display:none"></div>

  <div id="camera-wrap" style="display:none">
    <div class="khu-vuc-camera">
      <div class="camera-vien">
        <div id="qr-reader" style="border-radius:12px;overflow:hidden;"></div>
        <button id="btn-flash" class="btn-flash-overlay" hidden></button>
      </div>
      <div id="toast-vua-quet" class="toast-vua-quet"></div>
    </div>

    <div id="ket-qua-vua-quet-kich-ban" class="khoi-ket-qua-vua-quet chi-che-do-kich-ban" style="display:none"></div>

    <p id="mo-ta-quet-chup-anh" style="display:none;text-align:center;font-weight:600"></p>

    <div id="ket-qua-tra-cuu"></div>

    <button id="btn-dung-quet" class="btn-dung-quet chi-che-do-kich-ban" style="display:none"></button>

    <!-- Chuyển "dem-nhom" (3 ô đếm Sẵn sàng/Sai trạng thái/Không tìm thấy) xuống SAU nút "Dừng quét"
         (bổ sung 09/09/2026, theo yêu cầu người dùng) — trước đó nằm NGAY ĐẦU trang, đẩy vùng camera/
         kết quả vừa quét (thông tin đơn đang cần xem NHẤT lúc đang quét) xuống thấp hơn. Chỉ đổi VỊ
         TRÍ trong HTML, KHÔNG đổi id/class — renderDemNhom() vẫn document.getElementById('dem-nhom')
         như cũ, không cần sửa JS. -->
    <div id="dem-nhom" class="dem-nhom chi-che-do-kich-ban" style="display:none"></div>

    <div class="chi-che-do-kich-ban" style="display:none">
      <h3 style="margin-top:20px">Danh sách đang quét</h3>
      <div id="ds-dang-quet" class="ds-dang-quet"></div>
    </div>
  </div>

  <div id="photo-wrap" style="display:none">
    <p id="photo-mo-ta"></p>
    <div id="thong-tin-don-cho-chup" class="khoi-ket-qua-vua-quet ok"></div>
    <input type="file" accept="image/*" capture="environment" id="input-chup-anh" style="display:none">
    <button id="btn-chup-anh" class="btn-dung-quet san-sang"></button>
    <button type="button" id="btn-quet-lai-chup-anh" class="btn-hanh-dong phu">Quét lại</button>
    <div id="toast-chup-anh" class="toast-vua-quet"></div>
    <div id="dem-nhom-anh" class="dem-nhom"></div>
    <h3 style="margin-top:20px">Danh sách đã chụp</h3>
    <div id="ds-da-chup" class="ds-dang-quet"></div>
  </div>

  <div id="khu-xem-lai" class="man-xem-lai" style="display:none"></div>
</div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="/js/icons.js?v=79"></script>
<script src="/js/api.js?v=79"></script>
<script>
let user;
// Mặc định mở vào "Quét kịch bản" (batch) khi vào trang — theo yêu cầu người dùng 05/09/2026, vì đây
// là chế độ dùng thường xuyên nhất, "Tra cứu" (lookup) ít dùng hơn hẳn (đã đẩy xuống cuối dropdown
// chọn chế độ, xem MODE_OPTIONS bên dưới).
let mode = 'batch';
let scanner = null;
let cameraDangChayCho = null;
let dangXuLyQuet = false;
let denFlashBat = false;
let toastTimer = null;

let kichBanDaTai = [];
let kichBanDangChon = null;
let dsQuet = [];
let dangQuetKichBan = true;
let audioCtx = null;

let toastAnhTimer = null;
// Đơn ĐÃ XÁC ĐỊNH (qua quét QR sống) cho tab "Chụp ảnh đã sản xuất" — null =
// đang ở trạng thái "Đang quét" (hiện camera sống), có giá trị = đang ở trạng thái "Sẵn sàng chụp"
// (xem docs/superpowers/specs/2026-09-07-tach-quet-chup-anh-design.md). Trước đây đọc QR TỪ ẢNH VỪA
// CHỤP bằng html5-qrcode.scanFile() — tỉ lệ đọc thất bại cao (giải mã ảnh tĩnh 1 lần thử, khác hẳn
// quét sống nhiều khung hình/giây) — giờ quét sống TRƯỚC để xác định đơn, ảnh chụp sau không cần đọc
// được mã QR trong đó nữa.
let donDaXacDinhChoAnh = null;

// Mốc "chụp ảnh kèm chuyển giai đoạn" — xem CAU_HINH_ANH bên dưới. Giữ DANH SÁCH ĐÃ CHỤP riêng
// (dsDaChupTheoMoc) để không mất lịch sử phiên làm việc khi đổi qua lại các mode khác rồi quay lại.
// (Mốc "photo_dong_goi"/"Chụp ảnh đóng gói" ĐÃ XOÁ 09/09/2026 lần 3 cùng lúc xoá trạng thái "Đã đóng
// gói" khỏi hệ thống, theo yêu cầu người dùng — xem data/pipelineTinhTrang.js.)
// "photo_da_dan_tem"/"Chụp ảnh ĐÃ DÁN TEM" (bổ sung 09/09/2026 lần 4, theo yêu cầu người dùng) — THAY
// THẾ hẳn chế độ "Quét mã QR Tracking" cũ (gọi GKE thật tạo vận đơn — đã xoá) bằng xác nhận thuần ảnh,
// CÙNG khuôn "Chụp ảnh đã sản xuất": quét QR xác định đơn đang "Đã sản xuất" → chụp ảnh → tự chuyển
// TRANG_THAI_XUONG sang "ĐÃ DÁN TEM". KHÔNG gọi GKE, KHÔNG tạo mã tracking thật — cơ chế GKE (Mua
// Tracking, IN LABEL, trang Tracking) vẫn giữ nguyên, tách biệt hoàn toàn khỏi việc đổi trạng thái này
// (đã xác nhận rõ với người dùng, chấp nhận đơn "ĐÃ DÁN TEM" qua đường này sẽ không có mã tracking
// thật trừ khi dùng thêm 1 trong các cơ chế GKE kể trên).
const CAU_HINH_ANH = {
  photo_san_xuat: {
    moc: 'da_san_xuat',
    nhanTab: 'Chụp ảnh đã sản xuất',
    moTa: 'Đơn phải đang ở "Đang chạy máy".',
    yeuCau: 'Đang chạy máy', chuyenSang: 'Đã sản xuất',
  },
  photo_da_dan_tem: {
    moc: 'da_dan_tem',
    nhanTab: 'Chụp ảnh ĐÃ DÁN TEM',
    // Bổ sung 09/09/2026 lần 5: nhắc thêm điều kiện tracking ngay trong mô tả (routes/photos.js đã
    // chặn thật ở /kiem-tra và /upload — đây chỉ là chữ hiển thị giúp người quét hiểu lý do sớm hơn).
    moTa: 'Đơn phải đang ở "Đã sản xuất" và đã có thông tin Tracking (mua tracking trước ở menu Đơn hàng/Tracking).',
    yeuCau: 'Đã sản xuất', chuyenSang: 'ĐÃ DÁN TEM',
  },
};
let dsDaChupTheoMoc = { photo_san_xuat: [], photo_da_dan_tem: [] };

document.getElementById('mode-lookup').innerHTML = icon('scan') + ' Quét mã QR xem thông tin 1 đơn';
document.getElementById('mode-batch').innerHTML = icon('check') + ' Quét kịch bản';
document.getElementById('mode-photo-san-xuat').innerHTML = icon('camera', { size: 18 }) + ' ' + CAU_HINH_ANH.photo_san_xuat.nhanTab;
document.getElementById('btn-dung-quet').innerHTML = icon('stop', { size: 40 }) + ' Dừng quét → Xem lại';
document.getElementById('btn-chup-anh').innerHTML = icon('camera', { size: 40 }) + ' Chụp ảnh';
capNhatNutFlash();

// Dropdown là cách DUY NHẤT để chọn chế độ (đã bỏ hẳn menu 4 nút — xem .mode-select / .scan-mode
// trong style.css). 4 nút cũ vẫn còn trong DOM (ẩn) vì JS phía dưới vẫn toggle class active lên
// chúng — vô hại, không cần dọn vì không hiển thị.
// Thứ tự hiện trong dropdown — "Tra cứu" xếp CUỐI CÙNG (ít dùng nhất, theo yêu cầu người dùng
// 05/09/2026), không ảnh hưởng chế độ mặc định khi vào trang (vẫn là 'lookup', xem biến `mode` khai
// báo phía trên — đổi thứ tự dropdown không tự đổi luôn mặc định, 2 việc độc lập nhau).
const MODE_OPTIONS = [
  { value: 'batch', label: 'Quét kịch bản' },
  { value: 'photo_san_xuat', label: CAU_HINH_ANH.photo_san_xuat.nhanTab },
  { value: 'photo_da_dan_tem', label: CAU_HINH_ANH.photo_da_dan_tem.nhanTab },
  { value: 'lookup', label: 'Quét mã QR xem thông tin 1 đơn' },
];
const elModeSelect = document.getElementById('mode-select');
elModeSelect.innerHTML = MODE_OPTIONS.map(o => `<option value="${o.value}">${escapeHtml(o.label)}</option>`).join('');

// Đổi mode LUÔN đi qua đây (không gán thẳng biến `mode`) — reset donDaXacDinhChoAnh mỗi lần đổi mode
// để không lỡ giữ "đơn đã xác định" cũ từ trước sang 1 phiên chụp ảnh mới đối tượng vật lý đã khác
// (rủi ro gán nhầm ảnh cho sai đơn nếu người dùng rời màn hình rồi quay lại sau 1 lúc).
function doiMode(moiMode) {
  mode = moiMode;
  donDaXacDinhChoAnh = null;
  capNhatManHinh();
}

elModeSelect.onchange = () => doiMode(elModeSelect.value);

// Tự ẩn header khi cuộn xuống, hiện lại khi cuộn lên (chỉ trang này — xem <style> ở đầu file).
// Không đụng tới thanh tab điều hướng dưới cùng, vẫn cố định như trước.
(function () {
  let yLanTruoc = window.scrollY;
  let dangCho = false;
  window.addEventListener('scroll', () => {
    if (dangCho) return;
    dangCho = true;
    requestAnimationFrame(() => {
      const y = window.scrollY;
      const header = document.querySelector('.app-header');
      if (header) header.classList.toggle('an-khi-cuon', y > yLanTruoc && y > 80);
      yLanTruoc = y;
      dangCho = false;
    });
  }, { passive: true });
})();

(async () => {
  user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'scan');
  await taiKichBan();
  capNhatManHinh();
})();

document.getElementById('mode-lookup').onclick = () => doiMode('lookup');
document.getElementById('mode-batch').onclick = () => doiMode('batch');
document.getElementById('mode-photo-san-xuat').onclick = () => doiMode('photo_san_xuat');

async function taiKichBan() {
  try {
    kichBanDaTai = await apiFetch('/qr/kich-ban');
  } catch (e) {
    kichBanDaTai = [];
  }
}

async function capNhatManHinh() {
  document.getElementById('mode-lookup').classList.toggle('active', mode === 'lookup');
  document.getElementById('mode-batch').classList.toggle('active', mode === 'batch');
  document.getElementById('mode-photo-san-xuat').classList.toggle('active', mode === 'photo_san_xuat');
  document.getElementById('mode-select').value = mode;

  document.getElementById('chon-kich-ban-wrap').style.display = 'none';
  document.getElementById('camera-wrap').style.display = 'none';
  document.getElementById('khu-xem-lai').style.display = 'none';
  document.getElementById('photo-wrap').style.display = 'none';
  document.getElementById('mo-ta-quet-chup-anh').style.display = 'none';
  // Khung camera "Quét kịch bản" TỪNG rộng hơn, thấp hơn mặc định (.che-do-rong) — ĐÃ BỎ 09/09/2026,
  // theo yêu cầu người dùng: khung ngoài camera giờ chỉ to hơn khung quét QR ~10% ở MỌI chế độ, không
  // còn ngoại lệ nào (xem #qr-reader trong style.css).

  let cameraCanChay = null;

  if (mode === 'lookup') {
    document.getElementById('camera-wrap').style.display = 'block';
    document.getElementById('ket-qua-tra-cuu').style.display = 'block';
    setBatchOnlyVisible(false);
    cameraCanChay = 'lookup';
  } else if (mode === 'photo_san_xuat' || mode === 'photo_da_dan_tem') {
    const cauHinh = CAU_HINH_ANH[mode];
    if (!donDaXacDinhChoAnh) {
      // [Đang quét] — quét QR sống để xác định đơn trước, CHƯA cho chụp ảnh (xem
      // docs/superpowers/specs/2026-09-07-tach-quet-chup-anh-design.md).
      document.getElementById('camera-wrap').style.display = 'block';
      document.getElementById('ket-qua-tra-cuu').style.display = 'none';
      setBatchOnlyVisible(false);
      const moTa = document.getElementById('mo-ta-quet-chup-anh');
      moTa.style.display = 'block';
      moTa.textContent = `Quét mã QR để xác định đơn cần "${cauHinh.nhanTab}". ${cauHinh.moTa}`;
      cameraCanChay = 'photo_scan';
    } else {
      // [Sẵn sàng chụp] — đơn đã xác định, không cần camera sống nữa (dùng camera máy qua input file).
      document.getElementById('photo-wrap').style.display = 'block';
      document.getElementById('photo-mo-ta').textContent = cauHinh.moTa;
      renderThongTinDonChoAnh();
      renderDemNhomAnh();
      renderDsDaChup();
    }
  } else if (!kichBanDangChon) {
    renderChonKichBan();
    document.getElementById('chon-kich-ban-wrap').style.display = 'block';
  } else if (dangQuetKichBan) {
    document.getElementById('camera-wrap').style.display = 'block';
    document.getElementById('ket-qua-tra-cuu').style.display = 'none';
    setBatchOnlyVisible(true);
    renderDemNhom();
    renderDsDangQuet();
    renderKetQuaVuaQuet();
    cameraCanChay = 'batch';
  } else {
    document.getElementById('khu-xem-lai').style.display = 'block';
    renderXemLai();
  }

  await dieuChinhCamera(cameraCanChay);
}

function setBatchOnlyVisible(hien) {
  document.querySelectorAll('.chi-che-do-kich-ban').forEach(e => { e.style.display = hien ? '' : 'none'; });
}

function renderChonKichBan() {
  const el = document.getElementById('chon-kich-ban-wrap');
  if (kichBanDaTai.length === 0) {
    el.innerHTML = '<p>Chưa có kịch bản nào trong tab CauHinhKichBan.</p>';
    return;
  }
  el.innerHTML = `
    <h3>Chọn kịch bản để bắt đầu quét</h3>
    <div class="kich-ban-picker">
      ${kichBanDaTai.map(k => `
        <button class="kich-ban-btn" data-id="${k.id}">
          ${escapeHtml(k.label)}
          ${k.requireStatus ? `<span class="phu-de">Yêu cầu đang ở: ${escapeHtml(k.requireStatus)}</span>` : ''}
        </button>`).join('')}
    </div>`;
  el.querySelectorAll('.kich-ban-btn').forEach(btn => { btn.onclick = () => chonKichBan(btn.dataset.id); });
}

function chonKichBan(id) {
  kichBanDangChon = kichBanDaTai.find(k => k.id === id) || null;
  dsQuet = [];
  dangQuetKichBan = true;
  // Khởi tạo/mở khoá AudioContext ngay trong cú bấm này (thao tác người dùng thật) — nhiều trình duyệt
  // chặn phát âm thanh tự động nếu chưa có tương tác, nên "mồi" trước để tiếng bíp sau này phát được ngay.
  try { layAudioCtx().resume(); } catch (e) {}
  capNhatManHinh();
}

// ============================================================
// ÂM THANH — 3 tiếng bíp khác nhau rõ rệt cho 3 kết quả quét, tự tạo bằng Web Audio API (không cần file âm thanh)
// ============================================================
function layAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function phatBeep(tanSo, thoiLuongMs, doTreMs, loaiSong) {
  try {
    const ctx = layAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = loaiSong || 'sine';
    osc.frequency.value = tanSo;
    gain.gain.value = 0.18;
    osc.connect(gain);
    gain.connect(ctx.destination);
    const batDau = ctx.currentTime + (doTreMs || 0) / 1000;
    osc.start(batDau);
    osc.stop(batDau + thoiLuongMs / 1000);
  } catch (e) { /* trình duyệt chặn âm thanh — bỏ qua lặng lẽ, không ảnh hưởng luồng quét */ }
}

// 3 kết quả phải nghe RÕ RÀNG KHÁC NHAU, đặc biệt "Sẵn sàng" phải khác hẳn 2 trường hợp lỗi để
// không nhầm khi quét nhanh liên tục: OK dùng sóng sine êm (như chuông); 2 trường hợp lỗi dùng
// sóng square (âm sắc "còi báo động", khác hẳn về chất âm chứ không chỉ khác cao độ) + có rung.
function phatAmThanhKetQua(nhom) {
  if (nhom === 'DA_NHAN') {
    // Tab Tracking (bổ sung 02/09/2026): quét xong 1 mã phải chờ GKE tới ~1 phút mới có kết quả
    // cuối — nếu chỉ phát âm OK/lỗi ở cuối thì người quét không biết máy đã "nhận" được mã ngay lúc
    // quét hay chưa, dễ tưởng máy treo mà quét lại. 2 tiếng "tít tít" NGẮN, CÙNG 1 cao độ, sát nhau
    // (mô phỏng tiếng bíp máy quét mã vạch quen thuộc, dễ nhận ra ngay) — cao độ cao hơn hẳn và
    // không tăng dần như OK (OK: 2 nốt tăng dần 880→1175, dài hơn, cách xa hơn) nên không lẫn dù
    // cùng là 2 tiếng; không mang nghĩa thành công/thất bại nên không rung.
    phatBeep(1500, 50, 0, 'sine');
    phatBeep(1500, 50, 70, 'sine');
  } else if (nhom === 'OK') {
    // 2 nốt sine tăng dần, êm nhẹ — không rung, để phân biệt tuyệt đối với 2 trường hợp lỗi bên dưới
    phatBeep(880, 120, 0, 'sine');
    phatBeep(1175, 150, 100, 'sine');
  } else if (nhom === 'SAI_TRANG_THAI') {
    // Sóng vuông (âm sắc "còi"), 2 tiếng đều nhau mức trung — khác hẳn chất âm của OK
    phatBeep(520, 130, 0, 'square');
    phatBeep(520, 130, 190, 'square');
    if (navigator.vibrate) navigator.vibrate([120, 90, 120]); // rung 2 nhịp ngắn
  } else if (nhom === 'KHONG_TIM_THAY') {
    // Sóng vuông, trầm hơn, dài hơn, 3 tiếng dồn dập — nặng nhất trong 3 kết quả, không thể nhầm với OK
    phatBeep(220, 160, 0, 'square');
    phatBeep(220, 160, 220, 'square');
    phatBeep(180, 260, 440, 'square');
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]); // rung 3 nhịp dài hơn, khác kiểu với Sai trạng thái
  }
}

async function dieuChinhCamera(muonChay) {
  if (muonChay === cameraDangChayCho) return;
  if (cameraDangChayCho !== null) await dungCamera();
  cameraDangChayCho = muonChay;
  if (muonChay === 'lookup') await batDauCamera(xuLyQuetTraCuu);
  // "Quét kịch bản" TỪNG truyền aspectRatio 16/9 riêng (khung camera rộng-thấp) — ĐÃ BỎ 09/09/2026,
  // dùng chung đúng 1 cỡ khung mặc định (qrbox 260 + khung ngoài ~286px) như mọi chế độ khác.
  else if (muonChay === 'batch') await batDauCamera(xuLyQuetKichBan);
  // "Chụp ảnh đã sản xuất" — bước quét QR SỐNG để xác định đơn, trước khi cho chụp ảnh
  // thật (xem docs/superpowers/specs/2026-09-07-tach-quet-chup-anh-design.md).
  else if (muonChay === 'photo_scan') await batDauCamera(xuLyQuetDeXacDinhDon);
}

// "NotReadableError: Could not start video source" KHÔNG PHẢI lỗi quyền — trình duyệt/OS chưa kịp
// nhả hẳn camera từ lượt dừng ngay trước đó (hay gặp khi dừng rồi mở lại camera liên tiếp) HOẶC 1
// app/tab khác đang giữ camera. Tự thử lại vài lần có chờ trước khi báo lỗi thật — phần lớn trường
// hợp tự hết sau 1-2 lần thử vì camera vừa được nhả ra.
function laLoiCameraDangBanRoi(err) {
  return /NotReadableError/i.test(String(err));
}

async function batDauCamera(onScan, qrboxSize, tuyChon = {}) {
  const { soLanThuLai = 2, facingMode = 'environment', aspectRatio } = tuyChon;
  if (!scanner) scanner = new Html5Qrcode('qr-reader');

  // Ghi ra Console (F12) trạng thái quyền camera THẬT SỰ theo trình duyệt (nếu hỗ trợ Permissions
  // API) — để phân biệt rõ "chưa cấp quyền/đã bị chặn" (permission) với "có quyền nhưng phần cứng
  // không mở được" (NotReadableError, xem hàm trên) thay vì đoán mò qua thông báo lỗi chung chung.
  try {
    const trangThai = await navigator.permissions.query({ name: 'camera' });
    console.log('[Camera] Trạng thái quyền camera (Permissions API):', trangThai.state);
  } catch (e) {
    console.log('[Camera] Trình duyệt không hỗ trợ Permissions API cho camera — bỏ qua bước kiểm tra này (không phải lỗi).');
  }

  for (let lan = 0; lan <= soLanThuLai; lan++) {
    const gioBatDau = Date.now();
    try {
      await scanner.start({ facingMode }, { fps: 10, qrbox: qrboxSize || 260, ...(aspectRatio ? { aspectRatio } : {}) }, onScan);
      capNhatHoTroFlash();
      console.log(`[Camera] Mở camera thành công sau ${Date.now() - gioBatDau}ms (facingMode=${facingMode})`);
      return;
    } catch (err) {
      console.error(`[Camera] Lỗi mở camera (lần ${lan + 1}/${soLanThuLai + 1}, sau ${Date.now() - gioBatDau}ms) — tên lỗi: "${err && err.name}":`, err);
      if (laLoiCameraDangBanRoi(err) && lan < soLanThuLai) {
        console.warn(`[Camera] Camera đang bận, đợi rồi thử lại...`);
        await new Promise(r => setTimeout(r, 700));
        continue;
      }
      const goiY = laLoiCameraDangBanRoi(err)
        ? 'Camera đang được app/tab khác dùng — đóng hết ứng dụng/tab khác đang mở camera (Zoom, Teams, Windows Camera, tab trình duyệt khác...) rồi thử lại.'
        : 'Hãy cho phép quyền camera cho trang web này trong trình duyệt.';
      document.getElementById('ket-qua-tra-cuu').innerHTML =
        `<div class="ket-qua-box loi">${icon('alert')} Không mở được camera: ${escapeHtml(String(err))}. ${goiY}</div>`;
      return;
    }
  }
}

async function dungCamera() {
  if (scanner) {
    try { await scanner.stop(); } catch (e) {}
  }
  cameraDangChayCho = null;
  denFlashBat = false;
  document.getElementById('btn-flash').hidden = true;
  capNhatNutFlash();
}

// Đèn flash chỉ hoạt động qua web trên số ít thiết bị/trình duyệt hỗ trợ "torch" — kiểm tra ngay
// sau khi mở camera, ẩn hẳn icon nếu không hỗ trợ (thay vì hiện ra rồi báo lỗi khi bấm như trước).
function capNhatHoTroFlash() {
  let hoTro = false;
  try {
    const kn = scanner.getRunningTrackCapabilities();
    hoTro = !!(kn && kn.torch);
  } catch (e) {}
  document.getElementById('btn-flash').hidden = !hoTro;
}

document.getElementById('btn-flash').onclick = async () => {
  if (!scanner || !cameraDangChayCho) return;
  try {
    denFlashBat = !denFlashBat;
    await scanner.applyVideoConstraints({ advanced: [{ torch: denFlashBat }] });
  } catch (e) {
    denFlashBat = false;
    alert('Thiết bị hoặc trình duyệt này không hỗ trợ bật đèn flash qua web (thường gặp trên iPhone/Safari).');
  }
  capNhatNutFlash();
};

function capNhatNutFlash() {
  const btn = document.getElementById('btn-flash');
  btn.classList.toggle('dang-bat', denFlashBat);
  btn.innerHTML = '🔦';
  btn.setAttribute('aria-label', denFlashBat ? 'Tắt đèn flash' : 'Bật đèn flash');
  btn.title = btn.getAttribute('aria-label');
}

async function xuLyQuetTraCuu(sttKey) {
  if (dangXuLyQuet) return;
  dangXuLyQuet = true;
  const el = document.getElementById('ket-qua-tra-cuu');

  try {
    const don = await apiFetch('/qr/tra-cuu/' + encodeURIComponent(sttKey));
    el.innerHTML = `<div class="ket-qua-box">
      ${icon('package')}
      <div>
        <strong>${escapeHtml(don.TieuDeSanPham || don.STT_Key)}</strong> — ${escapeHtml(don.TenKhachHang || '')}<br>
        Trạng thái: <span class="badge ${lopTrangThai(don.TRANG_THAI_XUONG)}">${escapeHtml(don.TRANG_THAI_XUONG || '')}</span><br>
        <a href="/order.html?stt=${encodeURIComponent(sttKey)}">Xem chi tiết ${icon('arrowRight', {size:14})}</a>
      </div>
    </div>`;
  } catch (e) {
    el.innerHTML = `<div class="ket-qua-box loi">${icon('alert')} ${escapeHtml(e.message)}</div>`;
  }

  setTimeout(() => { dangXuLyQuet = false; }, 1500);
}

async function xuLyQuetKichBan(sttKey) {
  if (dangXuLyQuet) return;

  const daCo = dsQuet.find(x => x.sttKey === sttKey);
  if (daCo) {
    hienThiToast('trung', `Mã ${sttKey} đã có trong danh sách`);
    nhayDong(daCo.key);
    return;
  }

  dangXuLyQuet = true;
  let ketQua;
  try {
    ketQua = await apiFetch(`/qr/kich-ban/${kichBanDangChon.id}/kiem-tra`, {
      method: 'POST', body: JSON.stringify({ sttKey }),
    });
  } catch (e) {
    alert('Lỗi khi kiểm tra mã: ' + e.message);
    dangXuLyQuet = false;
    return;
  }

  const item = {
    key: sttKey + '_' + Date.now(),
    sttKey: ketQua.sttKey || sttKey,
    tieuDe: ketQua.tieuDe || '',
    tenKhachHang: ketQua.tenKhachHang || '',
    nhom: ketQua.nhom,
    lyDo: ketQua.lyDo || '',
    trangThaiHienTai: ketQua.trangThaiHienTai || '',
    trangThaiYeuCau: ketQua.trangThaiYeuCau || '',
    trangThaiSau: ketQua.trangThaiSau || '',
    daXuLy: false,
  };
  dsQuet.unshift(item);

  hienThiToast(item.nhom, item.tieuDe || item.sttKey);
  phatAmThanhKetQua(item.nhom);

  renderDemNhom();
  renderDsDangQuet();
  renderKetQuaVuaQuet();

  setTimeout(() => { dangXuLyQuet = false; }, 700);
}

function hienThiToast(loai, noiDung) {
  clearTimeout(toastTimer);
  const el = document.getElementById('toast-vua-quet');
  const MAP = {
    OK: { cls: 'ok', icon: '✅' },
    SAI_TRANG_THAI: { cls: 'canh-bao', icon: '⚠️' },
    KHONG_TIM_THAY: { cls: 'loi', icon: '❌' },
    trung: { cls: 'canh-bao', icon: '🔁' },
  };
  const m = MAP[loai] || MAP.trung;
  el.className = 'toast-vua-quet hien ' + m.cls;
  el.innerHTML = `<span style="font-size:1.4rem">${m.icon}</span> ${escapeHtml(noiDung)}`;
  toastTimer = setTimeout(() => { el.classList.remove('hien'); }, 3500);
}

function lopNhom(nhom) { return nhom === 'OK' ? 'ok' : nhom === 'SAI_TRANG_THAI' ? 'canh-bao' : 'loi'; }
function nhanIconNhom(nhom) { return nhom === 'OK' ? '✅' : nhom === 'SAI_TRANG_THAI' ? '⚠️' : '❌'; }

function renderDemNhom() {
  const el = document.getElementById('dem-nhom');
  const soOK = dsQuet.filter(x => x.nhom === 'OK' && !x.daXuLy).length;
  const soCanhBao = dsQuet.filter(x => x.nhom === 'SAI_TRANG_THAI' && !x.daXuLy).length;
  const soLoi = dsQuet.filter(x => x.nhom === 'KHONG_TIM_THAY' && !x.daXuLy).length;
  el.innerHTML = `
    <div class="dem-o ok"><div class="hang-tren"><span class="dem-icon">✅</span><span class="dem-so">${soOK}</span></div><div class="dem-nhan">Sẵn sàng</div></div>
    <div class="dem-o canh-bao"><div class="hang-tren"><span class="dem-icon">⚠️</span><span class="dem-so">${soCanhBao}</span></div><div class="dem-nhan">Sai trạng thái</div></div>
    <div class="dem-o loi"><div class="hang-tren"><span class="dem-icon">❌</span><span class="dem-so">${soLoi}</span></div><div class="dem-nhan">Không tìm thấy</div></div>`;
}

// Nội dung 1 dòng kết quả quét (dùng chung cho "Danh sách đang quét" và "Xem lại", nhóm cảnh báo/
// lỗi ở dongXemLaiCanBaoLoi bên dưới) — LUÔN hiện dòng tiêu đề `item.tieuDe` (services/orderService.js,
// tieuDeSanPham, đã tự chứa STT_Key ở đầu) cho MỌI nhóm, kể cả SAI_TRANG_THAI (sửa 12/09/2026, theo
// yêu cầu người dùng — trước đây nhóm SAI_TRANG_THAI CHỈ hiện `lyDo` (server dựng sẵn, có nhắc mã đơn
// trong câu) để tránh lặp mã đơn 2 lần trên cùng 1 thẻ, nhưng như vậy lại ẩn mất tên/loại/size/màu thật
// của đơn — người dùng xác nhận cần thấy rõ tên đơn hơn là tránh lặp đúng mã đơn 1 lần).
function noiDungDongQuet(item) {
  return `
        <strong>${escapeHtml(item.tieuDe || item.sttKey)}</strong>
        <div class="ly-do">${escapeHtml(item.lyDo || (item.nhom === 'OK' ? `Sẽ chuyển: ${item.trangThaiHienTai} → ${item.trangThaiSau}` : ''))}</div>`;
}

function renderDsDangQuet() {
  const el = document.getElementById('ds-dang-quet');
  if (dsQuet.length === 0) { el.innerHTML = '<p style="color:var(--color-text-faint)">Chưa quét mã nào.</p>'; return; }

  el.innerHTML = dsQuet.map(item => `
    <div class="dong-quet ${lopNhom(item.nhom)}" id="dong-${item.key}">
      <span style="font-size:1.3rem">${nhanIconNhom(item.nhom)}</span>
      <div class="noi-dung">${noiDungDongQuet(item)}</div>
      <button class="btn-xoa-dong" onclick="xoaKhoiDsQuet('${item.key}', false)">XÓA</button>
    </div>`).join('');
}

function nhanTenNhom(nhom) { return nhom === 'OK' ? 'Sẵn sàng' : nhom === 'SAI_TRANG_THAI' ? 'Sai trạng thái' : 'Không tìm thấy'; }

// Khối "Kết quả vừa quét" — luôn hiện ĐÚNG 1 đơn vừa quét gần nhất (dsQuet[0]), KHÔNG tự ẩn như
// toast-vua-quet (biến mất sau 3.5s) — người quét thường đang thao tác tay ngoài kho, cần đủ thời
// gian đọc kỹ tình trạng đơn vừa quét thay vì phải nhìn đúng lúc toast còn hiện. Chỉ bị ghi đè khi
// có lượt quét MỚI (gọi lại hàm này), không tự đổi theo thời gian.
function renderKetQuaVuaQuet() {
  const el = document.getElementById('ket-qua-vua-quet-kich-ban');
  // LUÔN giữ "chi-che-do-kich-ban" trong className (không ghi đè mất) — setBatchOnlyVisible() dựa
  // vào đúng class này để ẩn khối này khi chuyển sang chế độ khác (Tra cứu/Tracking/Chụp ảnh); nếu
  // mất class này ở đây, khối sẽ bị kẹt hiện luôn kể cả sau khi rời khỏi "Quét kịch bản".
  if (dsQuet.length === 0) {
    el.className = 'khoi-ket-qua-vua-quet chi-che-do-kich-ban';
    el.innerHTML = '<p style="color:var(--color-text-faint);margin:0">Chưa quét mã nào.</p>';
    return;
  }
  const item = dsQuet[0];
  el.className = 'khoi-ket-qua-vua-quet chi-che-do-kich-ban ' + lopNhom(item.nhom);
  const dongTrangThai = item.nhom === 'OK'
    ? `Trạng thái: ${escapeHtml(item.trangThaiHienTai)} → ${escapeHtml(item.trangThaiSau)}`
    : escapeHtml(item.lyDo);
  el.innerHTML = `
    <div class="hang-tren"><span class="icon-lon">${nhanIconNhom(item.nhom)}</span><strong>${escapeHtml(nhanTenNhom(item.nhom))}</strong></div>
    <div class="tieu-de-lon">${escapeHtml(item.tieuDe || item.sttKey)}</div>
    ${item.tenKhachHang ? `<div class="dong-khach-hang">Khách hàng: ${escapeHtml(item.tenKhachHang)}</div>` : ''}
    <div class="dong-trang-thai">${dongTrangThai}</div>`;
}

function nhayDong(key) {
  const el = document.getElementById('dong-' + key);
  if (!el) return;
  el.style.outline = '3px solid var(--color-primary)';
  setTimeout(() => { if (el) el.style.outline = 'none'; }, 700);
}

function xoaKhoiDsQuet(key, tuManXemLai) {
  dsQuet = dsQuet.filter(x => x.key !== key);
  renderDemNhom();
  if (tuManXemLai) renderXemLai(); else { renderDsDangQuet(); renderKetQuaVuaQuet(); }
}

document.getElementById('btn-dung-quet').onclick = async () => {
  dangQuetKichBan = false;
  await capNhatManHinh();
};

function renderXemLai() {
  const el = document.getElementById('khu-xem-lai');
  const nhomOK = dsQuet.filter(x => x.nhom === 'OK' && !x.daXuLy);
  const nhomCanhBao = dsQuet.filter(x => x.nhom === 'SAI_TRANG_THAI' && !x.daXuLy);
  const nhomLoi = dsQuet.filter(x => x.nhom === 'KHONG_TIM_THAY' && !x.daXuLy);
  const coTheThoat = nhomCanhBao.length === 0 && nhomLoi.length === 0;

  el.innerHTML = `
    <h2>Xem lại kết quả quét — ${escapeHtml(kichBanDangChon.label)}</h2>

    <div class="luoi-3-nhom">
      <div class="nhom-xem-lai ok">
        <div class="tieu-de-nhom">✅ Sẵn sàng (${nhomOK.length})</div>
        <div class="danh-sach-nhom">${nhomOK.length ? nhomOK.map(dongXemLaiOK).join('') : dongTrong()}</div>
      </div>
      <div class="nhom-xem-lai canh-bao">
        <div class="tieu-de-nhom">⚠️ Sai trạng thái (${nhomCanhBao.length})</div>
        <div class="danh-sach-nhom">${nhomCanhBao.length ? nhomCanhBao.map(dongXemLaiCanBaoLoi).join('') : dongTrong()}</div>
      </div>
      <div class="nhom-xem-lai loi">
        <div class="tieu-de-nhom">❌ Không tìm thấy (${nhomLoi.length})</div>
        <div class="danh-sach-nhom">${nhomLoi.length ? nhomLoi.map(dongXemLaiCanBaoLoi).join('') : dongTrong()}</div>
      </div>
    </div>

    <button class="btn-xac-nhan-nhom" id="btn-xac-nhan" ${nhomOK.length === 0 ? 'disabled' : ''}>
      ${icon('check', { size: 48 })} Xác nhận cập nhật (${nhomOK.length})
    </button>

    <button class="btn-tiep-tuc-quet ${coTheThoat ? 'san-sang' : ''}" id="btn-tiep-tuc" ${coTheThoat ? '' : 'disabled'}>
      ${coTheThoat ? 'Tiếp tục quét' : 'Cần xử lý hết nhóm Cảnh báo & Lỗi trước khi tiếp tục'}
    </button>
  `;

  document.getElementById('btn-xac-nhan').onclick = xacNhanCapNhatHangLoat;
  document.getElementById('btn-tiep-tuc').onclick = tiepTucQuet;
  el.querySelectorAll('[data-danxem]').forEach(btn => { btn.onclick = () => danhDauDaXuLy(btn.dataset.danxem); });
  el.querySelectorAll('[data-xoa]').forEach(btn => { btn.onclick = () => xoaKhoiDsQuet(btn.dataset.xoa, true); });
}

function dongTrong() {
  return '<div class="dong-xem-lai"><span style="color:var(--color-text-faint)">Không có mục nào.</span></div>';
}

function dongXemLaiOK(item) {
  return `<div class="dong-xem-lai">
    <div class="noi-dung">
      <strong>${escapeHtml(item.tieuDe || item.sttKey)}</strong>
      <div class="ly-do">${escapeHtml(item.tenKhachHang || '')} · Sẽ chuyển: ${escapeHtml(item.trangThaiHienTai)} → ${escapeHtml(item.trangThaiSau)}</div>
    </div>
  </div>`;
}

function dongXemLaiCanBaoLoi(item) {
  return `<div class="dong-xem-lai">
    <div class="noi-dung">${noiDungDongQuet(item)}</div>
    <div class="nhom-nut">
      <button class="btn-daxem-xemlai" data-danxem="${item.key}">Đã xem</button>
      <button class="btn-xoa-xemlai" data-xoa="${item.key}">XÓA</button>
    </div>
  </div>`;
}

function danhDauDaXuLy(key) {
  const item = dsQuet.find(x => x.key === key);
  if (item) item.daXuLy = true;
  renderDemNhom();
  renderXemLai();
}

async function xacNhanCapNhatHangLoat() {
  const nhomOK = dsQuet.filter(x => x.nhom === 'OK' && !x.daXuLy);
  if (nhomOK.length === 0) return;

  const btn = document.getElementById('btn-xac-nhan');
  btn.disabled = true;
  btn.textContent = 'Đang cập nhật...';

  // Gọi tuần tự từng mã 1 (thay vì gửi cả danh sách trong 1 request) để hiện được tiến độ thật —
  // xem chayHangLoatCoTienDo()/taoThanhTienDo() trong api.js. API vẫn y hệt, chỉ đổi cách gọi.
  let daHuy = false;
  const thanhTienDo = taoThanhTienDo(btn, { onHuy: () => { daHuy = true; } });
  thanhTienDo.capNhat(0, nhomOK.length);

  const res = await chayHangLoatCoTienDo(
    nhomOK.map(x => x.sttKey),
    sttKey => apiFetch(`/qr/kich-ban/${kichBanDangChon.id}/xac-nhan-hang-loat`, {
      method: 'POST', body: JSON.stringify({ sttKeys: [sttKey] }),
    }),
    { onTienDo: (hienTai, tong) => thanhTienDo.capNhat(hienTai, tong), kiemTraHuy: () => daHuy }
  );
  thanhTienDo.xoa();

  dsQuet = dsQuet.filter(x => !res.thanhCong.includes(x.sttKey));

  res.loi.forEach(l => {
    const item = dsQuet.find(x => x.sttKey === l.sttKey);
    if (item) { item.nhom = 'SAI_TRANG_THAI'; item.lyDo = l.lyDo; item.daXuLy = false; }
  });

  if (res.daHuy) {
    alert(`Đã HỦY giữa chừng — đã cập nhật ${res.thanhCong.length}/${nhomOK.length} đơn. Các đơn còn lại vẫn ở nhóm "OK", bấm "Xác nhận cập nhật" lại để tiếp tục.`);
  } else if (res.loi.length > 0) {
    alert(`Đã cập nhật ${res.thanhCong.length} đơn. Có ${res.loi.length} đơn KHÔNG cập nhật được — xem lại nhóm "Sai trạng thái" bên dưới.`);
  }

  renderDemNhom();
  renderXemLai();
}

async function tiepTucQuet() {
  dangQuetKichBan = true;
  await capNhatManHinh();
}

// TÁCH QUÉT/CHỤP THÀNH 2 BƯỚC 07/09/2026)
// Dùng UI/logic này cho tab "Chụp ảnh đã sản xuất" — lấy cấu hình (mốc ảnh + trạng thái yêu cầu/đích)

// xoá 09/09/2026 lần 3 — xem data/pipelineTinhTrang.js).

//   [Đang quét] --quét QR sống OK + đơn đủ điều kiện (POST /photos/kiem-tra)--> [Sẵn sàng chụp]

//   [Sẵn sàng chụp] --bấm "Quét lại"--> [Đang quét] (không upload gì)
//   [Sẵn sàng chụp] --chụp ảnh, upload OK--> ghi log, TỰ QUAY LẠI [Đang quét] cho đơn tiếp theo
//   [Sẵn sàng chụp] --chụp ảnh, upload lỗi--> báo lỗi, VẪN Ở [Sẵn sàng chụp] (đơn đã biết, chụp lại
//                                              ngay không cần quét lại)
//
// TRƯỚC ĐÂY (đến 07/09/2026): đọc mã QR NGAY TỪ ẢNH VỪA CHỤP bằng html5-qrcode.scanFile() — giải mã
// ẢNH TĨNH, đúng 1 lần thử, không có "khung hình kế tiếp" để cứu như quét sống — tỉ lệ thất bại cao
// trên thực tế (mờ/loá sáng/góc chụp xấu tại đúng khoảnh khắc bấm chụp, mã QR chỉ chiếm 1 góc nhỏ
// trong ảnh vì ảnh còn phải chụp cả sản phẩm). Quét QR SỐNG (nhiều khung hình/giây, tự lấy nét) đáng
// tin cậy hơn hẳn — giờ quét sống TRƯỚC để xác định đơn, ảnh chụp sau không cần đọc được mã QR nữa.
// ============================================================

// Quét được mã trong trạng thái [Đang quét] — kiểm tra đơn đủ điều kiện chụp TRƯỚC khi cho chụp ảnh
// thật (tránh lãng phí 1 lần chụp cho đơn sai trạng thái/không tồn tại).
async function xuLyQuetDeXacDinhDon(sttKeyThoDoc) {
  if (dangXuLyQuet) return;
  dangXuLyQuet = true;
  const cauHinh = CAU_HINH_ANH[mode];

  try {
    const ketQua = await apiFetch('/photos/kiem-tra', {
      method: 'POST', body: JSON.stringify({ sttKey: sttKeyThoDoc, moc: cauHinh.moc }),
    });
    donDaXacDinhChoAnh = { sttKey: ketQua.sttKey || sttKeyThoDoc, tieuDe: ketQua.tieuDe, tenKhachHang: ketQua.tenKhachHang };
    hienThiToast('OK', ketQua.tieuDe || sttKeyThoDoc);
    phatAmThanhKetQua('OK');
    await capNhatManHinh();
  } catch (err) {
    hienThiToast('SAI_TRANG_THAI', err.message);
    phatAmThanhKetQua('SAI_TRANG_THAI');
  }

  setTimeout(() => { dangXuLyQuet = false; }, 700);
}

// Bấm "Quét lại" ở trạng thái [Sẵn sàng chụp] — quay về [Đang quét], KHÔNG upload gì.
document.getElementById('btn-quet-lai-chup-anh').onclick = async () => {
  donDaXacDinhChoAnh = null;
  await capNhatManHinh();
};

document.getElementById('btn-chup-anh').onclick = () => {
  document.getElementById('input-chup-anh').value = ''; // reset để chọn lại đúng ảnh mới chụp, kể cả khi trùng tên file với lần trước
  document.getElementById('input-chup-anh').click();
};

document.getElementById('input-chup-anh').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  await xuLyChupAnh(file);
});

async function xuLyChupAnh(file) {
  if (!donDaXacDinhChoAnh) { alert('Chưa xác định được đơn — quét lại mã QR trước khi chụp.'); return; }
  const cauHinh = CAU_HINH_ANH[mode];
  const sttKey = donDaXacDinhChoAnh.sttKey;
  const btn = document.getElementById('btn-chup-anh');
  btn.disabled = true;
  btn.innerHTML = icon('spinner', { className: 'icon-spin', size: 24 }) + ' Đang tải ảnh lên...';

  const form = new FormData();
  form.append('photo', file);
  form.append('sttKey', sttKey);
  form.append('moc', cauHinh.moc);

  try {
    const res = await fetch('/api/photos/upload', { method: 'POST', body: form, credentials: 'include' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    const don = data.don || {};
    hienThiToastAnh('ok', `${don.STT_Key || sttKey}${don.TenKhachHang ? ' · ' + don.TenKhachHang : ''} — đã chuyển sang "${cauHinh.chuyenSang}"`);
    phatAmThanhKetQua('OK');
    themDongDaChup({ trangThai: 'ok', sttKey: don.STT_Key || sttKey, ghiChu: `${don.TenKhachHang || ''} — ${cauHinh.yeuCau} → ${cauHinh.chuyenSang}` });

    // Xong 1 đơn — quay lại [Đang quét] cho đơn tiếp theo, giữ đúng nhịp quét→chụp liên tục cho cả lô.
    donDaXacDinhChoAnh = null;
    btn.disabled = false;
    btn.innerHTML = icon('camera', { size: 40 }) + ' Chụp ảnh';
    await capNhatManHinh();
  } catch (err) {
    // Lỗi upload thật (mất mạng, server từ chối vì đơn vừa đổi trạng thái...) — đơn ĐÃ BIẾT vẫn giữ
    // nguyên (donDaXacDinhChoAnh không đổi), cho chụp lại NGAY không cần quét lại QR từ đầu.
    hienThiToastAnh('canh-bao', `${sttKey}: ${err.message}`);
    phatAmThanhKetQua('SAI_TRANG_THAI');
    themDongDaChup({ trangThai: 'canh-bao', sttKey, ghiChu: err.message });
    btn.disabled = false;
    btn.innerHTML = icon('camera', { size: 40 }) + ' Chụp lại';
  }
}

// Hiện thông tin đơn đã xác định ở trạng thái [Sẵn sàng chụp] — dùng lại đúng class
// .khoi-ket-qua-vua-quet đã có cho khối "Kết quả vừa quét" ở Quét kịch bản, nhất quán hình ảnh.
function renderThongTinDonChoAnh() {
  const el = document.getElementById('thong-tin-don-cho-chup');
  if (!donDaXacDinhChoAnh) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="tieu-de-lon">${escapeHtml(donDaXacDinhChoAnh.tieuDe || donDaXacDinhChoAnh.sttKey)}</div>
    ${donDaXacDinhChoAnh.tenKhachHang ? `<div class="dong-khach-hang">Khách hàng: ${escapeHtml(donDaXacDinhChoAnh.tenKhachHang)}</div>` : ''}`;
}

function hienThiToastAnh(loai, noiDung) {
  clearTimeout(toastAnhTimer);
  const el = document.getElementById('toast-chup-anh');
  const MAP = { ok: '✅', 'canh-bao': '⚠️', loi: '❌' };
  el.className = 'toast-vua-quet hien ' + loai;
  el.innerHTML = `<span style="font-size:1.4rem">${MAP[loai] || ''}</span> ${escapeHtml(noiDung)}`;
  toastAnhTimer = setTimeout(() => { el.classList.remove('hien'); }, 4500);
}

function themDongDaChup(item) {
  dsDaChupTheoMoc[mode].unshift(item);
  renderDemNhomAnh();
  renderDsDaChup();
}

function renderDemNhomAnh() {
  const el = document.getElementById('dem-nhom-anh');
  const ds = dsDaChupTheoMoc[mode];
  const soOK = ds.filter(x => x.trangThai === 'ok').length;
  const soCanhBao = ds.filter(x => x.trangThai === 'canh-bao').length;
  // Bỏ ô đếm "Không đọc được mã" (07/09/2026) — từ khi tách quét/chụp thành 2 bước, ảnh chụp không
  // còn cần tự đọc mã QR nữa nên themDongDaChup() không bao giờ còn gọi với trangThai:'loi' (xem
  // docs/superpowers/specs/2026-09-07-tach-quet-chup-anh-design.md) — ô đếm này sẽ luôn là 0.
  el.innerHTML = `
    <div class="dem-o ok"><div class="hang-tren"><span class="dem-icon">✅</span><span class="dem-so">${soOK}</span></div><div class="dem-nhan">Thành công</div></div>
    <div class="dem-o canh-bao"><div class="hang-tren"><span class="dem-icon">⚠️</span><span class="dem-so">${soCanhBao}</span></div><div class="dem-nhan">Lỗi nghiệp vụ</div></div>`;
}

function renderDsDaChup() {
  const el = document.getElementById('ds-da-chup');
  const ds = dsDaChupTheoMoc[mode];
  if (ds.length === 0) { el.innerHTML = '<p style="color:var(--color-text-faint)">Chưa chụp ảnh nào.</p>'; return; }
  el.innerHTML = ds.map(item => `
    <div class="dong-quet ${item.trangThai}">
      <span style="font-size:1.3rem">${item.trangThai === 'ok' ? '✅' : item.trangThai === 'canh-bao' ? '⚠️' : '❌'}</span>
      <div class="noi-dung">
        <strong>${escapeHtml(item.sttKey)}</strong>
        <div class="ly-do">${escapeHtml(item.ghiChu || '')}</div>
      </div>
    </div>`).join('');
}
</script>
</body>
</html>
