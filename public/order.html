<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết đơn hàng — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=107">
<script src="/js/theme.js?v=104"></script>
</head>
<body>
<div id="nav"></div>
<div class="page" id="don-hang">
  <div class="skeleton-list"><div class="skeleton-card" style="height:220px"></div></div>
</div>

<script src="/js/icons.js?v=104"></script>
<script src="/js/api.js?v=108"></script>
<script>
const sttKey = new URLSearchParams(location.search).get('stt');
// Số ngày bỏ khỏi nhãn (bổ sung 23/09/2026, theo yêu cầu người dùng) — ngưỡng giờ chỉnh được ở
// settings.html (superadmin), số cứng không còn luôn đúng nên không hard-code vào nhãn hiển thị nữa.
const NHAN_CANH_BAO = { VANG: 'Cảnh báo Vàng · ít tiến triển', CAM: 'Cảnh báo Cam · chưa vào sản xuất', DO: 'Cảnh báo Đỏ · chưa ship' };
// PHẢI khớp TINH_TRANG_VALUES trong data/pipelineTinhTrang.js
// (bổ sung 26/08/2026) Đơn "Đang chạy máy" nhưng không tra được người vận hành (vd sửa thẳng trên
// Sheet, log bị thiếu) — vẫn cho xem (an toàn hơn) nhưng cảnh báo TO, RÕ thay vì chỉ ghi "Không xác định".
const NHAN_NGUOI_VAN_HANH_KHONG_RO = 'ĐƠN SỬA TRONG GGSHEET, KHÔNG RÕ TÀI KHOẢN SẢN XUẤT NÀO ĐANG CHẠY';
const DANH_SACH_TINH_TRANG = [
  'Chưa in mã', 'Đã in mã', 'ĐÃ SẴN SÀNG CHẠY MÁY', 'Đang chạy máy', 'Đã sản xuất', 'LỖI SẢN XUẤT CẦN LÀM LẠI',
  'ĐÃ DÁN TEM', 'DELIVERED_Đã giao đến khách', 'CANCELLED_Đã hủy', 'REFUNDED_Hoàn đơn',
];

// Format timestamp ngắn gọn "DD-MM HH:mm:ss" — nhất quán với backend dinhDangNgayGioNgan()
// Không dùng toLocaleString('vi-VN') vì output phụ thuộc cài đặt trình duyệt và dài hơn cần thiết
function tsDep(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d)) return isoStr; // fallback: hiện nguyên chuỗi gốc
  const fmt = (n) => String(n).padStart(2, '0');
  // Chuyển sang giờ GMT+7 Việt Nam
  const vn = new Date(d.toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh' }));
  return `${fmt(vn.getDate())}-${fmt(vn.getMonth()+1)} ${fmt(vn.getHours())}:${fmt(vn.getMinutes())}:${fmt(vn.getSeconds())}`;
}

let user;
let donHienTai = null; // đơn đang xem (lần tải gần nhất) — nút mua tracking kiểm tra đơn đã huỷ trước khi hỏi xác nhận
let dsSanXuatDangHoatDong = []; // chỉ admin cần, nạp 1 lần lúc vào trang (xem renderKhuVucThaoTac)
let dsVeFileDangHoatDong = []; // chỉ admin cần, nạp 1 lần lúc vào trang (xem renderKhuVucThaoTac)

(async () => {
  user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'orders');

  // "Chỉ định người chạy máy" (bổ sung 07/09/2026, xem docs/superpowers/specs/2026-09-07-nguoi-chay-may-design.md)
  // + "Chỉ định người vẽ file" (bổ sung 09/09/2026, cùng khuôn — route POST /orders/chi-dinh-nguoi-ve-file
  // đã có sẵn từ trước) — CHỈ admin. /users vốn đã chỉ mở cho admin (requireRole trong routes/users.js).
  if (laAdmin(user.vaiTro)) {
    try {
      const dsNhanVien = await apiFetch('/users/tom-tat');
      dsSanXuatDangHoatDong = dsNhanVien.filter(u => u.VaiTro === 'san_xuat' && String(u.KichHoat).toUpperCase() === 'TRUE');
      dsVeFileDangHoatDong = dsNhanVien.filter(u => u.VaiTro === 've_file' && String(u.KichHoat).toUpperCase() === 'TRUE');
    } catch (e) { /* không tải được danh sách — ô chọn sẽ hiện rỗng, không chặn tải trang */ }
  }

  await taiChiTiet();
})();

function dongDiaChi(don) {
  const phan = [don.TEN_DIA_CHI, don.DIA_CHI_TEN_DUONG, don.DIA_CHI_TEN_TP, don.DIA_CHI_BANG, don.MA_ZIPCODE, don.DIA_CHI_NUOC]
    .filter(Boolean);
  return phan.length ? phan.join(', ') : '(chưa có địa chỉ)';
}

// nguoi_san_xuat (bổ sung 12/09/2026, theo yêu cầu người dùng): chỉ hiện ĐÚNG 3 trường (Số lượng,
// Ngày lên đơn, Ghi chú — bôi đậm) thay vì đủ 14 trường như trước — hạn chế thông tin khách hàng/địa
// chỉ/tracking/IOSS... không cần thiết cho việc chạy máy, dễ gây nhiễu hoặc bỏ sót thông tin quan
// trọng. admin/ve_file vẫn thấy đủ như cũ.
// Ghi chú xưởng (28/09/2026): bản chính là cột GHI_CHU_XUONG trong Sheet Seller (app ghi ngược vào đó, đọc lại
// qua RAW -> Don_Hang_ALL). Bản lưu trong app (GHI_CHU_XUONG_NOI_BO) KHÁC bản Sheet = chưa ghi được sang Sheet
// hoặc Sheet chưa cập nhật lại -> hiện thêm 1 dòng màu cam để không ai tưởng đã có trên Sheet Seller.
// Bản trong app chỉ được ưu tiên hơn bản Sheet khi (a) lần ghi gần nhất sang Sheet BỊ LỖI, hoặc (b) vừa ghi thành
// công < 15 phút (IMPORTRANGE/QUERY chưa kịp cập nhật). Ngoài 2 trường hợp đó Sheet là bản chính — Seller có thể
// đã sửa cột Q SAU lần lưu gần nhất; điền bản app cũ vào ô sửa sẽ khiến bấm Lưu GHI ĐÈ mất ghi chú mới của Seller.
function trangThaiGhiChuXuong(don) {
  const noiBo = don.GHI_CHU_XUONG_NOI_BO || '';
  const sheet = don.GHI_CHU_XUONG || '';
  const gan = don.DongBoGhiChuXuong;
  if (!gan || noiBo === sheet) return { oSua: sheet, canhBao: '' };
  if (gan.KetQua === 'LOI') return { oSua: noiBo, canhBao: `CHƯA ghi được sang Sheet Seller — ${gan.LyDo}` };
  if (Date.now() - new Date(gan.ThoiGian).getTime() < 15 * 60 * 1000) {
    return { oSua: noiBo, canhBao: `Đã ghi sang Sheet Seller lúc ${tsDep(gan.ThoiGian)} — đang chờ Sheet cập nhật lại.` };
  }
  return { oSua: sheet, canhBao: '' };
}
function dongGhiChuNoiBo(don) {
  const { canhBao } = trangThaiGhiChuXuong(don);
  if (!canhBao) return '';
  return `<tr><td>Ghi chú xưởng<br><small>(bản lưu trong app)</small></td><td style="color:var(--color-warning-text)"><strong>${escapeHtml(don.GHI_CHU_XUONG_NOI_BO)}</strong><br><small>${escapeHtml(canhBao)}</small></td></tr>`;
}

function renderBangThongTin(don, viTri) {
  if (user.vaiTro === 'san_xuat') {
    return `
      <tr><td>Số lượng</td><td>${escapeHtml(don.SO_LUONG || '')} ${don.SO_LUONG_AO_TREN_DON ? `(áo trên đơn: ${escapeHtml(don.SO_LUONG_AO_TREN_DON)})` : ''}</td></tr>
      <tr><td>Ngày lên đơn</td><td>${don.NGAY_LEN_DON ? dinhDangNgay(don.NGAY_LEN_DON) : ''}</td></tr>
      <tr><td>Ghi chú</td><td><strong>${escapeHtml(don.GHI_CHU || '')}</strong></td></tr>
      ${don.GHI_CHU_XUONG ? `<tr><td>Ghi chú xưởng</td><td><strong>${escapeHtml(don.GHI_CHU_XUONG)}</strong></td></tr>` : ''}
      ${dongGhiChuNoiBo(don)}`;
  }
  return `
    <tr><td>Mã đơn</td><td>${escapeHtml(don.STT_Key)}</td></tr>
    <tr><td>Mã đơn (sàn TMĐT)</td><td>${escapeHtml(don.MA_DON_HANG_ORDERID || '')}</td></tr>
    ${dongNhomNhieuAo(don.NhomNhieuAo)}
    <tr><td>Khách hàng</td><td>${escapeHtml(don.TenKhachHang || '')} <span style="color:var(--color-text-faint)">(${escapeHtml(don.MA_KHACH_HANG || '')})</span></td></tr>
    <tr><td>Loại / Kích thước / Màu</td><td>${escapeHtml(don.LOAI || '')} · ${escapeHtml(don.KICH_THUOC || '')} · ${escapeHtml(don.MAU_SAC || '')}</td></tr>
    <tr><td>Vị trí thêu</td><td>${viTri}</td></tr>
    <tr><td>Số lượng</td><td>${escapeHtml(don.SO_LUONG || '')} ${don.SO_LUONG_AO_TREN_DON ? `(áo trên đơn: ${escapeHtml(don.SO_LUONG_AO_TREN_DON)})` : ''}</td></tr>
    <tr><td>Ngày lên đơn</td><td>${don.NGAY_LEN_DON ? dinhDangNgay(don.NGAY_LEN_DON) : ''}</td></tr>
    <tr><td>Hãng vận chuyển</td><td>${escapeHtml(don.HANG_VAN_CHUYEN || '')}</td></tr>
    <tr><td>Mã tracking</td><td>${escapeHtml(don.TRACKING_ID || '')}${don.TRACKING_CHUNG_CUA ? ` <span style="color:var(--color-text-faint)">(dùng chung của ${escapeHtml(don.TRACKING_CHUNG_CUA)})</span>` : ''}</td></tr>
    <tr><td>Đã mua Tracking</td><td><strong>${escapeHtml(don.DA_MUA_TRACKING || '')}</strong> <span style="color:var(--color-text-faint)">— ${escapeHtml(don.LyDoDaMuaTracking || '')}</span></td></tr>
    ${don.TRACKING_ID && don.TRANG_THAI_TRACKING ? `
    <tr><td>Trạng thái vận chuyển</td><td>${escapeHtml(don.TRANG_THAI_TRACKING)}${don.THOI_GIAN_CAP_NHAT_TRACKING ? ` <span style="color:var(--color-text-faint)">(cập nhật ${escapeHtml(don.THOI_GIAN_CAP_NHAT_TRACKING)})</span>` : ''}</td></tr>` : ''}
    <tr><td>Người nhận</td><td>${escapeHtml(don.TEN || '')} ${don.SDT ? '· ' + escapeHtml(don.SDT) : ''}</td></tr>
    <tr><td>Địa chỉ giao hàng</td><td>${escapeHtml(dongDiaChi(don))}</td></tr>
    <tr><td>Mã IOSS</td><td>${escapeHtml(don.MA_IOSS || '')}</td></tr>
    <tr><td>Ghi chú</td><td>${escapeHtml(don.GHI_CHU || '')}</td></tr>
    <tr><td>Ghi chú xưởng</td><td>${escapeHtml(don.GHI_CHU_XUONG || '')}</td></tr>
    ${dongGhiChuNoiBo(don)}
    <tr><td>Xưởng</td><td>${escapeHtml(don.XUONG || '(chưa gán)')}</td></tr>
    <tr><td>Cập nhật lần cuối</td><td>${escapeHtml(don.NguoiCapNhatCuoi || '')}${don.ThoiGianCapNhatCuoi ? ' · ' + tsDep(don.ThoiGianCapNhatCuoi) : ''}</td></tr>`;
}

// DonNhieuAo (bổ sung 26/09/2026) — liệt kê cả nhóm (link từng đơn + trạng thái + tracking) và lỗi dữ
// liệu của nhóm, nếu có. Xem services/donNhieuAoService.js#tomTatChoDon.
function dongNhomNhieuAo(n) {
  if (!n) return '';
  const cacDon = n.thanhVien.map(t => `<div><a href="/order.html?stt=${encodeURIComponent(t.sttKey)}">${escapeHtml(t.sttKey)}</a>${t.sttKey === n.donMua ? ' <strong>(mua tracking)</strong>' : ''}${t.sttKey === n.donIn && n.donIn !== n.donMua ? ' <strong>(in label)</strong>' : ''} · ${escapeHtml(t.trangThai)}${t.trackingId ? ' · ' + escapeHtml(t.trackingId) : ''}</div>`).join('');
  const loi = [...n.loiChan, ...n.canhBao];
  return `<tr><td>Nhóm DonNhieuAo</td><td>${nhanNhomNhieuAo(n)}<div style="margin-top:6px">${cacDon}</div>${loi.length ? `<p style="margin:6px 0 0;color:var(--color-danger-text)">${loi.map(escapeHtml).join('<br>')}</p>` : ''}</td></tr>`;
}

async function taiChiTiet() {
  let don;
  try {
    don = await apiFetch('/orders/' + encodeURIComponent(sttKey));
    donHienTai = don;
  } catch (e) {
    document.getElementById('don-hang').innerHTML = `<p>${escapeHtml(e.message)}</p>`;
    return;
  }

  const dsAnh = urlAnhHienThiList(don.DUONG_DAN_URL || don.MOCKUP, CHIEU_RONG_ANH_CHI_TIET);
  const viTri = (don.ViTriTheu || []).map(escapeHtml).join(' · ') || '—';

  document.getElementById('don-hang').innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <h2 style="margin:0" class="${don.DonUuTien ? 'uu-tien' : ''}">${escapeHtml(don.TieuDeSanPham || don.STT_Key)}</h2>
      <button type="button" class="btn-hanh-dong phu" onclick="inDonHang(this)">${icon('printer')} IN ĐƠN</button>
    </div>
    <div class="badge-row" style="margin-bottom:16px">
      ${don.DonUuTien ? `<span class="badge trang-thai-danger">${icon('star', {size:14})} Đơn ưu tiên</span>` : ''}
      ${nhanNhomNhieuAo(don.NhomNhieuAo)}
      <span class="badge ${lopTrangThai(don.TRANG_THAI_XUONG)}">${escapeHtml(don.TRANG_THAI_XUONG || '')}</span>
      ${don.TRANG_THAI_XUONG === 'Đang chạy máy' ? `
        <span class="badge trang-thai-info">${icon('users', {size:14})} Đang vận hành: <strong>${escapeHtml(don.NguoiVanHanh || NHAN_NGUOI_VAN_HANH_KHONG_RO)}</strong></span>` : ''}
      ${['Chưa in mã', 'Đã in mã'].includes(don.TRANG_THAI_XUONG) ? `
        <span class="badge ${lopTrangThai(don.TRANG_THAI_PHOI)}">${escapeHtml(don.TRANG_THAI_PHOI || '')}</span>
        <span class="badge ${lopTrangThai(don.TRANG_THAI_VE_FILE)}">${escapeHtml(don.TRANG_THAI_VE_FILE || '')}</span>` : ''}
      ${don.DANH_DAU_IN ? `<span class="badge trang-thai-info">${icon('check', {size:14})} Đã đánh dấu in</span>` : ''}
      ${don.CanhBao ? `
        <span class="badge badge-canh-bao ${don.CanhBao.toLowerCase()}">
          ${icon('alert')} ${escapeHtml(NHAN_CANH_BAO[don.CanhBao] || don.CanhBao)}
        </span>` : ''}
    </div>

    <div class="${user.vaiTro === 'san_xuat' ? '' : 'chi-tiet-layout'}">
      <div>
        ${dsAnh.length ? `<div class="nhom-anh-mau">${dsAnh.map(src => `<img class="anh-mau" src="${escapeHtml(src)}" alt="Ảnh mẫu/mockup" loading="lazy" onerror="this.remove()">`).join('')}</div>` : ''}
        ${(user.vaiTro !== 'nguoi_lay_phoi' && (don.DUONG_DAN_URL || don.MOCKUP)) || don.Anh_File_Theu_URL || don.Anh_File_Theu_URL_2 || don.Anh_File_Theu_URL_3 || don.Anh_Da_San_Xuat_URL || don.Anh_Dong_Goi_URL ? `
        <div class="danh-sach-link-anh">
          ${user.vaiTro !== 'nguoi_lay_phoi' && don.DUONG_DAN_URL ? `<a href="${escapeHtml(don.DUONG_DAN_URL)}" target="_blank" rel="noopener">${icon('file', {size:14})} Ảnh PNG</a>` : ''}
          ${user.vaiTro !== 'nguoi_lay_phoi' && don.MOCKUP ? `<a href="${escapeHtml(don.MOCKUP)}" target="_blank" rel="noopener">${icon('file', {size:14})} Ảnh Mockup</a>` : ''}
          ${don.Anh_File_Theu_URL ? `<a href="${escapeHtml(don.Anh_File_Theu_URL)}" target="_blank" rel="noopener">${icon('file', {size:14})} Ảnh file thêu</a>` : ''}
          ${don.Anh_File_Theu_URL_2 ? `<a href="${escapeHtml(don.Anh_File_Theu_URL_2)}" target="_blank" rel="noopener">${icon('file', {size:14})} Ảnh File Thêu 2</a>` : ''}
          ${don.Anh_File_Theu_URL_3 ? `<a href="${escapeHtml(don.Anh_File_Theu_URL_3)}" target="_blank" rel="noopener">${icon('file', {size:14})} Ảnh File Thêu 3</a>` : ''}
          ${don.Anh_Da_San_Xuat_URL ? `<a href="${escapeHtml(don.Anh_Da_San_Xuat_URL)}" target="_blank" rel="noopener">${icon('file', {size:14})} Ảnh đã sản xuất</a>` : ''}
          ${don.Anh_Da_Dan_Tem_URL ? `<a href="${escapeHtml(don.Anh_Da_Dan_Tem_URL)}" target="_blank" rel="noopener">${icon('file', {size:14})} Ảnh ĐÃ DÁN TEM</a>` : ''}
          ${don.Anh_Dong_Goi_URL ? `<a href="${escapeHtml(don.Anh_Dong_Goi_URL)}" target="_blank" rel="noopener">${icon('file', {size:14})} Ảnh đóng gói</a>` : ''}
        </div>` : ''}
        <table class="info-table">
          ${renderBangThongTin(don, viTri)}
        </table>
        <div id="khu-vuc-thao-tac"></div>
      </div>

      ${user.vaiTro === 'san_xuat' ? '' : `
      <div>
        <h3>Lịch sử thay đổi</h3>
        <div class="timeline">
          ${(don.lichSu || []).map(l => `
            <div class="timeline-item${l.Mo ? ' lich-su-mo' : ''}">
              <div class="timeline-info">
                <strong>${escapeHtml(l.NguoiDung)}</strong>${l.VaiTro ? ` <span style="font-size:0.85rem;color:var(--color-text-muted)">(${escapeHtml(NHAN_VAI_TRO[l.VaiTro] || l.VaiTro)})</span>` : ''}
                <div style="margin-top:2px">${escapeHtml(l.MoTa || l.HanhDong)}</div>
                ${htmlThayDoiLichSu(l.ThayDoi)}
              </div>
              <div class="timeline-time">${tsDep(l.ThoiGian)}</div>
            </div>`).join('') || '<p>Chưa có lịch sử.</p>'}
        </div>
      </div>`}
    </div>
  `;
  renderKhuVucThaoTac(don);
}

// Tô màu <select> Phôi/Vẽ file theo giá trị đang chọn — xanh lá cho "Đã..." (positive), cam cho
// "Chưa..." (negative), khớp đúng ý nghĩa với badge trạng thái đang dùng ở nơi khác trong app.
function capNhatMauChonTrangThai(select) {
  const laTichCuc = select.value.startsWith('Đã ');
  select.classList.toggle('chon-trang-thai-tich-cuc', laTichCuc);
  select.classList.toggle('chon-trang-thai-tieu-cuc', !laTichCuc);
}

function renderKhuVucThaoTac(don) {
  const el = document.getElementById('khu-vuc-thao-tac');
  let html = '';

  // 2 nút lớn (28/09/2026, theo yêu cầu người dùng — routes/orders.js POST /:sttKey/nut-trang-thai):
  // xanh "BẮT ĐẦU CHẠY MÁY" chỉ san_xuat, khi đơn "ĐÃ SẴN SÀNG CHẠY MÁY"; đỏ "BÁO LỖI" cho mọi vai trò
  // xem được đơn, khi đơn "Đang chạy máy" (hỏi xác nhận trước — theo yêu cầu, chỉ nút này).
  if (user.vaiTro === 'san_xuat' && don.TRANG_THAI_XUONG === 'ĐÃ SẴN SÀNG CHẠY MÁY') {
    html += `<button type="button" class="nut-trang-thai-lon xanh" onclick="bamNutTrangThai('BAT_DAU_CHAY_MAY', this)">${icon('arrowRight', { size: 28 })} BẮT ĐẦU CHẠY MÁY</button>`;
  }
  // san_xuat: nút BÁO LỖI nằm CUỐI trang, cỡ thường (xem cuối hàm) — tránh bấm nhầm (29/09/2026).
  if (don.TRANG_THAI_XUONG === 'Đang chạy máy' && user.vaiTro !== 'san_xuat') {
    html += `<button type="button" class="nut-trang-thai-lon do" onclick="bamNutTrangThai('BAO_LOI_SAN_XUAT', this)">${icon('alert', { size: 28 })} BÁO LỖI SẢN XUẤT – CẦN LÀM LẠI</button>`;
  }

  // nguoi_san_xuat (bổ sung 12/09/2026, theo yêu cầu người dùng — hạn chế thông tin/thao tác không
  // cần thiết dễ gây nhiễu khi chỉ tập trung chạy máy): ẩn nút chuyển giai đoạn theo kịch bản + ô ghi
  // chú xưởng. Báo lỗi sản xuất giờ qua nút đỏ ở trên (khối "Sửa trạng thái thủ công" chỉ còn admin).
  if (user.vaiTro !== 'san_xuat') {
    // Nút chuyển giai đoạn — đọc từ chính tab CauHinhKichBan (dùng chung logic với quét QR),
    // không hardcode nút theo vai trò vì Sheet không định nghĩa vai trò cho từng kịch bản.
    if (don.kichBanKeTiep && don.kichBanKeTiep.length > 0) {

// Cảnh báo TRƯỚC khi lưu, ngay khi người dùng đổi 1 trong 3 dropdown — soi gương lại đúng 2 quy tắc
// trong services/orderService.js (kiemTraTinhHopLy) để người dùng thấy lỗi ngay, không phải bấm Lưu
// mới biết bị từ chối. Đây CHỈ là gợi ý trên giao diện — server vẫn kiểm tra lại đầy đủ (không thể
// bỏ qua bằng cách sửa JS trên trình duyệt), đây không phải là chốt bảo mật.
function loiToHopTrangThai(tinhTrang, phoi, veFile) {
  // Vẽ file độc lập với in mã; chỉ chặn khi CHÍNH lần lưu này tạo ra "Chưa in mã + Đã lấy phôi" (đơn cũ lỡ lấy phôi
  // trước khi in mã vẫn lưu được thay đổi khác) — cùng quy tắc với kiemTraTinhHopLy (28/09/2026).
  const truoc = donHienTai || {};
  if (tinhTrang === 'Chưa in mã' && phoi === 'Đã lấy phôi' &&
      (truoc.TRANG_THAI_PHOI !== 'Đã lấy phôi' || truoc.TRANG_THAI_XUONG !== 'Chưa in mã')) {
    return 'Đơn đang "Chưa in mã" thì chưa thể "Đã lấy phôi" — in mã đơn trước.';
  }
  // Cùng danh sách với THU_TU_TINH_TRANG trong data/pipelineTinhTrang.js (bỏ 2 bước đầu "Chưa/Đã in
  // mã", xử lý riêng ở trên) — sửa 1 chỗ thì nhớ sửa chỗ kia. Đã bỏ "Đã đóng gói", thêm "ĐÃ DÁN TEM"
  // (09/09/2026 lần 3 — trước đó thiếu "ĐÃ DÁN TEM" trong danh sách này, 1 lỗ hổng cảnh báo có sẵn từ
  // trước, tiện sửa luôn).
  const CAC_TRANG_THAI_TU_SAN_SANG_TRO_DI = [
    'ĐÃ SẴN SÀNG CHẠY MÁY', 'Đang chạy máy', 'Đã sản xuất', 'ĐÃ DÁN TEM',
    'DELIVERED_Đã giao đến khách',
  ];
  if (CAC_TRANG_THAI_TU_SAN_SANG_TRO_DI.includes(tinhTrang)) {
    if (phoi !== 'Đã lấy phôi') return `Đang ở "${tinhTrang}" nhưng phôi vẫn "${phoi}" — phải có đủ phôi mới tới được giai đoạn này.`;
    if (veFile !== 'Đã vẽ file') return `Đang ở "${tinhTrang}" nhưng file vẽ vẫn "${veFile}" — phải vẽ xong file mới tới được giai đoạn này.`;
  }
  return null;
}

function canhBaoToHopSai() {
  const tinhTrang = document.getElementById('sua-tinh-trang').value;
  const phoi = document.getElementById('sua-phoi').value;
  const veFile = document.getElementById('sua-ve-file').value;
  const loi = loiToHopTrangThai(tinhTrang, phoi, veFile);

  const khu = document.getElementById('canh-bao-to-hop');
  const nutLuu = document.getElementById('nut-luu-trang-thai');
  if (loi) {
    khu.innerHTML = `<p style="margin:0;font-size:0.85rem;color:var(--color-danger-text);background:var(--color-danger-bg);padding:8px 10px;border-radius:6px">${icon('alert', {size:14})} ${escapeHtml(loi)}</p>`;
    nutLuu.disabled = true;
  } else {
    khu.innerHTML = '';
    nutLuu.disabled = false;
  }
}

async function luuTrangThaiThuCong() {
  const updates = {
    TRANG_THAI_XUONG: document.getElementById('sua-tinh-trang').value,
    TRANG_THAI_PHOI: document.getElementById('sua-phoi').value,
    TRANG_THAI_VE_FILE: document.getElementById('sua-ve-file').value,
  };
  try {
    await apiFetch('/orders/' + encodeURIComponent(sttKey), { method: 'PUT', body: JSON.stringify(updates) });
    await taiChiTiet();
  } catch (e) { alert(e.message); }
}

  if (!confirm(`Chỉ định "${nguoiSanXuat}" chạy máy cho đơn này (chuyển sang "Đang chạy máy")?`)) return;

  const nhanGoc = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = icon('spinner', { className: 'icon-spin', size: 16 }) + ' Đang xử lý...';

  try {
    const ketQua = await apiFetch('/orders/chi-dinh-nguoi-chay-may', {
      method: 'POST', body: JSON.stringify({ sttKeys: [sttKey], nguoiSanXuat }),
    });
    if (ketQua.loi && ketQua.loi.length > 0) {
      alert('Không chỉ định được: ' + ketQua.loi[0].lyDo);
      btn.disabled = false;
      btn.innerHTML = nhanGoc;
    } else {
      await taiChiTiet(); // vẽ lại toàn bộ khu vực thao tác — không cần tự khôi phục nút cũ
    }
  } catch (e) {
    alert(e.message);
    btn.disabled = false;
    btn.innerHTML = nhanGoc;
  }
}

function laDonConNhieuAo(don) {

}

const laDonDaHuy = () => donHienTai && donHienTai.TRANG_THAI_XUONG === TRANG_THAI_DON_DA_HUY;

async function muaTrackingThuCongChiTiet(btn) {
  if (laDonDaHuy()) return hienThongBaoDonDaHuy([sttKey]);
  if (!confirm(`Mua tracking GKE thủ công cho đơn ${sttKey} ngay bây giờ? Đây là thao tác tạo vận đơn THẬT, có thể phát sinh chi phí.`)) return;

  const nhanGoc = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = icon('spinner', { className: 'icon-spin', size: 16 }) + ' Đang mua...';

  try {
    const ketQua = await apiFetch('/tracking/mua-thu-cong', { method: 'POST', body: JSON.stringify({ sttKeys: [sttKey] }) });
    if (ketQua.loi && ketQua.loi.length > 0) {
      const loiKhac = await tachVaBaoDonDaHuy(ketQua.loi);
      if (loiKhac.length) alert('Không mua được tracking: ' + loiKhac[0].lyDo);
      btn.disabled = false;
      btn.innerHTML = nhanGoc;
    } else {
      // Đẩy tracking sang Sheet khách hàng (bổ sung 21/09/2026, theo yêu cầu người dùng) — tracking
      // THẬT đã mua thành công, chỉ báo riêng nếu bước đồng bộ ra Sheet khách hàng thất bại.
      await baoLoiSheetSeller(ketQua.loiDaySheetKh);
      await taiChiTiet();
    }
  } catch (e) {
    alert(e.message);
    btn.disabled = false;
    btn.innerHTML = nhanGoc;
  }
}

async function xuLyInLabelChiTiet(btn, duongDan) {
  const nhanGoc = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = icon('spinner', { className: 'icon-spin', size: 16 }) + ' Đang xử lý...';

  try {
    const ketQua = await apiFetch(duongDan, { method: 'POST', body: JSON.stringify({ sttKeys: [sttKey] }) });
    if (ketQua.loi && ketQua.loi.length > 0) {
      const loiKhac = await tachVaBaoDonDaHuy(ketQua.loi);
      if (loiKhac.length) alert('Lỗi: ' + loiKhac[0].lyDo);
      btn.disabled = false;
      btn.innerHTML = nhanGoc;
      return;
    }
    if (ketQua.labelBase64) {
      const goiIn = moHopThoaiInPdf(ketQua.labelBase64);

    await baoLoiSheetSeller(ketQua.loiDaySheetKh);
    await taiChiTiet();
  } catch (e) {
    alert('Lỗi: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = nhanGoc;
  }
}

// Giống hệt inNhanh('don_can_in', ...) ở orders.html nhưng chỉ in đúng 1 đơn — dùng 'stt' (khớp
// chính xác STT_Key ở routes/reports.js locDon()) thay vì 'tuKhoa' (khớp chuỗi con, dễ dính nhầm
// đơn khác nếu STT_Key này là chuỗi con của 1 STT_Key khác).
async function inDonHang(btn) {
  const nhanGoc = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = icon('spinner', { className: 'icon-spin', size: 18 }) + ' Đang tạo file...';

  try {
    const res = await fetch('/api/reports/pdf?mau=don_can_in&stt=' + encodeURIComponent(sttKey), { credentials: 'include' });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Không xuất được file');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const contentDisposition = res.headers.get('Content-Disposition') || '';
    const khopTen = contentDisposition.match(/filename="([^"]+)"/);
    a.download = khopTen ? khopTen[1] : 'don-hang.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    // KHÔNG revoke ngay — cùng lỗi Safari iPad/iPhone đã sửa ở taiFileTuBlob() bên orders.html: Safari
    // tự mở tab mới trỏ tới blob: URL này (bất đồng bộ) thay vì tải file, revoke ngay khiến tab đó gặp
    // lỗi "Lỗi WebKitBlobResource 1" vì blob đã bị huỷ trước khi kịp đọc. Trễ 1 giây cho an toàn.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    alert('Lỗi: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = nhanGoc;
  }
}

async function taiAnh(moc) {
  const input = document.getElementById('anh-' + moc.replace(/_/g, '-'));
  if (!input.files[0]) return alert('Chưa chọn ảnh');

  // Nén ảnh trước khi upload (bổ sung 21/09/2026, theo yêu cầu người dùng — xem api.js#nenAnhTruocKhiTaiLen)
  // — cùng lý do đã áp dụng ở scan.html: ảnh camera gốc thường vài MB, nén trước giúp upload nhanh hơn.
  const fileDaNen = await nenAnhTruocKhiTaiLen(input.files[0]);

  const form = new FormData();
  form.append('photo', fileDaNen);
  form.append('sttKey', sttKey);
  form.append('moc', moc);

  try {
    const res = await fetch('/api/photos/upload', { method: 'POST', body: form, credentials: 'include' });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    alert('Đã tải ảnh lên!');
    await taiChiTiet();
  } catch (e) { alert(e.message); }
}
