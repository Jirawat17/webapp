<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chi tiết đơn hàng — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=112">
<script src="/js/theme.js?v=104"></script>
<style>
/* Ô "Nhập mã đơn" (04/10/2026, theo yêu cầu người dùng): gấp 3 cỡ cũ (160x21px, chữ 13,3px) cả rộng, cao, cỡ chữ; chữ gõ vào
   xanh dương đậm CỐ ĐỊNH (không dùng --color-primary vì mỗi máy tự chọn màu chủ đạo, có thể là cam/hồng); chữ gợi ý giữ
   xám thường; nút "Mở" cao bằng ô. Điện thoại: ô co vừa bề ngang trang (trừ lề .page 16px mỗi bên). */
#tim-ma-don { width: 480px; max-width: calc(100vw - 2 * var(--space-4)); height: 63px; font-size: 40px; font-weight: 700; color: #1d4ed8; }
#tim-ma-don::placeholder { color: #757575; font-weight: 400; opacity: 1; }
#tim-ma-don + button { height: 63px; }
/* Đơn HOLD: khối đầu trang có thêm lề trong 12px mỗi bên (style.css .dau-don.vong-hold) — trừ tiếp để ô không tràn ra ngoài vòng đỏ. */
.dau-don.vong-hold #tim-ma-don { max-width: calc(100vw - 2 * var(--space-4) - 24px); }
/* U2 Đối chiếu ảnh (11/10/2026): khung lưới 5 mục (Thiết kế, Mockup, File thêu, Đã sản xuất, Dán tem). 12/10/2026 (theo yêu cầu người dùng):
   ảnh to hơn 50% — cột tối thiểu 315px (~1,5 x cột cũ ~210px ở khung 1110px), cao tối đa 540px (cũ 360px); màn không đủ rộng cho 5 cột
   thì tự xuống hàng thay vì thu nhỏ ảnh (điện thoại: 1 cột). 12/10/2026 lần 2 (người dùng chốt): khung RỘNG HẾT màn hình (chừa lề 16px),
   cột giãn đều theo bề ngang (auto-fit — không để cột trống); mỗi ảnh cao tối đa bằng chiều cao màn hình trừ phần tiêu đề, để luôn thấy
   trọn 1 ảnh mà không phải cuộn. Nhiều ảnh thiết kế vẫn xếp dọc trong cột (cuộn khung để xem tiếp). */
#hop-doi-chieu { width: calc(100vw - 2 * var(--space-4)); max-width: none; max-height: calc(100vh - 2 * var(--space-4)); padding: var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); }
#hop-doi-chieu::backdrop { background: rgba(0, 0, 0, 0.55); }
.luoi-doi-chieu { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 315px), 1fr)); gap: var(--space-3); }
.luoi-doi-chieu h4 { margin: 0 0 6px; font-size: 0.95rem; }
.luoi-doi-chieu img { display: block; width: 100%; max-height: calc(100vh - 2 * var(--space-4) - 110px); object-fit: contain; background: #e4e4e7; border-radius: var(--radius-sm); margin-bottom: 6px; }
.luoi-doi-chieu .o-trong { padding: var(--space-4) 0; text-align: center; color: var(--color-text-muted); border: 1px dashed var(--color-border); border-radius: var(--radius-sm); }
</style>
</head>
<body>
<div id="nav"></div>
<div class="page" id="don-hang">
  <div class="skeleton-list"><div class="skeleton-card" style="height:220px"></div></div>
</div>

<script src="/js/icons.js?v=106"></script>
<script src="/js/api.js?v=129"></script>
<script>
const sttKey = new URLSearchParams(location.search).get('stt');
// Số ngày bỏ khỏi nhãn (bổ sung 23/09/2026, theo yêu cầu người dùng) — ngưỡng giờ chỉnh được ở
// settings.html (superadmin), số cứng không còn luôn đúng nên không hard-code vào nhãn hiển thị nữa.
// 07/10/2026: điều kiện từng mức chỉnh được ở Settings -> nhãn không ghi điều kiện cố định nữa.
const NHAN_CANH_BAO = { VANG: 'Cảnh báo Vàng', CAM: 'Cảnh báo Cam', DO: 'Cảnh báo Đỏ' };
// PHẢI khớp TINH_TRANG_VALUES trong data/pipelineTinhTrang.js
// (bổ sung 26/08/2026) Đơn "Đang chạy máy" nhưng không tra được người vận hành (vd sửa thẳng trên
// Sheet, log bị thiếu) — vẫn cho xem (an toàn hơn) nhưng cảnh báo TO, RÕ thay vì chỉ ghi "Không xác định".
const NHAN_NGUOI_VAN_HANH_KHONG_RO = 'ĐƠN SỬA TRONG GGSHEET, KHÔNG RÕ TÀI KHOẢN SẢN XUẤT NÀO ĐANG CHẠY';
const DANH_SACH_TINH_TRANG = [
  'Chưa in mã', 'Đã in mã', 'ĐÃ SẴN SÀNG CHẠY MÁY', 'Đang chạy máy', 'Đã sản xuất', 'LỖI SẢN XUẤT CẦN LÀM LẠI',
  'ĐÃ DÁN TEM', 'DELIVERED_Đã giao đến khách', 'CANCELLED_Đã hủy', 'REFUNDED_Hoàn đơn',
];

// Format timestamp ngắn gọn "DD-MM HH:mm:ss" — nhất quán với backend dinhDangNgayGioNgan()
// Không dùng toLocaleString('vi-VN') vì output phụ thuộc cài đặt trình duyệt và dài hơn cần thiết
function tsDep(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d)) return isoStr; // fallback: hiện nguyên chuỗi gốc
  const fmt = (n) => String(n).padStart(2, '0');
  // Chuyển sang giờ GMT+7 Việt Nam
  const vn = new Date(d.toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh' }));
  return `${fmt(vn.getDate())}-${fmt(vn.getMonth()+1)} ${fmt(vn.getHours())}:${fmt(vn.getMinutes())}:${fmt(vn.getSeconds())}`;
}

let user;
let donHienTai = null; // đơn đang xem (lần tải gần nhất) — nút mua tracking kiểm tra đơn đã huỷ trước khi hỏi xác nhận
let dsSanXuatDangHoatDong = []; // chỉ admin cần, nạp 1 lần lúc vào trang (xem renderKhuVucThaoTac)
let dsVeFileDangHoatDong = []; // chỉ admin cần, nạp 1 lần lúc vào trang (xem renderKhuVucThaoTac)

(async () => {
  user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'orders');

  // "Chỉ định người chạy máy" (bổ sung 07/09/2026, xem docs/superpowers/specs/2026-09-07-nguoi-chay-may-design.md)
  // + "Chỉ định người vẽ file" (bổ sung 09/09/2026, cùng khuôn — route POST /orders/chi-dinh-nguoi-ve-file
  // đã có sẵn từ trước) — CHỈ admin. /users vốn đã chỉ mở cho admin (requireRole trong routes/users.js).
  if (laAdmin(user.vaiTro)) {
    try {
      const dsNhanVien = await apiFetch('/users/tom-tat');
      dsSanXuatDangHoatDong = dsNhanVien.filter(u => u.VaiTro === 'san_xuat' && String(u.KichHoat).toUpperCase() === 'TRUE');
      dsVeFileDangHoatDong = dsNhanVien.filter(u => u.VaiTro === 've_file' && String(u.KichHoat).toUpperCase() === 'TRUE');
    } catch (e) { /* không tải được danh sách — ô chọn sẽ hiện rỗng, không chặn tải trang */ }
  }

  await taiChiTiet();
  oTimMaDonSanSang();
})();

// Địa chỉ giao hàng (02/10/2026, theo yêu cầu người dùng): **TEN** (đậm) · SDT, rồi DIA_CHI_TEN_DUONG, DIA_CHI_TEN_DUONG_2,
// DIA_CHI_TEN_TP, DIA_CHI_BANG, MA_ZIPCODE, DIA_CHI_NUOC — KHÔNG dùng TEN_DIA_CHI nữa (hàng "Người nhận" đã gộp vào đây).
// Trả HTML đã escape.
function dongDiaChi(don) {
  const nguoi = [don.TEN && `<strong>${escapeHtml(don.TEN)}</strong>`, don.SDT && escapeHtml(don.SDT)].filter(Boolean).join(' · ');
  const diaChi = [don.DIA_CHI_TEN_DUONG, don.DIA_CHI_TEN_DUONG_2, don.DIA_CHI_TEN_TP, don.DIA_CHI_BANG, don.MA_ZIPCODE, don.DIA_CHI_NUOC]
    .filter(Boolean).map(escapeHtml);
  const phan = [nguoi, ...diaChi].filter(Boolean);
  if (!phan.length) return '(chưa có địa chỉ)';
  // Sao chép: mỗi thông tin 1 dòng, đúng thứ tự trên nhãn gửi hàng (04/10/2026)
  const banChep = [don.TEN, don.SDT, don.DIA_CHI_TEN_DUONG, don.DIA_CHI_TEN_DUONG_2, don.DIA_CHI_TEN_TP, don.DIA_CHI_BANG, don.MA_ZIPCODE, don.DIA_CHI_NUOC]
    .filter(Boolean).join('\n');
  return phan.join(', ') + nutSaoChep(banChep, 'Sao chép địa chỉ');
}

// nguoi_san_xuat (bổ sung 12/09/2026, theo yêu cầu người dùng): chỉ hiện ĐÚNG 3 trường (Số lượng,
// Ngày lên đơn, Ghi chú — bôi đậm) thay vì đủ 14 trường như trước — hạn chế thông tin khách hàng/địa
// chỉ/tracking/IOSS... không cần thiết cho việc chạy máy, dễ gây nhiễu hoặc bỏ sót thông tin quan
// trọng. admin/ve_file vẫn thấy đủ như cũ.
// Ghi chú xưởng (28/09/2026): bản chính là cột GHI_CHU_XUONG trong Sheet Seller (app ghi ngược vào đó, đọc lại
// qua RAW -> Don_Hang_ALL). Bản lưu trong app (GHI_CHU_XUONG_NOI_BO) KHÁC bản Sheet = chưa ghi được sang Sheet
// hoặc Sheet chưa cập nhật lại -> hiện thêm 1 dòng màu cam để không ai tưởng đã có trên Sheet Seller.
// Bản trong app chỉ được ưu tiên hơn bản Sheet khi (a) lần ghi gần nhất sang Sheet BỊ LỖI, hoặc (b) vừa ghi thành
// công < 15 phút (IMPORTRANGE/QUERY chưa kịp cập nhật). Ngoài 2 trường hợp đó Sheet là bản chính — Seller có thể
// đã sửa cột Q SAU lần lưu gần nhất; điền bản app cũ vào ô sửa sẽ khiến bấm Lưu GHI ĐÈ mất ghi chú mới của Seller.
function trangThaiGhiChuXuong(don) {
  const noiBo = don.GHI_CHU_XUONG_NOI_BO || '';
  const sheet = don.GHI_CHU_XUONG || '';
  const gan = don.DongBoGhiChuXuong;
  if (!gan || noiBo === sheet) return { oSua: sheet, canhBao: '' };
  if (gan.KetQua === 'LOI') return { oSua: noiBo, canhBao: `CHƯA ghi được sang Sheet Seller — ${gan.LyDo}` };
  if (Date.now() - new Date(gan.ThoiGian).getTime() < 15 * 60 * 1000) {
    return { oSua: noiBo, canhBao: `Đã ghi sang Sheet Seller lúc ${tsDep(gan.ThoiGian)} — đang chờ Sheet cập nhật lại.` };
  }
  return { oSua: sheet, canhBao: '' };
}
function dongGhiChuNoiBo(don) {
  const { canhBao } = trangThaiGhiChuXuong(don);
  if (!canhBao) return '';
  return `<tr><td>Ghi chú xưởng<br><small>(bản lưu trong app)</small></td><td style="color:var(--color-warning-text)"><strong>${escapeHtml(don.GHI_CHU_XUONG_NOI_BO)}</strong><br><small>${escapeHtml(canhBao)}</small></td></tr>`;
}

// Ghi chú + Ghi chú xưởng luôn ở đầu bảng, in đậm cả tên trường lẫn giá trị (30/09/2026).
function dongGhiChu(don) {
  return `<tr><td><strong>Ghi chú</strong></td><td><strong>${escapeHtml(don.GHI_CHU || '')}</strong></td></tr>
    <tr><td><strong>Ghi chú xưởng</strong></td><td><strong>${escapeHtml(don.GHI_CHU_XUONG || '')}</strong></td></tr>
    ${dongGhiChuNoiBo(don)}
    ${dongSoMuiChi(don)}`;
}

// Số mũi chỉ (07/10/2026, theo yêu cầu người dùng) — 1 dòng ngay dưới "Ghi chú xưởng" trong bảng thông tin, ô nhập + Lưu ngay trong dòng.
// CHỈ admin/superadmin/ve_file (server routes/orders.js POST /:sttKey/so-mui-chi cũng chặn); vai trò khác không có dòng này.
function dongSoMuiChi(don) {
  if (!['admin', 'superadmin', 've_file'].includes(user.vaiTro)) return '';
  return `<tr><td><strong>Số mũi chỉ</strong></td><td>
      <form onsubmit="luuSoMuiChi(event)" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input type="text" id="so-mui-chi" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="Nhập số mũi chỉ..." aria-label="Số mũi chỉ"
          value="${escapeHtml(soMuiChiHienThi(don))}" style="width:160px;padding:6px 10px;border-radius:8px;border:1px solid var(--color-border);font:inherit;font-weight:700">
        <button type="submit" class="btn-hanh-dong phu">${icon('check')} Lưu</button>
      </form>
      <small id="so-mui-chi-tb" role="status" style="color:${don.SoMuiChiLoiSheet ? 'var(--color-danger-text)' : 'var(--color-text-muted)'}">${don.SoMuiChiLoiSheet ? CHUA_GHI_SHEET_SO_MUI : ''}</small>
    </td></tr>`;
}

function renderBangThongTin(don, viTri) {
  if (user.vaiTro === 'san_xuat') {
    return `
      ${dongGhiChu(don)}
      <tr><td><strong>Vị trí thêu</strong></td><td>${don.ViTriTheu?.length ? `<strong>${viTri}</strong>` : viTri}</td></tr>
      <tr><td>Số lượng</td><td>${escapeHtml(don.SO_LUONG || '')} ${don.SO_LUONG_AO_TREN_DON ? `(áo trên đơn: ${escapeHtml(don.SO_LUONG_AO_TREN_DON)})` : ''}</td></tr>
      <tr><td>Ngày lên đơn</td><td>${don.NGAY_LEN_DON ? dinhDangNgay(don.NGAY_LEN_DON) : ''}</td></tr>`;
  }
  return `
    ${dongGhiChu(don)}
    ${dongNhomNhieuAo(don.NhomNhieuAo)}
    <tr><td>Vị trí thêu</td><td>${viTri}</td></tr>
    <tr><td>Số lượng</td><td>${escapeHtml(don.SO_LUONG || '')} ${don.SO_LUONG_AO_TREN_DON ? `(áo trên đơn: ${escapeHtml(don.SO_LUONG_AO_TREN_DON)})` : ''}</td></tr>
    <tr><td>Ngày lên đơn</td><td>${don.NGAY_LEN_DON ? dinhDangNgay(don.NGAY_LEN_DON) : ''}</td></tr>
    <tr><td>Địa chỉ giao hàng</td><td>${dongDiaChi(don)}</td></tr>
    <tr><td>Hãng vận chuyển</td><td>${escapeHtml(don.HANG_VAN_CHUYEN || '')}</td></tr>
    <tr><td>Mã tracking</td><td>${escapeHtml(don.TRACKING_ID || '')}${don.TRACKING_ID ? nutSaoChep(don.TRACKING_ID, 'Sao chép mã tracking') : ''}${don.TRACKING_CHUNG_CUA ? ` <span style="color:var(--color-text-faint)">(dùng chung của ${escapeHtml(don.TRACKING_CHUNG_CUA)})</span>` : ''}${don.TRACKING_ID && don.NGUON_TRACKING === 'SELLER' ? ' <span style="color:var(--color-text-faint)">(Seller cung cấp — lấy từ TRACKING_ID2)</span>' : ''}</td></tr>
    ${don.BO_QUA_CANH_BAO_THU_CONG && user.vaiTro === 'superadmin' ? `
    <tr><td>Cảnh báo mua thủ công</td><td>Đã bỏ qua (${escapeHtml(String(don.BO_QUA_CANH_BAO_THU_CONG).split('|')[0])}, ${escapeHtml(String(don.BO_QUA_CANH_BAO_THU_CONG).split('|')[1] || '').slice(0, 16).replace('T', ' ')})
      <button type="button" class="btn-hanh-dong phu" style="padding:4px 10px;font-size:0.82rem" onclick='boQuaCanhBaoThuCong(this, ${escapeHtml(JSON.stringify(don.STT_Key))}, false)'>Hiện lại cảnh báo</button></td></tr>` : ''}
    <tr><td>Đã mua Tracking</td><td><strong>${escapeHtml(don.DA_MUA_TRACKING || '')}</strong> <span style="color:var(--color-text-faint)">— ${escapeHtml(don.LyDoDaMuaTracking || '')}</span></td></tr>
    <tr><td>Mã IOSS</td><td>${escapeHtml(don.MA_IOSS || '')}</td></tr>
    ${don.TRACKING_ID && don.TRANG_THAI_TRACKING ? `
    <tr><td>Trạng thái vận chuyển</td><td>${escapeHtml(don.TRANG_THAI_TRACKING)}${don.THOI_GIAN_CAP_NHAT_TRACKING ? ` <span style="color:var(--color-text-faint)">(cập nhật ${escapeHtml(don.THOI_GIAN_CAP_NHAT_TRACKING)})</span>` : ''}</td></tr>` : ''}
    <tr><td>Mã đơn (sàn TMĐT)</td><td>${escapeHtml(don.MA_DON_HANG_ORDERID || '')}</td></tr>
    <tr><td>Xưởng</td><td>${escapeHtml(don.XUONG || '(chưa gán)')}</td></tr>
    <tr><td>Cập nhật lần cuối</td><td>${escapeHtml(don.NguoiCapNhatCuoi || '')}${don.ThoiGianCapNhatCuoi ? ' · ' + tsDep(don.ThoiGianCapNhatCuoi) : ''}</td></tr>`;
}

// DonNhieuAo (bổ sung 26/09/2026) — liệt kê cả nhóm (link từng đơn + trạng thái + tracking) và lỗi dữ
// liệu của nhóm, nếu có. Xem services/donNhieuAoService.js#tomTatChoDon.
function dongNhomNhieuAo(n) {
  if (!n) return '';
  const cacDon = n.thanhVien.map(t => `<div><a href="/order.html?stt=${encodeURIComponent(t.sttKey)}">${escapeHtml(t.sttKey)}</a>${t.sttKey === n.donMua ? ' <strong>(mua tracking)</strong>' : ''}${t.sttKey === n.donIn && n.donIn !== n.donMua ? ' <strong>(in label)</strong>' : ''} · ${escapeHtml(t.trangThai)}${t.trackingId ? ' · ' + escapeHtml(t.trackingId) : ''}</div>`).join('');
  const loi = [...n.loiChan, ...n.canhBao];
  return `<tr><td>Nhóm DonNhieuAo</td><td>${nhanNhomNhieuAo(n)}<div style="margin-top:6px">${cacDon}</div>${loi.length ? `<p style="margin:6px 0 0;color:var(--color-danger-text)">${loi.map(escapeHtml).join('<br>')}</p>` : ''}</td></tr>`;
}

// Ô "Nhập mã đơn" (04/10/2026, theo yêu cầu người dùng): gõ ĐÚNG mã (không phân biệt hoa/thường, "," = "." — 05/10/2026) + Enter -> mở chi tiết
// đơn đó; sai -> báo không tìm thấy. Server tra và trả mã gốc (routes/orders.js GET /tra-ma). Hiện cả khi đơn đang mở báo lỗi.
function htmlOTimMaDon() {
  return `<form onsubmit="moDonTheoMa(event)" style="display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap">
      <input type="search" id="tim-ma-don" placeholder="Nhập mã đơn..." aria-label="Mở chi tiết đơn theo mã" autocomplete="off" enterkeyhint="go">
      <button type="submit" class="btn-hanh-dong phu">Mở</button>
      <span id="loi-tim-ma-don" role="alert" style="color:var(--color-danger-text);font-size:0.85rem"></span>
    </form>`;
}
async function moDonTheoMa(e) {
  e.preventDefault();
  const o = document.getElementById('tim-ma-don'), loi = document.getElementById('loi-tim-ma-don');
  const ma = o.value.trim();
  loi.textContent = '';
  if (!ma) return;
  try {
    const { sttKey: maGoc } = await apiFetch('/orders/tra-ma?ma=' + encodeURIComponent(ma));
    location.href = '/order.html?stt=' + encodeURIComponent(maGoc);
  } catch (err) {
    loi.textContent = err.message;
    o.select();
  }
}
// Mở trang chi tiết đơn -> ô "Nhập mã đơn" trống, con trỏ sẵn trong ô để gõ mã tiếp (04/10/2026, theo yêu cầu người dùng).
// Chỉ lúc mở trang và khi quay lại bằng nút Back (trình duyệt có thể giữ mã cũ trong ô); thao tác trên đơn làm vẽ lại
// trang thì KHÔNG giật con trỏ về đây.
function oTimMaDonSanSang() {
  const o = document.getElementById('tim-ma-don');
  if (!o) return;
  o.value = '';
  document.getElementById('loi-tim-ma-don').textContent = ''; // Back về trang cũ: bỏ cả dòng báo lỗi cũ
  o.focus(); // để trình duyệt tự cuộn tới ô nếu đang khuất (Back về trang đã cuộn) — gõ/quét mã tiếp là thấy ngay
}
window.addEventListener('pageshow', e => { if (e.persisted) oTimMaDonSanSang(); });

async function taiChiTiet() {
  let don;

// U2 Đối chiếu ảnh (11/10/2026, theo yêu cầu người dùng — spec 2026-10-04-21-tinh-nang-design.md mục 11): xem cạnh nhau mọi ảnh của
// đơn. Không thêm API: ảnh đi qua proxy sẵn có (kiểm quyền như cũ). Thiết kế: ảnh thu nhỏ trong thư viện Tìm ảnh (tối đa 6, chỉ
// vai trò dùng thư viện) nếu có, không thì DUONG_DAN_URL qua anh-ngoai. nguoi_lay_phoi thấy ảnh thiết kế/mockup nhưng KHÔNG có
// link mở bản gốc (giữ quy tắc hiện có). Bấm ảnh = mở bản gốc ở tab mới.
async function moDoiChieuAnh(nut) {
  const don = donHienTai;
  if (!don) return;
  const duocMoGocThietKe = user.vaiTro !== 'nguoi_lay_phoi';
  const tuLink = (url, moGoc = true) => urlAnhHienThiList(url, 800).map(src => ({ src, goc: moGoc ? urlAnToan(url) : '' }));
  let thietKe = tuLink(don.DUONG_DAN_URL, duocMoGocThietKe);
  if (['ve_file', 'admin', 'superadmin'].includes(user.vaiTro)) {
    nut.disabled = true;
    try {
      const d = await apiFetch('/thu-vien/don/' + encodeURIComponent(don.STT_Key) + '?chiFile=1');
      const png = d.png.filter(f => f.coThumb).slice(0, 6);
      if (png.length) thietKe = png.map(f => ({ src: '/api/thu-vien/thumb/' + f.id, goc: '/api/thu-vien/file/' + f.id }));
    } catch (e) { /* thư viện lỗi -> dùng link Sheet */ }
    nut.disabled = false;
  }
  const cot = [
    ['Thiết kế', thietKe],
    ['Mockup', tuLink(don.MOCKUP, duocMoGocThietKe)],
    ['File thêu', [don.Anh_File_Theu_URL, don.Anh_File_Theu_URL_2, don.Anh_File_Theu_URL_3].flatMap(u => tuLink(u))],
    ['Đã sản xuất', [don.Anh_Da_San_Xuat_URL, don.Anh_Da_San_Xuat_URL_2].flatMap(u => tuLink(u))],
    ['Đã dán tem / đóng gói', [don.Anh_Da_Dan_Tem_URL, don.Anh_Dong_Goi_URL].flatMap(u => tuLink(u))],
  ];
  const anh = a => {
    const img = `<img src="${escapeHtml(a.src)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;o-trong&quot;>Không tải được ảnh</div>'">`;
    return a.goc ? `<a href="${escapeHtml(a.goc)}" target="_blank" rel="noopener">${img}</a>` : img;
  };
  let hop = document.getElementById('hop-doi-chieu');
  if (!hop) {
    hop = document.createElement('dialog');
    hop.id = 'hop-doi-chieu';
    // Bấm ra NGOÀI khung = đóng. Không so e.target === hop: bấm vào lề trong (padding) của khung cũng có target là hop.
    // Kéo chuột (vd bôi đen chữ) từ trong khung ra ngoài rồi thả cũng sinh "click" ngoài khung -> chỉ đóng khi lúc BẤM XUỐNG cũng ở ngoài.
    const ngoaiKhung = e => { const r = hop.getBoundingClientRect(); return e.target === hop && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom); };
    let bamXuongNgoai = false;
    hop.addEventListener('mousedown', e => { bamXuongNgoai = ngoaiKhung(e); });
    hop.addEventListener('click', e => { if (bamXuongNgoai && ngoaiKhung(e)) hop.close(); bamXuongNgoai = false; });
    document.body.appendChild(hop);
  }
  hop.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:var(--space-3)">
      <h3 style="margin:0">Đối chiếu ảnh · ${escapeHtml(don.STT_Key)}</h3>
      <button type="button" class="btn-hanh-dong phu" onclick="document.getElementById('hop-doi-chieu').close()">Đóng</button>
    </div>
    <div class="luoi-doi-chieu">
      ${cot.map(([ten, ds]) => `<div><h4>${ten}</h4>${ds.length ? ds.map(anh).join('') : '<div class="o-trong">Chưa có ảnh</div>'}</div>`).join('')}
    </div>`;
  hop.showModal();
}

// Khối "File EMB" (03/10/2026, thư viện "Tìm ảnh" — docs/superpowers/specs/2026-10-03-thu-vien-tim-anh-design.md mục 13).
// Ai xem được đơn đều thấy trạng thái; tải về / tải lên chỉ ve_file, admin, superadmin (server kiểm lại). Không gắn với đổi trạng thái.
async function taiKhoiEmb() {
  const el = document.getElementById('khu-vuc-emb');
  if (!el) return;
  let d;
  try { d = await apiFetch('/thu-vien/emb/' + encodeURIComponent(sttKey)); } catch (e) { el.innerHTML = ''; return; }
  const ngay = s => String(s || '').slice(0, 16).replace('T', ' ');
  // Đơn có thể có NHIỀU file EMB chính (tải lên cùng 1 lượt, 12/10/2026) — mỗi file 1 dòng, có nút Tải về/Download riêng.
  const ds = d.dsChinh || (d.chinh ? [d.chinh] : []);
  embChinhHienTai = ds;
  el.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:0.9rem">
    <span>${icon('file', {size:14})} <strong>File EMB:</strong>
      ${ds.length ? `<span style="color:var(--color-success-text);font-weight:700">ĐÃ CÓ${ds.length > 1 ? ` ${ds.length} file` : ''}</span>`
        : '<span style="color:var(--color-danger-text);font-weight:700">Chưa tìm thấy file EMB liên kết</span>'}</span>
    ${ds.map(c => `<span>${escapeHtml(c.ten)} · phiên bản ${c.so_thu_tu} · ${escapeHtml(ngay(c.ngay_luu))}${c.nguoi_tai_len ? ' · ' + escapeHtml(c.nguoi_tai_len) : ''}
      ${d.duocTai ? ` · <a href="/api/thu-vien/file/${c.id}?tai=1">${icon('download', {size:14})} Tải về/Download</a>` : ''}</span>`).join('')}
    ${d.duocTaiLen ? `<button type="button" class="btn-hanh-dong phu" onclick="document.getElementById('chon-emb').click()" title="Chọn 1 hoặc nhiều file .emb (giữ Ctrl để chọn nhiều)">${icon('upload', {size:14})} Tải lên/Upload</button>
      <input type="file" id="chon-emb" accept=".emb" multiple hidden onchange="taiLenEmb(this)">
      <input type="file" id="chon-emb-thu-muc" webkitdirectory multiple hidden onchange="taiLenEmb(this)">
      <a href="javascript:void(0)" onclick="document.getElementById('chon-emb-thu-muc').click()">Chọn cả thư mục</a>
      <a href="/tim-anh.html#ta-tai-len">${icon('upload', {size:14})} Tải lên/Upload nhiều đơn</a>
      <a href="/tim-anh.html?stt=${encodeURIComponent(sttKey)}">Tìm thiết kế tương tự</a>` : ''}
    ${d.cu.length && d.duocTai ? `<span style="color:var(--color-text-muted)">Bản cũ (Tải về/Download): ${d.cu.map(x => `<a href="/api/thu-vien/file/${x.id}?tai=1" title="${escapeHtml(x.ten)}">v${x.so_thu_tu}</a> (${escapeHtml(ngay(x.ngay_luu))})`).join(', ')}</span>` : ''}
  </div>`;
  // A1 (11/10/2026): đơn chưa có EMB mà có gợi ý "Có EMB sẵn" -> hiện ngay dưới (chỉ vai trò dùng thư viện).
  if (!ds.length && d.duocTaiLen) {
    const ma = (donHienTai && donHienTai.STT_Key) || sttKey;
    try {
      const kq = await apiFetch('/thu-vien/tom-tat-don', { method: 'POST', body: JSON.stringify({ keys: [ma] }) });
      if (kq[ma]) el.insertAdjacentHTML('beforeend', htmlGoiYEmb(ma, kq[ma].goiY));
    } catch (e) { /* không có gợi ý cũng không sao */ }
  }
}

// Tải lên EMB (12/10/2026, theo yêu cầu người dùng): chọn 1 file -> như cũ (tên file tuỳ ý). Chọn NHIỀU file hoặc cả thư mục ->
// chỉ nhận file .emb có TÊN FILE khớp đúng mã đơn này (khớp ở server, cùng quy tắc menu Tìm ảnh), các file khác bỏ qua + báo
// danh sách; các file nhận cùng thành file chính của đơn (1 lượt — lượt EMB đang có thành bản cũ, không xoá).
let embChinhHienTai = []; // các file EMB chính đang hiện (taiKhoiEmb) — để câu xác nhận tải 1 file nói đúng điều sẽ xảy ra
async function taiLenEmb(input) {
  const files = [...input.files];
  const laThuMuc = input.id === 'chon-emb-thu-muc';
  input.value = '';
  if (!files.length) return;
  if (files.length > 1 || laThuMuc) return taiLenNhieuEmb(files);
  const f = files[0];
  if (!/\.emb$/i.test(f.name)) { await hopThongBao('Chỉ nhận file .emb'); return; }
  if (f.size > 30 * 1048576) { await hopThongBao('File quá lớn (tối đa 30MB).'); return; }
  // Đọc lại bộ file chính NGAY trước khi hỏi (người khác có thể vừa đổi bộ sau khi trang mở); lỗi thì dùng bản đang hiện.
  try { const d = await apiFetch('/thu-vien/emb/' + encodeURIComponent(sttKey)); embChinhHienTai = d.dsChinh || []; } catch (e) { /* dùng bản đang hiện */ }
  const ss = s => String(s || '').normalize('NFC').trim().toLowerCase(); // cùng cách so tên với server (xuLyService#tenSoSanh)
  const n = embChinhHienTai.length, dsCungTen = embChinhHienTai.filter(c => ss(c.ten) === ss(f.name)), cungTen = dsCungTen[0];
  if (n >= 2 && dsCungTen.length >= 2) { // cùng quy tắc với server (xuLyService#luuEmb) — không biết thay file nào
    await hopThongBao(`Bộ file chính của đơn ${sttKey} đang có ${dsCungTen.length} file cùng tên "${f.name}" — không biết thay file nào. Tải lại CẢ BỘ (chọn nhiều file cùng lúc) để thay.`);
    return;
  }
  if (!await hopXacNhan(n >= 2
    ? `Đơn ${sttKey} đang có ${n} file EMB chính. "${f.name}" sẽ ${cungTen ? `THAY file cùng tên "${cungTen.ten}" (file đó thành bản cũ)` : 'được THÊM vào bộ'}; các file chính khác giữ nguyên.`
    : `Tải "${f.name}" lên làm file EMB của đơn ${sttKey}? Bản EMB cũ (nếu có) vẫn được giữ lại.`)) return;
  const gui = xacNhan => {
    const fd = new FormData();
    fd.append('file', f, f.name);
    if (xacNhan) fd.append('xacNhanNgoaiSheet', '1');
    return apiFetch('/thu-vien/emb/' + encodeURIComponent(sttKey), { method: 'POST', body: fd, headers: {} });
  };
  try {
    let kq = await gui(false);
    // mã chưa có trong Sheet lẫn thư viện (hoặc không đọc được Sheet) -> server hỏi lại trước khi lưu
    if (kq.ketQua === 'CAN_XAC_NHAN') {
      if (!await hopXacNhan(`${kq.lyDo} Vẫn lưu file EMB vào đơn ${sttKey}?`)) return;
      kq = await gui(true);
    }
    await hopThongBao(kq.ketQua === 'DA_LUU' ? (kq.lyDo || 'Đã lưu file EMB.') : (kq.lyDo || 'Không lưu.'));
  } catch (e) { await hopThongBao('Tải lên EMB lỗi: ' + e.message); }
  taiKhoiEmb();
}

async function taiLenNhieuEmb(files) {
  const ma = (donHienTai && donHienTai.STT_Key) || sttKey;
  const dsEmb = files.filter(f => /\.emb$/i.test(f.name));
  if (!dsEmb.length) { await hopThongBao('Không có file .emb nào trong các file đã chọn.'); return; }
  if (dsEmb.length > 500) { await hopThongBao('Tối đa 500 file .emb mỗi lần.'); return; }
  let khop;
  try { // chỉ gửi TÊN file (không gửi thư mục) — đúng quy tắc "tên file chứa mã đơn"
    khop = await apiFetch('/thu-vien/xem-truoc', { method: 'POST', body: JSON.stringify({ files: dsEmb.map(f => ({ ten: f.name, duongDan: f.name, kichThuoc: f.size })) }) });
  } catch (e) { await hopThongBao('Không kiểm tra được tên file: ' + e.message); return; }
  const nhan = [], boQua = [], nhieuMa = [];
  const GHI_CHU_BO_QUA = { QUA_LON: ' (quá 30MB)', KHONG_QUYEN: ' (mã đơn ngoài phạm vi Xưởng của bạn)', KHOP: ' (mang mã đơn khác)', TRUNG: ' (mang mã đơn khác)' };
  dsEmb.forEach((f, i) => {
    const k = khop.ketQua[i] || {};
    if (k.sttKey === ma && (k.trangThai === 'KHOP' || k.trangThai === 'TRUNG')) nhan.push(f);
    else if (k.trangThai === 'NHIEU') nhieuMa.push(f.name); // tên khớp nhiều mã đơn — không đoán, báo đổi tên cho rõ
    else boQua.push(f.name + (GHI_CHU_BO_QUA[k.trangThai] || ''));
  });
  const soKhongPhaiEmb = files.length - dsEmb.length;
  const dongBoQua = (boQua.length ? `\n\nBỏ qua ${boQua.length} file không mang mã ${ma}: ${boQua.slice(0, 15).join(', ')}${boQua.length > 15 ? ', …' : ''}` : '')
    + (nhieuMa.length ? `\n\nBỏ qua ${nhieuMa.length} file có tên khớp NHIỀU mã đơn (đổi tên file cho rõ mã rồi chọn lại): ${nhieuMa.slice(0, 15).join(', ')}${nhieuMa.length > 15 ? ', …' : ''}` : '');
  if (!nhan.length) { await hopThongBao(`Không có file .emb nào có tên chứa mã đơn ${ma}.${dongBoQua}`); return; }
  if (!await hopXacNhan(`Tải lên ${nhan.length} file EMB vào đơn ${ma}: ${nhan.map(f => f.name).join(', ')}.\n`
    + `${nhan.length > 1 ? 'Các file này cùng là file chính của đơn; ' : ''}EMB đang có (nếu có) chuyển thành bản cũ, không bị xoá.${dongBoQua}`
    + `${soKhongPhaiEmb ? `\n(${soKhongPhaiEmb} file không phải .emb cũng bỏ qua.)` : ''}`)) return;
  const loTai = nhan.length > 1 ? 'emb' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8) : '';
  const ketQua = [];
  let xacNhan = false, coLoi = false;
  for (const f of nhan) {
    const gui = () => {
      const fd = new FormData();
      fd.append('file', f, f.name);
      if (loTai) fd.append('loTai', loTai);
      if (xacNhan) fd.append('xacNhanNgoaiSheet', '1');
      return apiFetch('/thu-vien/emb/' + encodeURIComponent(sttKey), { method: 'POST', body: fd, headers: {} });
    };
    try {
      let kq = await gui();
      if (kq.ketQua === 'CAN_XAC_NHAN') {
        if (!await hopXacNhan(`${kq.lyDo} Vẫn lưu file EMB vào đơn ${ma}?`)) break;
        xacNhan = true;
        kq = await gui();
      }
      ketQua.push(`${f.name}: ${kq.ketQua === 'DA_LUU' ? 'đã lưu' : (kq.lyDo || 'không lưu')}`);
    } catch (e) { coLoi = true; ketQua.push(`${f.name}: LỖI — ${e.message}`); }
  }
  // Lượt nhiều file lỗi giữa chừng: bộ file chính của đơn đang THIẾU (bộ cũ đã thành bản cũ) — báo rõ cách sửa.
  await hopThongBao(`Kết quả tải lên EMB đơn ${ma}:\n${ketQua.join('\n')}`
    + (coLoi && loTai ? `\n\n⚠ BỘ FILE CHÍNH CHƯA ĐỦ — chọn lại TOÀN BỘ ${nhan.length} file và tải lên lần nữa (file đã lưu được dùng lại, không lưu trùng).` : ''));
  taiKhoiEmb();
}

  select.classList.toggle('chon-trang-thai-tich-cuc', laTichCuc);

  // Nút BÁO LỖI cho san_xuat (29/09/2026, theo yêu cầu người dùng — hạn chế bấm nhầm): CUỐI trang, cỡ nút thường
  // (không còn nút lớn), bấm phải nhập mật khẩu xác nhận (kiểm tra ở server, xem bamNutTrangThai).
  if (don.TRANG_THAI_XUONG === 'Đang chạy máy' && user.vaiTro === 'san_xuat') {
    html += `<div style="margin-top:var(--space-6);padding-top:var(--space-4);border-top:1px dashed var(--color-border);text-align:center">
      <button type="button" class="btn-hanh-dong phu nguy-hiem" onclick="bamNutTrangThai('BAO_LOI_SAN_XUAT', this)">${icon('alert', { size: 16 })} Báo lỗi sản xuất – cần làm lại</button>
    </div>`;
  }

  el.innerHTML = html;
  if (document.getElementById('sua-tinh-trang')) { // khối "Sửa trạng thái thủ công" chỉ có với admin/superadmin
    canhBaoToHopSai();
    capNhatMauChonTrangThai(document.getElementById('sua-phoi'));
    capNhatMauChonTrangThai(document.getElementById('sua-ve-file'));
  }
}

// Cảnh báo TRƯỚC khi lưu, ngay khi người dùng đổi 1 trong 3 dropdown — soi gương lại đúng 2 quy tắc
// trong services/orderService.js (kiemTraTinhHopLy) để người dùng thấy lỗi ngay, không phải bấm Lưu
// mới biết bị từ chối. Đây CHỈ là gợi ý trên giao diện — server vẫn kiểm tra lại đầy đủ (không thể
// bỏ qua bằng cách sửa JS trên trình duyệt), đây không phải là chốt bảo mật.
function loiToHopTrangThai(tinhTrang, phoi, veFile) {
  // Vẽ file độc lập với in mã; chỉ chặn khi CHÍNH lần lưu này tạo ra "Chưa in mã + Đã lấy phôi" (đơn cũ lỡ lấy phôi
  // trước khi in mã vẫn lưu được thay đổi khác) — cùng quy tắc với kiemTraTinhHopLy (28/09/2026).
  const truoc = donHienTai || {};
  if (tinhTrang === 'Chưa in mã' && phoi === 'Đã lấy phôi' &&
      (truoc.TRANG_THAI_PHOI !== 'Đã lấy phôi' || truoc.TRANG_THAI_XUONG !== 'Chưa in mã')) {
    return 'Đơn đang "Chưa in mã" thì chưa thể "Đã lấy phôi" — in mã đơn trước.';
  }
  // Cùng danh sách với THU_TU_TINH_TRANG trong data/pipelineTinhTrang.js (bỏ 2 bước đầu "Chưa/Đã in
  // mã", xử lý riêng ở trên) — sửa 1 chỗ thì nhớ sửa chỗ kia. Đã bỏ "Đã đóng gói", thêm "ĐÃ DÁN TEM"
  // (09/09/2026 lần 3 — trước đó thiếu "ĐÃ DÁN TEM" trong danh sách này, 1 lỗ hổng cảnh báo có sẵn từ
  // trước, tiện sửa luôn).
  const CAC_TRANG_THAI_TU_SAN_SANG_TRO_DI = [
    'ĐÃ SẴN SÀNG CHẠY MÁY', 'Đang chạy máy', 'Đã sản xuất', 'ĐÃ DÁN TEM',
    'DELIVERED_Đã giao đến khách',
  ];
  if (CAC_TRANG_THAI_TU_SAN_SANG_TRO_DI.includes(tinhTrang)) {
    if (phoi !== 'Đã lấy phôi') return `Đang ở "${tinhTrang}" nhưng phôi vẫn "${phoi}" — phải có đủ phôi mới tới được giai đoạn này.`;
    if (veFile !== 'Đã vẽ file') return `Đang ở "${tinhTrang}" nhưng file vẽ vẫn "${veFile}" — phải vẽ xong file mới tới được giai đoạn này.`;
  }
  return null;
}

function canhBaoToHopSai() {
  const tinhTrang = document.getElementById('sua-tinh-trang').value;
  const phoi = document.getElementById('sua-phoi').value;
  const veFile = document.getElementById('sua-ve-file').value;
  const loi = loiToHopTrangThai(tinhTrang, phoi, veFile);

  const khu = document.getElementById('canh-bao-to-hop');
  const nutLuu = document.getElementById('nut-luu-trang-thai');
  if (loi) {
    khu.innerHTML = `<p style="margin:0;font-size:0.85rem;color:var(--color-danger-text);background:var(--color-danger-bg);padding:8px 10px;border-radius:6px">${icon('alert', {size:14})} ${escapeHtml(loi)}</p>`;
    nutLuu.disabled = true;
  } else {
    khu.innerHTML = '';
    nutLuu.disabled = false;
  }
}

async function luuTrangThaiThuCong() {
  const updates = {
    TRANG_THAI_XUONG: document.getElementById('sua-tinh-trang').value,
    TRANG_THAI_PHOI: document.getElementById('sua-phoi').value,

  };
  try {
    await apiFetch('/orders/' + encodeURIComponent(sttKey), { method: 'PUT', body: JSON.stringify(updates) });
    await taiChiTiet();

}

async function apDungChiDinhNguoiChayMayChiTiet(btn) {

function laDonConNhieuAo(don) {
  return !!don.NhomNhieuAo && !don.NhomNhieuAo.laDonMua;
}

const laDonDaHuy = () => donHienTai && donHienTai.TRANG_THAI_XUONG === TRANG_THAI_DON_DA_HUY;

async function muaTrackingThuCongChiTiet(btn) {
  if (laDonDaHuy()) return hienThongBaoDonDaHuy([sttKey]);
  if (!await hopXacNhan(`Mua tracking GKE thủ công cho đơn ${sttKey} ngay bây giờ? Đây là thao tác tạo vận đơn THẬT, có thể phát sinh chi phí.`)) return;

  const nhanGoc = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = icon('spinner', { className: 'icon-spin', size: 16 }) + ' Đang mua...';

  try {
    const ketQua = await apiFetch('/tracking/mua-thu-cong', { method: 'POST', body: JSON.stringify({ sttKeys: [sttKey] }) });
    if (ketQua.loi && ketQua.loi.length > 0) {
      const loiKhac = await tachVaBaoDonDaHuy(ketQua.loi);
      if (loiKhac.length) await hopThongBao('Không mua được tracking: ' + loiKhac[0].lyDo);
      btn.disabled = false;
      btn.innerHTML = nhanGoc;
    } else {
      // Đẩy tracking sang Sheet khách hàng (bổ sung 21/09/2026, theo yêu cầu người dùng) — tracking
      // THẬT đã mua thành công, chỉ báo riêng nếu bước đồng bộ ra Sheet khách hàng thất bại.
      await baoLoiSheetSeller(ketQua.loiDaySheetKh);
      await taiChiTiet();
    }
  } catch (e) {
    await hopThongBao(e.message);
    btn.disabled = false;
    btn.innerHTML = nhanGoc;
  }
}

// "IN LABEL"/"MUA TRACKING và IN LABEL" (bổ sung 09/09/2026 lần 2, theo yêu cầu người dùng) — 1 đơn

// ---- Khối "Vận chuyển (KL)" (22/10/2026, theo yêu cầu người dùng — services/trackingKlService.js) ----
// Quyền giống GKE: "Mua Tracking KL ngay" chỉ admin/superadmin (máy chủ cũng chặn); "Mua Tracking KL và In Label KL" admin/superadmin/ve_file.
// 1 đơn chỉ 1 tracking: đơn đã có tracking hãng khác (GKE / Seller) không mua KL.
function htmlKhoiKl(don) {
  const laKl = don.DON_VI_VAN_CHUYEN === 'KL';
  const nhom = don.NhomNhieuAo;
  let nd = '';
  if (don.TRACKING_ID && laKl) {
    const phi = [don.KL_PHI_USD ? `$${don.KL_PHI_USD}` : '', don.KL_PHI_VND ? `${Number(don.KL_PHI_VND).toLocaleString('vi-VN')}₫` : ''].filter(Boolean).join(' · ');
    nd = `<p style="margin:0 0 8px">Tracking KL: <strong>${escapeHtml(don.TRACKING_ID)}</strong>${nutSaoChep(don.TRACKING_ID, 'Sao chép mã tracking')}`
      + `${don.HANG_VAN_CHUYEN ? ` (${escapeHtml(don.HANG_VAN_CHUYEN)})` : ''}${phi ? ` · Phí: ${escapeHtml(phi)}` : ''}${don.TRACKING_CHUNG_CUA ? ` <span style="color:var(--color-text-faint)">(dùng chung của ${escapeHtml(don.TRACKING_CHUNG_CUA)})</span>` : ''}</p>`;
    nd += nhom && !nhom.laDonIn
      ? `<p style="margin:0;font-size:0.85rem">Cả nhóm DonNhieuAo ${escapeHtml(nhom.goc)} dùng 1 tem — in label KL ở đơn <strong>${escapeHtml(nhom.donIn || '(chưa xác định)')}</strong>.</p>`
      : `<div class="hang-nut"><button class="btn-hanh-dong" onclick="apDungMuaVaInLabelKl(this)">${icon('printer')} In Label KL</button></div>`;
  } else if (don.TRACKING_ID) {
    nd = `<p style="margin:0;font-size:0.85rem">Đơn đã có tracking <strong>${escapeHtml(don.TRACKING_ID)}</strong> (${don.NGUON_TRACKING === 'SELLER' ? 'Seller cung cấp' : 'GKE'}) — không mua KL.</p>`;
  } else if (don.TAM_THOI === 'DANG_CHO_GKE_TAO_TEM') {
    nd = '<p style="margin:0;font-size:0.85rem">Đơn đã tạo vận đơn GKE (đang chờ tem GKE) — không mua KL.</p>';
  } else if (laDonConNhieuAo(don)) {
    nd = `<p style="margin:0;font-size:0.85rem">Đơn thuộc nhóm DonNhieuAo ${escapeHtml(nhom.goc)} — mua tracking ở đơn <strong>${escapeHtml(nhom.donMua || '(chưa xác định)')}</strong>, đơn này dùng chung.</p>`;
  } else {
    if (don.KL_DANG_TAO) {
      nd += '<p style="margin:0 0 8px;font-size:0.85rem;color:var(--color-warning-text)">Lần mua KL trước chưa nhận được kết quả từ KL. Bấm mua lại: app tra KL theo mã đơn trước — KHÔNG tạo đơn trùng.'
        + (user.vaiTro === 'superadmin' ? ` Muốn mua GKE thay: <button type="button" class="btn-hanh-dong phu" style="padding:4px 10px;font-size:0.82rem" onclick="boDauDangMuaKl(this)">Bỏ dấu đang mua KL</button>` : '')
        + '</p>';
    }
    nd += `<div class="hang-nut">
        ${laAdmin(user.vaiTro) ? `<button class="btn-hanh-dong phu" onclick="muaTrackingKlNgay(this)">${icon('package')} Mua Tracking KL ngay</button>` : ''}
        ${nhom && !nhom.laDonIn ? '' : `<button class="btn-hanh-dong" onclick="apDungMuaVaInLabelKl(this)">${icon('printer')} Mua Tracking KL và In Label KL</button>`}
      </div>`;
  }
  return `
      <div class="upload-box">
        <label>${icon('package', { size: 18 })} Vận chuyển (KL)</label>
        ${nd}
        ${chuThich('KL chỉ nhận đơn giao tới Mỹ (US)', 'Mua Tracking KL: tạo đơn vận chuyển THẬT bên KL (có thể phát sinh phí), lấy mã tracking. Mua và In Label: chỉ khi đơn "Đã sản xuất" / "ĐÃ DÁN TEM", mua (nếu chưa có) rồi in label KL. Tài khoản KL theo Xưởng chỉnh ở Settings.')}
      </div>`;
}

async function muaTrackingKlNgay(btn) {
  if (laDonDaHuy()) return hienThongBaoDonDaHuy([sttKey]);
  if (!await hopXacNhan(`Mua tracking KL cho đơn ${sttKey} ngay bây giờ? Đây là thao tác tạo đơn vận chuyển THẬT bên KL, có thể phát sinh phí.`)) return;
  const nhanGoc = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = icon('spinner', { className: 'icon-spin', size: 16 }) + ' Đang mua...';
  try {
    const kq = await apiFetch('/tracking/kl/mua', { method: 'POST', body: JSON.stringify({ sttKeys: [sttKey] }) });
    if (kq.loi && kq.loi.length) {
      const loiKhac = await tachVaBaoDonDaHuy(kq.loi);
      if (loiKhac.length) await hopThongBao('Không mua được tracking KL: ' + loiKhac[0].lyDo);
      btn.disabled = false;
      btn.innerHTML = nhanGoc;
      return;
    }
    const t = kq.thanhCong[0] || {};
    const phi = [t.phiUsd != null ? `$${t.phiUsd}` : '', t.phiVnd != null ? `${Number(t.phiVnd).toLocaleString('vi-VN')}₫` : ''].filter(Boolean).join(' · ');
    await hopThongBao(`Đã mua tracking KL: ${t.tracking}${t.hang ? ` (${t.hang})` : ''}${phi ? ` · phí ${phi}` : ''}`);
    await baoLoiSheetSeller(kq.loiDaySheetKh);
    await taiChiTiet();
  } catch (e) {
    await hopThongBao(e.message);
    btn.disabled = false;
    btn.innerHTML = nhanGoc;
  }
}

// Superadmin: bỏ dấu "đang mua KL" (máy chủ tra KL trước; không tra được thì hỏi xác nhận đã tự kiểm tra trên trang KL).
async function boDauDangMuaKl(btn) {
  if (!await hopXacNhan(`Bỏ dấu "đang mua KL" của đơn ${sttKey}? App tra KL theo mã đơn trước — chỉ bỏ khi KL không có đơn này.`)) return;
  btn.disabled = true;
  const gui = boQuaKiemTra => apiFetch('/tracking/kl/bo-dau', { method: 'POST', body: JSON.stringify({ sttKey, boQuaKiemTra }) });
  try {
    try {
      await gui(false);
    } catch (e) {
      if (!(e.duLieu && e.duLieu.maLoi === 'KHONG_TRA_DUOC_KL')) throw e;
      if (!await hopXacNhan(`${e.message}
Bạn ĐÃ tự kiểm tra trên trang KL và chắc chắn KHÔNG có đơn ${sttKey}? Bỏ dấu mà KL thật ra đã tạo đơn thì có thể bị mua 2 lần (KL + GKE).`)) { btn.disabled = false; return; }
      await gui(true);
    }
    await hopThongBao('Đã bỏ dấu đang mua KL — có thể mua GKE hoặc mua KL lại.');
    await taiChiTiet();
  } catch (e) {
    await hopThongBao(e.message);
    btn.disabled = false;
  }
}

async function apDungMuaVaInLabelKl(btn) {
  if (laDonDaHuy()) return hienThongBaoDonDaHuy([sttKey]);
  const daCo = donHienTai && donHienTai.TRACKING_ID && donHienTai.DON_VI_VAN_CHUYEN === 'KL';
  if (!await hopXacNhan(daCo ? `In label KL cho đơn ${sttKey}?` : `Mua tracking KL và in label cho đơn ${sttKey}? Tạo đơn vận chuyển THẬT bên KL, có thể phát sinh phí.`)) return;
  await xuLyInLabelChiTiet(btn, '/tracking/kl/mua-va-in-label');
}

async function xuLyInLabelChiTiet(btn, duongDan) {
  const nhanGoc = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = icon('spinner', { className: 'icon-spin', size: 16 }) + ' Đang xử lý...';

  try {
    const ketQua = await apiFetch(duongDan, { method: 'POST', body: JSON.stringify({ sttKeys: [sttKey] }) });
    if (ketQua.loi && ketQua.loi.length > 0) {
      const loiKhac = await tachVaBaoDonDaHuy(ketQua.loi);
      if (loiKhac.length) await hopThongBao('Lỗi: ' + loiKhac[0].lyDo);
      // KL (22/10/2026): đã mua tracking nhưng lấy label lỗi -> báo lỗi Sheet Seller (nếu có) + tải lại đơn để hiện tracking vừa mua.
      if (ketQua.loi.some(l => l.daMua)) {
        await baoLoiSheetSeller(ketQua.loiDaySheetKh);
        await taiChiTiet();
        return;
      }
      btn.disabled = false;
      btn.innerHTML = nhanGoc;
      return;
    }
    if (ketQua.labelBase64) {
      const goiIn = moHopThoaiInPdf(ketQua.labelBase64);
      if (goiIn) goiIn();
    }
    await baoLoiSheetSeller(ketQua.loiDaySheetKh);
    await taiChiTiet();
  } catch (e) {
    await hopThongBao('Lỗi: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = nhanGoc;
  }
}

async function chuyenGiaiDoan(scenarioId, btn) {

  try {
    await apiFetch(`/qr/kich-ban/${scenarioId}/quet`, { method: 'POST', body: JSON.stringify({ sttKey }) });
    await taiChiTiet();
  } catch (e) {
    await hopThongBao(e.message);
    btn.disabled = false;
  }
}

// Ghi chú xưởng (28/09/2026): server LUÔN lưu bản trong app rồi ghi vào ô GHI_CHU_XUONG của Sheet Seller
// (routes/orders.js POST /:sttKey/ghi-chu-xuong). Ghi Sheet lỗi -> hộp đỏ; nội dung vẫn còn trong ô (tải lại
// trang điền sẵn bản trong app) để sửa nguyên nhân rồi Lưu lại / superadmin Đẩy lại.
async function bamNutTrangThai(nut, btn) {
  let matKhau;
  if (nut === 'BAO_LOI_SAN_XUAT') {
    // san_xuat: nhập mật khẩu xác nhận (29/09/2026) — so ở SERVER (routes/orders.js), không lộ giá trị đúng ở đây.
    if (user.vaiTro === 'san_xuat') {
      matKhau = await hopNhap(`Báo lỗi sản xuất đơn ${sttKey}?\n"Đang chạy máy" → "LỖI SẢN XUẤT CẦN LÀM LẠI"\n\nNhập mật khẩu xác nhận:`);
      if (matKhau === null) return;
    } else if (!await hopXacNhan(`Báo lỗi sản xuất đơn ${sttKey}?\n\n"Đang chạy máy" → "LỖI SẢN XUẤT CẦN LÀM LẠI"`)) return;
  }
  btn.disabled = true;
  try {
    await apiFetch('/orders/' + encodeURIComponent(sttKey) + '/nut-trang-thai', { method: 'POST', body: JSON.stringify({ nut, matKhau }) });
  } catch (e) {
    await hopThongBao(e.message);
  }
  await taiChiTiet();
}

// Số mũi chỉ (07/10/2026): bản chính là ô GhiChuTinhGia trong Sheet Seller (đọc lại qua RAW -> Don_Hang_ALL, trễ vài phút). Vừa lưu
// xong (< 30 phút) mà Sheet chưa kịp đổi -> hiện bản trong app (SO_MUI_CHI_NOI_BO); sau đó luôn theo Sheet (ai sửa thẳng trên Sheet
// vẫn thấy đúng).
const SO_MUI_CHO_SHEET_MS = 30 * 60 * 1000;
// Lưu số mũi giờ báo "đã lưu" ngay, ghi Sheet Seller chạy nền (16/10/2026) — ghi lỗi thì báo ở đây (lúc mở đơn + ngay sau khi lưu).
const CHUA_GHI_SHEET_SO_MUI = 'Đã lưu trong app nhưng CHƯA ghi được vào Sheet Seller — đã báo superadmin (Trung tâm hành động → Đẩy lại).';
// Hỏi lại kết quả ghi Sheet chạy nền: mỗi 3 giây, tối đa 1 phút (Google quá tải có thể tự thử lại gần 2 phút), tới khi có lần ghi MỚI HƠN
// mốc lưu (luc, giờ VN do máy chủ trả) VÀ đúng số vừa lưu (lần ghi của lượt lưu TRƯỚC còn xếp hàng có thể xong sau mốc này). Lưu lượt mới
// -> vòng của lượt cũ tự dừng (_luotChoSoMui), không ghi đè dòng báo của lượt mới.
let _luotChoSoMui = 0;
async function choKetQuaGhiSheetSoMui(luc, soMui, tb, chuDaLuu) {
  const luot = _luotChoSoMui;
  const conLaLuotNay = () => luot === _luotChoSoMui && tb.isConnected; // đã lưu lượt khác / tải lại / rời trang -> dừng
  for (let lan = 0; lan < 20; lan++) {
    await new Promise(r => setTimeout(r, 3000));
    if (!conLaLuotNay()) return;
    let d = null;
    try { d = await apiFetch('/orders/' + encodeURIComponent(sttKey) + '/so-mui-chi/dong-bo'); } catch (e) { continue; }
    if (!conLaLuotNay()) return;
    if (!d || String(d.ThoiGian || '') < luc || String(d.GiaTriSau ?? '') !== soMui) continue;
    if (d.KetQua === 'OK') { tb.textContent = chuDaLuu + ' · đã ghi vào Sheet Seller.'; return; }
    tb.style.color = 'var(--color-danger-text)';
    tb.textContent = `${chuDaLuu}. ${CHUA_GHI_SHEET_SO_MUI}${d.LyDo ? ' Lý do: ' + d.LyDo : ''}`;
    return;
  }
  if (conLaLuotNay()) tb.textContent = chuDaLuu + ' · chưa có kết quả ghi Sheet Seller (Google đang chậm) — tải lại trang sau ít phút: nếu ghi lỗi sẽ hiện chữ đỏ ở đây.';
}
function soMuiChiHienThi(don) {
  return don.SoMuiChiNguyenVan || ''; // server tính (services/orderService.js#docSoMuiChi) — 1 quy tắc cho cả danh sách/bộ lọc
}
async function luuSoMuiChi(e) {
  e.preventDefault();
  const o = document.getElementById('so-mui-chi'), tb = document.getElementById('so-mui-chi-tb');
  const nhap = o.value.trim();
  if (nhap && !(/^\d+$/.test(nhap) && Number(nhap) >= 1 && Number(nhap) <= 1000000)) {
    tb.style.color = 'var(--color-danger-text)';
    tb.textContent = 'Số mũi chỉ phải là số nguyên từ 1 đến 1.000.000 (không chữ, không số âm, không số lẻ).';
    o.focus();
    return;
  }
  const nut = e.target.querySelector('button');
  nut.disabled = true;
  _luotChoSoMui++; // dừng vòng hỏi kết quả ghi Sheet của lượt lưu trước
  try {
    const kq = await apiFetch('/orders/' + encodeURIComponent(sttKey) + '/so-mui-chi', { method: 'POST', body: JSON.stringify({ soMui: nhap }) });
    donHienTai.SO_MUI_CHI_NOI_BO = kq.soMui;
    donHienTai.SO_MUI_CHI_LUC = new Date().toISOString();
    o.value = kq.soMui;
    tb.style.color = 'var(--color-success-text)';
    const chuDaLuu = kq.soMui ? `Đã lưu số mũi chỉ: ${Number(kq.soMui).toLocaleString('en-US')}` : 'Đã xoá số mũi chỉ';
    tb.textContent = chuDaLuu + ' · đang ghi vào Sheet Seller...';
    if (kq.luc) choKetQuaGhiSheetSoMui(kq.luc, String(kq.soMui ?? ''), tb, chuDaLuu);
  } catch (err) {
    tb.style.color = 'var(--color-danger-text)';
    tb.textContent = /Không thể lưu số mũi chỉ/.test(err.message || '') ? err.message : `Không thể lưu số mũi chỉ. Vui lòng thử lại. (${err.message})`;
  } finally {
    nut.disabled = false;
  }
}

async function luuGhiChu() {
  const ghiChu = document.getElementById('ghi-chu-moi').value;
  try {
    const kq = await apiFetch('/orders/' + encodeURIComponent(sttKey) + '/ghi-chu-xuong', { method: 'POST', body: JSON.stringify({ ghiChu }) });
    if (kq.sheet.ok) {
      await hopThongBao(`Đã lưu ghi chú vào Sheet Seller (tab "${kq.sheet.tab}", dòng ${kq.sheet.dong}). Ghi chú sẽ hiện lại ở đây sau khi Sheet cập nhật (vài giây tới vài phút).`);
    } else {
      await hienHopDo({
        tieuDe: ['CHƯA GHI ĐƯỢC GHI CHÚ', 'VÀO SHEET SELLER'],
        moTa: 'Ghi chú đã lưu trong app nhưng CHƯA có trên Sheet Seller. Đơn đã vào danh sách "Chưa ghi được sang Sheet Seller" (Trung tâm hành động / Settings). Lý do:',
        danhSach: [kq.sheet.lyDo],
      });
    }
    await taiChiTiet();
  } catch (e) { await hopThongBao(e.message); }
}

// Giống hệt inNhanh('don_can_in', ...) ở orders.html nhưng chỉ in đúng 1 đơn — dùng 'stt' (khớp
// chính xác STT_Key ở routes/reports.js locDon()) thay vì 'tuKhoa' (khớp chuỗi con, dễ dính nhầm
// đơn khác nếu STT_Key này là chuỗi con của 1 STT_Key khác).
async function inDonHang(btn) {
  const nhanGoc = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = icon('spinner', { className: 'icon-spin', size: 18 }) + ' Đang tạo file...';

  try {
    const res = await fetch('/api/reports/pdf?mau=don_can_in&stt=' + encodeURIComponent(sttKey), { credentials: 'include' });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Không xuất được file');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const contentDisposition = res.headers.get('Content-Disposition') || '';
    const khopTen = contentDisposition.match(/filename="([^"]+)"/);
    a.download = khopTen ? khopTen[1] : 'don-hang.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    // KHÔNG revoke ngay — cùng lỗi Safari iPad/iPhone đã sửa ở taiFileTuBlob() bên orders.html: Safari
    // tự mở tab mới trỏ tới blob: URL này (bất đồng bộ) thay vì tải file, revoke ngay khiến tab đó gặp
    // lỗi "Lỗi WebKitBlobResource 1" vì blob đã bị huỷ trước khi kịp đọc. Trễ 1 giây cho an toàn.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (e) {
    await hopThongBao('Lỗi: ' + e.message);
    return; // in lỗi -> KHÔNG đổi trạng thái
  } finally {
    btn.disabled = false;
    btn.innerHTML = nhanGoc;
  }
  // In xong -> "Chưa in mã" sang "Đã in mã" (07/10/2026, theo yêu cầu người dùng — giống nút IN ĐƠN ở Danh sách đơn hàng). Server
  // chỉ đổi khi đơn ĐANG "Chưa in mã" (chiKhiDangLa, đọc trạng thái mới nhất); đơn ở bước sau giữ nguyên.
  if (donHienTai && donHienTai.TRANG_THAI_XUONG === 'Chưa in mã') {
    try {
      const kq = await apiFetch('/orders/chuyen-trang-thai-hang-loat', {
        method: 'POST', body: JSON.stringify({ sttKeys: [sttKey], cot: 'TRANG_THAI_XUONG', trangThaiMoi: 'Đã in mã', chiKhiDangLa: 'Chưa in mã' }),
      });
      if (kq.loi.length) await hopThongBao(`Đã in xong nhưng CHƯA chuyển được "Đã in mã": ${kq.loi[0].lyDo}`);
    } catch (e) {
      await hopThongBao(`Đã in xong nhưng CHƯA chuyển được "Đã in mã": ${e.message}`);
    }
    await taiChiTiet();
  }
}

async function taiAnh(nut) {
  const moc = document.getElementById('loai-anh').value;
  const input = document.getElementById('anh-tai-len');
  if (!moc) return await hopThongBao('Chưa chọn loại ảnh');
  if (!input.files[0]) return await hopThongBao('Chưa chọn ảnh');
  // Ảnh đã sản xuất: 1 hoặc 2 ảnh cùng lúc (14/10/2026, theo yêu cầu người dùng); loại khác 1 ảnh.
  const toiDa = moc === 'da_san_xuat' ? 2 : 1;
  if (input.files.length > toiDa) return await hopThongBao(`Chỉ chọn tối đa ${toiDa} ảnh cho loại này (đang chọn ${input.files.length}).`);
  if (nut.disabled) return; // chặn bấm 2 lần khi đang tải (ảnh Đã sản xuất / ĐÃ DÁN TEM tự chuyển trạng thái)
  // Thay ảnh đã sản xuất (14/10/2026, theo yêu cầu người dùng — chỉ ở đây, chỉ admin, đơn đang "Đã sản xuất"): thay CẢ lượt ảnh cũ.
  const thay = moc === 'da_san_xuat' && donHienTai && donHienTai.TRANG_THAI_XUONG === 'Đã sản xuất';
  if (thay && !await hopXacNhan(`Đơn đã ở "Đã sản xuất". THAY toàn bộ ảnh đã sản xuất hiện có bằng ${input.files.length} ảnh mới?`
    + (input.files.length === 1 && donHienTai.Anh_Da_San_Xuat_URL_2 ? '\n(Đơn đang có 2 ảnh — ảnh thứ 2 cũ sẽ bị bỏ.)' : '')
    + '\nTrạng thái đơn không đổi; link ảnh cũ vẫn xem được trong lịch sử đơn.')) return;
  nut.disabled = true;
  try { await guiAnh(moc, [...input.files], thay); } finally { nut.disabled = false; }
}
let daBaoHeif = false; // cảnh báo ảnh HEIC 1 lần mỗi lần mở trang
async function guiAnh(moc, dsFile, thay = false) {
  // Ảnh đã sản xuất 2 ảnh: gửi ảnh 1 (chưa chuyển trạng thái) rồi ảnh 2 (chuyển "Đã sản xuất") — xem routes/photos.js#soAnhSanXuatLuotNay.
  let daLuu = 0;
  try {
    for (let i = 0; i < dsFile.length; i++) {
      // Nén ảnh trước khi upload (bổ sung 21/09/2026, theo yêu cầu người dùng — xem api.js#nenAnhTruocKhiTaiLen)
      // — cùng lý do đã áp dụng ở scan.html: ảnh camera gốc thường vài MB, nén trước giúp upload nhanh hơn.
      const thongSo = {};
      const fileDaNen = await nenAnhTruocKhiTaiLen(dsFile[i], { thongSo });
      if (laAnhHeif(thongSo.dauFile) && !daBaoHeif) { daBaoHeif = true; await hopThongBao(CANH_BAO_FILE_HEIF); } // file HEIC — nhắc chuyển JPG / tắt HEIC
      const form = new FormData();
      form.append('photo', fileDaNen);
      form.append('sttKey', sttKey);
      form.append('moc', moc);
      form.append('viTri', String(i + 1));
      form.append('xong', i === dsFile.length - 1 ? '1' : '0');
      if (thay) form.append('thay', '1');
      const res = await fetch('/api/photos/upload', { method: 'POST', body: form, credentials: 'include' });
      const data = await res.json();
      if (!res.ok) throw Object.assign(new Error(data.error), { trangThaiHienTai: data.trangThaiHienTai });
      daLuu++;
    }
    await hopThongBao(thay ? `Đã thay ${dsFile.length} ảnh đã sản xuất!` : dsFile.length > 1 ? `Đã tải ${dsFile.length} ảnh lên!` : 'Đã tải ảnh lên!');
  } catch (e) {
    // Trang mở lúc đơn còn "Đang chạy máy" nhưng đơn vừa được chụp xong ở nơi khác -> giờ là "thay ảnh": tải lại trang, bấm lại.
    if (!daLuu && !thay && moc === 'da_san_xuat' && e.trangThaiHienTai === 'Đã sản xuất') {
      await hopThongBao('Đơn vừa được chuyển sang "Đã sản xuất" (có người vừa chụp xong ảnh). Trang sẽ tải lại thông tin đơn — chọn lại ảnh rồi bấm "Tải ảnh lên" nếu muốn THAY ảnh đã sản xuất.');
    } else await hopThongBao(!daLuu ? e.message : thay ? `Đã thay ảnh 1 nhưng ảnh 2 lỗi: ${e.message}\nĐơn hiện chỉ còn 1 ảnh mới — chọn lại cả 2 ảnh rồi thay lại.`
      : `Đã lưu ảnh 1 nhưng ảnh 2 lỗi: ${e.message}\nĐơn CHƯA chuyển trạng thái — chọn lại cả 2 ảnh rồi tải lại.`);
  }
  await taiChiTiet();
}
