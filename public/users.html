<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhân viên — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=94">
<script src="/js/theme.js?v=94"></script>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Quản lý nhân viên</h2>
  <form id="form-them" class="inline-form">
    <div class="truong">
      <label for="ten-moi">Tên nhân viên</label>
      <input id="ten-moi" required>
    </div>
    <div class="truong">
      <label for="vaitro-moi">Vai trò</label>
      <select id="vaitro-moi">
        <option value="admin">Admin</option>
        <option value="superadmin">Superadmin</option>
        <option value="nguoi_lay_phoi">Người lấy phôi</option>
        <option value="ve_file">Vẽ file</option>
        <option value="san_xuat">Sản xuất</option>
      </select>
    </div>
    <div class="truong">
      <label for="team-moi">Team (nếu là Sản xuất)</label>
      <input id="team-moi">
    </div>
    <div class="truong">
      <label for="xuong-moi">Xưởng</label>
      <select id="xuong-moi">
        <option value="">(chưa gán)</option>
        <option value="HN">HN</option>
        <option value="BN">BN</option>
      </select>
    </div>
    <div class="truong">
      <label for="matkhau-moi">Mật khẩu (tối đa 4 số)</label>
      <input id="matkhau-moi" inputmode="numeric" pattern="[0-9]{1,4}" maxlength="4" required>
    </div>
    <button type="submit" class="btn-hanh-dong">Thêm nhân viên</button>
  </form>
  <table id="bang-nv" class="info-table"></table>
</div>

<script src="/js/icons.js?v=94"></script>
<script src="/js/api.js?v=94"></script>
<script>
(async () => {
  const user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'users');
  // CHỈ superadmin (bổ sung 18/09/2026, theo yêu cầu người dùng — thu hẹp từ admin+superadmin, KHÁC
  // mọi trang khác trong app vẫn coi admin/superadmin ngang quyền qua laAdmin()).
  if (user.vaiTro !== 'superadmin') {
    document.querySelector('.page').innerHTML = '<p>Bạn không có quyền truy cập trang này.</p>';
    return;
  }
  await taiDanhSach();
})();

// Xưởng vật lý (HN/BN — bổ sung 13/09/2026, theo yêu cầu người dùng, đổi tên từ HANOI/BACNINH cùng
// ngày) — PHẢI khớp ĐÚNG DANH_SACH_XUONG trong services/orderService.js (tự khai báo lại ở đây thay
// vì import, cùng cách public/order.html đang tự khai báo lại DANH_SACH_TINH_TRANG).
const DANH_SACH_XUONG = ['HN', 'BN'];

document.getElementById('form-them').onsubmit = async (e) => {
  e.preventDefault();
  const ten = document.getElementById('ten-moi').value.trim();
  const vaiTro = document.getElementById('vaitro-moi').value;
  const team = document.getElementById('team-moi').value.trim();
  const xuong = document.getElementById('xuong-moi').value;
  const matKhau = document.getElementById('matkhau-moi').value.trim();
  try {
    await apiFetch('/users', { method: 'POST', body: JSON.stringify({ ten, vaiTro, team, xuong, matKhau }) });
    e.target.reset();
    await taiDanhSach();
  } catch (err) { alert(err.message); }
};

// Dùng data-* + this.dataset (KHÔNG nội suy chuỗi thẳng vào onclick="...('...')", bổ sung 20/09/2026,
// phát hiện qua rà soát bảo mật — xem cùng khuôn public/don-hang-loat.html) — Ten là tên nhân viên tự
// do, encodeURIComponent() không escape dấu ' nên KHÔNG đủ an toàn khi nội suy vào JS string bên trong
// thuộc tính onclick (tên chứa dấu nháy đơn phá cú pháp, tên cố ý chèn mã là XSS thật). dataset lấy
// đúng chuỗi gốc đã escapeHtml() lúc ghi, không đi qua bước "biên dịch lại thành mã JS" nào nữa.
async function taiDanhSach() {
  const list = await apiFetch('/users');
  document.getElementById('bang-nv').innerHTML = `
    <tr><th>Tên</th><th>Vai trò</th><th>Team</th><th>Xưởng</th><th>Trạng thái</th><th>Mật khẩu</th><th>Đăng nhập</th><th></th><th></th><th></th><th></th><th></th></tr>
    ${list.map(u => `
      <tr>
        <td>${escapeHtml(u.Ten)}
          <button class="btn-hanh-dong phu" data-ten="${escapeHtml(u.Ten)}" onclick="doiTen(this.dataset.ten)">Đổi tên</button>
        </td>
        <td>
          <select data-ten="${escapeHtml(u.Ten)}" onchange="doiVaiTro(this.dataset.ten, this.value)">
            ${Object.keys(NHAN_VAI_TRO).map(vt => `<option value="${vt}" ${u.VaiTro === vt ? 'selected' : ''}>${NHAN_VAI_TRO[vt]}</option>`).join('')}
          </select>
        </td>
        <td>${escapeHtml(u.Team || '')}</td>
        <td>
          <select data-ten="${escapeHtml(u.Ten)}" onchange="doiXuong(this.dataset.ten, this.value)">
            <option value="" ${!u.Xuong ? 'selected' : ''}>(chưa gán)</option>
            ${DANH_SACH_XUONG.map(x => `<option value="${x}" ${u.Xuong === x ? 'selected' : ''}>${x}</option>`).join('')}
          </select>
        </td>
        <td>${String(u.KichHoat).toUpperCase() === 'TRUE' ? 'Đang hoạt động' : 'Đã khoá'}</td>
        <td>${u.MatKhau ? escapeHtml(u.MatKhau) : '(chưa đặt)'}</td>
        <td>${String(u.HienThiDangNhap).toUpperCase() === 'FALSE' ? 'Đã ẩn' : 'Hiện công khai'}</td>
        <td><button class="btn-hanh-dong phu" data-ten="${escapeHtml(u.Ten)}" onclick="datMatKhau(this.dataset.ten)">Đặt mật khẩu</button></td>
        <td><button class="btn-hanh-dong phu" data-ten="${escapeHtml(u.Ten)}" onclick="xoaMatKhau(this.dataset.ten)">Xoá mật khẩu</button></td>
        <td><button class="btn-hanh-dong phu" data-ten="${escapeHtml(u.Ten)}" data-kich-hoat="${escapeHtml(u.KichHoat)}" onclick="doiKichHoat(this.dataset.ten, this.dataset.kichHoat)">
          ${String(u.KichHoat).toUpperCase() === 'TRUE' ? 'Khoá' : 'Mở lại'}
        </button></td>
        <td><button class="btn-hanh-dong phu" data-ten="${escapeHtml(u.Ten)}" data-hien-thi="${escapeHtml(u.HienThiDangNhap)}" onclick="doiHienThi(this.dataset.ten, this.dataset.hienThi)">
          ${String(u.HienThiDangNhap).toUpperCase() === 'FALSE' ? 'Hiện lại' : 'Ẩn khỏi đăng nhập'}
        </button></td>
      </tr>`).join('')}`;
}

// ten đến từ this.dataset.ten (xem taiDanhSach() ở trên) — chuỗi GỐC chưa encode, tự encodeURIComponent
// ở ĐÂY khi ghép vào URL (đây mới là đúng mục đích của hàm này — mã hoá cho URL, không phải cho JS).
async function doiXuong(ten, xuongMoi) {
  try {
    await apiFetch('/users/' + encodeURIComponent(ten), { method: 'PUT', body: JSON.stringify({ Xuong: xuongMoi }) });
    await taiDanhSach();
  } catch (err) { alert(err.message); await taiDanhSach(); }
}

async function doiVaiTro(ten, vaiTroMoi) {
  try {
    await apiFetch('/users/' + encodeURIComponent(ten), { method: 'PUT', body: JSON.stringify({ VaiTro: vaiTroMoi }) });
    await taiDanhSach();
  } catch (err) { alert(err.message); await taiDanhSach(); }
}

async function doiTen(tenCu) {
  const moi = prompt(`Nhập tên mới cho "${tenCu}":`, tenCu);
  if (moi === null) return;
  const tenMoi = moi.trim();
  if (!tenMoi || tenMoi === tenCu) return;
  try {
    await apiFetch('/users/' + encodeURIComponent(tenCu), { method: 'PUT', body: JSON.stringify({ TenMoi: tenMoi }) });
    await taiDanhSach();
  } catch (err) { alert(err.message); }
}

// Xoá mật khẩu (bổ sung 21/09/2026) — tài khoản về trạng thái "chưa đặt", đăng nhập không cần PIN,
// cùng ý nghĩa với tài khoản cũ chưa từng đặt mật khẩu — xem matKhauHopLe ở routes/users.js.
async function xoaMatKhau(ten) {
  if (!confirm(`Xoá mật khẩu của "${ten}"? Sau khi xoá, tài khoản này đăng nhập KHÔNG cần mật khẩu.`)) return;
  try {
    await apiFetch('/users/' + encodeURIComponent(ten), { method: 'PUT', body: JSON.stringify({ MatKhau: '' }) });
    await taiDanhSach();
  } catch (err) { alert(err.message); }
}

async function doiKichHoat(ten, kichHoatHienTai) {
  const moi = String(kichHoatHienTai).toUpperCase() === 'TRUE' ? 'FALSE' : 'TRUE';
  await apiFetch('/users/' + encodeURIComponent(ten), { method: 'PUT', body: JSON.stringify({ KichHoat: moi }) });
  await taiDanhSach();
}

// Ẩn/hiện khỏi danh sách nút bấm công khai ở màn hình đăng nhập (bổ sung 13/09/2026 — xem
// docs/superpowers/specs/2026-09-13-an-tai-khoan-dang-nhap-design.md). KHÔNG ảnh hưởng khả năng đăng
// nhập — tài khoản bị ẩn vẫn vào được bình thường qua trang đăng nhập riêng (gõ tay tên).
async function doiHienThi(ten, hienThiHienTai) {
  const moi = String(hienThiHienTai).toUpperCase() === 'FALSE' ? 'TRUE' : 'FALSE';
  try {
    await apiFetch('/users/' + encodeURIComponent(ten), { method: 'PUT', body: JSON.stringify({ HienThiDangNhap: moi }) });
    await taiDanhSach();
  } catch (err) { alert(err.message); }
}

// Đặt/đặt lại mật khẩu — dùng prompt() thay vì mở form riêng, đủ dùng cho thao tác admin ít khi làm.
async function datMatKhau(ten) {
  const moi = prompt(`Nhập mật khẩu mới (1-4 chữ số) cho "${ten}":`);
  if (moi === null) return; // bấm Huỷ
  if (!/^\d{1,4}$/.test(moi.trim())) { alert('Mật khẩu phải là 1-4 chữ số.'); return; }
  try {
    await apiFetch('/users/' + encodeURIComponent(ten), { method: 'PUT', body: JSON.stringify({ MatKhau: moi.trim() }) });
    await taiDanhSach();
  } catch (err) { alert(err.message); }
}
</script>
</body>
</html>
