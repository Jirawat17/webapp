<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhân viên — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=84">
<script src="/js/theme.js?v=84"></script>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Quản lý nhân viên</h2>
  <form id="form-them" class="inline-form">
    <div class="truong">
      <label for="ten-moi">Tên nhân viên</label>
      <input id="ten-moi" required>
    </div>
    <div class="truong">
      <label for="vaitro-moi">Vai trò</label>
      <select id="vaitro-moi">
        <option value="admin">Admin</option>
        <option value="nguoi_lay_phoi">Người lấy phôi</option>
        <option value="ve_file">Vẽ file</option>
        <option value="san_xuat">Sản xuất</option>
      </select>
    </div>
    <div class="truong">
      <label for="team-moi">Team (nếu là Sản xuất)</label>
      <input id="team-moi">
    </div>
    <div class="truong">
      <label for="xuong-moi">Xưởng</label>
      <select id="xuong-moi">
        <option value="">(chưa gán)</option>
        <option value="HANOI">HANOI</option>
        <option value="BACNINH">BACNINH</option>
      </select>
    </div>
    <div class="truong">
      <label for="matkhau-moi">Mật khẩu (tối đa 4 số)</label>
      <input id="matkhau-moi" inputmode="numeric" pattern="[0-9]{1,4}" maxlength="4" required>
    </div>
    <button type="submit" class="btn-hanh-dong">Thêm nhân viên</button>
  </form>
  <table id="bang-nv" class="info-table"></table>
</div>

<script src="/js/icons.js?v=84"></script>
<script src="/js/api.js?v=84"></script>
<script>
(async () => {
  const user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'users');
  if (user.vaiTro !== 'admin') {
    document.querySelector('.page').innerHTML = '<p>Bạn không có quyền truy cập trang này.</p>';
    return;
  }
  await taiDanhSach();
})();

// Xưởng vật lý (HANOI/BACNINH — bổ sung 13/09/2026, theo yêu cầu người dùng) — PHẢI khớp ĐÚNG
// DANH_SACH_XUONG trong services/orderService.js (tự khai báo lại ở đây thay vì import, cùng cách
// public/order.html đang tự khai báo lại DANH_SACH_TINH_TRANG).
const DANH_SACH_XUONG = ['HANOI', 'BACNINH'];

document.getElementById('form-them').onsubmit = async (e) => {
  e.preventDefault();
  const ten = document.getElementById('ten-moi').value.trim();
  const vaiTro = document.getElementById('vaitro-moi').value;
  const team = document.getElementById('team-moi').value.trim();
  const xuong = document.getElementById('xuong-moi').value;
  const matKhau = document.getElementById('matkhau-moi').value.trim();
  try {
    await apiFetch('/users', { method: 'POST', body: JSON.stringify({ ten, vaiTro, team, xuong, matKhau }) });
    e.target.reset();
    await taiDanhSach();
  } catch (err) { alert(err.message); }
};

async function taiDanhSach() {
  const list = await apiFetch('/users');
  document.getElementById('bang-nv').innerHTML = `
    <tr><th>Tên</th><th>Vai trò</th><th>Team</th><th>Xưởng</th><th>Trạng thái</th><th>Mật khẩu</th><th></th><th></th></tr>
    ${list.map(u => `
      <tr>
        <td>${escapeHtml(u.Ten)}</td>
        <td>${escapeHtml(NHAN_VAI_TRO[u.VaiTro] || u.VaiTro)}</td>
        <td>${escapeHtml(u.Team || '')}</td>
        <td>
          <select onchange="doiXuong('${encodeURIComponent(u.Ten)}', this.value)">
            <option value="" ${!u.Xuong ? 'selected' : ''}>(chưa gán)</option>
            ${DANH_SACH_XUONG.map(x => `<option value="${x}" ${u.Xuong === x ? 'selected' : ''}>${x}</option>`).join('')}
          </select>
        </td>
        <td>${String(u.KichHoat).toUpperCase() === 'TRUE' ? 'Đang hoạt động' : 'Đã khoá'}</td>
        <td>${u.MatKhau ? escapeHtml(u.MatKhau) : '(chưa đặt)'}</td>
        <td><button class="btn-hanh-dong phu" onclick="datMatKhau('${encodeURIComponent(u.Ten)}')">Đặt mật khẩu</button></td>
        <td><button class="btn-hanh-dong phu" onclick="doiKichHoat('${encodeURIComponent(u.Ten)}','${u.KichHoat}')">
          ${String(u.KichHoat).toUpperCase() === 'TRUE' ? 'Khoá' : 'Mở lại'}
        </button></td>
      </tr>`).join('')}`;
}

async function doiXuong(tenMaHoa, xuongMoi) {
  try {
    await apiFetch('/users/' + tenMaHoa, { method: 'PUT', body: JSON.stringify({ Xuong: xuongMoi }) });
    await taiDanhSach();
  } catch (err) { alert(err.message); await taiDanhSach(); }
}

async function doiKichHoat(tenMaHoa, kichHoatHienTai) {
  const moi = String(kichHoatHienTai).toUpperCase() === 'TRUE' ? 'FALSE' : 'TRUE';
  await apiFetch('/users/' + tenMaHoa, { method: 'PUT', body: JSON.stringify({ KichHoat: moi }) });
  await taiDanhSach();
}

// Đặt/đặt lại mật khẩu — dùng prompt() thay vì mở form riêng, đủ dùng cho thao tác admin ít khi làm.
async function datMatKhau(tenMaHoa) {
  const ten = decodeURIComponent(tenMaHoa);
  const moi = prompt(`Nhập mật khẩu mới (1-4 chữ số) cho "${ten}":`);
  if (moi === null) return; // bấm Huỷ
  if (!/^\d{1,4}$/.test(moi.trim())) { alert('Mật khẩu phải là 1-4 chữ số.'); return; }
  try {
    await apiFetch('/users/' + tenMaHoa, { method: 'PUT', body: JSON.stringify({ MatKhau: moi.trim() }) });
    await taiDanhSach();
  } catch (err) { alert(err.message); }
}
</script>
</body>
</html>
