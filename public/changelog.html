<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghi chú cập nhật</title>
  <link rel="stylesheet" href="/css/style.css?v=1">
  <style>
    .changelog-wrap {
      max-width: 720px;
    }
    .changelog-wrap h2 {
      margin: 0 0 var(--space-5);
      font-size: 1.5rem;
    }
    .cl-entry {
      display: flex;
      gap: var(--space-4);
      margin-bottom: var(--space-5);
    }
    .cl-entry::before {
      content: '';
      display: block;
      width: 2px;
      background: var(--color-border);
      border-radius: 2px;
      flex-shrink: 0;
      margin-top: 10px; /* align with badge center */
    }
    .cl-body {
      flex: 1;
      min-width: 0;
    }
    .cl-date {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--color-primary-dark, var(--color-primary));
      background: var(--color-primary-light);
      border-radius: var(--radius-full);
      padding: 3px 12px;
      margin-bottom: var(--space-3);
      letter-spacing: 0.02em;
    }
    .cl-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: var(--space-4);
    }
    .cl-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }
    .cl-list li {
      display: flex;
      gap: var(--space-2);
      align-items: flex-start;
      font-size: 0.95rem;
      line-height: 1.55;
      color: var(--color-text);
    }
    .cl-list li::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
      flex-shrink: 0;
      margin-top: 7px;
    }
    .cl-loading {
      color: var(--color-text-muted);
      font-size: 0.95rem;
      padding: var(--space-4) 0;
    }
  </style>
</head>
<body>
<div id="nav"></div>
<main class="page">
  <div class="changelog-wrap">
    <h2>Ghi chú cập nhật</h2>
    <div id="ds-cap-nhat"><p class="cl-loading">Đang tải…</p></div>
  </div>
</main>
<script src="/js/icons.js?v=106"></script>
<script src="/js/api.js?v=134"></script>
<script>
(async () => {
  const user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'changelog');

  const res = await fetch('/changelog.json?v=' + Date.now());
  if (!res.ok) {
    document.getElementById('ds-cap-nhat').innerHTML = '<p class="cl-loading">Không tải được dữ liệu.</p>';
    return;
  }
  const ds = await res.json();

  document.getElementById('ds-cap-nhat').innerHTML = ds.map(p => `
    <div class="cl-entry">
      <div class="cl-body">
        <div class="cl-date">${escapeHtml(p.phienBan)}</div>
        <div class="cl-card">
          <ul class="cl-list">
            ${p.capNhat.map(d => `<li><span>${escapeHtml(d)}</span></li>`).join('')}
          </ul>
        </div>
      </div>
    </div>
  `).join('') || '<p class="cl-loading">Chưa có ghi chú nào.</p>';
})();
</script>
</body>
</html>
