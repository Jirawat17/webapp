<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thống kê — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Thống kê</h2>
  <div id="tong-so" class="tong-so-the">Đang tải...</div>
  <div class="chart-grid">
    <div class="chart-card"><canvas id="chart-trangthai"></canvas></div>
    <div class="chart-card"><canvas id="chart-khachhang"></canvas></div>
    <div class="chart-card"><canvas id="chart-loai"></canvas></div>
    <div class="chart-card"><canvas id="chart-tuan"></canvas></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script>
(async () => {
  const user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'dashboard');

  let stats;
  try {
    stats = await apiFetch('/dashboard/thong-ke');
  } catch (e) {
    document.getElementById('tong-so').textContent = 'Không tải được thống kê: ' + e.message;
    return;
  }

  document.getElementById('tong-so').textContent = `Tổng số đơn: ${stats.tongSoDon}`;

  veBieuDo('chart-trangthai', 'pie', 'Theo trạng thái', stats.theoTrangThai);
  veBieuDo('chart-khachhang', 'bar', 'Theo khách hàng', stats.theoKhachHang);
  veBieuDo('chart-loai', 'bar', 'Theo loại sản phẩm', stats.theoLoaiSanPham);
  veBieuDo('chart-tuan', 'line', 'Đơn theo tuần (theo ngày lên đơn)', stats.theoTuan);
})();

// Bảng màu đủ tương phản, không chỉ dựa vào màu sắc để phân biệt (mỗi cột/lát đều có nhãn kèm theo)
const MAU = ['#4338ca','#22c55e','#f59e0b','#ef4444','#0891b2','#a855f7','#65a30d','#64748b'];

function veBieuDo(canvasId, type, title, dataObj) {
  const labels = Object.keys(dataObj);
  const data = Object.values(dataObj);
  new Chart(document.getElementById(canvasId), {
    type,
    data: { labels, datasets: [{ label: title, data, backgroundColor: MAU, borderColor: '#4338ca' }] },
    options: {
      responsive: true,
      plugins: {
        title: { display: true, text: title, font: { size: 14 } },
        legend: { display: type === 'pie', position: 'bottom' },
        tooltip: { enabled: true },
      },
    },
  });
}
</script>
</body>
</html>
