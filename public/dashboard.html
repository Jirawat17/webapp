<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thống kê — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=104">
<script src="/js/theme.js?v=104"></script>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <!-- Tiêu đề gộp CHUNG 1 hàng với thanh chọn kỳ (bổ sung 09/09/2026, theo yêu cầu người dùng — tăng
       diện tích hiển thị, cùng tinh thần đã gộp nav thành 1 hàng ở desktop). -->
  <div class="tieu-de-cong-cu">
    <h2>Thống kê</h2>
    <div class="thanh-cong-cu-danh-sach" id="thanh-chon-ky">
      <button type="button" class="btn-hanh-dong phu dang-mo" data-ky="toan_bo">Toàn bộ</button>
      <button type="button" class="btn-hanh-dong phu" data-ky="hom_nay">Hôm nay</button>
      <button type="button" class="btn-hanh-dong phu" data-ky="tuan_nay">Tuần này</button>
      <button type="button" class="btn-hanh-dong phu" data-ky="thang_nay">Tháng này</button>
      <button type="button" class="btn-hanh-dong phu" data-ky="tuy_chon">Tuỳ chọn...</button>
      <!-- Lọc theo khách hàng (bổ sung 25/09/2026) — mã khách tách từ STT_Key, xem routes/dashboard.js. -->
      <select id="loc-khach-hang" aria-label="Lọc theo khách hàng"><option value="">Tất cả khách hàng</option></select>
    </div>
  </div>

  <div id="panel-khoang-ngay" class="panel-dieu-khien" style="display:none">
    <div class="inline-form">
      <div class="truong">
        <label for="tk-tu-ngay">Từ ngày</label>
        <input type="date" id="tk-tu-ngay">
      </div>
      <div class="truong">
        <label for="tk-den-ngay">Đến ngày</label>
        <input type="date" id="tk-den-ngay">
      </div>
      <button type="button" class="btn-hanh-dong" id="btn-ap-dung-khoang">Áp dụng</button>
    </div>
  </div>

  <div id="tong-so" class="tong-so-the">Đang tải...</div>

  <!-- Bảng theo khách hàng (bổ sung 15/09/2026, xem
       docs/superpowers/specs/2026-09-15-thong-ke-khach-hang-va-an-menu-san-xuat-design.md) — tách
       riêng full-width thay vì nằm trong .chart-grid (2 cột ở desktop), vì 8 cột dữ liệu quá chật
       nếu chỉ chiếm nửa chiều rộng. -->
  <div class="chart-card" style="margin-bottom:var(--space-4)">
    <h3 style="margin-top:0">Theo khách hàng</h3>
    <div class="bang-cuon-ngang">
      <table class="bang-xem-truoc" id="bang-theo-khach-hang">
        <thead><tr>
          <th>Khách hàng</th><th>Tổng đơn</th><th>Đã DÁN TEM</th><th>Chưa DÁN TEM</th>
          <th>Đã vẽ file</th><th>Đã chạy máy</th><th>Có file, chưa chạy máy</th><th>Chưa có file vẽ</th>
        </tr></thead>
        <tbody id="bang-theo-khach-hang-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Bảng theo Xưởng (bổ sung 25/09/2026) — cùng cột với bảng khách hàng ở trên. -->
  <div class="chart-card" style="margin-bottom:var(--space-4)">
    <h3 style="margin-top:0">Theo Xưởng</h3>
    <div class="bang-cuon-ngang">
      <table class="bang-xem-truoc">
        <thead><tr>
          <th>Xưởng</th><th>Tổng đơn</th><th>Đã DÁN TEM</th><th>Chưa DÁN TEM</th>
          <th>Đã vẽ file</th><th>Đã chạy máy</th><th>Có file, chưa chạy máy</th><th>Chưa có file vẽ</th>
        </tr></thead>
        <tbody id="bang-theo-xuong-body"></tbody>
      </table>
    </div>
  </div>

  <div class="chart-grid">
    <div class="chart-card"><canvas id="chart-khach-hang"></canvas></div>
    <div class="chart-card"><canvas id="chart-xuong"></canvas></div>
    <div class="chart-card"><canvas id="chart-trangthai"></canvas></div>
    <div class="chart-card"><canvas id="chart-loai"></canvas></div>
    <div class="chart-card"><canvas id="chart-tuan"></canvas></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
<script src="/js/icons.js?v=104"></script>
<script src="/js/api.js?v=104"></script>
<script>
let kyHienTai = 'toan_bo';
const cacBieuDo = {};
// Ghi rõ con số ngay trên biểu đồ (chartjs-plugin-datalabels) — trước đây phải bấm/rê chuột vào mới
// thấy số qua tooltip, theo yêu cầu người dùng muốn nhìn thấy ngay không cần thao tác gì thêm.
Chart.register(ChartDataLabels);
let dangCheDoToiHienTai = false;

(async () => {
  const user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'dashboard');

  // Chart.js vẽ bằng <canvas>, KHÔNG tự đọc CSS variable của trang — nếu không set thủ công,
  // chữ tiêu đề/chú thích/lưới sẽ giữ nguyên màu tối mặc định, khó đọc khi bật Chế độ tối.
  dangCheDoToiHienTai = typeof dangCheDoToi === 'function' && dangCheDoToi();
  Chart.defaults.color = dangCheDoToiHienTai ? '#a6a6ad' : '#52525b';
  Chart.defaults.borderColor = dangCheDoToiHienTai ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.08)';

  document.querySelectorAll('#thanh-chon-ky button').forEach(btn => {
    btn.onclick = () => {
      kyHienTai = btn.dataset.ky;
      document.querySelectorAll('#thanh-chon-ky button').forEach(b => b.classList.toggle('dang-mo', b === btn));
      document.getElementById('panel-khoang-ngay').style.display = kyHienTai === 'tuy_chon' ? 'block' : 'none';
      if (kyHienTai !== 'tuy_chon') taiThongKe();
    };
  });
  document.getElementById('btn-ap-dung-khoang').onclick = () => taiThongKe();
  document.getElementById('loc-khach-hang').onchange = () => taiThongKe();

  await taiThongKe();
})();

// Quy đổi 1 trong 4 kỳ chọn nhanh (không tính "tuy_chon" — kỳ đó lấy trực tiếp từ 2 ô ngày)
// thành khoảng {tu, den}. Tuần bắt đầu từ Thứ 2 theo quy ước lịch làm việc VN, không phải Chủ nhật.
function tinhKhoangTheoKy(ky) {
  const homNay = new Date();
  homNay.setHours(0, 0, 0, 0);
  if (ky === 'hom_nay') return { tu: homNay, den: homNay };
  if (ky === 'tuan_nay') {
    const thu = homNay.getDay();
    const lechDauTuan = thu === 0 ? 6 : thu - 1;
    const dau = new Date(homNay); dau.setDate(homNay.getDate() - lechDauTuan);
    const cuoi = new Date(dau); cuoi.setDate(dau.getDate() + 6);
    return { tu: dau, den: cuoi };
  }
  if (ky === 'thang_nay') {
    const dau = new Date(homNay.getFullYear(), homNay.getMonth(), 1);
    const cuoi = new Date(homNay.getFullYear(), homNay.getMonth() + 1, 0);
    return { tu: dau, den: cuoi };
  }
  return null; // toan_bo — không giới hạn
}

function dinhDangYMD(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

async function taiThongKe() {
  document.getElementById('tong-so').textContent = 'Đang tải...';

  const qs = new URLSearchParams();
  if (kyHienTai === 'tuy_chon') {
    const tu = document.getElementById('tk-tu-ngay').value;
    const den = document.getElementById('tk-den-ngay').value;
    if (tu) qs.set('tuNgay', tu);
    if (den) qs.set('denNgay', den);
  } else {
    const khoang = tinhKhoangTheoKy(kyHienTai);
    if (khoang) {
      qs.set('tuNgay', dinhDangYMD(khoang.tu));
      qs.set('denNgay', dinhDangYMD(khoang.den));
    }
  }
  const oKhach = document.getElementById('loc-khach-hang');
  if (oKhach.value) qs.set('khachHang', oKhach.value);

  let stats;
  try {
    stats = await apiFetch('/dashboard/thong-ke?' + qs.toString());
  } catch (e) {
    document.getElementById('tong-so').textContent = 'Không tải được thống kê: ' + e.message;
    return;
  }

  document.getElementById('tong-so').textContent = `Tổng số đơn: ${stats.tongSoDon}`;

  // Đổ lại ô lọc khách hàng, giữ lựa chọn hiện tại.
  const dangChon = oKhach.value;
  oKhach.innerHTML = '<option value="">Tất cả khách hàng</option>' +
    stats.danhSachKhachHang.map(k => `<option value="${escapeHtml(k)}" ${k === dangChon ? 'selected' : ''}>${escapeHtml(k)}</option>`).join('');

  // Màu CỐ ĐỊNH theo khách (theo thứ tự danh sách đầy đủ) — cùng 1 khách luôn cùng màu ở mọi biểu đồ.
  mauTheoKhach = Object.fromEntries(stats.danhSachKhachHang.map((k, i) => [k, `hsl(${Math.round(i * 137.5) % 360} 65% 52%)`]));

  const tongDonTheoNhom = list => Object.fromEntries(list.map(n => [n.khachHang, n.tongDon]));
  veBieuDoCot('chart-khach-hang', 'Số đơn theo khách hàng', tongDonTheoNhom(stats.theoKhachHangChiTiet));
  veBieuDoCot('chart-xuong', 'Số đơn theo Xưởng', tongDonTheoNhom(stats.theoXuongChiTiet));
  veBieuDoChong('chart-trangthai', 'Theo trạng thái (chia theo khách hàng)', stats.chongTheoKhach.trangThai);
  veBieuDoChong('chart-loai', 'Theo loại sản phẩm (chia theo khách hàng)', stats.chongTheoKhach.loai);
  veBieuDoChong('chart-tuan', 'Đơn theo tuần — ngày lên đơn (chia theo khách hàng)', stats.chongTheoKhach.tuan, soSanhTuan);
  veBangTheoNhom('bang-theo-khach-hang-body', stats.theoKhachHangChiTiet);
  veBangTheoNhom('bang-theo-xuong-body', stats.theoXuongChiTiet);
}

let mauTheoKhach = {};

// "2026-W9" trước "2026-W10" (so chuỗi thường xếp sai).
function soSanhTuan(a, b) {
  const [na, ta] = a.split('-W').map(Number);
  const [nb, tb] = b.split('-W').map(Number);
  return na - nb || ta - tb;
}

function veBangTheoNhom(tbodyId, danhSach) {
  const tbody = document.getElementById(tbodyId);
  if (!danhSach || danhSach.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8">Không có dữ liệu.</td></tr>';
    return;
  }
  tbody.innerHTML = danhSach.map(n => `
    <tr>
      <td>${escapeHtml(n.khachHang)}</td>
      <td>${n.tongDon}</td>
      <td>${n.daDanTem}</td>
      <td>${n.chuaDanTem}</td>
      <td>${n.daVeFile}</td>
      <td>${n.daChayMay}</td>
      <td>${n.coFileChuaChayMay}</td>
      <td>${n.chuaCoFileVe}</td>
    </tr>`).join('');
}

function nhanSoTrenCot() {
  return {
    color: dangCheDoToiHienTai ? '#f4f4f5' : '#1f2937', anchor: 'end', align: 'top',
    font: { weight: 'bold', size: 11 },
    backgroundColor: dangCheDoToiHienTai ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.75)',
    borderRadius: 4, padding: { top: 1, bottom: 1, left: 4, right: 4 },
  };
}

// taiThongKe() có thể gọi lại nhiều lần khi đổi kỳ/khách — phải huỷ biểu đồ cũ trên cùng canvas trước,
// nếu không Chart.js báo lỗi "Canvas is already in use".
function taoBieuDo(canvasId, cauHinh) {
  if (cacBieuDo[canvasId]) cacBieuDo[canvasId].destroy();
  cacBieuDo[canvasId] = new Chart(document.getElementById(canvasId), cauHinh);
}

// Cột đơn — 1 màu, số ghi trên đầu cột. Người dùng ưu tiên biểu đồ cột hơn tròn/đường (25/09/2026).
function veBieuDoCot(canvasId, title, dataObj) {
  taoBieuDo(canvasId, {
    type: 'bar',
    data: { labels: Object.keys(dataObj), datasets: [{ label: title, data: Object.values(dataObj), backgroundColor: '#4338ca' }] },
    options: {
      responsive: true,
      scales: { y: { grace: '12%' } }, // chừa chỗ cho số trên đỉnh cột cao nhất
      plugins: {
        title: { display: true, text: title, font: { size: 14 } },
        legend: { display: false },
        datalabels: { ...nhanSoTrenCot(), formatter: v => v },
      },
    },
  });
}

// Cột CHỒNG theo khách hàng (bổ sung 25/09/2026) — chong = { nhãn: { maKhach: soDon } }. Mỗi khách 1
// dataset, màu cố định (mauTheoKhach). Chỉ ghi TỔNG trên đỉnh cột (ghi số từng đoạn quá rối khi nhiều
// khách) — rê chuột vào cột để xem số của từng khách.
function veBieuDoChong(canvasId, title, chong, soSanhNhan) {
  const labels = Object.keys(chong);
  if (soSanhNhan) labels.sort(soSanhNhan);
  const cacKhach = [...new Set(labels.flatMap(l => Object.keys(chong[l])))].sort();
  const datasets = cacKhach.map(k => ({
    label: k, data: labels.map(l => chong[l][k] || 0), backgroundColor: mauTheoKhach[k] || '#64748b',
  }));
  const tongTheoCot = labels.map(l => Object.values(chong[l]).reduce((a, b) => a + b, 0));
  taoBieuDo(canvasId, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      scales: { x: { stacked: true }, y: { stacked: true, grace: '12%' } }, // grace: chừa chỗ cho số trên đỉnh cột cao nhất
      plugins: {
        title: { display: true, text: title, font: { size: 14 } },
        legend: { display: true, position: 'bottom' },
        tooltip: { mode: 'index', filter: item => item.raw > 0 },
        datalabels: {
          ...nhanSoTrenCot(),
          display: ctx => ctx.datasetIndex === datasets.length - 1,
          formatter: (v, ctx) => tongTheoCot[ctx.dataIndex],
        },
      },
    },
  });
}
</script>
</body>
</html>
