<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thống kê — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=78">
<script src="/js/theme.js?v=78"></script>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Thống kê</h2>

  <div class="thanh-cong-cu-danh-sach" id="thanh-chon-ky">
    <button type="button" class="btn-hanh-dong phu dang-mo" data-ky="toan_bo">Toàn bộ</button>
    <button type="button" class="btn-hanh-dong phu" data-ky="hom_nay">Hôm nay</button>
    <button type="button" class="btn-hanh-dong phu" data-ky="tuan_nay">Tuần này</button>
    <button type="button" class="btn-hanh-dong phu" data-ky="thang_nay">Tháng này</button>
    <button type="button" class="btn-hanh-dong phu" data-ky="tuy_chon">Tuỳ chọn...</button>
  </div>

  <div id="panel-khoang-ngay" class="panel-dieu-khien" style="display:none">
    <div class="inline-form">
      <div class="truong">
        <label for="tk-tu-ngay">Từ ngày</label>
        <input type="date" id="tk-tu-ngay">
      </div>
      <div class="truong">
        <label for="tk-den-ngay">Đến ngày</label>
        <input type="date" id="tk-den-ngay">
      </div>
      <button type="button" class="btn-hanh-dong" id="btn-ap-dung-khoang">Áp dụng</button>
    </div>
  </div>

  <div id="tong-so" class="tong-so-the">Đang tải...</div>
  <div class="chart-grid">
    <div class="chart-card"><canvas id="chart-trangthai"></canvas></div>
    <div class="chart-card"><canvas id="chart-khachhang"></canvas></div>
    <div class="chart-card"><canvas id="chart-loai"></canvas></div>
    <div class="chart-card"><canvas id="chart-tuan"></canvas></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/icons.js?v=78"></script>
<script src="/js/api.js?v=78"></script>
<script>
let kyHienTai = 'toan_bo';
const cacBieuDo = {};

(async () => {
  const user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'dashboard');

  // Chart.js vẽ bằng <canvas>, KHÔNG tự đọc CSS variable của trang — nếu không set thủ công,
  // chữ tiêu đề/chú thích/lưới sẽ giữ nguyên màu tối mặc định, khó đọc khi bật Chế độ tối.
  const dangToi = typeof dangCheDoToi === 'function' && dangCheDoToi();
  Chart.defaults.color = dangToi ? '#a6a6ad' : '#52525b';
  Chart.defaults.borderColor = dangToi ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.08)';

  document.querySelectorAll('#thanh-chon-ky button').forEach(btn => {
    btn.onclick = () => {
      kyHienTai = btn.dataset.ky;
      document.querySelectorAll('#thanh-chon-ky button').forEach(b => b.classList.toggle('dang-mo', b === btn));
      document.getElementById('panel-khoang-ngay').style.display = kyHienTai === 'tuy_chon' ? 'block' : 'none';
      if (kyHienTai !== 'tuy_chon') taiThongKe();
    };
  });
  document.getElementById('btn-ap-dung-khoang').onclick = () => taiThongKe();

  await taiThongKe();
})();

// Quy đổi 1 trong 4 kỳ chọn nhanh (không tính "tuy_chon" — kỳ đó lấy trực tiếp từ 2 ô ngày)
// thành khoảng {tu, den}. Tuần bắt đầu từ Thứ 2 theo quy ước lịch làm việc VN, không phải Chủ nhật.
function tinhKhoangTheoKy(ky) {
  const homNay = new Date();
  homNay.setHours(0, 0, 0, 0);
  if (ky === 'hom_nay') return { tu: homNay, den: homNay };
  if (ky === 'tuan_nay') {
    const thu = homNay.getDay();
    const lechDauTuan = thu === 0 ? 6 : thu - 1;
    const dau = new Date(homNay); dau.setDate(homNay.getDate() - lechDauTuan);
    const cuoi = new Date(dau); cuoi.setDate(dau.getDate() + 6);
    return { tu: dau, den: cuoi };
  }
  if (ky === 'thang_nay') {
    const dau = new Date(homNay.getFullYear(), homNay.getMonth(), 1);
    const cuoi = new Date(homNay.getFullYear(), homNay.getMonth() + 1, 0);
    return { tu: dau, den: cuoi };
  }
  return null; // toan_bo — không giới hạn
}

function dinhDangYMD(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

async function taiThongKe() {
  document.getElementById('tong-so').textContent = 'Đang tải...';

  const qs = new URLSearchParams();
  if (kyHienTai === 'tuy_chon') {
    const tu = document.getElementById('tk-tu-ngay').value;
    const den = document.getElementById('tk-den-ngay').value;
    if (tu) qs.set('tuNgay', tu);
    if (den) qs.set('denNgay', den);
  } else {
    const khoang = tinhKhoangTheoKy(kyHienTai);
    if (khoang) {
      qs.set('tuNgay', dinhDangYMD(khoang.tu));
      qs.set('denNgay', dinhDangYMD(khoang.den));
    }
  }

  let stats;
  try {
    stats = await apiFetch('/dashboard/thong-ke?' + qs.toString());
  } catch (e) {
    document.getElementById('tong-so').textContent = 'Không tải được thống kê: ' + e.message;
    return;
  }

  document.getElementById('tong-so').textContent = `Tổng số đơn: ${stats.tongSoDon}`;

  veBieuDo('chart-trangthai', 'pie', 'Theo trạng thái', stats.theoTrangThai);
  veBieuDo('chart-khachhang', 'bar', 'Theo khách hàng', stats.theoKhachHang);
  veBieuDo('chart-loai', 'bar', 'Theo loại sản phẩm', stats.theoLoaiSanPham);
  veBieuDo('chart-tuan', 'line', 'Đơn theo tuần (theo ngày lên đơn)', stats.theoTuan);
}

// Bảng màu đủ tương phản, không chỉ dựa vào màu sắc để phân biệt (mỗi cột/lát đều có nhãn kèm theo)
const MAU = ['#4338ca','#22c55e','#f59e0b','#ef4444','#0891b2','#a855f7','#65a30d','#64748b'];

function veBieuDo(canvasId, type, title, dataObj) {
  // taiThongKe() có thể gọi lại nhiều lần khi đổi kỳ thống kê — phải huỷ biểu đồ cũ trên cùng
  // canvas trước, nếu không Chart.js báo lỗi "Canvas is already in use".
  if (cacBieuDo[canvasId]) cacBieuDo[canvasId].destroy();

  const labels = Object.keys(dataObj);
  const data = Object.values(dataObj);
  cacBieuDo[canvasId] = new Chart(document.getElementById(canvasId), {
    type,
    data: { labels, datasets: [{ label: title, data, backgroundColor: MAU, borderColor: '#4338ca' }] },
    options: {
      responsive: true,
      plugins: {
        title: { display: true, text: title, font: { size: 14 } },
        legend: { display: type === 'pie', position: 'bottom' },
        tooltip: { enabled: true },
      },
    },
  });
}
</script>
</body>
</html>
