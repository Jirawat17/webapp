<script>

  // Chart.js váº½ báº±ng <canvas>, KHÃ”NG tá»± Ä‘á»c CSS variable cá»§a trang â€” náº¿u khÃ´ng set thá»§ cÃ´ng,

// Quy Ä‘á»•i 1 trong 4 ká»³ chá»n nhanh (khÃ´ng tÃ­nh "tuy_chon" â€” ká»³ Ä‘Ã³ láº¥y trá»±c tiáº¿p tá»« 2 Ã´ ngÃ y)
// thÃ nh khoáº£ng {tu, den}. Tuáº§n báº¯t Ä‘áº§u tá»« Thá»© 2 theo quy Æ°á»›c lá»‹ch lÃ m viá»‡c VN, khÃ´ng pháº£i Chá»§ nháº­t.
function tinhKhoangTheoKy(ky) {
  const homNay = new Date();
  homNay.setHours(0, 0, 0, 0);
  if (ky === 'hom_nay') return { tu: homNay, den: homNay };
  if (ky === 'tuan_nay') {
    const thu = homNay.getDay();
    const lechDauTuan = thu === 0 ? 6 : thu - 1;
    const dau = new Date(homNay); dau.setDate(homNay.getDate() - lechDauTuan);
    const cuoi = new Date(dau); cuoi.setDate(dau.getDate() + 6);
    return { tu: dau, den: cuoi };
  }
  if (ky === 'thang_nay') {
    const dau = new Date(homNay.getFullYear(), homNay.getMonth(), 1);
    const cuoi = new Date(homNay.getFullYear(), homNay.getMonth() + 1, 0);
    return { tu: dau, den: cuoi };
  }
  return null; // toan_bo â€” khÃ´ng giá»›i háº¡n
}

function dinhDangYMD(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

async function taiThongKe() {

    if (den) qs.set('denNgay', den);
  } else {
    const khoang = tinhKhoangTheoKy(kyHienTai);

      qs.set('tuNgay', dinhDangYMD(khoang.tu));
      qs.set('denNgay', dinhDangYMD(khoang.den));
    }
  }
  const oKhach = document.getElementById('loc-khach-hang');
  if (oKhach.value) qs.set('khachHang', oKhach.value);

  let stats;
  try {
    stats = await apiFetch('/dashboard/thong-ke?' + qs.toString());
  } catch (e) {
    document.getElementById('tong-so').textContent = 'KhÃ´ng táº£i Ä‘Æ°á»£c thá»‘ng kÃª: ' + e.message;
    return;
  }

  document.getElementById('tong-so').textContent = `Tá»•ng sá»‘ Ä‘Æ¡n: ${stats.tongSoDon} Â· Tá»•ng sá»‘ sáº£n pháº©m: ${stats.tongSanPham ?? 0}`;

  // Äá»• láº¡i Ã´ lá»c khÃ¡ch hÃ ng, giá»¯ lá»±a chá»n hiá»‡n táº¡i.
  const dangChon = oKhach.value;
  oKhach.innerHTML = '<option value="">Táº¥t cáº£ khÃ¡ch hÃ ng</option>' +
    stats.danhSachKhachHang.map(k => `<option value="${escapeHtml(k)}" ${k === dangChon ? 'selected' : ''}>${escapeHtml(k)}</option>`).join('');

  // MÃ u Cá» Äá»ŠNH theo khÃ¡ch (theo thá»© tá»± danh sÃ¡ch Ä‘áº§y Ä‘á»§) â€” cÃ¹ng 1 khÃ¡ch luÃ´n cÃ¹ng mÃ u á»Ÿ má»i biá»ƒu Ä‘á»“.
  mauTheoKhach = Object.fromEntries(stats.danhSachKhachHang.map((k, i) => [k, `hsl(${Math.round(i * 137.5) % 360} 65% 52%)`]));

  const tongDonTheoNhom = list => Object.fromEntries(list.map(n => [n.khachHang, n.tongDon]));
  const tongSpTheoNhom = list => Object.fromEntries(list.map(n => [n.khachHang, n.tongSanPham ?? 0]));
  veBieuDoCot('chart-khach-hang', 'Sá»‘ Ä‘Æ¡n theo khÃ¡ch hÃ ng', tongDonTheoNhom(stats.theoKhachHangChiTiet));
  veBieuDoCot('chart-sp-khach-hang', 'Sá»‘ sáº£n pháº©m theo khÃ¡ch hÃ ng', tongSpTheoNhom(stats.theoKhachHangChiTiet));
  // 05/10/2026 (theo yÃªu cáº§u ngÆ°á»i dÃ¹ng): 2 biá»ƒu Ä‘á»“ dÆ°á»›i Ä‘Ã¢y bá» chia theo khÃ¡ch hÃ ng, chá»‰ cÃ²n Tá»”NG táº¥t cáº£ khÃ¡ch (váº«n theo Ã´
  // lá»c khÃ¡ch/ká»³) â€” tráº¡ng thÃ¡i: cá»™t 1 mÃ u (trá»¥c lÃ  cÃ¡c nhÃ³m riÃªng, khÃ´ng pháº£i thá»i gian); theo tuáº§n: biá»ƒu Ä‘á»“ Ä‘Æ°á»ng.
  veBieuDoCot('chart-trangthai', 'Theo tráº¡ng thÃ¡i (táº¥t cáº£ khÃ¡ch hÃ ng)', stats.theoTrangThai);
  veBieuDoChong('chart-loai', 'Theo loáº¡i sáº£n pháº©m (chia theo khÃ¡ch hÃ ng)', stats.chongTheoKhach.loai);
  veBieuDoDuong('chart-tuan', 'ÄÆ¡n theo tuáº§n â€” ngÃ y lÃªn Ä‘Æ¡n (táº¥t cáº£ khÃ¡ch hÃ ng)', dienTuanTrong(stats.theoTuan), soSanhTuan);
  veBieuDoDuong('chart-sp-tuan', 'Sáº£n pháº©m theo tuáº§n â€” ngÃ y lÃªn Ä‘Æ¡n (táº¥t cáº£ khÃ¡ch hÃ ng)', dienTuanTrong(stats.spTheoTuan), soSanhTuan);
  // Theo ngÃ y (07/10/2026): server Ä‘Ã£ xáº¿p theo thá»i gian + Ä‘iá»n 0 ngÃ y trá»‘ng â€” KHÃ”NG sáº¯p láº¡i theo chuá»—i DD/MM/YYYY.
  veBieuDoDuong('chart-ngay', 'Xu hÆ°á»›ng Ä‘Æ¡n theo ngÃ y â€” ngÃ y lÃªn Ä‘Æ¡n (táº¥t cáº£ khÃ¡ch hÃ ng)', stats.theoNgay);
  veBieuDoDuong('chart-sp-ngay', 'Sáº£n pháº©m theo ngÃ y â€” ngÃ y lÃªn Ä‘Æ¡n (táº¥t cáº£ khÃ¡ch hÃ ng)', stats.spTheoNgay);
  veBangTheoNhom('bang-theo-khach-hang-body', stats.theoKhachHangChiTiet);

let mauTheoKhach = {};

// "2026-W9" trÆ°á»›c "2026-W10" (so chuá»—i thÆ°á»ng xáº¿p sai).
function soSanhTuan(a, b) {
  const [na, ta] = a.split('-W').map(Number);
  const [nb, tb] = b.split('-W').map(Number);
  return na - nb || ta - tb;
}

function veBangTheoNhom(tbodyId, danhSach) {
  const tbody = document.getElementById(tbodyId);
  if (!danhSach || danhSach.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9">KhÃ´ng cÃ³ dá»¯ liá»‡u.</td></tr>';
    return;
  }
  // HÃ ng Tá»”NG cuá»‘i báº£ng (17/10/2026, theo yÃªu cáº§u ngÆ°á»i dÃ¹ng): cá»™ng tá»«ng cá»™t cá»§a cÃ¡c khÃ¡ch hÃ ng Ä‘ang hiá»‡n.
  const COT = ['tongDon', 'tongSanPham', 'daSanXuat', 'spDaSanXuat', 'chuaSanXuat', 'spChuaSanXuat', 'giaoHoanHuy', 'spGiaoHoanHuy'];
  const tong = Object.fromEntries(COT.map(c => [c, danhSach.reduce((s, n) => s + (Number(n[c]) || 0), 0)]));
  tbody.innerHTML = danhSach.map(n => `
    <tr>
      <td>${escapeHtml(n.khachHang)}</td>
      <td><strong>${n.tongDon}</strong></td><td>${n.tongSanPham ?? 0}</td>
      <td><strong>${n.daSanXuat}</strong></td><td>${n.spDaSanXuat ?? 0}</td>
      <td><strong>${n.chuaSanXuat}</strong></td><td>${n.spChuaSanXuat ?? 0}</td>
      <td><strong>${n.giaoHoanHuy}</strong></td><td>${n.spGiaoHoanHuy ?? 0}</td>
    </tr>`).join('') + `
    <tr style="background:var(--color-bg);border-top:2px solid var(--color-text-muted);font-weight:800">
      <td>Tá»”NG</td>${COT.map(c => `<td>${tong[c]}</td>`).join('')}
    </tr>`;
}

function nhanSoTrenCot() {
  return {
    color: dangCheDoToiHienTai ? '#f4f4f5' : '#1f2937', anchor: 'end', align: 'top',
    font: { weight: 'bold', size: 11 },
    backgroundColor: dangCheDoToiHienTai ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.75)',
    borderRadius: 4, padding: { top: 1, bottom: 1, left: 4, right: 4 },
  };
}

// taiThongKe() cÃ³ thá»ƒ gá»i láº¡i nhiá»u láº§n khi Ä‘á»•i ká»³/khÃ¡ch â€” pháº£i huá»· biá»ƒu Ä‘á»“ cÅ© trÃªn cÃ¹ng canvas trÆ°á»›c,
// náº¿u khÃ´ng Chart.js bÃ¡o lá»—i "Canvas is already in use".
function taoBieuDo(canvasId, cauHinh) {
  if (cacBieuDo[canvasId]) cacBieuDo[canvasId].destroy();
  cacBieuDo[canvasId] = new Chart(document.getElementById(canvasId), cauHinh);
}

// Cá»™t Ä‘Æ¡n â€” 1 mÃ u, sá»‘ ghi trÃªn Ä‘áº§u cá»™t. NgÆ°á»i dÃ¹ng Æ°u tiÃªn biá»ƒu Ä‘á»“ cá»™t hÆ¡n trÃ²n/Ä‘Æ°á»ng (25/09/2026).
function veBieuDoCot(canvasId, title, dataObj) {
  taoBieuDo(canvasId, {
    type: 'bar',
    data: { labels: Object.keys(dataObj), datasets: [{ label: title, data: Object.values(dataObj), backgroundColor: '#4338ca' }] },
    options: {
      responsive: true,
      scales: { y: { grace: '12%' } }, // chá»«a chá»— cho sá»‘ trÃªn Ä‘á»‰nh cá»™t cao nháº¥t
      plugins: {
        title: { display: true, text: title, font: { size: 14 } },
        legend: { display: false },
        datalabels: { ...nhanSoTrenCot(), formatter: v => v },
      },
    },
  });
}

// Server chá»‰ tráº£ cÃ¡c tuáº§n CÃ“ Ä‘Æ¡n â€” biá»ƒu Ä‘á»“ Ä‘Æ°á»ng mÃ  thiáº¿u tuáº§n thÃ¬ ná»‘i tháº³ng qua, che máº¥t tuáº§n trá»‘ng. Äiá»n 0 cho má»i tuáº§n
// náº±m giá»¯a tuáº§n Ä‘áº§u vÃ  tuáº§n cuá»‘i. Sá»‘ tuáº§n cuá»‘i nÄƒm tÃ­nh ÄÃšNG cÃ´ng thá»©c routes/dashboard.js#tuanCuaDon (ngÃ y 31/12).
function soTuanCuoiNam(nam) {
  const dauNam = new Date(nam, 0, 1);
  return Math.ceil(((new Date(nam, 11, 31) - dauNam) / 86400000 + dauNam.getDay() + 1) / 7);
}
function dienTuanTrong(theoTuan) {
  const cacTuan = Object.keys(theoTuan).sort(soSanhTuan);
  if (cacTuan.length < 2) return theoTuan;
  const [namDau, tuanDau] = cacTuan[0].split('-W').map(Number);
  const [namCuoi, tuanCuoi] = cacTuan[cacTuan.length - 1].split('-W').map(Number);
  const kq = {};
  for (let nam = namDau, tuan = tuanDau; nam < namCuoi || (nam === namCuoi && tuan <= tuanCuoi);) {
    kq[`${nam}-W${tuan}`] = theoTuan[`${nam}-W${tuan}`] || 0;
    if (++tuan > soTuanCuoiNam(nam)) { nam++; tuan = 1; }
  }
  return kq;
}

// ÄÆ°á»ng 1 mÃ u (05/10/2026) â€” dÃ¹ng cho sá»‘ Ä‘Æ¡n theo tuáº§n; ghi sá»‘ táº¡i tá»«ng Ä‘iá»ƒm nhÆ° biá»ƒu Ä‘á»“ cá»™t.
function veBieuDoDuong(canvasId, title, dataObj, soSanhNhan) {
  const labels = Object.keys(dataObj);
  if (soSanhNhan) labels.sort(soSanhNhan);
  taoBieuDo(canvasId, {
    type: 'line',
    data: { labels, datasets: [{ label: title, data: labels.map(l => dataObj[l]), borderColor: '#4338ca', backgroundColor: '#4338ca', tension: 0.25, pointRadius: 4 }] },
    options: {
      responsive: true,
      scales: { y: { beginAtZero: true, grace: '12%' } },
      plugins: {
        title: { display: true, text: title, font: { size: 14 } },
        legend: { display: false },
        // Nhiá»u Ä‘iá»ƒm (biá»ƒu Ä‘á»“ ngÃ y ká»³ dÃ i) thÃ¬ sá»‘ Ä‘Ã¨ lÃªn nhau â€” chá»‰ ghi sá»‘ khi <= 31 Ä‘iá»ƒm, cÃ²n láº¡i rÃª chuá»™t Ä‘á»ƒ xem.
        datalabels: { ...nhanSoTrenCot(), formatter: v => v, display: labels.length <= 31 },
      },
    },
  });
}

// Cá»™t CHá»’NG theo khÃ¡ch hÃ ng (bá»• sung 25/09/2026) â€” chong = { nhÃ£n: { maKhach: soDon } }. Má»—i khÃ¡ch 1
// dataset, mÃ u cá»‘ Ä‘á»‹nh (mauTheoKhach). Chá»‰ ghi Tá»”NG trÃªn Ä‘á»‰nh cá»™t (ghi sá»‘ tá»«ng Ä‘oáº¡n quÃ¡ rá»‘i khi nhiá»u
// khÃ¡ch) â€” rÃª chuá»™t vÃ o cá»™t Ä‘á»ƒ xem sá»‘ cá»§a tá»«ng khÃ¡ch.
function veBieuDoChong(canvasId, title, chong, soSanhNhan) {
  const labels = Object.keys(chong);
  if (soSanhNhan) labels.sort(soSanhNhan);
  const cacKhach = [...new Set(labels.flatMap(l => Object.keys(chong[l])))].sort();
  const datasets = cacKhach.map(k => ({
    label: k, data: labels.map(l => chong[l][k] || 0), backgroundColor: mauTheoKhach[k] || '#64748b',
  }));
  const tongTheoCot = labels.map(l => Object.values(chong[l]).reduce((a, b) => a + b, 0));
  taoBieuDo(canvasId, {
    type: 'bar',
    data: { labels, datasets },
    options: {
      responsive: true,
      scales: { x: { stacked: true }, y: { stacked: true, grace: '12%' } }, // grace: chá»«a chá»— cho sá»‘ trÃªn Ä‘á»‰nh cá»™t cao nháº¥t
      plugins: {
        title: { display: true, text: title, font: { size: 14 } },
        legend: { display: true, position: 'bottom' },
        tooltip: { mode: 'index', filter: item => item.raw > 0 },
        datalabels: {
          ...nhanSoTrenCot(),
          display: ctx => ctx.datasetIndex === datasets.length - 1,
          formatter: (v, ctx) => tongTheoCot[ctx.dataIndex],
        },
      },
    },
  });
}
</script>
