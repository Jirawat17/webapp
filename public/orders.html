<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đơn hàng — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Danh sách đơn hàng</h2>
  <div class="filters">
    <label class="sr-only" for="loc-trang-thai">Lọc theo trạng thái</label>
    <select id="loc-trang-thai"><option value="">Tất cả trạng thái</option></select>
    <label class="sr-only" for="loc-kh">Tìm theo tên khách hàng</label>
    <input id="loc-kh" placeholder="Tìm theo tên khách hàng">
  </div>
  <div id="danh-sach-don" class="order-list"></div>
</div>

<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/chatbot.js"></script>
<script>
const TRANG_THAI = ['MOI','CHO_PHOI','CO_PHOI_CHO_FILE','SAN_XUAT','DONG_GOI','SHIPPED','DELIVERED','HUY'];
const NHAN_CANH_BAO = { VANG: 'Vàng · 3 ngày', CAM: 'Cam · 5 ngày', DO: 'Đỏ · 7 ngày' };

(async () => {
  const user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'orders');

  const sel = document.getElementById('loc-trang-thai');
  TRANG_THAI.forEach(t => sel.innerHTML += `<option value="${t}">${t}</option>`);
  sel.onchange = taiDon;
  document.getElementById('loc-kh').oninput = debounce(taiDon, 400);

  taiDon();
})();

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

async function taiDon() {
  const el = document.getElementById('danh-sach-don');
  el.innerHTML = skeletonList(6);

  const trangThai = document.getElementById('loc-trang-thai').value;
  const kh = document.getElementById('loc-kh').value;
  const qs = new URLSearchParams();
  if (trangThai) qs.set('trangThai', trangThai);
  if (kh) qs.set('kh', kh);

  let list;
  try {
    list = await apiFetch('/orders?' + qs.toString());
  } catch (e) {
    el.innerHTML = `<p>Không tải được danh sách: ${escapeHtml(e.message)}</p>`;
    return;
  }

  if (list.length === 0) { el.innerHTML = '<p>Không có đơn nào khớp bộ lọc.</p>'; return; }

  el.innerHTML = list.map(o => `
    <a class="order-card" href="/order.html?stt=${encodeURIComponent(o.STT_Key)}">
      ${o.URL_Hinh_Anh
        ? `<img src="${escapeHtml(o.URL_Hinh_Anh)}" alt="" loading="lazy" onerror="this.remove()">`
        : ''}
      <div class="thong-tin">
        <strong>${escapeHtml(o.Ten_San_Pham || '(chưa đặt tên)')}</strong>
        <div class="meta">${escapeHtml(o.Ten_KH || '')} · SL: ${escapeHtml(o.So_Luong || '')}</div>
        <div class="meta">Deadline: ${escapeHtml(o.Ngay_Giao_Du_Kien || '—')}</div>
        <div class="badge-row">
          <span class="badge badge-${escapeHtml(o.Trang_Thai)}">${escapeHtml(o.Trang_Thai || '')}</span>
          ${o.CanhBao ? `
            <span class="badge badge-canh-bao ${o.CanhBao.toLowerCase()}">
              ${icon('alert')} ${NHAN_CANH_BAO[o.CanhBao] || o.CanhBao}
            </span>` : ''}
        </div>
      </div>
    </a>`).join('');
}
</script>
</body>
</html>
