<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đơn hàng — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=20260831f">
<script src="/js/theme.js?v=20260831f"></script>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Danh sách đơn hàng</h2>

  <div class="thanh-cong-cu-danh-sach">
    <button type="button" class="btn-hanh-dong phu" id="btn-mo-loc" onclick="batTatPanel('panel-loc')"></button>
    <button type="button" class="btn-hanh-dong phu" id="btn-mo-sap-xep" onclick="batTatPanel('panel-sap-xep')"></button>
  </div>

  <div id="panel-loc" class="panel-dieu-khien" style="display:none">
    <div class="inline-form">
      <div class="truong">
        <label for="loc-trang-thai">Trạng thái</label>
        <select id="loc-trang-thai"><option value="">Tất cả trạng thái</option></select>
      </div>
      <div class="truong">
        <label for="loc-phoi">Phôi</label>
        <select id="loc-phoi">
          <option value="">Tất cả (phôi)</option>
          <option value="Chưa lấy phôi">Chưa lấy phôi</option>
          <option value="Đã lấy phôi">Đã lấy phôi</option>
        </select>
      </div>
      <div class="truong">
        <label for="loc-ve-file">Vẽ file</label>
        <select id="loc-ve-file">
          <option value="">Tất cả (vẽ file)</option>
          <option value="Chưa vẽ file">Chưa vẽ file</option>
          <option value="Đã vẽ file">Đã vẽ file</option>
        </select>
      </div>
      <div class="truong">
        <label for="loc-canh-bao">Mức cảnh báo</label>
        <select id="loc-canh-bao">
          <option value="">Tất cả mức cảnh báo</option>
          <option value="VANG">Vàng · 3 ngày</option>
          <option value="CAM">Cam · 5 ngày</option>
          <option value="DO">Đỏ · 7 ngày</option>
        </select>
      </div>
      <div class="truong">
        <label for="loc-loai">Loại</label>
        <select id="loc-loai"><option value="">Tất cả loại</option></select>
      </div>
      <div class="truong">
        <label for="loc-kich-thuoc">Kích thước</label>
        <select id="loc-kich-thuoc"><option value="">Tất cả kích thước</option></select>
      </div>
      <div class="truong">
        <label for="loc-mau-sac">Màu sắc</label>
        <select id="loc-mau-sac"><option value="">Tất cả màu sắc</option></select>
      </div>
      <div class="truong">
        <label for="loc-hang-van-chuyen">Hãng vận chuyển</label>
        <select id="loc-hang-van-chuyen"><option value="">Tất cả hãng vận chuyển</option></select>
      </div>
      <div class="truong">
        <label for="loc-kh">Tìm theo tên đơn / mã KH</label>
        <input id="loc-kh" placeholder="STT_Key hoặc mã khách hàng">
      </div>
      <div class="truong">
        <label for="loc-tu-ngay">Từ ngày</label>
        <input type="date" id="loc-tu-ngay">
      </div>
      <div class="truong">
        <label for="loc-den-ngay">Đến ngày</label>
        <input type="date" id="loc-den-ngay">
      </div>
    </div>
    <button type="button" class="btn-hanh-dong phu" id="btn-xoa-loc" onclick="xoaTatCaLoc()">Xoá bộ lọc</button>
  </div>

  <div id="panel-sap-xep" class="panel-dieu-khien" style="display:none">
    <div class="inline-form">
      <div class="truong">
        <label for="sap-xep">Sắp xếp theo</label>
        <select id="sap-xep">
          <option value="">Ngày lên đơn — cũ nhất trước (mặc định)</option>
          <option value="ngay_moi_nhat">Ngày lên đơn — mới nhất trước</option>
          <option value="canh_bao">Mức cảnh báo — khẩn cấp nhất trước</option>
          <option value="so_luong">Số lượng — nhiều nhất trước</option>
          <option value="khach_hang">Tên khách hàng — A đến Z</option>
        </select>
      </div>
    </div>
  </div>

  <div class="in-nhanh-thanh">
    <button type="button" class="btn-hanh-dong phu" id="btn-in-phoi-ao" onclick="inNhanh('phoi_ao_gop', this)"></button>
    <button type="button" class="btn-hanh-dong phu" id="btn-in-don-ao" onclick="inNhanh('don_can_in', this)"></button>
    <button type="button" class="btn-hanh-dong phu" id="btn-in-tracking" onclick="inNhanh('tracking', this)"></button>
  </div>

  <label class="chon-tat-ca-hang">
    <input type="checkbox" id="chon-tat-ca" onchange="chonTatCa(this.checked)">
    Chọn tất cả đơn đang hiển thị
  </label>

  <div id="danh-sach-don" class="order-list"></div>
</div>

<div id="thanh-hanh-dong" class="thanh-hanh-dong-hang-loat" style="display:none">
  <span>Đã chọn <strong id="so-luong-da-chon">0</strong> đơn</span>
  <select id="trang-thai-dich">
    <option value="">Chuyển đến trạng thái...</option>
  </select>
  <button id="nut-ap-dung" class="btn-hanh-dong" onclick="apDungChuyenTrangThai()">Áp dụng</button>
  <span class="thanh-hanh-dong-cach"></span>
  <button id="btn-xac-nhan" class="btn-hanh-dong phu nhanh-phoi-ve-file trang-thai-tich-cuc" onclick="apDungNhanh('TINH_TRANG', 'Đã xác nhận', this)"></button>
  <button id="btn-da-lay-phoi" class="btn-hanh-dong phu nhanh-phoi-ve-file trang-thai-tich-cuc" onclick="apDungNhanh('TRANG_THAI_PHOI', 'Đã lấy phôi', this)"></button>
  <button id="btn-chua-lay-phoi" class="btn-hanh-dong phu nhanh-phoi-ve-file trang-thai-tieu-cuc" onclick="apDungNhanh('TRANG_THAI_PHOI', 'Chưa lấy phôi', this)"></button>
  <button id="btn-da-ve-file" class="btn-hanh-dong phu nhanh-phoi-ve-file trang-thai-tich-cuc" onclick="apDungNhanh('TRANG_THAI_VE_FILE', 'Đã vẽ file', this)"></button>
  <button id="btn-chua-ve-file" class="btn-hanh-dong phu nhanh-phoi-ve-file trang-thai-tieu-cuc" onclick="apDungNhanh('TRANG_THAI_VE_FILE', 'Chưa vẽ file', this)"></button>
  <button class="btn-hanh-dong phu" onclick="boChonTatCaDon()">Bỏ chọn</button>
</div>

<script src="/js/icons.js?v=20260831f"></script>
<script src="/js/api.js?v=20260831f"></script>
<script>
const NHAN_CANH_BAO = { VANG: 'Vàng · 3 ngày', CAM: 'Cam · 5 ngày', DO: 'Đỏ · 7 ngày' };

// Danh sách ĐẦY ĐỦ 10 giá trị TINH_TRANG — dùng riêng cho ô "Chuyển đến trạng thái" (chọn tự do,
// không kiểm tra trạng thái hiện tại). PHẢI khớp với DANH_SACH_TRANG_THAI_BAO_CAO trong
// data/pipelineTinhTrang.js — sửa 1 chỗ thì nhớ sửa chỗ kia.
// Cập nhật 24/08/2026 (theo Prompt_Ver_24.docx) — thay hoàn toàn hệ trạng thái B1.1-B5.2 cũ bằng
// tên gọi thuần Việt, và tách phôi/vẽ file ra 2 cột riêng (không còn nằm trong danh sách này).
const NHAN_NGUOI_VAN_HANH_KHONG_RO = 'ĐƠN SỬA TRONG GGSHEET, KHÔNG RÕ TÀI KHOẢN SẢN XUẤT NÀO ĐANG CHẠY';

const DANH_SACH_TRANG_THAI_DAY_DU = [
  'Chưa xác nhận', 'Đã xác nhận',
  'ĐÃ SẴN SÀNG CHẠY MÁY',
  'Đang chạy máy',
  'Đã sản xuất', 'LỖI SẢN XUẤT CẦN LÀM LẠI',
  'Đã đóng gói',
  'IN TRANSIT_Tracking đã hoạt động',
  'DELIVERED_Đã giao đến khách', 'CANCELLED_Đã hủy', 'REFUNDED_Hoàn đơn',
];

let danhSachHienTai = [];
let donDaChonSet = new Set();

(async () => {
  const user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'orders');

  document.getElementById('loc-trang-thai').onchange = () => { boChonTatCaDon(); taiDon(); };
  document.getElementById('loc-phoi').onchange = () => { boChonTatCaDon(); taiDon(); };
  document.getElementById('loc-ve-file').onchange = () => { boChonTatCaDon(); taiDon(); };
  document.getElementById('loc-canh-bao').onchange = () => { boChonTatCaDon(); taiDon(); };
  document.getElementById('loc-loai').onchange = () => { boChonTatCaDon(); taiDon(); };
  document.getElementById('loc-kich-thuoc').onchange = () => { boChonTatCaDon(); taiDon(); };
  document.getElementById('loc-mau-sac').onchange = () => { boChonTatCaDon(); taiDon(); };
  document.getElementById('loc-hang-van-chuyen').onchange = () => { boChonTatCaDon(); taiDon(); };
  document.getElementById('loc-kh').oninput = debounce(() => { boChonTatCaDon(); taiDon(); }, 400);
  document.getElementById('loc-tu-ngay').onchange = () => {
    const denNgay = document.getElementById('loc-den-ngay');
    if (document.getElementById('loc-tu-ngay').value && !denNgay.value) denNgay.value = ngayHomNayYYYYMMDD();
    boChonTatCaDon(); taiDon();
  };
  document.getElementById('loc-den-ngay').onchange = () => { boChonTatCaDon(); taiDon(); };
  // Sắp xếp chỉ đổi THỨ TỰ, không đổi danh sách đang chọn (khác lọc — lọc có thể làm mất đơn khỏi
  // danh sách hiển thị) nên KHÔNG cần bỏ chọn khi đổi kiểu sắp xếp.
  document.getElementById('sap-xep').onchange = () => { taiDon(); };

  document.getElementById('btn-mo-loc').innerHTML = icon('filter', { size: 16 }) + ' Lọc';
  document.getElementById('btn-mo-sap-xep').innerHTML = icon('sort', { size: 16 }) + ' Sắp xếp';

  document.getElementById('btn-in-phoi-ao').innerHTML = icon('printer') + ' IN DANH SÁCH PHÔI';
  document.getElementById('btn-in-don-ao').innerHTML = icon('printer') + ' IN ĐƠN';
  document.getElementById('btn-in-tracking').innerHTML = icon('printer') + ' IN DANH SÁCH ĐÃ SẢN XUẤT';

  // Nút "Đã..." (positive) dùng icon check, nút "Chưa..." (negative, đưa trạng thái quay lại) dùng
  // icon undo — phân biệt trực quan, không chỉ dựa vào màu (xem thêm .trang-thai-tich-cuc/.trang-thai-tieu-cuc trong style.css)
  document.getElementById('btn-xac-nhan').innerHTML = icon('check', { size: 16 }) + ' Đã xác nhận';
  document.getElementById('btn-da-lay-phoi').innerHTML = icon('check', { size: 16 }) + ' Đã lấy phôi';
  document.getElementById('btn-chua-lay-phoi').innerHTML = icon('undo', { size: 16 }) + ' Chưa lấy phôi';
  document.getElementById('btn-da-ve-file').innerHTML = icon('check', { size: 16 }) + ' Đã vẽ file';
  document.getElementById('btn-chua-ve-file').innerHTML = icon('undo', { size: 16 }) + ' Chưa vẽ file';

  document.getElementById('trang-thai-dich').innerHTML = '<option value="">Chuyển đến trạng thái...</option>' +
    DANH_SACH_TRANG_THAI_DAY_DU.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');

  taiDon();
})();

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function ngayHomNayYYYYMMDD() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${mm}-${dd}`;
}

// Đóng/mở 1 trong 2 panel "Lọc"/"Sắp xếp" — luôn đóng panel còn lại (đủ chỗ trên màn hình, tránh
// rối khi cả 2 cùng mở), bấm lại đúng nút đang mở thì đóng luôn (toggle).
function batTatPanel(idPanelMuonMo) {
  const dangMo = document.getElementById(idPanelMuonMo).style.display !== 'none';
  document.getElementById('panel-loc').style.display = 'none';
  document.getElementById('panel-sap-xep').style.display = 'none';
  document.getElementById('btn-mo-loc').classList.remove('dang-mo');
  document.getElementById('btn-mo-sap-xep').classList.remove('dang-mo');
  if (!dangMo) {
    document.getElementById(idPanelMuonMo).style.display = 'block';
    document.getElementById(idPanelMuonMo === 'panel-loc' ? 'btn-mo-loc' : 'btn-mo-sap-xep').classList.add('dang-mo');
  }
}

const CAC_O_LOC = ['loc-trang-thai', 'loc-phoi', 'loc-ve-file', 'loc-canh-bao', 'loc-loai', 'loc-kich-thuoc', 'loc-hang-van-chuyen', 'loc-mau-sac', 'loc-kh', 'loc-tu-ngay', 'loc-den-ngay'];

function xoaTatCaLoc() {
  CAC_O_LOC.forEach(id => { document.getElementById(id).value = ''; });
  boChonTatCaDon();
  taiDon();
}

function capNhatNhanNutLoc() {
  const soLuong = CAC_O_LOC.filter(id => document.getElementById(id).value).length;
  document.getElementById('btn-mo-loc').innerHTML = icon('filter', { size: 16 }) + ' Lọc' + (soLuong ? ` (${soLuong})` : '');
}

// Đổ danh sách lựa chọn cho 1 ô <select> theo đúng GIÁ TRỊ THẬT đang có trong dữ liệu (không hardcode)
// — dùng chung cho trạng thái/loại/kích thước/màu sắc/hãng vận chuyển. Giữ lại lựa chọn đang chọn
// (nếu còn hợp lệ) khi đổ lại danh sách.
function domLaiOChon(id, nhanTatCa, giaTriList) {
  const sel = document.getElementById(id);
  const dangChon = sel.value;
  const cacGiaTri = [...new Set(giaTriList.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'vi'));
  sel.innerHTML = `<option value="">${nhanTatCa}</option>` +
    cacGiaTri.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
  sel.value = dangChon;
}

// CHỈ đổ lại các ô lọc động khi KHÔNG có bộ lọc nào đang áp dụng — nếu đã lọc rồi mà vẫn đổ lại theo
// đúng danh sách đã bị thu hẹp thì các lựa chọn khác sẽ biến mất khỏi ô, không bấm lại được nữa.
function capNhatCacBoLocDong(list) {
  domLaiOChon('loc-trang-thai', 'Tất cả trạng thái', list.map(o => o.TINH_TRANG));
  domLaiOChon('loc-loai', 'Tất cả loại', list.map(o => o.LOAI));
  domLaiOChon('loc-kich-thuoc', 'Tất cả kích thước', list.map(o => o.KICH_THUOC));
  domLaiOChon('loc-mau-sac', 'Tất cả màu sắc', list.map(o => o.MAU_SAC));
  domLaiOChon('loc-hang-van-chuyen', 'Tất cả hãng vận chuyển', list.map(o => o.HANG_VAN_CHUYEN));
}

async function taiDon() {
  const el = document.getElementById('danh-sach-don');
  el.innerHTML = skeletonList(6);

  const trangThai = document.getElementById('loc-trang-thai').value;
  const trangThaiPhoi = document.getElementById('loc-phoi').value;
  const trangThaiVeFile = document.getElementById('loc-ve-file').value;
  const canhBao = document.getElementById('loc-canh-bao').value;
  const loai = document.getElementById('loc-loai').value;
  const kichThuoc = document.getElementById('loc-kich-thuoc').value;
  const mauSac = document.getElementById('loc-mau-sac').value;
  const hangVanChuyen = document.getElementById('loc-hang-van-chuyen').value;
  const kh = document.getElementById('loc-kh').value;
  const tuNgay = document.getElementById('loc-tu-ngay').value;
  const denNgay = document.getElementById('loc-den-ngay').value;
  const sapXep = document.getElementById('sap-xep').value;

  const qs = new URLSearchParams();
  if (trangThai) qs.set('trangThai', trangThai);
  if (trangThaiPhoi) qs.set('trangThaiPhoi', trangThaiPhoi);
  if (trangThaiVeFile) qs.set('trangThaiVeFile', trangThaiVeFile);
  if (canhBao) qs.set('canhBao', canhBao);
  if (loai) qs.set('loai', loai);
  if (kichThuoc) qs.set('kichThuoc', kichThuoc);
  if (mauSac) qs.set('mauSac', mauSac);
  if (hangVanChuyen) qs.set('hangVanChuyen', hangVanChuyen);
  if (kh) qs.set('kh', kh);
  if (tuNgay) qs.set('tuNgay', tuNgay);
  if (denNgay) qs.set('denNgay', denNgay);
  if (sapXep) qs.set('sapXep', sapXep);

  let list;
  try {
    list = await apiFetch('/orders?' + qs.toString());
  } catch (e) {
    el.innerHTML = `<p>Không tải được danh sách: ${escapeHtml(e.message)}</p>`;
    return;
  }

  danhSachHienTai = list;

  const coLocNaoDangChon = trangThai || trangThaiPhoi || trangThaiVeFile || canhBao || loai || kichThuoc || mauSac || hangVanChuyen || kh || tuNgay || denNgay;
  if (!coLocNaoDangChon) capNhatCacBoLocDong(list);
  capNhatNhanNutLoc();

  renderDanhSachDon();
}

function renderDanhSachDon() {
  const el = document.getElementById('danh-sach-don');

  // Ngày rút gọn D/M (không năm) — chỉ dùng riêng cho thẻ đơn ở Danh sách đơn hàng, không đụng đến
  // dinhDangNgay() dùng chung (có năm) ở các trang khác.
  function dinhDangNgayNgan(giaTri) {
    const d = parseNgay(giaTri);
    return d ? `${d.getDate()}/${d.getMonth() + 1}` : '';
  }

  if (danhSachHienTai.length === 0) { el.innerHTML = `<div class="trang-thai-rong">${icon('package')}<p>Không có đơn nào khớp bộ lọc.</p></div>`; capNhatThanhHanhDong(); return; }

  el.innerHTML = danhSachHienTai.map(o => {
    const daChon = donDaChonSet.has(o.STT_Key);
    return `
    <div class="order-card ${daChon ? 'da-chon' : ''}" data-stt="${escapeHtml(o.STT_Key)}"
         onclick="moChiTietDon(event, '${encodeURIComponent(o.STT_Key)}')">
      <input type="checkbox" class="order-checkbox" ${daChon ? 'checked' : ''}
             aria-label="Chọn đơn ${escapeHtml(o.STT_Key)}"
             onclick="event.stopPropagation()"
             onchange="toggleChonDon('${escapeHtml(o.STT_Key)}', this.checked)">
      ${o.MOCKUP || o.DUONG_DAN_URL
        ? `<img src="${escapeHtml(o.MOCKUP || o.DUONG_DAN_URL)}" alt="" loading="lazy" onerror="this.remove()">`
        : ''}
      <div class="thong-tin">
        <strong class="tieu-de-the">${escapeHtml(o.TieuDeSanPham || o.STT_Key)}</strong>
        <div class="meta">${escapeHtml(o.TenKhachHang || '')} · SL: <strong>${escapeHtml(o.SO_LUONG || '')}</strong></div>
        <div class="meta">Lên đơn: ${escapeHtml(o.NGAY_LEN_DON ? dinhDangNgayNgan(o.NGAY_LEN_DON) : '—')}</div>
        <div class="badge-row">
          <span class="badge ${lopTrangThai(o.TINH_TRANG)}">${escapeHtml(o.TINH_TRANG || '')}</span>
          ${o.TINH_TRANG === 'Đang chạy máy' ? `
            <span class="badge trang-thai-info">${icon('users', {size:14})} Đang vận hành: <strong>${escapeHtml(o.NguoiVanHanh || NHAN_NGUOI_VAN_HANH_KHONG_RO)}</strong></span>` : ''}
          ${['Chưa xác nhận', 'Đã xác nhận'].includes(o.TINH_TRANG) ? `
            <span class="badge ${lopTrangThai(o.TRANG_THAI_PHOI)}">${escapeHtml(o.TRANG_THAI_PHOI || '')}</span>
            <span class="badge ${lopTrangThai(o.TRANG_THAI_VE_FILE)}">${escapeHtml(o.TRANG_THAI_VE_FILE || '')}</span>` : ''}
          ${o.CanhBao ? `
            <span class="badge badge-canh-bao ${o.CanhBao.toLowerCase()}">
              ${icon('alert')} ${NHAN_CANH_BAO[o.CanhBao] || o.CanhBao}
            </span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  capNhatCheckboxChonTatCa();
  capNhatThanhHanhDong();
}

function moChiTietDon(e, sttKeyEncoded) {
  if (e.target.tagName === 'INPUT') return;
  window.location.href = '/order.html?stt=' + sttKeyEncoded;
}

function toggleChonDon(sttKey, daChon) {
  if (daChon) donDaChonSet.add(sttKey); else donDaChonSet.delete(sttKey);
  const the = document.querySelector(`[data-stt="${CSS.escape(sttKey)}"]`);
  if (the) the.classList.toggle('da-chon', daChon);
  capNhatCheckboxChonTatCa();
  capNhatThanhHanhDong();
}

function chonTatCa(daChonHet) {
  danhSachHienTai.forEach(o => {
    if (daChonHet) donDaChonSet.add(o.STT_Key); else donDaChonSet.delete(o.STT_Key);
  });
  renderDanhSachDon();
}

function capNhatCheckboxChonTatCa() {
  const cb = document.getElementById('chon-tat-ca');
  cb.checked = danhSachHienTai.length > 0 && danhSachHienTai.every(o => donDaChonSet.has(o.STT_Key));
}

function capNhatThanhHanhDong() {
  const thanh = document.getElementById('thanh-hanh-dong');
  if (donDaChonSet.size === 0) { thanh.style.display = 'none'; return; }
  thanh.style.display = 'flex';
  document.getElementById('so-luong-da-chon').textContent = donDaChonSet.size;
}

function boChonTatCaDon() {
  donDaChonSet.clear();
  renderDanhSachDon();
}

async function apDungNhanh(cot, trangThaiMoi, nut) {
  const soLuong = donDaChonSet.size;
  if (!confirm(`Đánh dấu ${soLuong} đơn đã chọn thành "${trangThaiMoi}"?`)) return;

  const nhanGoc = nut.innerHTML;
  document.querySelectorAll('.nhanh-phoi-ve-file, #nut-ap-dung').forEach(b => b.disabled = true);
  nut.innerHTML = icon('spinner', { className: 'icon-spin', size: 16 }) + ' Đang xử lý...';

  try {
    const ketQua = await apiFetch('/orders/chuyen-trang-thai-hang-loat', {
      method: 'POST',
      body: JSON.stringify({ sttKeys: Array.from(donDaChonSet), cot, trangThaiMoi }),
    });

    let thongBao = `Đã đánh dấu ${ketQua.thanhCong.length}/${soLuong} đơn thành "${trangThaiMoi}".`;
    if (ketQua.loi.length > 0) {
      thongBao += `\n\nKhông đánh dấu được ${ketQua.loi.length} đơn:\n` +
        ketQua.loi.map(l => `- ${l.sttKey}: ${l.lyDo}`).join('\n');
    }
    alert(thongBao);
  } catch (e) {
    alert('Lỗi: ' + e.message);
  } finally {
    document.querySelectorAll('.nhanh-phoi-ve-file, #nut-ap-dung').forEach(b => b.disabled = false);
    nut.innerHTML = nhanGoc;
    donDaChonSet.clear();
    await taiDon();
  }
}

async function apDungChuyenTrangThai() {
  const trangThaiMoi = document.getElementById('trang-thai-dich').value;
  if (!trangThaiMoi) { alert('Hãy chọn trạng thái muốn chuyển tới'); return; }

  const soLuong = donDaChonSet.size;
  if (!confirm(`Chuyển ${soLuong} đơn đã chọn sang trạng thái "${trangThaiMoi}"?\n\nThao tác này ghi thẳng, không kiểm tra trạng thái hiện tại của từng đơn.`)) return;

  const nutApDung = document.getElementById('nut-ap-dung');
  nutApDung.disabled = true;
  nutApDung.textContent = 'Đang xử lý...';

  try {
    const ketQua = await apiFetch('/orders/chuyen-trang-thai-hang-loat', {
      method: 'POST',
      body: JSON.stringify({ sttKeys: Array.from(donDaChonSet), trangThaiMoi }),
    });

    let thongBao = `Đã chuyển ${ketQua.thanhCong.length}/${soLuong} đơn sang "${trangThaiMoi}".`;
    if (ketQua.loi.length > 0) {
      thongBao += `\n\nKhông chuyển được ${ketQua.loi.length} đơn:\n` +
        ketQua.loi.map(l => `- ${l.sttKey}: ${l.lyDo}`).join('\n');
    }
    alert(thongBao);
  } catch (e) {
    alert('Lỗi: ' + e.message);
  }

  nutApDung.disabled = false;
  nutApDung.textContent = 'Áp dụng';
  donDaChonSet.clear();
  await taiDon();
}

// In nhanh: LUÔN gửi đúng mọi ô lọc đang hiển thị trên trang (trạng thái, phôi, vẽ file, ngày,
// từ khoá) — không ép cứng gì ở phía client nữa. Mỗi mẫu ('mau') sẽ ép thêm điều kiện trạng thái
// riêng của mình ở phía server (xem reports.js), kết hợp AND với các ô lọc này.
async function inNhanh(mau, nut) {
  const nhanGoc = nut.innerHTML;
  nut.disabled = true;
  nut.innerHTML = icon('spinner', { className: 'icon-spin', size: 18 }) + ' Đang tạo file...';

  const qs = new URLSearchParams();
  qs.set('mau', mau);
  const trangThai = document.getElementById('loc-trang-thai').value;
  const tuKhoa = document.getElementById('loc-kh').value;
  const tuNgay = document.getElementById('loc-tu-ngay').value;
  const denNgay = document.getElementById('loc-den-ngay').value;
  const trangThaiPhoi = document.getElementById('loc-phoi').value;
  const trangThaiVeFile = document.getElementById('loc-ve-file').value;
  if (trangThai) qs.set('trangThai', trangThai);
  if (tuKhoa) qs.set('tuKhoa', tuKhoa);
  if (tuNgay) qs.set('tuNgay', tuNgay);
  if (denNgay) qs.set('denNgay', denNgay);
  if (trangThaiPhoi) qs.set('trangThaiPhoi', trangThaiPhoi);
  if (trangThaiVeFile) qs.set('trangThaiVeFile', trangThaiVeFile);

  try {
    const res = await fetch('/api/reports/pdf?' + qs.toString(), { credentials: 'include' });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Không xuất được file');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const contentDisposition = res.headers.get('Content-Disposition') || '';
    const khopTen = contentDisposition.match(/filename="([^"]+)"/);
    a.download = khopTen ? khopTen[1] : 'bao-cao.pdf';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Lỗi: ' + e.message);
  } finally {
    nut.disabled = false;
    nut.innerHTML = nhanGoc;
  }
}
</script>
