<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đơn hàng — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=20260824f">
<script src="/js/theme.js?v=20260823b"></script>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2>Danh sách đơn hàng</h2>
  <div class="filters">
    <label class="sr-only" for="loc-trang-thai">Lọc theo trạng thái</label>
    <select id="loc-trang-thai"><option value="">Tất cả trạng thái</option></select>
    <label class="sr-only" for="loc-kh">Tìm theo tên đơn hoặc mã khách hàng</label>
    <input id="loc-kh" placeholder="Tìm theo tên đơn (STT_Key) hoặc mã khách hàng">
  </div>

  <div class="in-nhanh-thanh">
    <div class="in-nhanh">
      <button type="button" class="btn-hanh-dong phu" id="btn-in-phoi-ao" onclick="toggleMenuInNhanh('menu-phoi-ao')"></button>
      <div class="in-nhanh-menu" id="menu-phoi-ao" hidden>
        <button type="button" onclick="inNhanh('phoi_ao_gop', 'excel')">Xuất Excel</button>
        <button type="button" onclick="inNhanh('phoi_ao_gop', 'pdf')">Xuất PDF</button>
      </div>
    </div>
    <div class="in-nhanh">
      <button type="button" class="btn-hanh-dong phu" id="btn-in-don-ao" onclick="toggleMenuInNhanh('menu-don-ao')"></button>
      <div class="in-nhanh-menu" id="menu-don-ao" hidden>
        <button type="button" onclick="inNhanh('don_can_in', 'excel')">Xuất Excel</button>
        <button type="button" onclick="inNhanh('don_can_in', 'pdf')">Xuất PDF</button>
      </div>
    </div>
    <div class="in-nhanh">
      <button type="button" class="btn-hanh-dong phu" id="btn-in-tracking" onclick="toggleMenuInNhanh('menu-tracking')"></button>
      <div class="in-nhanh-menu" id="menu-tracking" hidden>
        <button type="button" onclick="inNhanh('tracking', 'excel')">Xuất Excel</button>
        <button type="button" onclick="inNhanh('tracking', 'pdf')">Xuất PDF</button>
      </div>
    </div>
  </div>

  <label class="chon-tat-ca-hang">
    <input type="checkbox" id="chon-tat-ca" onchange="chonTatCa(this.checked)">
    Chọn tất cả đơn đang hiển thị
  </label>

  <div id="danh-sach-don" class="order-list"></div>
</div>

<div id="thanh-hanh-dong" class="thanh-hanh-dong-hang-loat" style="display:none">
  <span>Đã chọn <strong id="so-luong-da-chon">0</strong> đơn</span>
  <select id="trang-thai-dich">
    <option value="">Chuyển đến trạng thái...</option>
  </select>
  <button id="nut-ap-dung" class="btn-hanh-dong" onclick="apDungChuyenTrangThai()">Áp dụng</button>
  <button class="btn-hanh-dong phu" onclick="boChonTatCaDon()">Bỏ chọn</button>
</div>

<script src="/js/icons.js?v=20260823c"></script>
<script src="/js/api.js?v=20260824a"></script>
<script>
const NHAN_CANH_BAO = { VANG: 'Vàng · 3 ngày', CAM: 'Cam · 5 ngày', DO: 'Đỏ · 7 ngày' };

// Danh sách ĐẦY ĐỦ 12 trạng thái — dùng riêng cho ô "Chuyển đến trạng thái" (chọn tự do, không
// kiểm tra trạng thái hiện tại). PHẢI khớp với DANH_SACH_TRANG_THAI_BAO_CAO trong
// data/pipelineTinhTrang.js — sửa 1 chỗ thì nhớ sửa chỗ kia.
const DANH_SACH_TRANG_THAI_DAY_DU = [
  'B0_Chờ xác nhận', 'B1_Đã in', 'B2_Đã lấy phôi', 'B3_Đã đủ Phôi và File Vẽ',
  'B4_Đang sản xuất', 'B5_Đã sản xuất', 'SHIPPED_Đã gửi vận chuyển',
  'IN TRAINSIT_Tracking đã hoạt động', 'DELIVERED_Đã giao hàng đến khách',
  'CANCELLED_Đã hủy đơn', 'REFUNDED_Hoàn đơn', 'ĐƠN LỖI CẦN LÀM LẠI',
];

let danhSachHienTai = [];
let donDaChonSet = new Set();

(async () => {
  const user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'orders');

  document.getElementById('loc-trang-thai').onchange = () => { boChonTatCaDon(); taiDon(); };
  document.getElementById('loc-kh').oninput = debounce(() => { boChonTatCaDon(); taiDon(); }, 400);

  document.getElementById('btn-in-phoi-ao').innerHTML = icon('printer') + ' IN DANH SÁCH PHÔI ÁO';
  document.getElementById('btn-in-don-ao').innerHTML = icon('printer') + ' IN ĐƠN ÁO';
  document.getElementById('btn-in-tracking').innerHTML = icon('printer') + ' IN DANH SÁCH ÁO ĐÃ SẢN XUẤT CHO TRACKING';
  document.addEventListener('click', (e) => { if (!e.target.closest('.in-nhanh')) donghetMenuInNhanh(); });

  document.getElementById('trang-thai-dich').innerHTML = '<option value="">Chuyển đến trạng thái...</option>' +
    DANH_SACH_TRANG_THAI_DAY_DU.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');

  taiDon();
})();

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function capNhatBoLocTrangThai(list) {
  const sel = document.getElementById('loc-trang-thai');
  const giaTriDangChon = sel.value;
  const cacTrangThai = [...new Set(list.map(o => o.TINH_TRANG).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">Tất cả trạng thái</option>' +
    cacTrangThai.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  sel.value = giaTriDangChon;
}

async function taiDon() {
  const el = document.getElementById('danh-sach-don');
  el.innerHTML = skeletonList(6);

  const trangThai = document.getElementById('loc-trang-thai').value;
  const kh = document.getElementById('loc-kh').value;
  const qs = new URLSearchParams();
  if (trangThai) qs.set('trangThai', trangThai);
  if (kh) qs.set('kh', kh);

  let list;
  try {
    list = await apiFetch('/orders?' + qs.toString());
  } catch (e) {
    el.innerHTML = `<p>Không tải được danh sách: ${escapeHtml(e.message)}</p>`;
    return;
  }

  danhSachHienTai = list;

  if (!trangThai && !kh) capNhatBoLocTrangThai(list);

  renderDanhSachDon();
}

function renderDanhSachDon() {
  const el = document.getElementById('danh-sach-don');

  if (danhSachHienTai.length === 0) { el.innerHTML = '<p>Không có đơn nào khớp bộ lọc.</p>'; capNhatThanhHanhDong(); return; }

  el.innerHTML = danhSachHienTai.map(o => {
    const daChon = donDaChonSet.has(o.STT_Key);
    return `
    <div class="order-card ${daChon ? 'da-chon' : ''}" data-stt="${escapeHtml(o.STT_Key)}"
         onclick="moChiTietDon(event, '${encodeURIComponent(o.STT_Key)}')">
      <input type="checkbox" class="order-checkbox" ${daChon ? 'checked' : ''}
             aria-label="Chọn đơn ${escapeHtml(o.STT_Key)}"
             onclick="event.stopPropagation()"
             onchange="toggleChonDon('${escapeHtml(o.STT_Key)}', this.checked)">
      ${o.MOCKUP || o.DUONG_DAN_URL
        ? `<img src="${escapeHtml(o.MOCKUP || o.DUONG_DAN_URL)}" alt="" loading="lazy" onerror="this.remove()">`
        : ''}
      <div class="thong-tin">
        <strong>${escapeHtml(o.TieuDeSanPham || o.STT_Key)}</strong>
        <div class="meta">${escapeHtml(o.TenKhachHang || '')} · SL: ${escapeHtml(o.SO_LUONG || '')}</div>
        <div class="meta">Lên đơn: ${escapeHtml(o.NGAY_LEN_DON ? dinhDangNgay(o.NGAY_LEN_DON) : '—')}</div>
        <div class="badge-row">
          <span class="badge ${lopTrangThai(o.TINH_TRANG)}">${escapeHtml(o.TINH_TRANG || '')}</span>
          ${o.CanhBao ? `
            <span class="badge badge-canh-bao ${o.CanhBao.toLowerCase()}">
              ${icon('alert')} ${NHAN_CANH_BAO[o.CanhBao] || o.CanhBao}
            </span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  capNhatCheckboxChonTatCa();
  capNhatThanhHanhDong();
}

function moChiTietDon(e, sttKeyEncoded) {
  if (e.target.tagName === 'INPUT') return;
  window.location.href = '/order.html?stt=' + sttKeyEncoded;
}

function toggleChonDon(sttKey, daChon) {
  if (daChon) donDaChonSet.add(sttKey); else donDaChonSet.delete(sttKey);
  const the = document.querySelector(`[data-stt="${CSS.escape(sttKey)}"]`);
  if (the) the.classList.toggle('da-chon', daChon);
  capNhatCheckboxChonTatCa();
  capNhatThanhHanhDong();
}

function chonTatCa(daChonHet) {
  danhSachHienTai.forEach(o => {
    if (daChonHet) donDaChonSet.add(o.STT_Key); else donDaChonSet.delete(o.STT_Key);
  });
  renderDanhSachDon();
}

function capNhatCheckboxChonTatCa() {
  const cb = document.getElementById('chon-tat-ca');
  cb.checked = danhSachHienTai.length > 0 && danhSachHienTai.every(o => donDaChonSet.has(o.STT_Key));
}

function capNhatThanhHanhDong() {
  const thanh = document.getElementById('thanh-hanh-dong');
  if (donDaChonSet.size === 0) { thanh.style.display = 'none'; return; }
  thanh.style.display = 'flex';
  document.getElementById('so-luong-da-chon').textContent = donDaChonSet.size;
}

function boChonTatCaDon() {
  donDaChonSet.clear();
  renderDanhSachDon();
}

async function apDungChuyenTrangThai() {
  const trangThaiMoi = document.getElementById('trang-thai-dich').value;
  if (!trangThaiMoi) { alert('Hãy chọn trạng thái muốn chuyển tới'); return; }

  const soLuong = donDaChonSet.size;
  if (!confirm(`Chuyển ${soLuong} đơn đã chọn sang trạng thái "${trangThaiMoi}"?\n\nThao tác này ghi thẳng, không kiểm tra trạng thái hiện tại của từng đơn.`)) return;

  const nutApDung = document.getElementById('nut-ap-dung');
  nutApDung.disabled = true;
  nutApDung.textContent = 'Đang xử lý...';

  try {
    const ketQua = await apiFetch('/orders/chuyen-trang-thai-hang-loat', {
      method: 'POST',
      body: JSON.stringify({ sttKeys: Array.from(donDaChonSet), trangThaiMoi }),
    });

    let thongBao = `Đã chuyển ${ketQua.thanhCong.length}/${soLuong} đơn sang "${trangThaiMoi}".`;
    if (ketQua.loi.length > 0) {
      thongBao += `\n\nKhông chuyển được ${ketQua.loi.length} đơn:\n` +
        ketQua.loi.map(l => `- ${l.sttKey}: ${l.lyDo}`).join('\n');
    }
    alert(thongBao);
  } catch (e) {
    alert('Lỗi: ' + e.message);
  }

  nutApDung.disabled = false;
  nutApDung.textContent = 'Áp dụng';
  donDaChonSet.clear();
  await taiDon();
}

function toggleMenuInNhanh(id) {
  const menu = document.getElementById(id);
  const dangMo = !menu.hidden;
  donghetMenuInNhanh();
  menu.hidden = dangMo;
}

function donghetMenuInNhanh() {
  document.querySelectorAll('.in-nhanh-menu').forEach(m => m.hidden = true);
}

// In nhanh theo ĐÚNG bộ lọc trạng thái + ô tìm kiếm đang áp dụng trên trang này (không ép về
// đúng trạng thái B1/B2/B5 của mẫu) — 'mau' chỉ ép cứng ĐỊNH DẠNG cột hiển thị trong file xuất.
async function inNhanh(mau, loai) {
  donghetMenuInNhanh();

  const qs = new URLSearchParams();
  qs.set('mau', mau);
  const trangThai = document.getElementById('loc-trang-thai').value;
  const tuKhoa = document.getElementById('loc-kh').value;
  if (trangThai) qs.set('trangThai', trangThai);
  if (tuKhoa) qs.set('tuKhoa', tuKhoa);

  try {
    const res = await fetch(`/api/reports/${loai}?` + qs.toString(), { credentials: 'include' });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Không xuất được file');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const contentDisposition = res.headers.get('Content-Disposition') || '';
    const khopTen = contentDisposition.match(/filename="([^"]+)"/);
    a.download = khopTen ? khopTen[1] : (loai === 'excel' ? 'bao-cao.xlsx' : 'bao-cao.pdf');
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert('Lỗi: ' + e.message);
  }
}
</script>
</body>
</html>
