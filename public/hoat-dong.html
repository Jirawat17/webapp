<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoạt động của tôi — Xưởng Thêu</title>
<link rel="stylesheet" href="/css/style.css?v=79">
<script src="/js/theme.js?v=79"></script>
</head>
<body>
<div id="nav"></div>
<div class="page">
  <h2 id="tieu-de-hoat-dong">Hoạt động của tôi</h2>
  <p id="mo-ta-hoat-dong" style="color:var(--color-text-muted);margin:-8px 0 20px">Nhật ký thao tác của chính bạn — quét QR, đổi trạng thái, upload ảnh — để tự đối soát cuối ngày/tuần.</p>

  <!-- Chỉ admin thấy (bổ sung 09/09/2026, theo yêu cầu người dùng — dễ theo dõi hoạt động của bất kỳ
       ai). Gồm CẢ tài khoản admin khác, không chỉ 3 vai trò công nhân (xác nhận với người dùng). -->
  <div class="thanh-cong-cu-danh-sach" id="khoi-chon-nguoi" style="display:none">
    <label for="chon-nguoi-xem" style="display:flex;align-items:center;gap:8px;font-weight:600">
      Xem hoạt động của:
      <select id="chon-nguoi-xem" style="min-width:220px">
        <option value="">Chính tôi (Admin)</option>
      </select>
    </label>
  </div>

  <div class="thanh-cong-cu-danh-sach" id="thanh-chon-ky">
    <button type="button" class="btn-hanh-dong phu dang-mo" data-ky="hom_nay">Hôm nay</button>
    <button type="button" class="btn-hanh-dong phu" data-ky="tuan_nay">Tuần này</button>
    <button type="button" class="btn-hanh-dong phu" data-ky="thang_nay">Tháng này</button>
    <button type="button" class="btn-hanh-dong phu" data-ky="toan_bo">Toàn bộ</button>
    <button type="button" class="btn-hanh-dong phu" data-ky="tuy_chon">Tuỳ chọn...</button>
  </div>

  <div id="panel-khoang-ngay" class="panel-dieu-khien" style="display:none">
    <div class="inline-form">
      <div class="truong">
        <label for="hd-tu-ngay">Từ ngày</label>
        <input type="date" id="hd-tu-ngay">
      </div>
      <div class="truong">
        <label for="hd-den-ngay">Đến ngày</label>
        <input type="date" id="hd-den-ngay">
      </div>
      <button type="button" class="btn-hanh-dong" id="btn-ap-dung-khoang">Áp dụng</button>
    </div>
  </div>

  <div id="khoi-chi-tieu-vai-tro" style="display:none">
    <h3 style="margin-top:0">Chỉ tiêu công việc</h3>
    <div id="the-chi-tieu-vai-tro" class="thong-ke-nhanh"></div>
  </div>

  <div id="thong-ke-nhanh" class="thong-ke-nhanh">Đang tải...</div>

  <div>
    <h3>Lượt quét QR thành công</h3>
    <div id="ds-quet" class="timeline"></div>
  </div>

  <div>
    <h3>Đổi trạng thái đơn</h3>
    <div id="ds-doi-trang-thai" class="timeline"></div>
  </div>

  <div>
    <h3>Ảnh đã upload</h3>
    <div id="ds-upload-anh" class="timeline"></div>
  </div>
</div>

<script src="/js/icons.js?v=79"></script>
<script src="/js/api.js?v=79"></script>
<script>
let kyHienTai = 'hom_nay';
let user; // dùng lại ở taiHoatDong() (biết vaiTro để hiện đúng nhóm chỉ tiêu công việc)
let nguoiDangXem = ''; // rỗng = xem hoạt động của chính người đăng nhập; admin có thể đổi sang người khác

const NHAN_COT_TRANG_THAI = { TRANG_THAI_XUONG: 'Trạng thái chung', TRANG_THAI_PHOI: 'Phôi', TRANG_THAI_VE_FILE: 'Vẽ file' };
const NHAN_MOC_ANH = { mau: 'Ảnh mẫu (PNG)', mockup: 'Ảnh Mockup', ve_file: 'Ảnh file thêu', da_san_xuat: 'Ảnh đã sản xuất', dong_goi: 'Ảnh đóng gói' };

(async () => {
  user = await requireLoginOrRedirect();
  if (!user) return;
  renderNav(user, 'hoat-dong');

  // "Xem hoạt động của bất kỳ ai" — chỉ admin. Dùng lại NHAN_VAI_TRO đã có sẵn từ api.js (KHÔNG khai
  // báo lại — 2 thẻ <script> thường dùng chung 1 scope cho const, khai báo trùng tên là SyntaxError
  // lúc parse, hỏng cả trang — gặp thật ở bang-dieu-khien.html 08/09/2026).
  if (user.vaiTro === 'admin') {
    try {
      const dsNhanVien = await apiFetch('/users');
      const dsChoChon = dsNhanVien.filter(u => String(u.KichHoat).toUpperCase() === 'TRUE' && u.Ten !== user.ten);
      document.getElementById('khoi-chon-nguoi').style.display = 'flex';
      const chon = document.getElementById('chon-nguoi-xem');
      chon.innerHTML = '<option value="">Chính tôi (Admin)</option>' +
        dsChoChon.map(u => `<option value="${escapeHtml(u.Ten)}">${escapeHtml(u.Ten)} (${escapeHtml(NHAN_VAI_TRO[u.VaiTro] || u.VaiTro)})</option>`).join('');
      chon.onchange = () => { nguoiDangXem = chon.value; taiHoatDong(); };
    } catch (e) { /* không tải được danh sách nhân viên — ẩn ô chọn, admin vẫn xem được hoạt động chính mình */ }
  }

  document.querySelectorAll('#thanh-chon-ky button').forEach(btn => {
    btn.onclick = () => {
      kyHienTai = btn.dataset.ky;
      document.querySelectorAll('#thanh-chon-ky button').forEach(b => b.classList.toggle('dang-mo', b === btn));
      document.getElementById('panel-khoang-ngay').style.display = kyHienTai === 'tuy_chon' ? 'block' : 'none';
      if (kyHienTai !== 'tuy_chon') taiHoatDong();
    };
  });
  document.getElementById('btn-ap-dung-khoang').onclick = () => taiHoatDong();

  await taiHoatDong();
})();

// Giống hệt logic ở dashboard.html (tinhKhoangTheoKy/dinhDangYMD) — mỗi trang tự chứa, không dùng
// chung module vì dự án này không có bước build để chia sẻ code giữa các trang tĩnh.
function tinhKhoangTheoKy(ky) {
  const homNay = new Date();
  homNay.setHours(0, 0, 0, 0);
  if (ky === 'hom_nay') return { tu: homNay, den: homNay };
  if (ky === 'tuan_nay') {
    const thu = homNay.getDay();
    const lechDauTuan = thu === 0 ? 6 : thu - 1;
    const dau = new Date(homNay); dau.setDate(homNay.getDate() - lechDauTuan);
    const cuoi = new Date(dau); cuoi.setDate(dau.getDate() + 6);
    return { tu: dau, den: cuoi };
  }
  if (ky === 'thang_nay') {
    const dau = new Date(homNay.getFullYear(), homNay.getMonth(), 1);
    const cuoi = new Date(homNay.getFullYear(), homNay.getMonth() + 1, 0);
    return { tu: dau, den: cuoi };
  }
  return null; // toan_bo — không giới hạn
}

function dinhDangYMD(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

// Format timestamp ngắn gọn "DD-MM HH:mm:ss" — copy từ order.html (tsDep), giữ nhất quán cách hiển
// thị thời gian trên toàn app.
function tsDep(isoStr) {
  if (!isoStr) return '';
  const d = new Date(isoStr);
  if (isNaN(d)) return isoStr;
  const fmt = (n) => String(n).padStart(2, '0');
  const vn = new Date(d.toLocaleString('en-US', { timeZone: 'Asia/Ho_Chi_Minh' }));
  return `${fmt(vn.getDate())}-${fmt(vn.getMonth()+1)} ${fmt(vn.getHours())}:${fmt(vn.getMinutes())}:${fmt(vn.getSeconds())}`;
}

async function taiHoatDong() {
  document.getElementById('thong-ke-nhanh').textContent = 'Đang tải...';

  const qs = new URLSearchParams();
  if (nguoiDangXem) qs.set('nguoiDung', nguoiDangXem);
  if (kyHienTai === 'tuy_chon') {
    const tu = document.getElementById('hd-tu-ngay').value;
    const den = document.getElementById('hd-den-ngay').value;
    if (tu) qs.set('tuNgay', tu);
    if (den) qs.set('denNgay', den);
  } else {
    const khoang = tinhKhoangTheoKy(kyHienTai);
    if (khoang) {
      qs.set('tuNgay', dinhDangYMD(khoang.tu));
      qs.set('denNgay', dinhDangYMD(khoang.den));
    }
  }

  let data;
  try {
    data = await apiFetch('/hoat-dong/cua-toi?' + qs.toString());
  } catch (e) {
    document.getElementById('thong-ke-nhanh').textContent = 'Không tải được: ' + e.message;
    return;
  }

  // Tiêu đề/mô tả đổi theo đúng người đang xem (bổ sung 09/09/2026 — admin có thể xem người khác) —
  // đọc data.nguoiXem.ten do SERVER trả về (đúng tên thật đã validate), không đọc thẳng biến
  // nguoiDangXem ở client để tránh lệch nếu server từ chối tên gõ sai.
  const dangXemNguoiKhac = data.nguoiXem && data.nguoiXem.ten !== user.ten;
  document.getElementById('tieu-de-hoat-dong').textContent = dangXemNguoiKhac
    ? `Hoạt động của ${data.nguoiXem.ten}` : 'Hoạt động của tôi';
  document.getElementById('mo-ta-hoat-dong').textContent = dangXemNguoiKhac
    ? `Nhật ký thao tác của ${data.nguoiXem.ten} — quét QR, đổi trạng thái, upload ảnh.`
    : 'Nhật ký thao tác của chính bạn — quét QR, đổi trạng thái, upload ảnh — để tự đối soát cuối ngày/tuần.';

  document.getElementById('thong-ke-nhanh').innerHTML = `
    <div class="the-nhanh"><div class="so">${data.tongSoQuet}</div><div class="nhan">${icon('scan', {size:14})} Lượt quét thành công</div></div>
    <div class="the-nhanh"><div class="so">${data.tongSoDoiTrangThai}</div><div class="nhan">${icon('arrowRight', {size:14})} Lượt đổi trạng thái</div></div>
    <div class="the-nhanh"><div class="so">${data.tongSoUpload}</div><div class="nhan">${icon('camera', {size:14})} Ảnh đã upload</div></div>
  `;

  renderChiTieuVaiTro(data.chiTieu, data.nguoiXem ? data.nguoiXem.vaiTro : user.vaiTro);
  renderDsQuet(data.quet);
  renderDsDoiTrangThai(data.doiTrangThai);
  renderDsUploadAnh(data.uploadAnh);
}

// Chỉ tiêu công việc theo vai trò (bổ sung 08/09/2026, xem
// docs/superpowers/specs/2026-09-08-chi-tieu-hoat-dong-theo-vai-tro-design.md) — backend luôn trả đủ
// cả 3 nhóm, ở đây chỉ chọn đúng nhóm khớp vaiTroXem để hiện (rỗng/admin không thuộc nhóm nào nên ẩn
// hẳn khối này). Nhận vaiTroXem làm tham số (bổ sung 09/09/2026) thay vì luôn đọc user.vaiTro — khi
// admin xem người khác, vaiTroXem là vai trò của NGƯỜI ĐƯỢC XEM, không phải vai trò admin. Mỗi việc
// có 2 thẻ đi cùng nhau: số đơn + tổng số lượng.
function renderChiTieuVaiTro(ct, vaiTroXem) {
  const khoi = document.getElementById('khoi-chi-tieu-vai-tro');
  if (!ct || !['san_xuat', 've_file', 'nguoi_lay_phoi'].includes(vaiTroXem)) { khoi.style.display = 'none'; return; }

  const the = (so, nhan, tenIcon) => `<div class="the-nhanh"><div class="so">${so}</div><div class="nhan">${icon(tenIcon, {size:14})} ${nhan}</div></div>`;
  let html = '';
  if (vaiTroXem === 'san_xuat') {
    html = the(ct.soDonDaChayMay, 'Đơn đã chạy máy', 'check') + the(ct.tongSlDaChayMay, 'Tổng SL sản phẩm đã chạy', 'check');
  } else if (vaiTroXem === 've_file') {
    html = the(ct.soFileDaVe, 'File đã vẽ', 'file') + the(ct.tongSlDaVe, 'Tổng SL sản phẩm đã vẽ file', 'file');
  } else if (vaiTroXem === 'nguoi_lay_phoi') {
    html = the(ct.soDonDaLayPhoi, 'Đơn đã lấy phôi', 'package') + the(ct.tongSlPhoiDaLay, 'Tổng SL phôi đã lấy', 'package')
      + the(ct.soDonDaDongGoi, 'Đơn đã đóng gói', 'check') + the(ct.tongSlDaDongGoi, 'Tổng SL sản phẩm đã đóng gói', 'check');
  }
  khoi.style.display = '';
  document.getElementById('the-chi-tieu-vai-tro').innerHTML = html;
}

function dongRong(chuThich) {
  return `<div class="trang-thai-rong">${icon('package')}<p>${escapeHtml(chuThich)}</p></div>`;
}

function renderDsQuet(list) {
  const el = document.getElementById('ds-quet');
  if (list.length === 0) { el.innerHTML = dongRong('Chưa có lượt quét thành công nào trong khoảng này.'); return; }
  el.innerHTML = list.map(x => `
    <div class="timeline-item">
      <div class="timeline-info">
        <strong><a href="/order.html?stt=${encodeURIComponent(x.sttKey)}">${escapeHtml(x.sttKey)}</a></strong>
        <div style="font-size:0.85rem;color:var(--color-text-muted);margin-top:2px">
          ${escapeHtml(x.kichBan || NHAN_COT_TRANG_THAI[x.cot] || x.cot)}${x.tu ? `: ${escapeHtml(x.tu)} → ${escapeHtml(x.sang)}` : (x.sang ? ` → ${escapeHtml(x.sang)}` : '')}
        </div>
      </div>
      <div class="timeline-time">${tsDep(x.thoiGian)}</div>
    </div>`).join('');
}

function renderDsDoiTrangThai(list) {
  const el = document.getElementById('ds-doi-trang-thai');
  if (list.length === 0) { el.innerHTML = dongRong('Chưa có thay đổi trạng thái nào trong khoảng này.'); return; }
  el.innerHTML = list.map(x => `
    <div class="timeline-item">
      <div class="timeline-info">
        <strong><a href="/order.html?stt=${encodeURIComponent(x.sttKey)}">${escapeHtml(x.sttKey)}</a></strong>
        <div style="font-size:0.85rem;color:var(--color-text-muted);margin-top:2px">
          ${escapeHtml(NHAN_COT_TRANG_THAI[x.cot] || x.cot)} (${escapeHtml(x.nguon)}): ${x.tu ? `${escapeHtml(x.tu)} → ` : ''}${escapeHtml(x.sang)}
        </div>
      </div>
      <div class="timeline-time">${tsDep(x.thoiGian)}</div>
    </div>`).join('');
}

function renderDsUploadAnh(list) {
  const el = document.getElementById('ds-upload-anh');
  if (list.length === 0) { el.innerHTML = dongRong('Chưa có ảnh nào được tải lên trong khoảng này.'); return; }
  el.innerHTML = list.map(x => `
    <div class="timeline-item">
      <div class="timeline-info">
        <strong><a href="/order.html?stt=${encodeURIComponent(x.sttKey)}">${escapeHtml(x.sttKey)}</a></strong>
        <div style="font-size:0.85rem;color:var(--color-text-muted);margin-top:2px">
          ${escapeHtml(NHAN_MOC_ANH[x.moc] || x.moc)}${x.tuDongChuyenSang ? ` — tự động chuyển đơn sang "${escapeHtml(x.tuDongChuyenSang)}"` : ''}
        </div>
      </div>
      <div class="timeline-time">${tsDep(x.thoiGian)}</div>
    </div>`).join('');
}
</script>
</body>
</html>
